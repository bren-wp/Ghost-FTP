plugins {
    id 'com.android.application'
}

def ghostFtpVersion = rootProject.file('../VERSION').text.trim()
def ghostFtpVersionParts = ghostFtpVersion.tokenize('.')
if (ghostFtpVersionParts.size() != 3 || !ghostFtpVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("Ghost FTP VERSION must be numeric MAJOR.MINOR.PATCH, got '${ghostFtpVersion}'")
}
def ghostFtpVersionCode =
        ghostFtpVersionParts[0].toInteger() * 1000000 +
        ghostFtpVersionParts[1].toInteger() * 1000 +
        ghostFtpVersionParts[2].toInteger()
if (ghostFtpVersionCode <= 0 || ghostFtpVersionCode > 2100000000) {
    throw new GradleException("Ghost FTP Android versionCode is out of range: ${ghostFtpVersionCode}")
}

android {
    namespace 'app.ghostftp.client'
    compileSdk 35

    defaultConfig {
        applicationId 'app.ghostftp.client'
        minSdk 26
        targetSdk 35
        versionCode ghostFtpVersionCode
        versionName ghostFtpVersion
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('packageGhostFtpApk', Copy) {
    dependsOn 'assembleDebug'
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(rootProject.layout.projectDirectory.dir('dist'))
    rename { 'Ghost-FTP-Android-dev.apk' }
    doLast {
        def apk = rootProject.layout.projectDirectory.file('dist/Ghost-FTP-Android-dev.apk').asFile
        if (!apk.isFile() || apk.length() <= 0) {
            throw new GradleException("Android development APK was not generated at ${apk}")
        }
        println "ANDROID_DEV_APK=${apk}"
    }
}
