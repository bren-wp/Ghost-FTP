plugins {
    id 'com.android.application'
}

def ghostFtpVersion = rootProject.file('../VERSION').text.trim()
def ghostFtpVersionParts = ghostFtpVersion.tokenize('.')
if (ghostFtpVersionParts.size() != 3 || !ghostFtpVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("Ghost FTP VERSION must be numeric MAJOR.MINOR.PATCH, got '${ghostFtpVersion}'")
}
def ghostFtpVersionMajor = ghostFtpVersionParts[0].toInteger()
def ghostFtpVersionMinor = ghostFtpVersionParts[1].toInteger()
def ghostFtpVersionPatch = ghostFtpVersionParts[2].toInteger()
if (ghostFtpVersionMinor > 999 || ghostFtpVersionPatch > 999) {
    throw new GradleException("Ghost FTP Android VERSION minor and patch fields must be <= 999: ${ghostFtpVersion}")
}
def ghostFtpVersionCode =
        ghostFtpVersionMajor * 1000000 +
        ghostFtpVersionMinor * 1000 +
        ghostFtpVersionPatch
if (ghostFtpVersionCode <= 0 || ghostFtpVersionCode > 2100000000) {
    throw new GradleException("Ghost FTP Android versionCode is out of range: ${ghostFtpVersionCode}")
}

android {
    namespace 'app.ghostftp.client'
    compileSdk 35

    defaultConfig {
        applicationId 'app.ghostftp.client'
        minSdk 26
        targetSdk 35
        versionCode ghostFtpVersionCode
        versionName ghostFtpVersion
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
