name: Bug report
description: Report a reproducible ByFTP problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, passphrases, private keys or confidential server/customer data.
  - type: input
    id: version
    attributes:
      label: ByFTP version
      placeholder: "2.12.0"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - FTP
        - FTPS explicit
        - FTPS implicit
        - SFTP
        - Not connection-related
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use sanitized host/user/path examples only.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ByFTP
        2. Connect to sanitized.example
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, passphrases, private keys and confidential server/customer data from this report.
          required: true
