name: Prijava greške
description: Prijavite ponovljiv problem u ByFTP-u
title: "[Greška] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Hvala na prijavi. Nemojte uključivati lozinke, zaporke privatnog ključa, privatne ključeve ni povjerljive podatke poslužitelja ili klijenta.
  - type: input
    id: version
    attributes:
      label: ByFTP verzija
      description: Upišite broj verzije prikazan u ByFTP-u ili naziv preuzetog službenog izdanja.
      placeholder: "npr. verzija prikazana u aplikaciji"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protokol
      options:
        - FTP
        - FTPS — eksplicitni
        - FTPS — implicitni
        - SFTP
        - Problem nije vezan uz povezivanje
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows verzija
      options:
        - Windows 11
        - Windows 10
        - Drugo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Što se dogodilo?
      description: Koristite samo sanitizirane primjere hosta, korisnika i putanja.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Koraci za reprodukciju
      placeholder: |
        1. Otvorite ByFTP
        2. Povežite se na sanitizirani.example
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Očekivano ponašanje
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Provjera privatnosti
      options:
        - label: Uklonio/la sam lozinke, zaporke, privatne ključeve i povjerljive podatke poslužitelja/klijenta iz ove prijave.
          required: true
