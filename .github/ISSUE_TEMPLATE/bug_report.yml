name: Bug report
description: Report a reproducible problem in Ghost FTP
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, private-key passphrases, private keys, or confidential server/customer data.
  - type: input
    id: version
    attributes:
      label: Ghost FTP version
      description: Enter the version shown in Ghost FTP or the name of the downloaded official release.
      placeholder: "e.g. the version shown in the application"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - FTP
        - FTPS — explicit
        - FTPS — implicit
        - SFTP
        - Not connection-related
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Android
        - iOS
        - Web
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use only sanitized host, username, and path examples.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Ghost FTP
        2. Connect to sanitized.example
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, passphrases, private keys, and confidential server/customer data from this report.
          required: true
