# Ghost FTP by Brendigo
version: 2
updates:
  - package-ecosystem: npm
    directory: /ghostftp-desktop
    schedule:
      interval: daily
      time: "07:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 8
    groups:
      npm-maintenance:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /ghostftp-desktop/src-tauri
    schedule:
      interval: daily
      time: "07:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 8
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "07:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 6
  - package-ecosystem: gomod
    directory: /tools/ghostftp-runtime
    schedule:
      interval: daily
      time: "07:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 4
  - package-ecosystem: gomod
    directory: /tools/ghostftp-installer
    schedule:
      interval: daily
      time: "07:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 4
