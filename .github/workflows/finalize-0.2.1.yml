name: Finalize Ghost FTP 0.2.1

on:
  push:
    branches:
      - work/windows-ui-stability-logo-20260906
    paths:
      - .github/workflows/finalize-0.2.1.yml
      - scripts/finalize_0_2_1.py

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  finalize:
    name: Patch, test and commit 0.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/windows-ui-stability-logo-20260906
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Apply and prove 0.2.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_0_2_1.py
