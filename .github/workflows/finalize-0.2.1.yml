name: Finalize Ghost FTP 0.2.1

on:
  push:
    branches:
      - work/windows-ui-stability-logo-20260906
    paths:
      - .github/workflows/finalize-0.2.1.yml
      - scripts/finalize_0_2_1.py

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  finalize:
    name: Patch, test and commit 0.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/windows-ui-stability-logo-20260906
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Apply and prove 0.2.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/finalize_0_2_1.py')
          text = p.read_text(encoding='utf-8')
          local_line = "        ('u.openPrompt(linuxPromptLocalMkdir, \"New local folder\", \"New folder\")', 'u.openPrompt(linuxPromptLocalMkdir, u.tr(\"common.new_folder\")+\" · \"+u.tr(\"section.local\"), u.tr(\"common.new_folder\"))'),\n"
          remote_line = "        ('u.openPrompt(linuxPromptRemoteMkdir, \"New server folder\", \"New folder\")', 'u.openPrompt(linuxPromptRemoteMkdir, u.tr(\"common.new_folder\")+\" · \"+u.tr(\"section.remote\"), u.tr(\"common.new_folder\"))'),\n"
          if text.count(local_line) != 1 or text.count(remote_line) != 1:
              raise SystemExit('migration target fix guard failed')
          text = text.replace(local_line, '', 1).replace(remote_line, '', 1)
          needle = 'replace_all_checked(\n    "internal/desktop/gui_linux_actions.go",\n'
          if text.count(needle) != 1:
              raise SystemExit('migration insertion guard failed')
          block = '''replace_all_checked(\n    "internal/desktop/gui_linux.go",\n    [\n        ('u.openPrompt(linuxPromptLocalMkdir, "New local folder", "New folder")', 'u.openPrompt(linuxPromptLocalMkdir, u.tr("common.new_folder")+" · "+u.tr("section.local"), u.tr("common.new_folder"))'),\n        ('u.openPrompt(linuxPromptRemoteMkdir, "New server folder", "New folder")', 'u.openPrompt(linuxPromptRemoteMkdir, u.tr("common.new_folder")+" · "+u.tr("section.remote"), u.tr("common.new_folder"))'),\n    ],\n)\n\n'''
          text = text.replace(needle, block + needle, 1)
          p.write_text(text, encoding='utf-8')

          security = Path('docs/SECURITY.md')
          security_text = security.read_text(encoding='utf-8')
          old = '**Current Ghost FTP release: 0.2.0**'
          new = '**Current Ghost FTP release: 0.2.1**'
          if security_text.count(old) != 1:
              raise SystemExit('security release marker guard failed')
          security.write_text(security_text.replace(old, new, 1), encoding='utf-8')

          maintenance = Path('scripts/test_maintenance.py')
          maintenance_text = maintenance.read_text(encoding='utf-8')
          old_test = '        self.assertEqual(version, "0.2.0")'
          new_test = '        self.assertEqual(version, "0.2.1")'
          if maintenance_text.count(old_test) != 1:
              raise SystemExit('maintenance version guard failed')
          maintenance.write_text(maintenance_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          git add docs/SECURITY.md scripts/test_maintenance.py
          python scripts/finalize_0_2_1.py
