name: Ghost FTP Temporary Gofmt Helper

on:
  push:
    branches:
      - ui/windows-master-parity-0.0.9

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Format Windows master workspace
        run: gofmt -w internal/desktop/master_workspace_windows.go
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: ghostftp-gofmt-master-workspace
          path: internal/desktop/master_workspace_windows.go
          if-no-files-found: error
