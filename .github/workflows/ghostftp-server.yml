name: Ghost FTP Server Phase 4

on:
  push:
    branches: [main]
    paths:
      - 'ghost-server/**'
      - '.github/workflows/ghostftp-server.yml'
  pull_request:
    paths:
      - 'ghost-server/**'
      - '.github/workflows/ghostftp-server.yml'

permissions:
  contents: read

jobs:
  standalone-ftps-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Source formatting
        run: gofmt -w ghost-server
      - name: Run real localhost TLS and filesystem tests with race detector
        working-directory: ghost-server
        run: go test -race -count=1 ./...
      - name: Run go vet
        working-directory: ghost-server
        run: go vet ./...
      - name: Cross compile the standalone Windows portable executable
        working-directory: ghost-server
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/ghost-server-windows-amd64.exe ./cmd/ghost-server
      - name: Build standalone Linux binary
        working-directory: ghost-server
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/ghost-server-linux-amd64 ./cmd/ghost-server
          cd dist
          sha256sum ghost-server-windows-amd64.exe ghost-server-linux-amd64 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload unsigned Phase 4 developer artifacts (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Server-ReadOnly-FTPS-Dev
          path: ghost-server/dist/*
          retention-days: 14
          if-no-files-found: error

  windows-service-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Run Windows-native FTP/TLS regression tests
        working-directory: ghost-server
        run: go test -count=1 ./...
      - name: Compile genuine Windows SCM service mode
        working-directory: ghost-server
        run: go build -trimpath -o "$env:RUNNER_TEMP\\ghost-server-scm.exe" ./cmd/ghost-server
      - name: Validate service installation/uninstallation PowerShell syntax
        shell: pwsh
        run: |
          $files = @('ghost-server/install/Install-GhostFTPServer.ps1','ghost-server/install/Uninstall-GhostFTPServer.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors: $errors" }
          }

      - name: Build genuine unsigned NSIS setup executable
        shell: pwsh
        working-directory: ghost-server
        run: |
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler unavailable' }
          & $compiler /V2 'install\GhostFTPServer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'dist\ghost-server-windows-x64-setup-unsigned.exe')) { throw 'NSIS setup file missing' }
      - name: Hash unsigned Windows portable + setup
        shell: pwsh
        working-directory: ghost-server
        run: |
          $files=@('ghost-server-windows-amd64.exe','ghost-server-windows-x64-setup-unsigned.exe')
          $lines=foreach ($file in $files) {
            $hash=(Get-FileHash -LiteralPath (Join-Path 'dist' $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path 'dist').Path 'Windows-SHA256SUMS.txt'),[string[]]$lines)
      - name: Upload unsigned Windows service + setup developer package
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Server-Windows-Setup-Dev
          path: ghost-server/dist/*
          retention-days: 14
          if-no-files-found: error
