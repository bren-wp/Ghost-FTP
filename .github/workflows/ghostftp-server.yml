name: Ghost FTP Server Phase 4

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standalone-ftps-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Source formatting
        run: gofmt -w ghost-server
      - name: Run real localhost TLS and filesystem tests with race detector
        working-directory: ghost-server
        run: go test -race -count=1 ./...
      - name: Run go vet
        working-directory: ghost-server
        run: go vet ./...
      - name: Validate offline demo source and race-safety alongside server
        run: go test -C ghost-demo -race ./...
      - name: Prepare RPM packaging tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
      - name: Cross compile standalone Windows binary and build Linux binary with canonical version
        working-directory: ghost-server
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('../version.json').version")"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION -X ghostftp/server.BuildVersion=$VERSION" -o dist/ghost-server-windows-amd64.exe ./cmd/ghost-server
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$VERSION -X ghostftp/server.BuildVersion=$VERSION" -o dist/ghost-server-linux-amd64 ./cmd/ghost-server
          test "$(dist/ghost-server-linux-amd64 -version)" = "Ghost FTP Server $VERSION Preview"
      - name: Build and validate standalone Linux, tarball, DEB, RPM and systemd payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./version.json').version")"
          bash ghost-server/install/linux/build-packages.sh "$VERSION"
          cd ghost-server/dist
          sha256sum GhostFTP-Server-Linux-* > Linux-SHA256SUMS.txt
          sha256sum -c Linux-SHA256SUMS.txt
      - name: Upload exact-SHA Linux server release candidates
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Server-Linux-Package-Preview
          path: |
            ghost-server/dist/GhostFTP-Server-Linux-*
            ghost-server/dist/Linux-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  windows-service-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Run Windows-native FTP/TLS regression tests
        working-directory: ghost-server
        run: go test -count=1 ./...
      - name: Compile genuine Windows SCM service mode
        working-directory: ghost-server
        run: go build -trimpath -o "$env:RUNNER_TEMP\\ghost-server-scm.exe" ./cmd/ghost-server
      - name: Validate service installation/uninstallation PowerShell syntax
        shell: pwsh
        run: |
          $files = @('ghost-server/install/Install-GhostFTPServer.ps1','ghost-server/install/Uninstall-GhostFTPServer.ps1','ghost-server/install/Smoke-GhostFTPServer-CI.ps1','ghost-server/install/Smoke-GhostFTPInstaller-CI.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors: $errors" }
          }

      - name: Build Windows portable executable for NSIS payload
        shell: pwsh
        working-directory: ghost-server
        run: |
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $version=(Get-Content '../version.json' -Raw | ConvertFrom-Json).version
          go build -trimpath -ldflags "-X main.version=$version -X ghostftp/server.BuildVersion=$version" -o 'dist/ghost-server-windows-amd64.exe' ./cmd/ghost-server
          if ((& './dist/ghost-server-windows-amd64.exe' -version) -ne "Ghost FTP Server $version Preview") { throw 'Wrong embedded server version' }
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable build failed' }
          if (-not (Test-Path -LiteralPath 'dist/ghost-server-windows-amd64.exe')) { throw 'Windows setup payload missing' }
      - name: Real Windows LocalService install, start, FTP greeting and stop
        shell: pwsh
        working-directory: ghost-server
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'GhostFTP-Server-QA-Private'
          & ./install/Smoke-GhostFTPServer-CI.ps1 -Executable 'dist/ghost-server-windows-amd64.exe' -FixtureDir $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Windows Service Control Manager smoke failed' }
      - name: Build genuine unsigned NSIS setup executable
        shell: pwsh
        working-directory: ghost-server
        run: |
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler unavailable' }
          & $compiler /V2 'install\GhostFTPServer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'dist\ghost-server-windows-x64-setup-unsigned.exe')) { throw 'NSIS setup file missing' }
      - name: Exercise real NSIS install and uninstall without side effects
        shell: pwsh
        working-directory: ghost-server
        run: |
          # This PowerShell script throws on real failure and never sets the
          # process-scoped $LASTEXITCODE. Checking that variable afterward
          # reuses the exit code from a prior, unrelated sc.exe invocation.
          & ./install/Smoke-GhostFTPInstaller-CI.ps1 -Setup 'dist/ghost-server-windows-x64-setup-unsigned.exe'
      - name: Hash unsigned Windows portable + setup
        shell: pwsh
        working-directory: ghost-server
        run: |
          $files=@('ghost-server-windows-amd64.exe','ghost-server-windows-x64-setup-unsigned.exe')
          $lines=foreach ($file in $files) {
            $hash=(Get-FileHash -LiteralPath (Join-Path 'dist' $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path 'dist').Path 'Windows-SHA256SUMS.txt'),[string[]]$lines)
      - name: Build and self-test isolated Ghost FTP Demo Windows portable
        shell: pwsh
        working-directory: ghost-server
        run: |
          $ErrorActionPreference = 'Stop'
          go test -C ../ghost-demo ./...
          if ($LASTEXITCODE -ne 0) { throw 'Offline Ghost FTP Demo unit tests failed' }
          $version=(Get-Content '../version.json' -Raw | ConvertFrom-Json).version
          $demo=Join-Path (Resolve-Path 'dist').Path "GhostFTP-Demo-Windows-x64-Portable-v$version.exe"
          go build -C ../ghost-demo -trimpath -ldflags "-X main.version=$version" -o $demo .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $demo)) { throw 'Real Windows Demo EXE build failed' }
          if ((& $demo -version) -ne "Ghost FTP Demo $version Preview") { throw 'Demo binary version mismatch' }
          if ((& $demo -self-test) -ne "Ghost FTP Demo offline/self-test PASS") { throw 'Demo self-test failed' }
          if ((Get-Item $demo).Length -le 0) { throw 'Empty Demo EXE' }
      - name: Normalize exact-SHA Windows server release candidates and hashes
        shell: pwsh
        working-directory: ghost-server
        run: |
          $version=(Get-Content '../version.json' -Raw | ConvertFrom-Json).version
          Copy-Item 'dist/ghost-server-windows-amd64.exe' "dist/GhostFTP-Server-Windows-x64-Portable-v$version.exe"
          Copy-Item 'dist/ghost-server-windows-x64-setup-unsigned.exe' "dist/GhostFTP-Server-Windows-x64-Setup-Unsigned-Preview-v$version.exe"
          $names=@("GhostFTP-Server-Windows-x64-Portable-v$version.exe","GhostFTP-Server-Windows-x64-Setup-Unsigned-Preview-v$version.exe","GhostFTP-Demo-Windows-x64-Portable-v$version.exe")
          $lines=foreach($name in $names) { $digest=(Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant(); "$digest  $name" }
          # Linux sha256sum expects LF, not PowerShell's Windows CRLF output.
          [IO.File]::WriteAllText((Join-Path (Resolve-Path 'dist').Path 'Release-SHA256SUMS.txt'),(($lines -join "`n") + "`n"),[Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText((Join-Path (Resolve-Path 'dist').Path 'Release-SHA256SUMS.txt')).Contains("`r")) { throw 'Checksum manifest must be LF-only' }
          foreach($name in $names) { if ((Get-Item (Join-Path 'dist' $name)).Length -le 0) { throw "Empty server asset $name" } }
      - name: Upload exact-SHA Windows portable and unsigned NSIS setup release candidates
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Server-Windows-Package-Preview
          path: |
            ghost-server/dist/GhostFTP-Server-Windows-*
            ghost-server/dist/GhostFTP-Demo-Windows-*
            ghost-server/dist/Release-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
