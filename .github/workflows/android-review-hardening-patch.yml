name: Apply Android review hardening patch

on:
  push:
    branches: [parity/android-advanced-workspace]
    paths:
      - '.github/workflows/android-review-hardening-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: parity/android-advanced-workspace
          fetch-depth: 0
      - name: Apply deterministic review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_android_review_hardening.py')
          text = path.read_text(encoding='utf-8')
          helper_marker = '    return text.replace(old, new, 1)\n\n\nftp = FTP.read_text(encoding="utf-8")\n'
          helper_replacement = '''    return text.replace(old, new, 1)\n\n\ndef first(text: str, old: str, new: str, label: str) -> str:\n    if old not in text:\n        raise SystemExit(f"{label}: marker not found")\n    download = text.find("    synchronized void download(")\n    occurrence = text.find(old)\n    if occurrence < 0 or download < 0 or occurrence > download:\n        raise SystemExit(f"{label}: first marker is not in upload path")\n    return text.replace(old, new, 1)\n\n\nftp = FTP.read_text(encoding="utf-8")\n'''
          if text.count(helper_marker) != 1:
              raise SystemExit('helper insertion marker mismatch')
          text = text.replace(helper_marker, helper_replacement, 1)
          call_marker = 'ftp = once(\n    ftp,\n    "        if (!gate.markReadyToCommit()) {\\n",\n'
          call_replacement = 'ftp = first(\n    ftp,\n    "        if (!gate.markReadyToCommit()) {\\n",\n'
          if text.count(call_marker) != 1:
              raise SystemExit('staged mode invocation marker mismatch')
          path.write_text(text.replace(call_marker, call_replacement, 1), encoding='utf-8')
          PY
          python scripts/apply_android_review_hardening.py
          git checkout -- scripts/apply_android_review_hardening.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'android/app/src/main/java/app/ghostftp/client/FtpSession.java\nandroid/app/src/main/java/app/ghostftp/client/MainActivity.java'
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit production review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add android/app/src/main/java/app/ghostftp/client/FtpSession.java \
                  android/app/src/main/java/app/ghostftp/client/MainActivity.java
          git commit -m 'Harden Android Remote Edit and recursive search review paths'
          git push origin HEAD:parity/android-advanced-workspace
