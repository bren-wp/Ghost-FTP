name: Završna 2.16 validacija i merge

on:
  push:
    branches:
      - agent/byftp-2.16.0-connect-reliability
    paths:
      - '.github/workflows/final-validate-merge-2.16.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_brand_assets.py --check
          python scripts/audit_croatian.py
          python scripts/audit_version.py
          python scripts/audit_docs.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_release.py
          python -m unittest discover -s scripts -p 'test_*.py'
          go test ./...
          go test -race ./...
          go vet ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - shell: pwsh
        run: .\BUILD-WINDOWS.ps1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - shell: bash
        run: |
          set -euo pipefail
          bash scripts/BUILD-LINUX.sh
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/ByFTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = byftp
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - shell: bash
        run: |
          set -euo pipefail
          bash scripts/BUILD-MACOS.sh
          version="$(tr -d '\r\n' < VERSION)"
          pkg="dist/ByFTP-${version}-macOS-Universal.pkg"
          test -s "$pkg"
          pkgutil --expand "$pkg" "$RUNNER_TEMP/byftp-pkg"
          test -f "$RUNNER_TEMP/byftp-pkg/PackageInfo"

  clean-and-merge:
    needs: [quality, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
          fetch-depth: 0
      - name: Ukloni sve razvojne pomoćne datoteke
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/debug-unit-test.log .github/debug-windows-build.log
          rm -f .github/workflows/debug-2.16.yml
          rm -f .github/workflows/fix-askpass-2.16.yml
          rm -f .github/workflows/cleanup-temp-2.16.yml
          rm -f .github/workflows/finalize-docs-2.16.yml
          rm -f .github/workflows/final-validate-merge-2.16.yml
          git config user.name 'ByFTP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Očisti 2.16 razvojne pomoćne datoteke'
            git push origin HEAD:agent/byftp-2.16.0-connect-reliability
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Squash spoji provjereni PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge 15 --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$FINAL_SHA" --subject 'ByFTP 2.16.0 — pouzdanije povezivanje i više platformi' --body 'SFTP connect reliability, Windows x64/x86, Linux DEB, macOS Universal, sigurnost, release ugovor i dokumentacija.'
