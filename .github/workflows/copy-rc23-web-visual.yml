name: Copy RC23 web visual

on:
  push:
    branches:
      - 'fix/rc23-post-merge-hardening'
    paths:
      - '.github/workflows/copy-rc23-web-visual.yml'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Copy reviewed native screenshot into website assets
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/assets/screenshots/ghostftp-native-files.png
          cp docs/assets/screenshots/ghostftp-native-files.png website/assets/ghostftp-app.png
          test -s website/assets/ghostftp-app.png

      - name: Commit web visual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/ghostftp-app.png
          if git diff --cached --quiet; then
            echo "Web visual already matches the reviewed native screenshot."
            exit 0
          fi
          git commit -m "web: use reviewed RC23 native app visual"
          git push origin "HEAD:${GITHUB_REF_NAME}"
