name: Refresh canonical Cargo lock

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'ghostftp-desktop/src-tauri/**/Cargo.toml'
      - '.github/scripts/refresh-cargo-lock.sh'
      - '.github/workflows/cargo-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: ghostftp-cargo-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate and validate canonical lockfile
        shell: bash
        run: bash .github/scripts/refresh-cargo-lock.sh

      - name: Commit Cargo-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostftp-desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already canonical"
            exit 0
          fi
          git commit -m "deps: commit canonical Cargo lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
