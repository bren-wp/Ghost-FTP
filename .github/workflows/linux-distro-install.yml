name: Ghost FTP Linux Universal Installer Matrix

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'linux/**'
      - 'build/icon.png'
      - 'LICENSE'
      - '.github/workflows/linux-distro-install.yml'
      - 'scripts/verify_linux_distro_install.sh'
      - 'scripts/test_linux_distro_install_contract.py'
  push:
    branches:
      - main
      - 'packaging/**'
    paths:
      - 'VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'linux/**'
      - 'build/icon.png'
      - 'LICENSE'
      - '.github/workflows/linux-distro-install.yml'
      - 'scripts/verify_linux_distro_install.sh'
      - 'scripts/test_linux_distro_install_contract.py'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  native-amd64-install:
    name: Universal installer install GUI smoke and uninstall on Debian Ubuntu Fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'

      - name: Verify install-gate source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify_linux_distro_install.sh
          python -m py_compile scripts/test_linux_distro_install_contract.py
          python scripts/test_linux_distro_install_contract.py

      - name: Build exact-head universal distro bundles
        shell: bash
        run: |
          set -euo pipefail
          bash linux/BUILD-DISTROS.sh
          version="$(tr -d '\r\n' < VERSION)"
          for distro in Debian Ubuntu Fedora; do
            test -x "dist/Ghost-FTP-${version}-Linux-${distro}-Installer.run"
            test -s "dist/Ghost-FTP-${version}-Linux-${distro}-Portable.tar.gz"
          done

      - name: Verify Debian 13 native amd64 installer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            debian:13-slim \
            bash scripts/verify_linux_distro_install.sh debian "$version" 13 \
              "/workspace/dist/Ghost-FTP-${version}-Linux-Debian-Installer.run"

      - name: Verify Ubuntu 26.04 LTS native amd64 installer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            ubuntu:26.04 \
            bash scripts/verify_linux_distro_install.sh ubuntu "$version" 26.04 \
              "/workspace/dist/Ghost-FTP-${version}-Linux-Ubuntu-Installer.run"

      - name: Verify Fedora 44 native x86_64 installer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            fedora:44 \
            bash scripts/verify_linux_distro_install.sh fedora "$version" 44 \
              "/workspace/dist/Ghost-FTP-${version}-Linux-Fedora-Installer.run"

      - name: Record install matrix scope
        shell: bash
        run: |
          set -euo pipefail
          echo 'LINUX_DISTRO_INSTALL_MATRIX=PASS'
          echo 'Native installer runtime coverage: Debian 13 amd64; Ubuntu 26.04 amd64; Fedora 44 x86_64.'
          echo 'arm64 and i386 payloads are build/package verified on exact head; this matrix does not claim native ARM64/i386 runtime execution.'
