name: Validate Windows hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript and production frontend
        working-directory: ghostftp-desktop
        run: npm run build
      - name: UI contracts
        working-directory: ghostftp-desktop
        run: npm run check:ui
      - name: Windows helper process hardening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/ghostftp-installer/payload
          : > tools/ghostftp-installer/payload/GhostFTP.exe
          (cd tools/ghostftp-installer && go test ./...)
          (cd tools/ghostftp-runtime && go test ./...)
          grep -Fq 'CREATE_NO_WINDOW' ghostftp-desktop/src-tauri/ghostftp-agentd/src/jobs.rs

          # Native GUI process launches must stay windowless on Windows. These
          # contracts cover runtime surfaces that have historically flashed a
          # console-subsystem helper during normal GUI workflows.
          test "$(grep -Fc 'crate::windows_process::hide_console(&mut command);' ghostftp-desktop/src-tauri/src/editor.rs)" -ge 2
          grep -Fq 'crate::windows_process::hide_console(&mut command);' ghostftp-desktop/src-tauri/src/oauth.rs
          grep -Fq 'crate::windows_process::hide_console(&mut command);' ghostftp-desktop/src-tauri/src/commands.rs
          grep -Fq 'crate::windows_process::hide_console(&mut command);' ghostftp-desktop/src-tauri/src/lib.rs
          grep -Fq 'creation_flags(CREATE_NO_WINDOW)' ghostftp-desktop/src-tauri/src/main.rs
          ! grep -Fq 'Command::new("where")' ghostftp-desktop/src-tauri/src/path_integration.rs
          ! grep -Fq 'Command::new("which")' ghostftp-desktop/src-tauri/src/path_integration.rs

          ! grep -En 'exec\.Command\("(rundll32|reg|powershell|cmd(\.exe)?)"' \
            tools/ghostftp-installer/main.go \
            tools/ghostftp-runtime/main.go
      - name: Rust formatting
        working-directory: ghostftp-desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Verify committed Rust dependency graph
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Rust tests
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # Test every native/library workspace member without forcing the CLI
          # test harness to link the GUI/WebView2 runtime into a console binary.
          cargo test --workspace --exclude ghostftp-cli --locked
          # Execute all pure CLI safety/version tests in the lightweight lib target.
          cargo test -p ghostftp-cli --no-default-features --lib --locked
          # Still compile-check the complete CLI runtime and ghostftp_lib integration.
          cargo check -p ghostftp-cli --locked
