name: Validate Windows hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript and production frontend
        working-directory: ghostftp-desktop
        run: npm run build
      - name: UI contracts
        working-directory: ghostftp-desktop
        run: npm run check:ui
      - name: Windows helper process hardening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/ghostftp-installer/payload
          : > tools/ghostftp-installer/payload/GhostFTP.exe
          (cd tools/ghostftp-installer && go test ./...)
          (cd tools/ghostftp-runtime && go test ./...)
          grep -Fq 'CREATE_NO_WINDOW' ghostftp-desktop/src-tauri/ghostftp-agentd/src/jobs.rs
          ! grep -En 'exec\.Command\("(rundll32|reg|powershell|cmd(\.exe)?)"' \
            tools/ghostftp-installer/main.go \
            tools/ghostftp-runtime/main.go
      - name: Rust formatting
        working-directory: ghostftp-desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Verify committed Rust dependency graph
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Rust tests
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # Test every native/library workspace member without forcing the CLI
          # test harness to link the GUI/WebView2 runtime into a console binary.
          cargo test --workspace --exclude ghostftp-cli --locked
          # Execute all pure CLI safety/version tests in the lightweight lib target.
          cargo test -p ghostftp-cli --no-default-features --lib --locked
          # Still compile-check the complete CLI runtime and ghostftp_lib integration.
          cargo check -p ghostftp-cli --locked
      - name: Windows NSIS production bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: --bundles nsis
      - name: Windows Setup install and uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $setup) { throw 'NSIS Setup executable was not produced.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'GhostFTP-Setup-Smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Ghost FTP Setup failed with exit code $($install.ExitCode)"
          }

          $installedExe = Get-ChildItem $installDir -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installedExe -or $installedExe.Length -le 0) {
            throw 'Ghost FTP executable was not installed by Setup.'
          }

          $uninstaller = Get-ChildItem $installDir -Filter '*uninstall*.exe' -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw 'Ghost FTP uninstaller was not installed.' }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Ghost FTP uninstaller failed with exit code $($uninstall.ExitCode)"
          }

          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installedExe.FullName); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installedExe.FullName) {
            throw 'Ghost FTP executable remained after silent uninstall.'
          }
