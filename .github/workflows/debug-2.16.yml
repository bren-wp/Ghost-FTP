name: Privremena 2.16 dijagnostika

on:
  push:
    branches:
      - agent/byftp-2.16.0-connect-reliability
    paths:
      - '.github/workflows/debug-2.16.yml'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  linux-unit-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Zabilježi unit izlaz
        shell: bash
        run: |
          set +e
          go test ./... > unit-test.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> unit-test.log
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-unit-log
          path: unit-test.log
          if-no-files-found: error
          retention-days: 1

  windows-build-log:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Zabilježi Windows build izlaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & .\BUILD-WINDOWS.ps1 *>&1 | Tee-Object -FilePath 'windows-build.log'
          "EXIT_CODE=$LASTEXITCODE" | Add-Content 'windows-build.log'
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-windows-log
          path: windows-build.log
          if-no-files-found: error
          retention-days: 1
