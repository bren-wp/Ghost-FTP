name: Finalize Ghost FTP 0.2.0 release surface
# Final desktop release/documentation/dead-code cleanup gate.

on:
  push:
    branches:
      - work/ghostftp-0.2.0-desktop-quality
    paths:
      - .github/workflows/finalize-020-release-surface.yml

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: work/ghostftp-0.2.0-desktop-quality
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Apply and verify desktop release cleanup
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          python scripts/finalize_020_docs.py
          python scripts/finalize_020_dead_code.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize_020_release_surface.py')
          text = path.read_text(encoding='utf-8')
          old = 'for rel in (".github/workflows/release.yml", "scripts/audit_release.py", "scripts/README.md"):'
          new = 'for rel in (".github/workflows/release.yml", "scripts/README.md"):'
          if text.count(old) != 1:
              raise SystemExit('release cleanup guard patch target is not unique')
          text = text.replace(old, new, 1)
          marker = '# Verify the changed policy before committing it.\n'
          staged = 'subprocess.run(["git", "add", "-A"], cwd=ROOT, check=True)\n'
          if text.count(marker) != 1:
              raise SystemExit('release cleanup staging patch target is not unique')
          text = text.replace(marker, marker + staged, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/finalize_020_release_surface.py
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -print))"
          python -m unittest discover -s scripts -p 'test_*.py'
          go test ./...
          GOOS=windows GOARCH=amd64 go build -o /tmp/GhostFTP-x64.exe ./cmd/ghostftp
          GOOS=windows GOARCH=amd64 go build -o /tmp/GhostFTP-Setup-x64.exe ./cmd/installer
          GOOS=windows GOARCH=386 go build -o /tmp/GhostFTP-x86.exe ./cmd/ghostftp
          GOOS=windows GOARCH=386 go build -o /tmp/GhostFTP-Setup-x86.exe ./cmd/installer
      - name: Commit verified desktop release cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize 0.2.0 canonical desktop UI and release surface'
          git push origin HEAD:work/ghostftp-0.2.0-desktop-quality
