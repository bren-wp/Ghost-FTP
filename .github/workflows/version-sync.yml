name: Sync central product version

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'version.json'
      - '.github/scripts/sync-version.mjs'
      - '.github/scripts/refresh-cargo-lock.sh'
      - '.github/workflows/version-sync.yml'

permissions:
  contents: write

concurrency:
  group: ghostftp-version-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Synchronize all product metadata
        run: |
          set -euo pipefail
          node .github/scripts/sync-version.mjs
          node .github/scripts/sync-version.mjs --check

      - name: Validate canonical Cargo lockfile
        shell: bash
        run: bash .github/scripts/refresh-cargo-lock.sh

      - name: Verify native macOS credential vault stays in the locked graph
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"apple-native"' ghostftp-desktop/src-tauri/Cargo.toml
          grep -Fq '"security-framework 2.11.1"' ghostftp-desktop/src-tauri/Cargo.lock
          grep -Fq '"security-framework 3.7.0"' ghostftp-desktop/src-tauri/Cargo.lock
          echo "Native Apple Keychain and existing TLS security framework lock graph preserved."

      - name: Diagnose Cargo feature-graph drift without publishing changes
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          cd ghostftp-desktop/src-tauri
          echo "::notice::Diagnostic only: compute Cargo.lock changes without --locked; no publishing or dependency-version upgrades authorized."
          cargo metadata --format-version 1 > /dev/null || true
          git diff -- Cargo.lock | head -n 180 || true
          git status --short Cargo.lock || true

      - name: Commit synchronized metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostftp-desktop android tools updates ghostftp-desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "All version metadata already synchronized."
            exit 0
          fi
          git commit -m "release: sync metadata from central version"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
