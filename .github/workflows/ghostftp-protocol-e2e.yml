name: Ghost FTP protocol E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-protocol-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-protocol-roundtrip:
    name: Real FTP / FTPS / SFTP roundtrip
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri -> target

      - name: Install native and protocol test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            openssh-server \
            python3-pip \
            netcat-openbsd \
            ca-certificates \
            openssl \
            vsftpd \
            strace

          python3 -m pip install --disable-pip-version-check --no-cache-dir pyftpdlib pyopenssl

      - name: Prepare desktop frontendDist for Rust tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ghostftp-desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > ghostftp-desktop/dist/index.html

      - name: Start real FTP, explicit FTPS and SFTP servers
        shell: bash
        run: |
          set -euo pipefail

          USERNAME=ghostftp_e2e
          PASSWORD="$(openssl rand -hex 24)"
          KEYPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$KEYPASS"

          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo install -d -m 0555 -o root -g root "/home/$USERNAME/ghostftp-e2e-readonly"

          # SFTP password + encrypted OpenSSH private-key authentication.
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          ssh-keygen -q -t ed25519 -N "$KEYPASS" -f "$RUNNER_TEMP/ghostftp_e2e_ed25519"

          # Seed the runner's known_hosts with a deliberately stale key for the
          # test SFTP endpoint. The Rust E2E must reject this mismatch, then an
          # explicit Trust decision must atomically replace it with the real key.
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ghostftp_e2e_stale_host"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          awk '{ print "[127.0.0.1]:2222 " $1 " " $2 }'             "$RUNNER_TEMP/ghostftp_e2e_stale_host.pub" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          sudo install -d -m 700 -o "$USERNAME" -g "$USERNAME" "/home/$USERNAME/.ssh"
          sudo install -m 600 -o "$USERNAME" -g "$USERNAME" \
            "$RUNNER_TEMP/ghostftp_e2e_ed25519.pub" "/home/$USERNAME/.ssh/authorized_keys"

          cat > "$RUNNER_TEMP/ghostftp-sshd.conf" <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM no
          PermitRootLogin no
          AllowUsers ghostftp_e2e
          Subsystem sftp internal-sftp
          PidFile /tmp/ghostftp-e2e-sshd.pid
          LogLevel VERBOSE
          EOF
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/ghostftp-sshd.conf" -E "$RUNNER_TEMP/ghostftp-sshd.log"

          # A one-run CA trusted by the runner, plus a server certificate valid
          # for localhost only. The IP mismatch is asserted by the Rust E2E test.
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=Ghost FTP E2E CA' \
            -keyout "$RUNNER_TEMP/ghostftp-e2e-ca.key" \
            -out "$RUNNER_TEMP/ghostftp-e2e-ca.crt"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -subj '/CN=localhost' \
            -keyout "$RUNNER_TEMP/ghostftp-e2e-server.key" \
            -out "$RUNNER_TEMP/ghostftp-e2e-server.csr"
          cat > "$RUNNER_TEMP/ghostftp-e2e-server.ext" <<'EOF'
          subjectAltName=DNS:localhost
          extendedKeyUsage=serverAuth
          keyUsage=digitalSignature,keyEncipherment
          EOF
          openssl x509 -req -sha256 -days 1 \
            -in "$RUNNER_TEMP/ghostftp-e2e-server.csr" \
            -CA "$RUNNER_TEMP/ghostftp-e2e-ca.crt" \
            -CAkey "$RUNNER_TEMP/ghostftp-e2e-ca.key" \
            -CAcreateserial \
            -extfile "$RUNNER_TEMP/ghostftp-e2e-server.ext" \
            -out "$RUNNER_TEMP/ghostftp-e2e-server.crt"
          sudo cp "$RUNNER_TEMP/ghostftp-e2e-ca.crt" /usr/local/share/ca-certificates/ghostftp-e2e-ca.crt
          sudo update-ca-certificates

          cat > "$RUNNER_TEMP/ghostftp_ftp_server.py" <<'PY'
          import os
          import sys
          from pyftpdlib.authorizers import DummyAuthorizer
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer

          mode = sys.argv[1]
          username = os.environ["GHOSTFTP_SERVER_USERNAME"]
          password = os.environ["GHOSTFTP_SERVER_PASSWORD"]
          home = os.environ["GHOSTFTP_SERVER_HOME"]

          authorizer = DummyAuthorizer()
          authorizer.add_user(username, password, home, perm="elradfmwMT")

          if mode not in ("ftp", "dos-list", "dos-invalid", "dos-no-a"):
              raise SystemExit(f"unknown server mode: {mode}")

          # This is a REAL FTP data-channel interaction through a running
          # pyftpdlib daemon, not a static/mock return from the Rust parser.
          # It emulates the IIS LIST byte format, NOT the IIS FTP engine.
          class DosListHandler(FTPHandler):
              def ftp_LIST(self, path):
                  if mode == "dos-no-a" and not getattr(self, "_rejected_list_a", False):
                      self._rejected_list_a = True
                      self.respond("550 LIST -a is unsupported")
                      return path
                  rows = [
                      "05-13-25  04:17PM                427 report čćž 文件 with spaces.txt",
                      "04-27-00  09:09PM       <DIR>          Folder Name",
                      "04-27-25  09:09AM                  0 .htaccess",
                      "04-27-00  09:09PM       <DIR>          .",
                      "04-27-00  09:09PM       <DIR>          ..",
                  ]
                  if mode == "dos-invalid":
                      rows.append("04-27-25  09:99AM                77 malformed.txt")
                  if mode == "dos-no-a":
                      # Bare LIST deliberately hides .htaccess while exposing
                      # a real file: a destructive client must refuse upfront.
                      rows = ["04-27-25  09:09AM                  8 visible.txt"]
                  self.push_dtp_data(("\r\n".join(rows) + "\r\n").encode("utf-8"), cmd="LIST")
                  return path

          handler = FTPHandler if mode == "ftp" else DosListHandler
          handler.passive_ports = range(30000, 30010)
          port = {"ftp": 2121, "dos-list": 2123, "dos-invalid": 2124, "dos-no-a": 2125}[mode]

          handler.authorizer = authorizer
          handler.banner = f"Ghost FTP {mode.upper()} E2E"
          server = FTPServer(("127.0.0.1", port), handler)
          server.serve_forever(timeout=0.5, blocking=True)
          PY

          FTP_HOME="$RUNNER_TEMP/ghostftp-ftp-home"
          mkdir -p "$FTP_HOME"
          chmod 700 "$FTP_HOME"
          mkdir -p "$FTP_HOME/ghostftp-e2e-readonly"
          chmod 0555 "$FTP_HOME/ghostftp-e2e-readonly"
          mkdir -p "$FTP_HOME/ghostftp-e2e-safety"
          printf 'survivor' > "$FTP_HOME/ghostftp-e2e-safety/visible.txt"
          printf 'private' > "$FTP_HOME/ghostftp-e2e-safety/.htaccess"

          export GHOSTFTP_SERVER_USERNAME="$USERNAME"
          export GHOSTFTP_SERVER_PASSWORD="$PASSWORD"
          export GHOSTFTP_SERVER_HOME="$FTP_HOME"
          export GHOSTFTP_SERVER_CERT="$RUNNER_TEMP/ghostftp-e2e-server.crt"
          export GHOSTFTP_SERVER_KEY="$RUNNER_TEMP/ghostftp-e2e-server.key"

          python3 "$RUNNER_TEMP/ghostftp_ftp_server.py" ftp \
            >"$RUNNER_TEMP/ghostftp-ftp.log" 2>&1 &
          FTP_PID=$!
          python3 "$RUNNER_TEMP/ghostftp_ftp_server.py" dos-list \
            >"$RUNNER_TEMP/ghostftp-dos-list.log" 2>&1 &
          DOS_PID=$!
          python3 "$RUNNER_TEMP/ghostftp_ftp_server.py" dos-invalid \
            >"$RUNNER_TEMP/ghostftp-dos-invalid.log" 2>&1 &
          DOS_INVALID_PID=$!
          python3 "$RUNNER_TEMP/ghostftp_ftp_server.py" dos-no-a \
            >"$RUNNER_TEMP/ghostftp-dos-no-a.log" 2>&1 &
          DOS_NO_A_PID=$!

          # The pyftpdlib/PyOpenSSL fixture repeatedly returned data TLS 522
          # on LIST, including after reauthentication. This independent local
          # vsftpd server provides genuine protected control AND data sockets.
          # Do not disable certificate or hostname validation in the client.
          sudo systemctl stop vsftpd 2>/dev/null || true
          # vsftpd reads its TLS key and configuration from system-controlled
          # paths, not a runner-owned work directory. The test CA is ephemeral.
          sudo install -d -m 0555 -o root -g root /var/run/vsftpd/empty
          sudo install -m 0644 -o root -g root \
            "$RUNNER_TEMP/ghostftp-e2e-server.crt" /etc/ssl/certs/ghostftp-e2e-server.crt
          sudo install -m 0600 -o root -g root \
            "$RUNNER_TEMP/ghostftp-e2e-server.key" /etc/ssl/private/ghostftp-e2e-server.key
          cat > "$RUNNER_TEMP/ghostftp-vsftpd.conf" <<EOF
          # Localhost-only FTPS fixture with mandatory TLS on both channels.
          listen=YES
          listen_address=127.0.0.1
          listen_port=2122
          anonymous_enable=NO
          local_enable=YES
          write_enable=YES
          local_root=/home/$USERNAME
          pam_service_name=vsftpd
          pasv_min_port=30010
          pasv_max_port=30019
          ssl_enable=YES
          force_local_logins_ssl=YES
          force_local_data_ssl=YES
          ssl_tlsv12=YES
          ssl_tlsv13=NO
          require_ssl_reuse=NO
          rsa_cert_file=/etc/ssl/certs/ghostftp-e2e-server.crt
          rsa_private_key_file=/etc/ssl/private/ghostftp-e2e-server.key
          EOF
          # vsftpd 3.0.5's actual parseconf_bool_array uses ssl_tlsv12 /
          # ssl_tlsv13 (NOT the underscore spellings listed in some manpages).
          # The wrong names caused exit_group(2) before binding port 2122.
          if ! grep -Fxq 'ssl_tlsv12=YES' "$RUNNER_TEMP/ghostftp-vsftpd.conf" ||
             ! grep -Fxq 'ssl_tlsv13=NO' "$RUNNER_TEMP/ghostftp-vsftpd.conf" ||
             grep -Eq '^ssl_tlsv1_[23]=' "$RUNNER_TEMP/ghostftp-vsftpd.conf"; then
            echo "FTPS test fixture has unsupported vsftpd TLS option names." >&2
            exit 1
          fi
          # Session reuse is disabled only for this loopback fixture because
          # SuppaFTP/native-tls does not expose control-session resumption to
          # the separate data socket. TLS encryption remains mandatory.
          sudo install -m 0600 -o root -g root \
            "$RUNNER_TEMP/ghostftp-vsftpd.conf" /etc/ghostftp-e2e-vsftpd.conf
          # Trace metadata only (process/file/socket, no read/write payloads)
          # so an immediate daemon exit has diagnosable errno evidence.
          sudo strace -ff -qq -e trace=process,file,network \
            -o "$RUNNER_TEMP/ghostftp-vsftpd-trace" \
            /usr/sbin/vsftpd /etc/ghostftp-e2e-vsftpd.conf \
            >"$RUNNER_TEMP/ghostftp-ftps.log" 2>&1 &
          FTPS_PID=$!
          sleep 1
          if ! kill -0 "$FTPS_PID" 2>/dev/null; then
            echo "FTPS test daemon quit before binding port 2122." >&2
            cat "$RUNNER_TEMP/ghostftp-ftps.log" >&2 || true
            echo "Last safe daemon process/file/socket syscalls:" >&2
            sudo sh -c 'tail -n 70 "$1"/ghostftp-vsftpd-trace*' sh "$RUNNER_TEMP" >&2 || true
            echo "Diagnostic file/socket/process errno and exit codes:" >&2
            sudo sh -c 'grep -hE "ENOENT|EACCES|EINVAL|EADDRINUSE|EPERM|exit_group|SIG" "$1"/ghostftp-vsftpd-trace* | tail -n 50' sh "$RUNNER_TEMP" >&2 || true
            ps -ef | grep '[v]sftpd' >&2 || true
          fi

          echo "Ghost FTP FTP test server PID: $FTP_PID"
          echo "Ghost FTP FTPS test server PID: $FTPS_PID"

          for port in 2121 2122 2123 2124 2125 2222; do
            ready=0
            for _ in $(seq 1 30); do
              if nc -z 127.0.0.1 "$port"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Protocol test server failed to listen on port $port" >&2
              echo "--- FTP log ---" >&2
              cat "$RUNNER_TEMP/ghostftp-ftp.log" 2>/dev/null || true
              echo "--- FTPS log ---" >&2
              cat "$RUNNER_TEMP/ghostftp-ftps.log" 2>/dev/null || true
              echo "--- vsftpd process/socket/file errno ---" >&2
              sudo sh -c 'grep -hE "ENOENT|EACCES|EINVAL|EADDRINUSE|EPERM|exit_group|SIG" "$1"/ghostftp-vsftpd-trace* | tail -n 50' sh "$RUNNER_TEMP" >&2 || true
              echo "--- last safe process/file/socket syscalls ---" >&2
              sudo sh -c 'tail -n 70 "$1"/ghostftp-vsftpd-trace*' sh "$RUNNER_TEMP" >&2 || true
              echo "--- vsftpd daemon and bound ports ---" >&2
              ps -ef | grep '[v]sftpd' >&2 || true
              sudo ss -ltnp '( sport = :2122 )' >&2 || true
              sudo test -r /etc/ghostftp-e2e-vsftpd.conf || true
              echo "--- SFTP log ---" >&2
              cat "$RUNNER_TEMP/ghostftp-sshd.log" 2>/dev/null || true
              exit 1
            fi
          done

          # Require TLS 1.2 in the local vsftpd fixture; refuse TLS 1.3.
          TLS12_PROBE="$(printf 'QUIT\r\n' | openssl s_client \
            -starttls ftp -connect 127.0.0.1:2122 -tls1_2 -brief 2>&1 || true)"
          if ! grep -q "Protocol version: TLSv1.2" <<<"$TLS12_PROBE"; then
            echo "FTPS E2E fixture did not negotiate TLS 1.2" >&2
            printf '%s\n' "$TLS12_PROBE" >&2
            exit 1
          fi

          TLS13_PROBE="$(printf 'QUIT\r\n' | openssl s_client \
            -starttls ftp -connect 127.0.0.1:2122 -tls1_3 -brief 2>&1 || true)"
          if grep -q "Protocol version: TLSv1.3" <<<"$TLS13_PROBE"; then
            echo "FTPS E2E fixture unexpectedly negotiated TLS 1.3" >&2
            printf '%s\n' "$TLS13_PROBE" >&2
            exit 1
          fi

          {
            echo "GHOSTFTP_PROTOCOL_E2E=1"
            echo "GHOSTFTP_E2E_USERNAME=$USERNAME"
            echo "GHOSTFTP_E2E_PASSWORD=$PASSWORD"
            echo "GHOSTFTP_E2E_FTP_PORT=2121"
            echo "GHOSTFTP_E2E_DOS_PORT=2123"
            echo "GHOSTFTP_E2E_DOS_INVALID_PORT=2124"
            echo "GHOSTFTP_E2E_DOS_NO_A_PORT=2125"
            echo "GHOSTFTP_E2E_FTPS_PORT=2122"
            echo "GHOSTFTP_E2E_SFTP_PORT=2222"
            echo "GHOSTFTP_E2E_KEY_PATH=$RUNNER_TEMP/ghostftp_e2e_ed25519"
            echo "GHOSTFTP_E2E_KEY_PASSPHRASE=$KEYPASS"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Start real standalone Ghost FTP Server for desktop FTPS interoperability
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ghostftp-e2e-server.crt"
          test -s "$RUNNER_TEMP/ghostftp-e2e-server.key"
          test -n "$GHOSTFTP_E2E_USERNAME"
          test -n "$GHOSTFTP_E2E_PASSWORD"
          mkdir -m 0700 "$RUNNER_TEMP/ghostftp-native-server-root"
          (umask 077; printf '%s' "$GHOSTFTP_E2E_PASSWORD" > "$RUNNER_TEMP/ghostftp-native-server-password")
          (cd ghost-server && go build -trimpath -o "$RUNNER_TEMP/ghostftp-native-server" ./cmd/ghost-server)
          "$RUNNER_TEMP/ghostftp-native-server" \
            -listen 127.0.0.1:2126 \
            -root "$RUNNER_TEMP/ghostftp-native-server-root" \
            -cert "$RUNNER_TEMP/ghostftp-e2e-server.crt" \
            -key "$RUNNER_TEMP/ghostftp-e2e-server.key" \
            -user "$GHOSTFTP_E2E_USERNAME" \
            -password-file "$RUNNER_TEMP/ghostftp-native-server-password" \
            -allow-uploads -max-upload-bytes 1048576 \
            >"$RUNNER_TEMP/ghostftp-native-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 2126; then
              echo "GHOSTFTP_E2E_GHOST_PORT=2126" >> "$GITHUB_ENV"
              echo "Genuine Ghost FTP Server is listening on isolated loopback port 2126"
              exit 0
            fi
            sleep 1
          done
          echo "The real Ghost FTP Server failed to listen" >&2
          cat "$RUNNER_TEMP/ghostftp-native-server.log" >&2 || true
          exit 1

      - name: Verify committed Rust dependency graph
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null

      # A passing isolated-server roundtrip is not enough if local backups,
      # mirror safety, SQLite snapshots or profile recovery regress.
      - name: Run desktop filesystem and credential regression unit tests
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ghostftp --lib --locked

      - name: Run real protocol E2E
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ghostftp --test protocol_e2e --locked -- --nocapture

      - name: Dump protocol server diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "--- FTP server log ---"
          cat "$RUNNER_TEMP/ghostftp-ftp.log" 2>/dev/null || true
          echo "--- FTPS server log ---"
          cat "$RUNNER_TEMP/ghostftp-ftps.log" 2>/dev/null || true
          echo "--- Ghost FTP Server interoperability (byte counts only, no payloads) ---"
          grep -E 'FTPS integrity reject:|error|failed' "$RUNNER_TEMP/ghostftp-native-server.log" 2>/dev/null | tail -n 30 || true
          echo "--- DOS LIST FTP emulation logs ---"
          cat "$RUNNER_TEMP/ghostftp-dos-list.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ghostftp-dos-invalid.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ghostftp-dos-no-a.log" 2>/dev/null || true
          echo "--- SFTP server log ---"
          cat "$RUNNER_TEMP/ghostftp-sshd.log" 2>/dev/null || true
          echo "--- TLS runtime ---"
          openssl version -a || true
          python3 - <<'PY'
          try:
              import OpenSSL
              import pyftpdlib
              print("pyOpenSSL", OpenSSL.__version__)
              print("pyftpdlib", getattr(pyftpdlib, "__version__", "unknown"))
          except Exception as exc:
              print("protocol runtime version probe failed:", exc)
          PY

  windows-file-integrity:
    name: Windows filesystem security regressions
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri -> target
      - name: Prepare desktop frontendDist for native tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ghostftp-desktop/dist | Out-Null
          Set-Content ghostftp-desktop/dist/index.html '<!doctype html><html><body></body></html>'
      - name: Run Windows desktop filesystem regression tests
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ghostftp --lib --locked

  desktop-security-gate:
    name: Desktop security gate
    needs: [real-protocol-roundtrip, windows-file-integrity]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed unless real protocol E2E and Windows tests pass
        shell: bash
        env:
          PROTOCOL_RESULT: ${{ needs.real-protocol-roundtrip.result }}
          WINDOWS_RESULT: ${{ needs.windows-file-integrity.result }}
        run: |
          set -euo pipefail
          test "$PROTOCOL_RESULT" = success
          test "$WINDOWS_RESULT" = success
