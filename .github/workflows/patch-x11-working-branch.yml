name: Ghost FTP one-shot X11 patch

on:
  push:
    branches:
      - work/premium-parity-release-hardening-0.1.1
    paths:
      - .github/workflows/patch-x11-working-branch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/premium-parity-release-hardening-0.1.1
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Patch X11 CreateGC value mask
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/desktop/x11_linux.go')
          s = p.read_text(encoding='utf-8')
          old = 'gcMask := uint32((1 << 2) | (1 << 3) | (1 << 14))'
          new = 'gcMask := uint32((1 << 2) | (1 << 3))'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one CreateGC mask marker, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/desktop/x11_linux.go
          test -z "$(gofmt -l internal/desktop/x11_linux.go)"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add internal/desktop/x11_linux.go
          git commit -m 'Fix Linux X11 CreateGC value mask'
          git push origin HEAD:work/premium-parity-release-hardening-0.1.1
