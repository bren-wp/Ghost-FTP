name: Import verified 0.95.51 README captures

on:
  push:
    branches: [fix/release-recovery-screenshots-v09552]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-readme-09551-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fetch actual Windows QA pixels with exact build SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39484945427 --jq '.head_sha')" = "1d6d5683c0fc4dee8e4b9c6de1750599db33fc4f"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/39484945427 --jq '.conclusion')" = "success"
          mkdir -p "$RUNNER_TEMP/ghostftp-qa"
          gh run download 39484945427 --name GhostFTP-Windows-x64-Preview-QA --dir "$RUNNER_TEMP/ghostftp-qa"
          node .github/scripts/import-verified-windows-screenshots.mjs "$RUNNER_TEMP/ghostftp-qa"
      - name: Commit real screenshots to correction PR
        run: |
          set -euo pipefail
          git add README.md docs/assets/screenshots
          if git diff --cached --quiet; then
            echo "Native screenshots already match the verified QA artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: replace historical README with verified 0.95.51 screenshots"
          git push origin "HEAD:$GITHUB_REF_NAME"
