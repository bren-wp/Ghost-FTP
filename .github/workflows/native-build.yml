name: GhostFTP Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install GhostFTP frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci

      - name: Build GhostFTP frontend
        working-directory: ghostftp-desktop
        run: npm run build

      - name: Build GhostFTP native packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}

      - name: Upload GhostFTP native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostftp-desktop-${{ runner.os }}
          path: |
            ghostftp-desktop/src-tauri/target/release/bundle/**
            ghostftp-desktop/src-tauri/target/release/ghostftp.exe
            ghostftp-desktop/src-tauri/target/release/ghostftp
          if-no-files-found: error
