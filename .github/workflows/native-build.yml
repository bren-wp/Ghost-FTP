name: Ghost FTP native build

# RC8 native release gate: only Tauri/WebView bundles are eligible for end-user releases.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: desktop-tauri
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: desktop-tauri
        run: npm run build
      - name: Native Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ghostftp-native-${{ runner.os }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/**
            desktop-tauri/src-tauri/target/release/ghostftp.exe
            desktop-tauri/src-tauri/target/release/ghostftp
          if-no-files-found: error
