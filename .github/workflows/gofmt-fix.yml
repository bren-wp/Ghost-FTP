name: Ghost FTP Temporary Go Format Fix

on:
  push:
    branches:
      - 'release/0.0.8-final-platform-parity'
    paths:
      - '.github/workflows/gofmt-fix.yml'
      - 'internal/desktop/linux_master_rail.go'

permissions:
  contents: write

concurrency:
  group: ghostftp-temp-gofmt-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.0.8-final-platform-parity
          fetch-depth: 0

      - name: Format Linux master source and commit only when needed
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/desktop/linux_master_rail.go
          if git diff --quiet -- internal/desktop/linux_master_rail.go; then
            echo 'GOFMT_FIX=NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- internal/desktop/linux_master_rail.go
          git commit -m 'style(linux): apply canonical gofmt'
          git push origin HEAD:release/0.0.8-final-platform-parity
          echo 'GOFMT_FIX=COMMITTED'
