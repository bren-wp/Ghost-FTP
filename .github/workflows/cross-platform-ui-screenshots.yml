name: Ghost FTP Cross-Platform UI Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'internal/desktop/**'
      - 'internal/platform/**'
      - 'cmd/ghostftp/**'
      - '.github/workflows/cross-platform-ui-screenshots.yml'
  push:
    branches:
      - 'feature/cross-platform-advanced-rdp-readme'
    paths:
      - 'android/**'
      - 'internal/desktop/**'
      - 'internal/platform/**'
      - 'cmd/ghostftp/**'
      - '.github/workflows/cross-platform-ui-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: ghostftp-cross-platform-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  linux:
    name: Capture authentic Linux workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = off
      - name: Install headless capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick fonts-dejavu-core
      - name: Build native Linux GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-linux
          version="$(tr -d '\r\n' < VERSION)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-X main.version=$version" -o ui-linux/ghostftp ./cmd/ghostftp
          chmod 0755 ui-linux/ghostftp
      - name: Capture real Linux window
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp >ui-linux/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill $xvfb_pid >/dev/null 2>&1 || true' EXIT
          sleep 2
          ./ui-linux/ghostftp >ui-linux/app.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid >/dev/null 2>&1 || true; kill $xvfb_pid >/dev/null 2>&1 || true' EXIT
          window=''
          for _ in $(seq 1 40); do
            window="$(xdotool search --onlyvisible --name 'Ghost FTP' 2>/dev/null | head -n1 || true)"
            [ -n "$window" ] && break
            sleep 0.5
          done
          if [ -z "$window" ]; then
            cat ui-linux/app.log >&2 || true
            exit 1
          fi
          xdotool windowactivate --sync "$window" || true
          sleep 1
          import -display :99 -window "$window" ui-linux/Ghost-FTP-linux-main.png
      - name: Verify Linux screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-linux/Ghost-FTP-linux-main.png
          file ui-linux/Ghost-FTP-linux-main.png | grep -q 'PNG image data'
          bytes="$(stat -c%s ui-linux/Ghost-FTP-linux-main.png)"
          test "$bytes" -ge 4096
          dimensions="$(identify -format '%wx%h' ui-linux/Ghost-FTP-linux-main.png)"
          width="${dimensions%x*}"; height="${dimensions#*x}"
          test "$width" -ge 640; test "$height" -ge 400
          printf 'LINUX_UI_SCREENSHOT=%s BYTES=%s SHA256=%s\n' "$dimensions" "$bytes" "$(sha256sum ui-linux/Ghost-FTP-linux-main.png | awk '{print $1}')"
      - name: Upload Linux screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-ui-screenshot
          if-no-files-found: error
          retention-days: 30
          path: ui-linux/Ghost-FTP-linux-main.png

  android:
    name: Capture authentic Android workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Install Android build and emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build real Android APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug :app:packageGhostFtpApk --no-daemon --stacktrace
      - name: Boot emulator and capture app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-android
          echo no | avdmanager create avd --force --name ghostftp-ui --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd ghostftp-ui -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off >ui-android/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill $emulator_pid >/dev/null 2>&1 || true' EXIT
          adb wait-for-device
          for _ in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb install -r android/dist/Ghost-FTP-Android.apk
          adb shell am start -W -n app.ghostftp.client/.MainActivity
          sleep 3
          adb exec-out screencap -p > ui-android/Ghost-FTP-android-main.png
      - name: Verify Android screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-android/Ghost-FTP-android-main.png
          file ui-android/Ghost-FTP-android-main.png | grep -q 'PNG image data'
          bytes="$(stat -c%s ui-android/Ghost-FTP-android-main.png)"
          test "$bytes" -ge 4096
          python - <<'PY'
          import struct
          from pathlib import Path
          path = Path('ui-android/Ghost-FTP-android-main.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('invalid PNG signature')
          width, height = struct.unpack('>II', data[16:24])
          if width < 480 or height < 800:
              raise SystemExit(f'implausible Android screenshot dimensions: {width}x{height}')
          print(f'ANDROID_UI_DIMENSIONS={width}x{height}')
          PY
          printf 'ANDROID_UI_SCREENSHOT_BYTES=%s SHA256=%s\n' "$bytes" "$(sha256sum ui-android/Ghost-FTP-android-main.png | awk '{print $1}')"
      - name: Upload Android screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-android-ui-screenshot
          if-no-files-found: error
          retention-days: 30
          path: ui-android/Ghost-FTP-android-main.png

  persist:
    name: Persist verified Linux and Android screenshots
    needs: [linux, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Linux screenshot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ghostftp-linux-ui-screenshot
          path: ui-evidence/linux
      - name: Download Android screenshot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ghostftp-android-ui-screenshot
          path: ui-evidence/android
      - name: Persist authentic cross-platform screenshots
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.ref_name }}'
          test -n "$branch"
          test -s ui-evidence/linux/Ghost-FTP-linux-main.png
          test -s ui-evidence/android/Ghost-FTP-android-main.png
          mkdir -p docs/images
          cp ui-evidence/linux/Ghost-FTP-linux-main.png docs/images/ghost-ftp-linux-main.png
          cp ui-evidence/android/Ghost-FTP-android-main.png docs/images/ghost-ftp-android-main.png
          git add -- docs/images/ghost-ftp-linux-main.png docs/images/ghost-ftp-android-main.png
          if git diff --cached --quiet; then
            echo 'CROSS_PLATFORM_UI_SCREENSHOTS=UNCHANGED'
            exit 0
          fi
          git fetch origin "$branch"
          remote="$(git rev-parse "origin/$branch")"
          test "$remote" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update authentic Linux and Android UI screenshots [skip ci]'
          git push origin "HEAD:$branch"
          echo 'CROSS_PLATFORM_UI_SCREENSHOTS=PERSISTED'
