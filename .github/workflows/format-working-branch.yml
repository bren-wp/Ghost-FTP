name: Ghost FTP one-shot branch formatter

on:
  push:
    branches:
      - work/premium-parity-release-hardening-0.1.1
    paths:
      - .github/workflows/format-working-branch.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/premium-parity-release-hardening-0.1.1
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Format only CI-reported files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/ghostftp-smoke/main.go \
            internal/desktop/x11_linux.go \
            internal/desktop/theme.go
          unformatted="$(gofmt -l cmd/ghostftp-smoke/main.go internal/desktop/x11_linux.go internal/desktop/theme.go)"
          test -z "$unformatted"

      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd/ghostftp-smoke/main.go internal/desktop/x11_linux.go internal/desktop/theme.go; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add cmd/ghostftp-smoke/main.go internal/desktop/x11_linux.go internal/desktop/theme.go
          git commit -m 'Apply gofmt to premium parity sources'
          git push origin HEAD:work/premium-parity-release-hardening-0.1.1
