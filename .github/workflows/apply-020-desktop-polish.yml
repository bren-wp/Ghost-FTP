name: Apply 0.2.0 desktop polish

on:
  push:
    branches:
      - work/ghostftp-0.2.0-desktop-quality
    paths:
      - scripts/apply_020_desktop_polish.py
      - .github/workflows/apply-020-desktop-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ghostftp-0.2.0-desktop-quality
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Apply deterministic source migration
        run: python3 scripts/apply_020_desktop_polish.py
      - name: Format and test
        run: |
          gofmt -w cmd/installer/main.go internal/desktop/gui_linux.go internal/desktop/theme.go
          go test ./...
          GOOS=windows GOARCH=amd64 go test ./cmd/ghostftp ./cmd/installer ./internal/desktop ./internal/platform
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/installer/main.go internal/desktop/gui_linux.go internal/desktop/theme.go
          git commit -m "Apply 0.2.0 desktop polish"
          git push origin HEAD:work/ghostftp-0.2.0-desktop-quality
