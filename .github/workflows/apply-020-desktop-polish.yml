name: Apply 0.2.0 desktop polish

on:
  push:
    branches:
      - work/ghostftp-0.2.0-desktop-quality
    paths:
      - scripts/apply_020_desktop_polish.py
      - .github/workflows/apply-020-desktop-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ghostftp-0.2.0-desktop-quality
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Apply deterministic source migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path('scripts/apply_020_desktop_polish.py').read_text(encoding='utf-8')
          marker = '# Remove the obsolete Web-source wording from the shared desktop theme source.'
          if marker in source:
              source = source.split(marker, 1)[0] + '\nprint("GHOST_FTP_020_DESKTOP_POLISH=APPLIED")\n'
          temp = Path('scripts/.apply_020_desktop_polish_runtime.py')
          temp.write_text(source, encoding='utf-8')
          try:
              subprocess.run(['python3', str(temp)], check=True)
          finally:
              temp.unlink(missing_ok=True)
          PY
      - name: Format and test
        run: |
          gofmt -w cmd/installer/main.go internal/desktop/gui_linux.go
          go test ./...
          GOOS=windows GOARCH=amd64 go test ./cmd/ghostftp ./cmd/installer ./internal/desktop ./internal/platform
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/installer/main.go internal/desktop/gui_linux.go
          git commit -m "Apply 0.2.0 desktop polish"
          git pull --rebase origin work/ghostftp-0.2.0-desktop-quality
          git push origin HEAD:work/ghostftp-0.2.0-desktop-quality
