name: Refresh RC23 native screenshots

on:
  push:
    branches:
      - 'fix/rc23-post-merge-hardening'
    paths:
      - '.github/workflows/refresh-rc23-native-screenshots.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download reviewed Windows QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          gh run download 36187380362 --name GhostFTP-Windows-x64-RC21-QA -D qa
          test -s qa/GhostFTP-Windows-RC21-Native-Window.png
          test -s qa/GhostFTP-Windows-RC21-Site-Manager.png
          test -s qa/GhostFTP-Windows-RC21-New-Connection.png
          test -s qa/GhostFTP-Windows-RC21-Preferences.png
          test -s qa/GhostFTP-Windows-RC21-Transfer-Center.png
          test -s qa/GhostFTP-Windows-RC21-File-Properties.png
          test -s qa/GhostFTP-Windows-RC21-About.png

      - name: Refresh tracked native screenshots
        shell: bash
        run: |
          set -euo pipefail
          cp qa/GhostFTP-Windows-RC21-Native-Window.png docs/assets/screenshots/ghostftp-native-files.png
          cp qa/GhostFTP-Windows-RC21-Site-Manager.png docs/assets/screenshots/ghostftp-native-sites.png
          cp qa/GhostFTP-Windows-RC21-New-Connection.png docs/assets/screenshots/ghostftp-native-new-connection.png
          cp qa/GhostFTP-Windows-RC21-Preferences.png docs/assets/screenshots/ghostftp-native-settings.png
          cp qa/GhostFTP-Windows-RC21-Transfer-Center.png docs/assets/screenshots/ghostftp-native-transfers.png
          cp qa/GhostFTP-Windows-RC21-File-Properties.png docs/assets/screenshots/ghostftp-native-file-properties.png
          cp qa/GhostFTP-Windows-RC21-About.png docs/assets/screenshots/ghostftp-native-about.png

      - name: Commit refreshed screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/ghostftp-native-*.png
          if git diff --cached --quiet; then
            echo "Tracked screenshots already match reviewed QA evidence."
            exit 0
          fi
          git commit -m "docs: refresh RC23 native screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
