          required: true
'''
          }
          for name, content in files.items():
              Path(name).write_text(content, encoding='utf-8', newline='\n')
      - name: Provjeri dokumentaciju i javni sadržaj
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_croatian.py
          python scripts/audit_version.py
          python scripts/audit_docs.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_release.py
      - name: Spremi i ukloni vlastiti workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-docs-2.16.yml
          git config user.name 'ByFTP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Dovrši 2.16 cross-platform dokumentaciju i GitHub predloške'
          git push origin HEAD:agent/byftp-2.16.0-connect-reliability
