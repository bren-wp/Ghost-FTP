name: Refresh RC23 native QA screenshots

on:
  push:
    branches: [fix/rc23-post-merge-hardening]
    paths:
      - '.github/workflows/refresh-rc23-native-qa.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc23-post-merge-hardening
      - name: Download reviewed Windows QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa-refresh
          gh run download 36194665919 --repo "${{ github.repository }}" --name GhostFTP-Windows-x64-RC23-QA --dir qa-refresh
          test -s qa-refresh/GhostFTP-Windows-RC23-Native-Window.png
      - name: Refresh tracked native screenshots
        run: |
          set -euo pipefail
          cp qa-refresh/GhostFTP-Windows-RC23-Native-Window.png docs/assets/screenshots/ghostftp-native-files.png
          cp qa-refresh/GhostFTP-Windows-RC23-Site-Manager.png docs/assets/screenshots/ghostftp-native-sites.png
          cp qa-refresh/GhostFTP-Windows-RC23-New-Connection.png docs/assets/screenshots/ghostftp-native-new-connection.png
          cp qa-refresh/GhostFTP-Windows-RC23-Preferences.png docs/assets/screenshots/ghostftp-native-settings.png
          cp qa-refresh/GhostFTP-Windows-RC23-Transfer-Center.png docs/assets/screenshots/ghostftp-native-transfers.png
          cp qa-refresh/GhostFTP-Windows-RC23-File-Properties.png docs/assets/screenshots/ghostftp-native-file-properties.png
          cp qa-refresh/GhostFTP-Windows-RC23-About.png docs/assets/screenshots/ghostftp-native-about.png
      - name: Commit reviewed evidence
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/assets/screenshots; then
            echo "Tracked screenshots already match reviewed QA evidence."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots
          git commit -m "docs: refresh RC23 native QA screenshots"
          git push origin HEAD:fix/rc23-post-merge-hardening
