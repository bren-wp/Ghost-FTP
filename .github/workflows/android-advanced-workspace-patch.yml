name: Apply Android advanced workspace patch

on:
  push:
    branches: [parity/android-advanced-workspace]
    paths:
      - '.github/workflows/android-advanced-workspace-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: parity/android-advanced-workspace
          fetch-depth: 0
      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/app/ghostftp/client/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = "        transferGeneration++;\n        transferActive = false;\n        transferFinalizing = false;\n        activeTransferGate = null;\n        session = null;\n"
          new = "        transferGeneration++;\n        // __ANDROID_ADVANCED_PATCH_CANCEL_ANCHOR__\n        transferActive = false;\n        transferFinalizing = false;\n        activeTransferGate = null;\n        session = null;\n"
          if text.count(old) != 1:
              raise SystemExit(f'cancel-transfer anchor: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/apply_android_advanced_workspace_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/app/ghostftp/client/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          marker = "        // __ANDROID_ADVANCED_PATCH_CANCEL_ANCHOR__\n"
          if text.count(marker) != 1:
              raise SystemExit(f'cleanup anchor: expected 1 match, found {text.count(marker)}')
          path.write_text(text.replace(marker, '', 1), encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'android/app/src/main/java/app/ghostftp/client/FtpSession.java\nandroid/app/src/main/java/app/ghostftp/client/MainActivity.java'
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit patched production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java \
                  android/app/src/main/java/app/ghostftp/client/FtpSession.java
          git commit -m 'Apply Android advanced workspace parity patch'
          git push origin HEAD:parity/android-advanced-workspace
