name: Apply Android user message hardening

on:
  push:
    branches:
      - fix/0.0.6-android-user-message-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.0.6-android-user-message-hardening
          fetch-depth: 0

      - name: Apply production message hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          activity_path = Path("android/app/src/main/java/app/ghostftp/client/MainActivity.java")
          activity = activity_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Passwords are never saved. FTP and secure explicit FTPS are available on Android.",
                  "Passwords are never saved. FTP and secure FTPS are available on Android.",
                  "quick-connect copy",
              ),
              ('return "Sites / Connections";', 'return "Sites";', "sites section title"),
              (
                  "Disconnect before saving site identity changes.",
                  "Disconnect before changing saved connection details.",
                  "saved-site copy",
              ),
              (
                  '"FTPS connected. Secure server identity verified."',
                  '"FTPS connected securely."',
                  "ftps connected copy",
              ),
              (
                  '"Connection or saved server start directory failed"',
                  '"Connection failed or the saved start folder is unavailable"',
                  "saved start folder error",
              ),
              (
                  'postError("Remote directory is unavailable; current path was not changed", e);',
                  'postError("Server folder is unavailable; current folder was not changed", e);',
                  "server folder error",
              ),
              (
                  '"Local directory is unavailable; current path was not changed: "',
                  '"Local folder is unavailable; current folder was not changed: "',
                  "local folder error",
              ),
              (
                  '"Parent folder is unavailable; current path was not changed: "',
                  '"Parent folder is unavailable; current folder was not changed: "',
                  "parent folder error",
              ),
              (
                  '.setTitle("Directory comparison")',
                  '.setTitle("Compare folders")',
                  "folder comparison title",
              ),
              (
                  '"Select a local file, not a directory, to upload."',
                  '"Select a local file, not a folder, to upload."',
                  "upload selection copy",
              ),
              (
                  '"Select a server file, not a directory, to download."',
                  '"Select a server file, not a folder, to download."',
                  "download selection copy",
              ),
              (
                  '"Upload finalization lost its connection. Reconnect and refresh before retrying."',
                  '"The connection closed while finishing the upload. Reconnect and refresh before retrying."',
                  "upload completion copy",
              ),
          ]
          for old, new, label in replacements:
              activity = replace_once(activity, old, new, label)

          old_safe = '''    private static String safeMessage(Exception e) {
              String value = e == null ? null : e.getMessage();
              if (value == null || value.trim().isEmpty()) return "The operation could not be completed.";
              String safe = value.replace('\\n', ' ').replace('\\r', ' ').trim();
              if (safe.length() > 180
                      || safe.contains("/home/")
                      || safe.contains("/data/user/")
                      || safe.contains("java.")
                      || safe.contains("javax.")
                      || safe.contains("android.")
                      || safe.contains("Exception")
                      || safe.contains("StackTrace")) {
                  return "The operation could not be completed. Check the connection and try again.";
              }
              return safe;
          }
          '''
          new_safe = '''    private static String safeMessage(Exception e) {
              String value = e == null ? null : e.getMessage();
              if (value == null || value.trim().isEmpty()) return "The operation could not be completed.";
              String safe = value.replace('\\n', ' ').replace('\\r', ' ').trim();
              String lower = safe.toLowerCase(java.util.Locale.ROOT);
              if (safe.length() > 180
                      || safe.contains("/home/")
                      || safe.contains("/data/user/")
                      || safe.contains("/data/data/")
                      || safe.contains("java.")
                      || safe.contains("javax.")
                      || safe.contains("android.")
                      || safe.contains("app.ghostftp.")
                      || safe.contains(".java:")
                      || safe.contains("Exception")
                      || safe.contains("StackTrace")
                      || lower.contains("staging")
                      || lower.contains("final commit")
                      || lower.contains("server response code")
                      || lower.contains("control connection")
                      || lower.contains("cancellation lifecycle")
                      || lower.contains("data channel")) {
                  return "The operation could not be completed. Check the connection and try again.";
              }
              return safe;
          }
          '''
          activity = replace_once(activity, old_safe, new_safe, "safeMessage hardening")
          activity_path.write_text(activity, encoding="utf-8")

          test_path = Path("scripts/test_android_contract.py")
          tests = test_path.read_text(encoding="utf-8")
          old_markers = '''            "strict server identity verification",
                  ):
                      self.assertNotIn(marker, shipping_copy)
          '''
          new_markers = '''            "strict server identity verification",
                      "sites / connections",
                      "saved server start directory",
                      "remote directory is unavailable",
                      "upload finalization",
                      "directory comparison",
                      "ftp and secure explicit ftps are available on android",
                  ):
                      self.assertNotIn(marker, shipping_copy)
          '''
          tests = replace_once(tests, old_markers, new_markers, "shipping-copy markers")

          anchor = '''    def test_server_identity_change_clears_server_paths(self) -> None:
          '''
          regression = '''    def test_android_user_facing_errors_hide_internal_details(self) -> None:
              activity = self.read(f"{_regressions.ANDROID_JAVA}/MainActivity.java")
              safe_start = activity.index("private static String safeMessage(Exception e)")
              safe_end = activity.index("private LinearLayout surfaceContent()", safe_start)
              safe = activity[safe_start:safe_end]

              for marker in (
                  'safe.contains("/home/")',
                  'safe.contains("/data/user/")',
                  'safe.contains("/data/data/")',
                  'safe.contains("java.")',
                  'safe.contains("javax.")',
                  'safe.contains("android.")',
                  'safe.contains("app.ghostftp.")',
                  'safe.contains(".java:")',
                  'safe.contains("Exception")',
                  'safe.contains("StackTrace")',
                  'lower.contains("staging")',
                  'lower.contains("final commit")',
                  'lower.contains("server response code")',
                  'lower.contains("control connection")',
                  'lower.contains("cancellation lifecycle")',
                  'lower.contains("data channel")',
              ):
                  self.assertIn(marker, safe)

              self.assertIn(
                  'return "The operation could not be completed. Check the connection and try again.";',
                  safe,
              )

          '''
          tests = replace_once(tests, anchor, regression + anchor, "sanitizer regression test")
          test_path.write_text(tests, encoding="utf-8")
          PY

          python3 scripts/test_android_contract.py
          git diff --check

      - name: Commit production hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-android-user-message-hardening.yml
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java scripts/test_android_contract.py
          git commit -m "fix(android): harden user-facing error messages"
          git push origin HEAD:fix/0.0.6-android-user-message-hardening
