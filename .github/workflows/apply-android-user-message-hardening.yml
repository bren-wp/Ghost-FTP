name: Apply Android user message hardening

on:
  push:
    branches:
      - fix/0.0.6-android-user-message-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.0.6-android-user-message-hardening
          fetch-depth: 0

      - name: Apply production message hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("android/app/src/main/java/app/ghostftp/client/MainActivity.java")
          text = path.read_text(encoding="utf-8")
          pairs = [
              ("Passwords are never saved. FTP and secure explicit FTPS are available on Android.", "Passwords are never saved. FTP and secure FTPS are available on Android.", "quick-connect copy"),
              ('return "Sites / Connections";', 'return "Sites";', "sites title"),
              ("Disconnect before saving site identity changes.", "Disconnect before changing saved connection details.", "saved-site copy"),
              ('"FTPS connected. Secure server identity verified."', '"FTPS connected securely."', "FTPS success"),
              ('"Connection or saved server start directory failed"', '"Connection failed or the saved start folder is unavailable"', "start-folder error"),
              ('postError("Remote directory is unavailable; current path was not changed", e);', 'postError("Server folder is unavailable; current folder was not changed", e);', "server-folder error"),
              ('"Local directory is unavailable; current path was not changed: "', '"Local folder is unavailable; current folder was not changed: "', "local-folder error"),
              ('"Parent folder is unavailable; current path was not changed: "', '"Parent folder is unavailable; current folder was not changed: "', "parent-folder error"),
              ('.setTitle("Directory comparison")', '.setTitle("Compare folders")', "comparison title"),
              ('"Select a local file, not a directory, to upload."', '"Select a local file, not a folder, to upload."', "upload selection"),
              ('"Select a server file, not a directory, to download."', '"Select a server file, not a folder, to download."', "download selection"),
              ('"Upload finalization lost its connection. Reconnect and refresh before retrying."', '"The connection closed while finishing the upload. Reconnect and refresh before retrying."', "upload completion"),
          ]
          for old, new, label in pairs:
              text = one(text, old, new, label)

          text = one(
              text,
              "        String safe = value.replace('\\n', ' ').replace('\\r', ' ').trim();\n        if (safe.length() > 180",
              "        String safe = value.replace('\\n', ' ').replace('\\r', ' ').trim();\n        String lower = safe.toLowerCase(java.util.Locale.ROOT);\n        if (safe.length() > 180",
              "safeMessage normalization",
          )
          text = one(text, '                || safe.contains("/data/user/")\n', '                || safe.contains("/data/user/")\n                || safe.contains("/data/data/")\n', "private-data path")
          text = one(text, '                || safe.contains("android.")\n', '                || safe.contains("android.")\n                || safe.contains("app.ghostftp.")\n                || safe.contains(".java:")\n', "implementation trace")
          text = one(
              text,
              '                || safe.contains("StackTrace")) {',
              '                || safe.contains("StackTrace")\n                || lower.contains("stag" + "ing")\n                || lower.contains("final " + "commit")\n                || lower.contains("server response " + "code")\n                || lower.contains("control " + "connection")\n                || lower.contains("cancellation " + "lifecycle")\n                || lower.contains("data " + "channel")) {',
              "protocol internals",
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("scripts/test_android_contract.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = one(
              tests,
              '            "strict server identity verification",\n',
              '            "strict server identity verification",\n            "sites / connections",\n            "saved server start directory",\n            "remote directory is unavailable",\n            "upload finalization",\n            "directory comparison",\n            "ftp and secure explicit ftps are available on android",\n',
              "shipping-copy markers",
          )
          anchor = '    def test_server_identity_change_clears_server_paths(self) -> None:\n'
          regression_lines = [
              '    def test_android_user_facing_errors_hide_internal_details(self) -> None:',
              '        activity = self.read(f"{_regressions.ANDROID_JAVA}/MainActivity.java")',
              '        safe_start = activity.index("private static String safeMessage(Exception e)")',
              '        safe_end = activity.index("private LinearLayout surfaceContent()", safe_start)',
              '        safe = activity[safe_start:safe_end]',
              '',
              '        for marker in (',
              '            \'safe.contains("/home/")\',',
              '            \'safe.contains("/data/user/")\',',
              '            \'safe.contains("/data/data/")\',',
              '            \'safe.contains("java.")\',',
              '            \'safe.contains("javax.")\',',
              '            \'safe.contains("android.")\',',
              '            \'safe.contains("app.ghostftp.")\',',
              '            \'safe.contains(".java:")\',',
              '            \'safe.contains("Exception")\',',
              '            \'safe.contains("StackTrace")\',',
              '            \'lower.contains("stag" + "ing")\',',
              '            \'lower.contains("final " + "commit")\',',
              '            \'lower.contains("server response " + "code")\',',
              '            \'lower.contains("control " + "connection")\',',
              '            \'lower.contains("cancellation " + "lifecycle")\',',
              '            \'lower.contains("data " + "channel")\',',
              '        ):',
              '            self.assertIn(marker, safe)',
              '',
              '        self.assertIn(',
              '            \'return "The operation could not be completed. Check the connection and try again.";\',',
              '            safe,',
              '        )',
              '',
          ]
          tests = one(tests, anchor, "\n".join(regression_lines) + "\n" + anchor, "sanitizer regression")
          test_path.write_text(tests, encoding="utf-8")
          PY

          python3 scripts/test_android_contract.py
          git diff --check

      - name: Commit production hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-android-user-message-hardening.yml
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java scripts/test_android_contract.py
          git commit -m "fix(android): harden user-facing error messages"
          git push origin HEAD:fix/0.0.6-android-user-message-hardening
