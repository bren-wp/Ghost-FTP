name: Ghost FTP Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_contract.py'
      - 'scripts/test_android_passive_data_contract.py'
      - 'scripts/test_android_mobile_navigation_contract.py'
      - 'scripts/test_android_release_signing_contract.py'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_contract.py'
      - 'scripts/test_android_passive_data_contract.py'
      - 'scripts/test_android_mobile_navigation_contract.py'
      - 'scripts/test_android_release_signing_contract.py'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostftp-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android tests lint and release-signing verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
          python scripts/test_android_release_signing_contract.py
      - name: Test lint and build verification plus unsigned release APKs
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Verify test APK structure
        shell: bash
        run: |
          set -euo pipefail
          test_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$test_apk"
          file "$test_apk" | grep -Eq 'Android package|Zip archive data'
          unzip -t "$test_apk" >/dev/null
          printf 'ANDROID_TEST_APK_SHA256=%s\n' "$(sha256sum "$test_apk" | awk '{print $1}')"
      - name: Exercise release APK signing pipeline with isolated CI identity
        shell: bash
        run: |
          set -euo pipefail
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$unsigned"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$build_tools/apksigner"
          smoke_keystore="$RUNNER_TEMP/ghostftp-android-ci-smoke.jks"
          smoke_signed="$RUNNER_TEMP/Ghost-FTP-Android-ci-smoke.apk"
          keytool -genkeypair -noprompt \
            -keystore "$smoke_keystore" \
            -storepass 'ghostftp-ci-smoke' \
            -keypass 'ghostftp-ci-smoke' \
            -alias 'ghostftp-ci-smoke' \
            -dname 'CN=Ghost FTP CI Verification,O=Ghost FTP,C=HR' \
            -keyalg RSA -keysize 3072 -validity 2
          "$build_tools/apksigner" sign \
            --ks "$smoke_keystore" \
            --ks-key-alias 'ghostftp-ci-smoke' \
            --ks-pass pass:ghostftp-ci-smoke \
            --key-pass pass:ghostftp-ci-smoke \
            --out "$smoke_signed" \
            "$unsigned"
          "$build_tools/apksigner" verify --verbose --print-certs "$smoke_signed"
          rm -f "$smoke_signed" "$smoke_keystore"
          echo 'ANDROID_RELEASE_SIGNING_PIPELINE_SMOKE=PASS'
          echo 'ANDROID_RELEASE_SIGNING_PIPELINE_SMOKE_IDENTITY=ISOLATED_CI_ONLY'
