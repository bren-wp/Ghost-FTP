name: Ghost FTP Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_contract.py'
      - 'scripts/test_android_passive_data_contract.py'
      - 'scripts/test_android_mobile_navigation_contract.py'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/test_android_contract.py'
      - 'scripts/test_android_passive_data_contract.py'
      - 'scripts/test_android_mobile_navigation_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostftp-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android lint and installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android source contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
      - name: Lint and build APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug :app:packageGhostFtpApk --no-daemon --stacktrace
      - name: Verify APK contract
        shell: bash
        run: |
          set -euo pipefail
          test -s android/dist/Ghost-FTP-Android.apk
          file android/dist/Ghost-FTP-Android.apk | grep -Eq 'Android package|Zip archive data'
          unzip -t android/dist/Ghost-FTP-Android.apk >/dev/null
          printf 'ANDROID_APK_SHA256=%s\n' "$(sha256sum android/dist/Ghost-FTP-Android.apk | awk '{print $1}')"
      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-android-apk
          if-no-files-found: error
          retention-days: 14
          path: android/dist/Ghost-FTP-Android.apk
