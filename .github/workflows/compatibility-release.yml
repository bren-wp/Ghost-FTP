name: Publish Ghost FTP Compatibility Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'compat/ghostftp-v*'

permissions:
  contents: read

concurrency:
  group: ghostftp-compatibility-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Compatibility release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate exact current main and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$main_sha" || {
            echo "Compatibility release must run from exact current main: run=$GITHUB_SHA main=$main_sha" >&2
            exit 1
          }
          if [[ "$GITHUB_REF_NAME" == compat/ghostftp-v* ]]; then
            branch_version="${GITHUB_REF_NAME#compat/ghostftp-v}"
            test "$branch_version" = "$version"
          fi
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -print))"
          go test -race ./...
          go vet ./...
          python scripts/audit_repository.py
          python scripts/audit_platform_contract.py
          python scripts/audit_desktop_surface.py
          python scripts/audit_dependencies.py
          python scripts/audit_version.py
          python scripts/audit_localization.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_docs.py
          python -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Unsigned Windows universal setup and portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Build unsigned compatibility packages
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
          Remove-Item Env:GHOSTFTP_SIGNING_PFX_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:GHOSTFTP_SIGNING_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:GHOSTFTP_SIGNING_TIMESTAMP_URL -ErrorAction SilentlyContinue
          .\BUILD-WINDOWS.ps1
      - name: Verify unsigned Windows state
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          foreach ($kind in @('Setup','Portable')) {
            $path = "dist\Ghost-FTP-$version-$kind.exe"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
              throw "Missing Windows compatibility artifact: $path"
            }
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.SignerCertificate) {
              throw "Compatibility release expected unsigned Windows artifact, but signer was present: $path"
            }
          }
          Write-Host 'WINDOWS_COMPATIBILITY_SIGNING=UNSIGNED'
      - name: Store Windows compatibility artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-compat-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Ghost-FTP-*-Setup.exe
            dist/Ghost-FTP-*-Portable.exe

  linux:
    name: Linux universal compatibility bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build and verify Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          bash linux/BUILD-DISTROS.sh
          version="$(tr -d '\r\n' < VERSION)"
          for distro in Debian Ubuntu Fedora; do
            test -x "dist/Ghost-FTP-${version}-Linux-${distro}-Installer.run"
            test -s "dist/Ghost-FTP-${version}-Linux-${distro}-Portable.tar.gz"
          done
      - name: Store Linux compatibility artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-compat-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Ghost-FTP-*-Linux-Debian-Installer.run
            dist/Ghost-FTP-*-Linux-Debian-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Ubuntu-Installer.run
            dist/Ghost-FTP-*-Linux-Ubuntu-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Fedora-Installer.run
            dist/Ghost-FTP-*-Linux-Fedora-Portable.tar.gz

  android:
    name: Android temporary compatibility certificate APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      signer_sha256: ${{ steps.sign.outputs.signer_sha256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned Android release
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Sign with one-run compatibility certificate
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          signed="dist/Ghost-FTP-${version}-Android.apk"
          keystore="$RUNNER_TEMP/ghostftp-compatibility.jks"
          password="$(openssl rand -hex 24)"
          mkdir -p dist
          keytool -genkeypair             -keystore "$keystore"             -storepass "$password"             -keypass "$password"             -alias ghostftp-compatibility             -keyalg RSA             -keysize 3072             -validity 3650             -dname 'CN=Ghost FTP Compatibility Release,O=Ghost FTP,C=HR'             -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$keystore"             --ks-key-alias ghostftp-compatibility             --ks-pass "pass:$password"             --key-pass "pass:$password"             --out "$signed"             "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/android-compat-signature.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-compat-signature.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]]
          unzip -t "$signed" >/dev/null
          echo "signer_sha256=$signer" >> "$GITHUB_OUTPUT"
          rm -f "$keystore"
          echo 'ANDROID_COMPATIBILITY_SIGNING=TEMPORARY_ONE_RUN_CERTIFICATE'
      - name: Store Android compatibility APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-compat-android
          retention-days: 7
          if-no-files-found: error
          path: dist/Ghost-FTP-*-Android.apk

  macos:
    name: macOS ad-hoc validation compatibility app
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build universal ad-hoc validation app
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          bash macos/BUILD.sh
          version="$(tr -d '\r\n' < VERSION)"
          src="macos/dist/Ghost-FTP-${version}-macOS.app.zip"
          dst="macos/dist/Ghost-FTP-${version}-macOS-Unsigned-Validation.app.zip"
          test -s "$src"
          mv "$src" "$dst"
          test -s "$dst"
          echo 'MACOS_COMPATIBILITY_SIGNING=ADHOC_VALIDATION_NOT_NOTARIZED'
      - name: Store macOS compatibility validation app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-compat-macos
          retention-days: 7
          if-no-files-found: error
          path: macos/dist/Ghost-FTP-*-macOS-Unsigned-Validation.app.zip

  browser:
    name: Browser helper compatibility packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Build browser helper packages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py --check
          python scripts/build_browser_extensions.py
          version="$(tr -d '\r\n' < VERSION)"
          for browser in Chrome Edge Firefox Opera; do
            archive="dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip"
            test -s "$archive"
            unzip -t "$archive" >/dev/null
          done
      - name: Store browser helper compatibility packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-compat-browser
          retention-days: 7
          if-no-files-found: error
          path: dist/browser/*.zip

  publish:
    name: Publish clearly labeled compatibility release
    needs: [quality, windows, linux, android, macos, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_COMPAT_SIGNER_SHA256: ${{ needs.android.outputs.signer_sha256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Windows
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-compat-windows
          path: staging/windows
      - name: Download Linux
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-compat-linux
          path: staging/linux
      - name: Download Android
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-compat-android
          path: staging/android
      - name: Download macOS
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-compat-macos
          path: staging/macos
      - name: Download browser helpers
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-compat-browser
          path: staging/browser
      - name: Assemble compatibility release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="ghostftp-v${version}"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$main_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to move it." >&2
            exit 1
          fi

          mkdir -p bundle
          cp staging/windows/Ghost-FTP-*-Setup.exe bundle/
          cp staging/windows/Ghost-FTP-*-Portable.exe bundle/
          cp staging/linux/Ghost-FTP-*-Linux-* bundle/
          cp staging/android/Ghost-FTP-*-Android.apk bundle/
          cp staging/macos/Ghost-FTP-*-macOS-Unsigned-Validation.app.zip bundle/
          cp staging/browser/Ghost-FTP-*-Extension.zip bundle/

          cat > bundle/BUILD-METADATA.txt <<EOF
BRAND=Ghost FTP
VERSION=${version}
RELEASE_TAG=${tag}
RELEASE_CHANNEL=current-compatibility
COMMIT=${main_sha}
PUBLIC_RELEASE_PLATFORMS=WINDOWS,LINUX,ANDROID,MACOS,BROWSER_HELPER
WINDOWS_SETUP=universal-x86-x64-arm64
WINDOWS_PORTABLE=universal-x86-x64-arm64
WINDOWS_AUTHENTICODE=UNSIGNED_COMPATIBILITY_RELEASE
LINUX_BUNDLE_ARCHITECTURES=amd64,arm64,i386
ANDROID_APK=TEMPORARY_COMPATIBILITY_CERTIFICATE
ANDROID_SIGNER_SHA256=${ANDROID_COMPAT_SIGNER_SHA256}
ANDROID_SFTP=hidden-until-strict-host-key-verification
MACOS_APP=UNIVERSAL_ARM64_X86_64_VALIDATION
MACOS_SIGNING=ADHOC_VALIDATION_NOT_NOTARIZED
BROWSER_EXTENSION_PACKAGES=Chrome,Edge,Firefox,Opera
PUBLIC_PLATFORM_ARTIFACTS=14
PUBLIC_RELEASE_FILES=17
EOF

          cat > bundle/RELEASE-NOTES.txt <<EOF
Ghost FTP ${version}

Compatibility release
=====================

This release is published without protected production signing keys, matching
the compatibility distribution model used for Ghost FTP 0.0.7.

Windows
-------
- Universal Setup and Portable packages include x64, x86 and ARM64 payloads.
- Windows executables are explicitly UNSIGNED.
- Windows SmartScreen may therefore show an unknown-publisher warning.

Linux
-----
- Debian, Ubuntu and Fedora Installer + Portable universal bundles.
- Each bundle contains amd64, arm64 and i386 payloads.

Android
-------
- The APK is installable and is signed with a temporary certificate generated
  only for this compatibility publication run.
- It is NOT the permanent production Android signing identity.
- A future production-signed APK may require uninstall/reinstall instead of an
  in-place upgrade.
- Compatibility signer SHA-256: ${ANDROID_COMPAT_SIGNER_SHA256}

macOS
-----
- The included macOS archive is the real universal arm64/x86_64 validation app.
- It is ad-hoc signed for validation only and is NOT Developer ID signed or Apple notarized.
- macOS Gatekeeper may block normal launch until the user explicitly allows it.
- This archive is not represented as a notarized production package.

Security and privacy
--------------------
- Runtime FTP/FTPS security checks, privacy audits and telemetry-free behavior
  remain enabled.
- Android SFTP remains hidden until strict maintained host-key verification is available.
- No release-signing requirement is being represented as satisfied when it is not.

Integrity
---------
- Exact source commit: ${main_sha}
- Platform artifacts: 14
- Metadata files: 3
- Total public files: 17
- SHA256.txt covers every public file except itself.
EOF

          (
            cd bundle
            find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | while read -r file; do
              sha256sum "$file"
            done > SHA256.txt
          )
          count="$(find bundle -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = '17'
          test "$(grep -c '  Ghost-FTP-' bundle/SHA256.txt)" -ge 14
          test -s bundle/BUILD-METADATA.txt
          test -s bundle/RELEASE-NOTES.txt
          test -s bundle/SHA256.txt

          gh release create "$tag" bundle/*             --repo "$GITHUB_REPOSITORY"             --target "$main_sha"             --title "Ghost FTP ${version}"             --notes-file bundle/RELEASE-NOTES.txt

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<<"$release_json")" = 'false'
          test "$(jq -r .prerelease <<<"$release_json")" = 'false'
          test "$(jq '.assets | length' <<<"$release_json")" = '17'
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          test "$tag_sha" = "$main_sha"
          echo "COMPATIBILITY_RELEASE_PUBLISHED=PASS"
          echo "RELEASE_TAG=$tag"
          echo "RELEASE_COMMIT=$main_sha"
