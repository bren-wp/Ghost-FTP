name: Temporary Linux Queue Pause Resume Patch

on:
  push:
    branches:
      - automation/linux-queue-pause-resume-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: hardening/linux-queue-action-state
      EXPECTED_TARGET_SHA: d4dd7841a21e1a6b16be8ba2164da05cab1828e1
      EXPECTED_MAIN_SHA: e675e02a3af9cb19cf3f9a788200147b0e7907ad
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/linux-queue-action-state
          fetch-depth: 0

      - name: Verify immutable patch preconditions
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$target_sha" = "$EXPECTED_TARGET_SHA"
          test "$main_sha" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$target_sha" "$main_sha")" = "$main_sha"
          test "$(git status --porcelain)" = ""

      - name: Guard Linux pause and resume clicks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/desktop/gui_linux.go")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''case l.pause.contains(x, y):\n\t\tu.engine.PauseTransfers()\n\t\tu.queuePaused = true\n\t\tu.setStatus("Transfer queue paused.")''',
                  '''case l.pause.contains(x, y):\n\t\tu.pauseTransfersLinux()''',
              ),
              (
                  '''case l.resume.contains(x, y):\n\t\tu.engine.ResumeTransfers()\n\t\tu.queuePaused = false\n\t\tu.setStatus("Transfer queue resumed.")''',
                  '''case l.resume.contains(x, y):\n\t\tu.resumeTransfersLinux()''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor count={count} for {old[:80]!r}; refusing patch")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          gofmt -w internal/desktop/gui_linux.go internal/desktop/queue_actions_linux.go internal/desktop/queue_actions_linux_test.go
          git diff --check

      - name: Validate focused Linux queue action hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_ui_action_wiring.py
          go test ./internal/desktop ./internal/api ./internal/transfer

      - name: Commit exact target patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/desktop/gui_linux.go
          git diff --cached --check
          git commit -m "Linux: guard disabled queue control clicks"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Remove temporary automation branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "${GITHUB_REF_NAME}"
