name: Publish Ghost FTP 2.1.1 RC7

on:
  workflow_run:
    workflows: ["Ghost FTP native build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-rc7-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify source audit prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'Faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
            desktop-tauri/src desktop-tauri/src-tauri runtime installer website \
            --exclude-dir=node_modules --exclude-dir=target
          node --check runtime/site/app.js
          node --check installer/site/setup.js
          node --check website/assets/site.js

      - name: Package full source, native source, web and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/Ghost-FTP-v2.1.1-RC7-FULL-SOURCE.zip HEAD
          zip -qr dist/Ghost-FTP-v2.1.1-RC7-Tauri-NATIVE-SOURCE.zip desktop-tauri
          zip -qr dist/Ghost-FTP-v2.1.1-RC7-WEB.zip website
          zip -qj dist/Ghost-FTP-v2.1.1-RC7-DOCS-QA.zip \
            AUDIT.md BRANDING_AUDIT.md BUILD_STATUS.md CHANGELOG.md CLICK_QA.md CODE_AUDIT.md \
            INSTALLATION.md INSTALLER_QA.md LANGUAGE_AUDIT.md PIXEL_QA.md PRIVACY.md QA.md README.md \
            RESPONSIVE_QA.md SECURITY.md SECURITY_AUDIT.md SUPPORT.md THIRD_PARTY_NOTICES.md \
            TITLEBAR_QA.md TRANSFER_QA.md UNINSTALL.md UPDATE_POLICY.md LICENSE.txt EULA.txt \
            RELEASE_NOTES_RC7.md

      - name: Download this successful native Windows/Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -maxdepth 8 -print

      - name: Normalize native artifact names
        shell: bash
        run: |
          set -euo pipefail

          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"

          test -n "$WIN_EXE"
          test -n "$WIN_SETUP"
          test -n "$LINUX_BIN"
          test -n "$APPIMAGE"
          test -n "$DEB"
          test -n "$RPM"

          cp "$WIN_EXE" dist/GhostFTP-Portable-2.1.1-RC7.exe
          cp "$WIN_SETUP" dist/GhostFTP-Setup-2.1.1-RC7.exe
          cp "$LINUX_BIN" dist/GhostFTP-linux-x86_64-2.1.1-RC7
          chmod +x dist/GhostFTP-linux-x86_64-2.1.1-RC7
          cp "$APPIMAGE" dist/GhostFTP-linux-x86_64-2.1.1-RC7.AppImage
          cp "$DEB" dist/ghostftp_2.1.1~rc7_amd64.deb
          cp "$RPM" dist/ghostftp-2.1.1-rc7.x86_64.rpm

          rm -rf dist/native

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum
          ) > dist/SHA256SUMS.txt

      - name: Replace RC7 release with native artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-rc.7"

          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" -y || true
            done
            gh release edit "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Ghost FTP 2.1.1 RC7 — Native" \
              --notes-file RELEASE_NOTES_RC7.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Ghost FTP 2.1.1 RC7 — Native" \
              --notes-file RELEASE_NOTES_RC7.md \
              --prerelease
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done < <(find dist -type f -print0)

          gh release view "$TAG" --json url,tagName,name,isPrerelease,assets
