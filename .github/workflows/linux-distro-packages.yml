name: Ghost FTP Linux Universal Distro Bundles

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'linux/**'
      - 'build/icon.png'
      - 'LICENSE'
      - '.github/workflows/linux-distro-packages.yml'
      - 'scripts/test_linux_distro_packaging_contract.py'
  push:
    branches:
      - main
      - 'packaging/**'
    paths:
      - 'VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'linux/**'
      - 'build/icon.png'
      - 'LICENSE'
      - '.github/workflows/linux-distro-packages.yml'
      - 'scripts/test_linux_distro_packaging_contract.py'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  distro-bundles:
    name: Debian Ubuntu Fedora universal installer and portable bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'

      - name: Verify distro packaging source contract
        shell: bash
        run: python scripts/test_linux_distro_packaging_contract.py

      - name: Build universal distro bundles
        shell: bash
        run: |
          set -euo pipefail
          bash linux/BUILD-DISTROS.sh

      - name: Verify universal bundle contents and real installer path
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          shopt -s nullglob
          artifacts=(dist/Ghost-FTP-"$version"-Linux-*)
          test "${#artifacts[@]}" -eq 6

          for distro in Debian Ubuntu Fedora; do
            installer="dist/Ghost-FTP-${version}-Linux-${distro}-Installer.run"
            portable="dist/Ghost-FTP-${version}-Linux-${distro}-Portable.tar.gz"
            test -s "$installer"
            test -x "$installer"
            test -s "$portable"

            root="$work/$distro"
            mkdir -p "$root"
            tar -xzf "$portable" -C "$root"
            portable_root="$root/Ghost-FTP-${version}-Linux-${distro}-Portable"
            test -x "$portable_root/ghostftp"
            test -x "$portable_root/bin/amd64/ghostftp"
            test -x "$portable_root/bin/arm64/ghostftp"
            test -x "$portable_root/bin/i386/ghostftp"
            test -x "$portable_root/bin/amd64/ghostftp-native-host"
            test -x "$portable_root/bin/arm64/ghostftp-native-host"
            test -x "$portable_root/bin/i386/ghostftp-native-host"
            test "$(cat "$portable_root/DISTRIBUTION")" = "$distro"
            test -f "$portable_root/ghost-ftp.desktop"
            test -f "$portable_root/ghost-ftp.png"
            test -f "$portable_root/LICENSE"
            test -f "$portable_root/README.md"

            file "$portable_root/bin/amd64/ghostftp" | grep -E 'x86-64|x86_64'
            file "$portable_root/bin/arm64/ghostftp" | grep -E 'ARM aarch64|aarch64'
            file "$portable_root/bin/i386/ghostftp" | grep -E 'Intel 80386|80386'
            file "$portable_root/bin/amd64/ghostftp-native-host" | grep -E 'x86-64|x86_64'
            file "$portable_root/bin/arm64/ghostftp-native-host" | grep -E 'ARM aarch64|aarch64'
            file "$portable_root/bin/i386/ghostftp-native-host" | grep -E 'Intel 80386|80386'

            prefix="$work/${distro}-installed"
            GHOSTFTP_PREFIX="$prefix" "$installer"
            test -x "$prefix/bin/ghostftp"
            test -x "$prefix/libexec/ghostftp/ghostftp-native-host"
            test -f "$prefix/share/applications/ghost-ftp.desktop"
            test -f "$prefix/share/icons/hicolor/512x512/apps/ghost-ftp.png"
            test -f "$prefix/share/doc/ghost-ftp/LICENSE"
            test -f "$prefix/share/doc/ghost-ftp/README.md"
            cmp "$prefix/bin/ghostftp" "$portable_root/bin/amd64/ghostftp"
            cmp "$prefix/libexec/ghostftp/ghostftp-native-host" "$portable_root/bin/amd64/ghostftp-native-host"
          done

          test "$(find dist -maxdepth 1 -type f -name 'Ghost-FTP-*-Linux-*.deb' | wc -l)" -eq 0
          test "$(find dist -maxdepth 1 -type f -name 'Ghost-FTP-*-Linux-*.rpm' | wc -l)" -eq 0
          test "$(find dist -maxdepth 1 -type f -name 'Ghost-FTP-*-Linux-Portable-*.tar.gz' | wc -l)" -eq 0
          echo 'LINUX_UNIVERSAL_DISTRO_BUNDLE_PARITY=PASS'
          echo 'LINUX_NATIVE_BROWSER_HOST_PAYLOADS=amd64,arm64,i386'

      - name: Store Linux universal distro bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-universal-distro-stage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Linux-Debian-Installer.run
            dist/Ghost-FTP-*-Linux-Debian-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Ubuntu-Installer.run
            dist/Ghost-FTP-*-Linux-Ubuntu-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Fedora-Installer.run
            dist/Ghost-FTP-*-Linux-Fedora-Portable.tar.gz
