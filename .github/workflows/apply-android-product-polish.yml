name: Apply Android Product Polish

on:
  push:
    branches:
      - hardening/0.0.6-product-polish
    paths:
      - .github/workflows/apply-android-product-polish.yml
      - scripts/tmp_apply_android_product_polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply complete Android product polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/tmp_apply_android_product_polish.py')
          text = p.read_text(encoding='utf-8')
          needle = "    ('Local folder permission is no longer available.', 'Local folder access is no longer available.'),\n]"
          replacement = """    ('Local folder permission is no longer available.', 'Local folder access is no longer available.'),
              ('Storage provider rejected the folder creation.', 'The folder could not be created.'),
              ('Storage provider changed the requested folder name; creation was rolled back.', 'The folder name could not be verified, so no folder was kept.'),
              ('Storage provider rejected the rename.', 'The item could not be renamed.'),
              ('Storage provider changed the requested final name; rename verification failed.', 'The new item name could not be verified.'),
              ('Storage provider rejected the delete operation.', 'The item could not be deleted.'),
              ('Delete “" + entry.name + "” from the selected Android storage provider? This cannot be undone.', 'Delete “" + entry.name + "” from the selected folder? This cannot be undone.'),
          ]"""
          if needle not in text:
              raise SystemExit('Temporary Android polish script insertion point not found')
          text = text.replace(needle, replacement, 1)

          audit_needle = "forbidden = [\n"
          audit_prefix = """forbidden = [
              'storage provider',
          """
          if audit_needle not in text:
              raise SystemExit('Temporary Android polish audit insertion point not found')
          text = text.replace(audit_needle, audit_prefix, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/tmp_apply_android_product_polish.py

      - name: Align Android regression assertions with user-facing copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/_android_contract_regressions.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'beginFinalCommit(attempt, \\"Finalizing download name…\\");': 'beginFinalCommit(attempt, \\"Finalizing download…\\");',
              'setBusy(false, \\"Download completed and committed: \\"': 'setBusy(false, \\"Download completed: \\"',
              'Local site start folder saved as a SAF capability URI': 'Local start folder saved.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Android regression marker not found: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Android core contract
        run: python scripts/test_android_contract.py

      - name: Android passive-data contract
        run: python scripts/test_android_passive_data_contract.py

      - name: Android navigation contract
        run: python scripts/test_android_mobile_navigation_contract.py

      - name: Android signing contract
        run: python scripts/test_android_release_signing_contract.py

      - name: Android unit tests, lint and release compile
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Validate repository product surfaces
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_runtime_surface.py
          python scripts/test_ui_theme_contract.py
          python scripts/web_runtime_ui_audit.py
          python scripts/check_web_contract.py
          node --check extensions/shared/popup.js
          node --check web/assets/js/site.js
          node --check web/ftp/assets/app.js
          find web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          gofmt -w cmd internal
          git diff --exit-code -- cmd internal
          go test ./...
          go vet ./...

      - name: Remove one-time files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-android-product-polish.yml
          rm -f .github/workflows/product-polish-runtime-audit.yml
          rm -f scripts/tmp_apply_android_product_polish.py
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java scripts/_android_contract_regressions.py .github/workflows scripts
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Polish Android runtime UI and remove development copy'
          git push origin HEAD:hardening/0.0.6-product-polish
