name: Apply Android Product Polish

on:
  push:
    branches:
      - hardening/0.0.6-product-polish
    paths:
      - .github/workflows/apply-android-product-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply complete Android product polish
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_apply_android_product_polish.py

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Validate Android changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
          python scripts/test_android_release_signing_contract.py
          cd android
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Remove one-time files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-android-product-polish.yml
          rm -f .github/workflows/product-polish-runtime-audit.yml
          rm -f scripts/tmp_apply_android_product_polish.py
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java .github/workflows scripts
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Polish Android runtime UI and remove development copy'
          git push origin HEAD:hardening/0.0.6-product-polish
