name: Apply Android Product Polish

on:
  push:
    branches:
      - hardening/0.0.6-product-polish
    paths:
      - .github/workflows/apply-android-product-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply exact Android UI copy and theme initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/app/ghostftp/client/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '        super.onCreate(state);\n        SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);':
              '        super.onCreate(state);\n        GhostTheme.apply(this);\n        GhostTheme.applySystemBars(this);\n        SharedPreferences preferences = getSharedPreferences(PREFS, MODE_PRIVATE);',

              'Local SAF storage and the active FTP/FTPS server. File management mirrors the desktop create, rename, delete and remote-permission workflow while preserving Android scoped storage.':
              'Browse local files and your connected server from one workspace.',

              'Transfer only the selected file. Staged upload/download and cancellation safety remain authoritative.':
              'Move the selected file safely and follow its progress while the transfer is active.',

              'Android Storage Access Framework only; Ghost FTP never requests broad all-files access. Long-press a directory to select it without opening it.':
              'Choose a folder, browse files and manage only the locations you allow Ghost FTP to use. Long-press a folder to select it without opening it.',

              'Fresh MLSD listings over the active FTP/FTPS session; FTPS keeps strict TLS and hostname verification. Long-press a directory to select it without opening it.':
              'Browse and manage files on the connected server. Secure connections are verified before use. Long-press a folder to select it without opening it.',

              'Quick Connect stays transient. Saved sites contain non-secret connection and navigation metadata only.':
              'Connect quickly or save the server details you use often.',

              'Password is memory-only. Android currently exposes FTP and strict explicit FTPS; SFTP stays hidden until strict host-key verification exists.':
              'Passwords are never saved. FTP and secure explicit FTPS are available on Android.',

              'Load, create, update or delete an explicit saved site. Quick Connect never creates hidden profiles.':
              'Save only the connection details you choose. Passwords are never stored.',

              'Navigation state is explicit and account-bound. Quick Connect does not create hidden bookmarks.':
              'Save frequently used local folders and remote paths for faster navigation.',

              'Local starts/bookmarks are SAF capability URIs and are freshly revalidated before navigation.':
              'Saved local folders remain limited to locations you selected.',

              'Remote paths are bound to protocol, canonical host, port and exact username, and are freshly listed before visible commit.':
              'Saved remote paths stay linked to the matching server and account.',

              'This surface shows the real active transfer lifecycle. No decorative queue or fake history is displayed.':
              'Follow the current transfer and cancel it while cancellation is still safe.',

              'Progress comes from actual bytes read/written. Cancellation is available only before the irreversible final-name commit gate.':
              'Progress reflects the current file transfer.',

              'Only settings with a real Android runtime owner are interactive.':
              'Choose how Ghost FTP behaves on this device.',

              'Ghost FTP Android uses the canonical dark brand palette. These options change actual local runtime behavior.':
              'Adjust local preferences for browsing and quick connections.',

              'Runtime security policy is informational here and cannot be weakened from the UI.':
              'Security protections stay enforced automatically.',

              'Platform trust store + strict hostname verification':
              'Certificate and hostname verification enabled',

              'Memory-only; never stored in site JSON/preferences':
              'Kept in memory only and never saved',

              'Android SAF grants only; no all-files permission':
              'Access limited to folders you select',

              'Hidden until strict Android host-key identity verification exists':
              'Unavailable until strict server identity verification is enabled',

              'No telemetry, analytics, ads, fingerprinting or Ghost FTP cloud':
              'No telemetry, analytics, ads or Ghost FTP cloud',

              'Build identity and privacy/security status for this Android app.':
              'Version, supported protocols and privacy information.',

              'FTP + strict explicit FTPS on Android source line':
              'FTP and explicit FTPS',

              'None: no telemetry, analytics, ads or hidden backend':
              'No telemetry, analytics or ads',

              'Quick Connect metadata will be remembered. Passwords remain memory-only.':
              'Quick Connect details will be remembered. Passwords are never saved.',

              'Quick Connect metadata persistence disabled and stored endpoint metadata cleared.':
              'Saved Quick Connect details were cleared.',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          remove_lines = [
              '        card.addView(infoLine("Package", BuildConfig.APPLICATION_ID), matchWrapSpaced());\n',
              '        card.addView(infoLine("Release status", "Repository build " + BuildConfig.VERSION_NAME + (BuildConfig.DEBUG ? "; development package; not the production-signed public APK" : "; release package; official publication requires verified publisher-signature evidence")), matchWrapSpaced());\n',
          ]
          for old in remove_lines:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one removable line, found {count}: {old!r}')
              text = text.replace(old, '', 1)

          forbidden = [
              'Storage Access Framework', 'scoped storage', 'Fresh MLSD', 'remain authoritative',
              'commit gate', 'runtime owner', 'canonical dark brand palette', 'production-signature evidence',
              'development package', 'Repository build', 'Android source line', 'site JSON/preferences',
              'SAF capability URIs', 'hidden profiles', 'fake history', 'visible commit'
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit('Forbidden user-facing development wording remains: ' + ', '.join(found))

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Validate Android changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
          python scripts/test_android_release_signing_contract.py
          cd android
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Remove one-time audit workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-android-product-polish.yml
          rm -f .github/workflows/product-polish-runtime-audit.yml
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java .github/workflows
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Polish Android runtime UI and remove development copy'
          git push origin HEAD:hardening/0.0.6-product-polish
