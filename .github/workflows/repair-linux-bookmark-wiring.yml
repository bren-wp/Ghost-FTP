name: Repair Linux Bookmark Wiring

on:
  push:
    branches:
      - fix/authentic-ui-workflow-yaml
    paths:
      - 'scripts/repair_linux_bookmark_wiring.py'
      - '.github/workflows/repair-linux-bookmark-wiring.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/authentic-ui-workflow-yaml
          fetch-depth: 0

      - name: Wire Bookmarks into real Linux desktop header and input path
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_linux_bookmark_wiring.py
          if git diff --quiet -- internal/desktop/gui_linux.go; then
            echo 'LINUX_BOOKMARK_WIRING=UNCHANGED'
            exit 0
          fi
          gofmt -w internal/desktop/gui_linux.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/desktop/gui_linux.go
          git commit -m 'fix: wire Linux bookmark manager into desktop UI'
          git push origin HEAD:fix/authentic-ui-workflow-yaml
