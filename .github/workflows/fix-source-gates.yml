name: GhostFTP source gate normalization

on:
  push:
    branches: ['release/ghost-ftp-1.0.1-portable']

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[source-gates-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/ghost-ftp-1.0.1-portable
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Fix source gates and format Go
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          activity = Path('android/app/src/main/java/com/ghostftp/client/MainActivity.java')
          text = activity.read_text(encoding='utf-8')
          old = 'R.drawable.ic_GhostFTP'
          if old not in text:
              raise SystemExit('Android drawable marker was not found')
          activity.write_text(text.replace(old, 'R.drawable.ic_ghostftp'), encoding='utf-8', newline='')

          audit = Path('scripts/audit_version.py')
          text = audit.read_text(encoding='utf-8')
          replacements = (
              ('\'run_python_audit("scripts/audit_repository.py",\',', '\'run("scripts/audit_repository.py")\','),
              ('\'run_python_audit("scripts/audit_web.py",\',', '\'run("scripts/audit_web.py")\','),
              ('"PUBLIC_PLATFORM_ARTIFACTS=8"', '"PUBLIC_PLATFORM_ARTIFACTS=10"'),
              ('"PUBLIC_RELEASE_FILES=11"', '"PUBLIC_RELEASE_FILES=13"'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing audit-version marker: {old}')
              text = text.replace(old, new)
          obsolete = '''    if "dotnet nuget push" in release_workflow or "<PackageId>GhostFTP.Windows</PackageId>" in release_workflow:\n        fail("release workflow contains obsolete NuGet publication")\n'''
          replacement = '''    if "GhostFTP.Windows" in release_workflow:\n        fail("release workflow contains the retired NuGet package identity")\n    if "dotnet nuget push" not in release_workflow or "packages: write" not in release_workflow:\n        fail("release workflow does not publish the GhostFTP GitHub Package")\n'''
          if obsolete not in text:
              raise SystemExit('obsolete NuGet audit block was not found')
          audit.write_text(text.replace(obsolete, replacement), encoding='utf-8', newline='')
          PY

          mapfile -d '' gofiles < <(git ls-files -z '*.go')
          if ((${#gofiles[@]})); then
            gofmt -w "${gofiles[@]}"
          fi

          git add -- android/app/src/main/java/com/ghostftp/client/MainActivity.java scripts/audit_version.py '*.go' 'cmd/**/*.go' 'internal/**/*.go'
          git add -u -- '*.go'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source-gate changes produced.' >&2; exit 1; }
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git commit -m 'Fix GhostFTP source gates [source-gates-fixed]'
          git push origin HEAD:release/ghost-ftp-1.0.1-portable
