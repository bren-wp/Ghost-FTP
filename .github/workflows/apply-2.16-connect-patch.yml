name: Privremeno primijeni 2.16 connect patch

on:
  push:
    branches:
      - agent/byftp-2.16.0-connect-reliability
    paths:
      - '.github/workflows/apply-2.16-connect-patch.yml'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Provjeri i primijeni patch
        shell: bash
        run: |
          set -euo pipefail
          patch='.github/byftp-patches/2.16-connect-reliability.patch'
          git apply --check "$patch"
          git apply "$patch"
          rm -f "$patch"
          rmdir .github/byftp-patches 2>/dev/null || true
      - name: Provjeri kod
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Spremi čisti rezultat na granu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ByFTP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/remote/sftp.go internal/remote/curl_ftp.go internal/desktop/connection_profiles_windows.go
          git add -u .github/byftp-patches || true
          if git diff --cached --quiet; then
            echo 'Nema promjena za spremanje.'
            exit 0
          fi
          git commit -m 'Ispravi stvarno SFTP povezivanje i timeout uzroke'
          git push origin HEAD:agent/byftp-2.16.0-connect-reliability
