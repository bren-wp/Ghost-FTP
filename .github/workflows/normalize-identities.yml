name: GhostFTP technical identity normalization

on:
  push:
    branches: ['release/ghost-ftp-1.0.1-portable']

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[identity-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/ghost-ftp-1.0.1-portable
      - name: Normalize source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = (
              ('com.GhostFTP.client', 'com.ghostftp.client'),
              ('./cmd/GhostFTP', './cmd/ghostftp'),
              ('cmd/GhostFTP', 'cmd/ghostftp'),
              ('io.github.bren-wp.GhostFTP', 'io.github.bren-wp.ghostftp'),
          )
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or ('.github' in path.parts and 'workflows' in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
          PY
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No identity changes produced.' >&2; exit 1; }
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git commit -m 'Normalize GhostFTP technical identities [identity-normalized]'
          git push origin HEAD:release/ghost-ftp-1.0.1-portable
