name: Publish Ghost FTP 2.1.1 RC9

on:
  workflow_run:
    workflows: ["Ghost FTP native build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-rc9-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm RC9 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "2.1.1-rc.9"' desktop-tauri/package.json
          grep -q '"version": "2.1.1-rc.9"' desktop-tauri/src-tauri/tauri.conf.json

      - name: Wait for source audit on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            result="$(gh run list --workflow "Ghost FTP source audit" --commit "$HEAD_SHA" --limit 1 --json status,conclusion --jq '.[0] | (.status // "") + ":" + (.conclusion // "")' || true)"
            echo "source audit: ${result:-not-found}"
            if [ "$result" = "completed:success" ]; then
              exit 0
            fi
            if [[ "$result" == completed:* ]] && [ "$result" != "completed:success" ]; then
              echo "Source audit did not pass."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for source audit."
          exit 1

      - name: Package source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC9-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC9-Native-Source.zip desktop-tauri
          zip -qr dist/GhostFTP-v2.1.1-RC9-Web.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC9-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download native Windows and Linux artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -maxdepth 10 -print

      - name: Normalize native release names
        shell: bash
        run: |
          set -euo pipefail

          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"

          for required in "$WIN_EXE" "$WIN_SETUP" "$LINUX_BIN" "$APPIMAGE" "$DEB" "$RPM"; do
            test -n "$required"
            test -f "$required"
          done

          cp "$WIN_EXE" dist/GhostFTP-Windows-x64-Portable-v2.1.1-RC9.exe
          cp "$WIN_SETUP" dist/GhostFTP-Windows-x64-Setup-v2.1.1-RC9.exe

          cp "$LINUX_BIN" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9
          chmod +x dist/GhostFTP-Linux-x86_64-v2.1.1-RC9
          cp "$APPIMAGE" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9.AppImage
          cp "$DEB" dist/GhostFTP-Linux-amd64-v2.1.1-RC9.deb
          cp "$RPM" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9.rpm

          zip -qj dist/GhostFTP-Windows-x64-v2.1.1-RC9.zip             dist/GhostFTP-Windows-x64-Portable-v2.1.1-RC9.exe             dist/GhostFTP-Windows-x64-Setup-v2.1.1-RC9.exe

          tar -C dist -czf dist/GhostFTP-Linux-x86_64-v2.1.1-RC9.tar.gz             GhostFTP-Linux-x86_64-v2.1.1-RC9             GhostFTP-Linux-x86_64-v2.1.1-RC9.AppImage             GhostFTP-Linux-amd64-v2.1.1-RC9.deb             GhostFTP-Linux-x86_64-v2.1.1-RC9.rpm

          rm -rf dist/native

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'GhostFTP-v2.1.1-RC9-SHA256SUMS.txt' -printf '%f\0'               | sort -z               | xargs -0 sha256sum
          ) > dist/GhostFTP-v2.1.1-RC9-SHA256SUMS.txt

      - name: Publish RC9 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-rc.9"
          TARGET="${{ github.event.workflow_run.head_sha }}"
          NOTES="docs/releases/2.1.1-rc.9.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" -y || true
            done
            gh release edit "$TAG"               --target "$TARGET"               --title "Ghost FTP 2.1.1 RC9 — Native"               --notes-file "$NOTES"               --prerelease
          else
            gh release create "$TAG"               --target "$TARGET"               --title "Ghost FTP 2.1.1 RC9 — Native"               --notes-file "$NOTES"               --prerelease
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done < <(find dist -maxdepth 1 -type f -print0)

          gh release view "$TAG" --json url,tagName,name,isPrerelease,assets
