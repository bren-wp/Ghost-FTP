name: Ghost FTP release

on:
  workflow_run:
    workflows: ["Ghost FTP native preview build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and wait for release gates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-version.mjs --check
          VERSION="$(node -p 'require("./version.json").version')"
          test -f "docs/releases/$VERSION.md"

          wait_for_gate() {
            local workflow="$1"
            local label="$2"
            for attempt in $(seq 1 60); do
              state="$(gh run list --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json status,conclusion --jq '.[0] | ((.status // "") + ":" + (.conclusion // ""))' || true)"
              echo "$label for $SOURCE_SHA: ${state:-not-found}"
              if [ "$state" = "completed:success" ]; then return 0; fi
              if [[ "$state" == completed:* ]] && [ "$state" != "completed:success" ]; then return 1; fi
              sleep 20
            done
            return 1
          }

          wait_for_gate "ghostftp-quality.yml" "source audit"
          wait_for_gate "ghostftp-protocol-e2e.yml" "FTP/FTPS/SFTP E2E"
          wait_for_gate "ghostftp-android.yml" "Android"
          wait_for_gate "validate-win-hardening.yml" "Windows hardening"

          PREVIOUS_VERSION="$(node -p 'require("./version.json").previousVersion || ""')"
          if [ -n "$PREVIOUS_VERSION" ]; then
            echo "Waiting for previous canonical release v$PREVIOUS_VERSION before publishing v$VERSION"
            found_previous=false
            for attempt in $(seq 1 90); do
              if gh release view "v$PREVIOUS_VERSION" >/dev/null 2>&1; then
                found_previous=true
                break
              fi
              sleep 20
            done
            if [ "$found_previous" != "true" ]; then
              echo "Previous release v$PREVIOUS_VERSION was not published in time." >&2
              exit 1
            fi
          fi

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          git archive --format=zip --output="dist/GhostFTP-v$VERSION-Source.zip" HEAD
          zip -qr "dist/GhostFTP-v$VERSION-Desktop-Source.zip" ghostftp-desktop
          zip -qr "dist/GhostFTP-v$VERSION-Android-Source.zip" android
          zip -qr "dist/GhostFTP-v$VERSION-Website.zip" website
          zip -qr "dist/GhostFTP-v$VERSION-Updates.zip" updates
          zip -qr "dist/GhostFTP-v$VERSION-Documentation.zip" docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download native build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -print

      - name: Download verified installable Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "ghostftp-android.yml" --commit "$SOURCE_SHA" --limit 10 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // ""')"
          test -n "$RUN_ID"
          mkdir -p dist/android
          gh run download "$RUN_ID" --name GhostFTP-Android-APK-Preview -D dist/android
          find dist/android -type f -print

      - name: Normalize release artifacts
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup*.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"
          ANDROID_APK="$(find dist/android -type f -iname '*Installable-Preview.apk' | head -n1 || true)"

          test -n "$WIN_EXE"; test -n "$WIN_SETUP"; test -n "$LINUX_BIN"
          test -n "$APPIMAGE"; test -n "$DEB"; test -n "$RPM"; test -n "$ANDROID_APK"

          cp "$WIN_EXE" "dist/GhostFTP-Windows-x64-Portable-v$VERSION.exe"
          cp "$WIN_SETUP" "dist/GhostFTP-Windows-x64-Setup-v$VERSION.exe"
          cp "$LINUX_BIN" "dist/GhostFTP-Linux-x86_64-v$VERSION"
          chmod +x "dist/GhostFTP-Linux-x86_64-v$VERSION"
          cp "$APPIMAGE" "dist/GhostFTP-Linux-x86_64-v$VERSION.AppImage"
          cp "$DEB" "dist/GhostFTP-Linux-amd64-v$VERSION.deb"
          cp "$RPM" "dist/GhostFTP-Linux-x86_64-v$VERSION.rpm"
          cp "$ANDROID_APK" "dist/GhostFTP-Android-v$VERSION.apk"

          (cd dist && zip -q "GhostFTP-Windows-x64-v$VERSION.zip" "GhostFTP-Windows-x64-Portable-v$VERSION.exe" "GhostFTP-Windows-x64-Setup-v$VERSION.exe")
          (cd dist && tar -czf "GhostFTP-Linux-x86_64-v$VERSION.tar.gz" "GhostFTP-Linux-x86_64-v$VERSION" "GhostFTP-Linux-x86_64-v$VERSION.AppImage" "GhostFTP-Linux-amd64-v$VERSION.deb" "GhostFTP-Linux-x86_64-v$VERSION.rpm")
          rm -rf dist/native dist/android

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name "GhostFTP-v$VERSION-SHA256SUMS.txt" -printf '%f\0' | sort -z | xargs -0 sha256sum) > "dist/GhostFTP-v$VERSION-SHA256SUMS.txt"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-release.sh "$SOURCE_SHA"
