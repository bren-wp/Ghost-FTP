name: Ghost FTP quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghostftp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-go:
    name: Product + compatibility tooling
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json

      - name: Verify version train transition regression matrix
        run: node .github/scripts/check-version-policy.mjs

      - name: Version consistency and progression
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/sync-version.mjs --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            if git cat-file -e FETCH_HEAD:version.json 2>/dev/null; then
              BASE_VERSION="$(git show FETCH_HEAD:version.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
            else
              BASE_VERSION="0.14.0"
            fi
            node .github/scripts/sync-version.mjs --check-next "$BASE_VERSION"
          fi

      - name: Documentation and release alignment
        shell: bash
        run: node .github/scripts/check-docs-alignment.mjs
      - name: CI runtime hardening contract
        shell: bash
        run: node .github/scripts/check-ci-runtime.mjs
      - name: Desktop update service contract
        shell: bash
        run: node .github/scripts/check-update-contract.mjs

      # Detect immutable-tag reuse before expensive platform builds or merging.
      # Re-running checks on an already published exact source SHA is valid.
      - name: Immutable release tag and public lineage preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./version.json").version')"
          PREVIOUS="$(node -p 'require("./version.json").previousPublishedVersion')"
          # gh may print a 404 JSON response even when no tag exists.
          # Parse the full body, accepting only a genuine 404 as "not tagged".
          TAG_RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>/dev/null || true)"
          TAG_SHA="$(printf '%s' "$TAG_RESPONSE" | jq -r '
            if . == null then ""
            elif ((.status | tostring) == "404") or .message == "Not Found" then ""
            elif (.object.sha | type) == "string" then .object.sha
            else error("Cannot verify remote tag reference")
            end
          ')"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Immutable tag v$VERSION already points at $TAG_SHA; this source is $SOURCE_SHA. Advance version.json without changing the existing tag."
            exit 1
          fi
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft == false)) | sort_by(.published_at) | reverse | .[0].tag_name // empty')"
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Latest public GitHub release could not be resolved."
            exit 1
          fi
          if [ "$LATEST_TAG" != "v$PREVIOUS" ]; then
            if [ "$LATEST_TAG" != "v$VERSION" ] || [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Release lineage mismatch: latest $LATEST_TAG, expected previous v$PREVIOUS."
              exit 1
            fi
          fi
          echo "Release lineage verified: v$VERSION from public predecessor v$PREVIOUS."

      - name: Latest-release documentation image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft == false)) | sort_by(.published_at) | reverse | .[0].tag_name // empty')"
          test -n "$LATEST_TAG"
          git fetch --force origin "refs/tags/$LATEST_TAG:refs/tags/$LATEST_TAG" --depth=1
          GHOSTFTP_LATEST_RELEASE_TAG="$LATEST_TAG" node .github/scripts/check-release-images.mjs

      - name: Reject legacy/demo branding
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'Faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
            ghostftp-desktop/src ghostftp-desktop/src-tauri tools/ghostftp-runtime tools/ghostftp-installer \
            --exclude-dir=node_modules --exclude-dir=target

          ! grep -Rni 'Ghost-FTP-Premium' \
            README.md ghostftp-desktop/README.md docs/build docs/product docs/release
          grep -Fq 'https://github.com/bren-wp/Ghost-FTP/releases' README.md
          grep -Fq 'sha256sum -c' .github/scripts/publish-release.sh

      - name: Cross-platform premium branding integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--bg: 7 14 26;' ghostftp-desktop/src/styles.css
          grep -Fq -- '--accent: 56 171 255;' ghostftp-desktop/src/styles.css
          grep -Fq '#38ABFF' android/app/src/main/res/values/colors.xml
          grep -Fq 'M24,155c16,-4' android/app/src/main/res/drawable/ic_ghost_ftp.xml
          grep -Fq 'GhostPremiumPalette.accent' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift
          grep -Fq 'static let sidebar = Color(red: 13/255, green: 25/255, blue: 43/255)' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift
          grep -Fq 'val row: Int = panel' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'val input: Int = background' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'background: rgb(var(--bg-panel)) !important;' ghostftp-desktop/src/styles.css
          grep -Fq 'No macOS mockups were provided' docs/product/PREMIUM_BRAND_2026.md
          test -s assets/branding/ghostftp-app-icon.svg
          grep -Fq 'viewBox="0 0 1280 330"' ghostftp-desktop/branding/ghostftp-logo.svg
          grep -Fq 'MORE THAN TRANSFER. TOTAL CONTROL.' ghostftp-desktop/branding/ghostftp-logo.svg
          ! grep -Fq 'FILES MOVE FORWARD' ghostftp-desktop/branding/ghostftp-logo.svg

      - name: Real in-app support and brand identity parity
        shell: bash
        run: |
          set -euo pipefail
          # The update-service endpoint remains separate from the in-app help links.
          grep -Fq 'PRODUCT_SITE = "https://ghostftp.com"' ghostftp-desktop/src/lib/release.ts
          grep -Fq 'const PROJECT_REPOSITORY_URL = "https://github.com/bren-wp/Ghost-FTP";' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq 'More Than Transfer. Total Control.' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq 'const val REPOSITORY_URL = "https://github.com/bren-wp/Ghost-FTP"' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'FTPS and SFTP remain disabled' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift
          ! grep -Fq 'ghostftp.com' ghostftp-desktop/src/components/AboutDialog.tsx
          ! grep -Fq 'ghostftp.com' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          ! grep -Fq 'ghostftp.com' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift

      - name: Real premium Help/About reference hierarchy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ghost-about-reference-grid' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq 'ghost-about-reference-brand' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq 'void check(false)' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq '.ghost-about-reference-resources' ghostftp-desktop/src/styles.css
          ! grep -Fq 'function AboutLandscape(' ghostftp-desktop/src/components/AboutDialog.tsx
          grep -Fq 'private fun aboutFactRow(' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'GhostMarkView(this@MainActivity)' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'officialLinkRow(getString(R.string.label_project_repository)' android/app/src/main/java/com/ghostftp/android/MainActivity.kt
          grep -Fq 'private func identityCard(version: String)' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift
          grep -Fq 'FTPS and SFTP remain disabled' macos/Sources/GhostFTPMacApp/Views/WorkspaceShell.swift

      - name: Verify complete 75-screen premium design traceability
        shell: bash
        run: node .github/scripts/check-premium-75-screens.mjs

      - name: Historical release recovery script syntax and source lock
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/backfill-releases.sh
          grep -Fq '0.30.11:3ddfee0edb0039f090c3b7b7c475fe536ba0d040' .github/scripts/backfill-releases.sh
          grep -Fq '0.30.12:8c768856bee6226f0dab00191a5d0f74123008a5' .github/scripts/backfill-releases.sh
          grep -Fq -- '--latest=false' .github/scripts/backfill-releases.sh

      - name: Native window architecture guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'tauri::WebviewWindowBuilder::new(app, "main", tauri::WebviewUrl::default())' ghostftp-desktop/src-tauri/src/lib.rs
          test "$(grep -Rho 'WebviewWindowBuilder::new' ghostftp-desktop/src-tauri/src --include='*.rs' | wc -l | tr -d ' ')" -eq 1
          ! grep -Fq 'core:webview:allow-create-webview-window' ghostftp-desktop/src-tauri/capabilities/default.json
          grep -Fq '"windows": ["main"]' ghostftp-desktop/src-tauri/capabilities/default.json
          grep -Fq '.inner_size(1290.0, 852.0)' ghostftp-desktop/src-tauri/src/lib.rs
          grep -Fq '.min_inner_size(480.0, 600.0)' ghostftp-desktop/src-tauri/src/lib.rs
          grep -Fq '.decorations(false)' ghostftp-desktop/src-tauri/src/lib.rs
          ! grep -RniE 'http://127\\.0\\.0\\.1|browser shell' \
            ghostftp-desktop/src ghostftp-desktop/src-tauri/src tools/ghostftp-runtime tools/ghostftp-installer \
            --exclude-dir=target

      - name: UI single-window and simplified navigation regression guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.ghost-workspace-view {' ghostftp-desktop/src/styles.css
          grep -Fq '.ghost-transient-overlay {' ghostftp-desktop/src/styles.css
          grep -Fq '.ghost-primary-sidebar {' ghostftp-desktop/src/styles.css
          grep -Fq 'ghost-simple-header' ghostftp-desktop/src/components/TitleBar.tsx
          grep -Fq 'label="Files"' ghostftp-desktop/src/components/ReferenceSiteSidebar.tsx
          grep -Fq 'label="Settings"' ghostftp-desktop/src/components/ReferenceSiteSidebar.tsx
          ! grep -Fq 'English (English)' ghostftp-desktop/src/components/TitleBar.tsx
          ! grep -Fq 'ghost-menu-popover' ghostftp-desktop/src/components/TitleBar.tsx
          ! grep -RFn 'ghost-standalone-view fixed inset-0 z-modal' \
            ghostftp-desktop/src/components/SiteManagerDialog.tsx \
            ghostftp-desktop/src/components/TransferCenterDialog.tsx \
            ghostftp-desktop/src/components/Settings.tsx \
            ghostftp-desktop/src/components/AboutDialog.tsx
          ! grep -RFn 'new WebviewWindow' ghostftp-desktop/src ghostftp-desktop/packages/file-ui/src

      - name: Runtime checks
        shell: bash
        run: |
          set -euo pipefail
          cd tools/ghostftp-runtime
          go test ./...
          go vet ./...
          node --check site/app.js

      - name: Installer checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/ghostftp-installer/payload
          : > tools/ghostftp-installer/payload/GhostFTP.exe
          cd tools/ghostftp-installer
          go test ./...
          go vet ./...
          node --check site/setup.js

      - name: Operational script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find .github/scripts updates/scripts ghostftp-desktop/scripts -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .github/scripts updates/scripts android/scripts ghostftp-desktop/scripts -type f -name '*.sh' -print0)

      - name: Windows release package contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"msi"' ghostftp-desktop/src-tauri/tauri.conf.json
          grep -Fq "args: '--bundles nsis,msi'" .github/workflows/ghostftp-build.yml
          grep -Fq 'Windows NSIS and MSI install/uninstall smoke' .github/workflows/ghostftp-build.yml
          grep -Fq 'GhostFTP-Windows-x64-Setup.msi' .github/workflows/ghostftp-build.yml
          grep -Fq 'GhostFTP-Windows-x64-Setup-v$VERSION.msi' .github/workflows/ghostftp-release.yml

      - name: Native frontend typecheck and production build
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          node ../.github/scripts/check-npm-dev-audit.mjs
          npm run check:i18n
          npm run check:ui
          npm run check:dead
          npm run check
          npm run build

  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri

      - name: Linux desktop prerequisites
        shell: bash
        run: |
          set -euo pipefail

          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "APT attempt $attempt/3: $*"
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout --signal=TERM --kill-after=30s 8m \
                apt-get -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  -o Dpkg::Use-Pty=0 "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "::error::APT prerequisites failed after 3 bounded attempts."
            return 1
          }

          apt_retry update
          apt_retry install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare desktop frontendDist for Rust checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ghostftp-desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > ghostftp-desktop/dist/index.html

      - name: Rust formatting
        working-directory: ghostftp-desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Verify committed Rust dependency graph
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Rust workspace check
        working-directory: ghostftp-desktop/src-tauri
        run: cargo check --workspace --all-targets --locked

      - name: Rust workspace tests
        timeout-minutes: 20
        working-directory: ghostftp-desktop/src-tauri
        run: cargo test --workspace --locked

      - name: Clippy
        working-directory: ghostftp-desktop/src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings