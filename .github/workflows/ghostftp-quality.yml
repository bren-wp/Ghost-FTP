name: Ghost FTP quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghostftp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-go:
    name: Web + compatibility tooling
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json

      - name: Version consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "2.1.1-rc.10"' ghostftp-desktop/package.json
          grep -q '"version": "2.1.1-rc.10"' ghostftp-desktop/package-lock.json
          grep -q '^version = "2.1.1-rc.10"$' ghostftp-desktop/src-tauri/Cargo.toml
          grep -q '^version = "2.1.1-rc.10"$' ghostftp-desktop/src-tauri/ghostftp-cli/Cargo.toml
          grep -q '^version = "2.1.1-rc.10"$' ghostftp-desktop/src-tauri/ghostftp-agent-proto/Cargo.toml
          grep -q '^version = "2.1.1-rc.10"$' ghostftp-desktop/src-tauri/ghostftp-agentd/Cargo.toml
          grep -q '"version": "2.1.1-rc.10"' ghostftp-desktop/src-tauri/tauri.conf.json
          grep -q 'PRODUCT_VERSION = "2.1.1-rc.10"' ghostftp-desktop/src/lib/release.ts
          grep -q 'const version = "2.1.1-rc.10"' tools/ghostftp-runtime/main.go
          grep -q 'const version = "2.1.1-rc.10"' tools/ghostftp-installer/main.go
          grep -q '"version": "2.1.1-rc.10"' updates/channels/preview.template.json

      - name: Reject legacy/demo branding
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'Faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
            ghostftp-desktop/src ghostftp-desktop/src-tauri tools/ghostftp-runtime tools/ghostftp-installer website \
            --exclude-dir=node_modules --exclude-dir=target

      - name: Runtime checks
        shell: bash
        run: |
          set -euo pipefail
          cd tools/ghostftp-runtime
          go test ./...
          go vet ./...
          node --check site/app.js

      - name: Installer checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/ghostftp-installer/payload
          : > tools/ghostftp-installer/payload/GhostFTP.exe
          cd tools/ghostftp-installer
          go test ./...
          go vet ./...
          node --check site/setup.js

      - name: Website syntax and markup policy
        shell: bash
        run: |
          set -euo pipefail
          node --check website/assets/site.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          errors = []

          class AuditParser(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "style" in attrs:
                      errors.append(f"{self.path}: inline style attribute is not allowed")
                  if tag == "script" and not attrs.get("src"):
                      errors.append(f"{self.path}: inline script block is not allowed")

          for path in Path("website").rglob("*.html"):
              parser = AuditParser(path)
              parser.feed(path.read_text(encoding="utf-8"))

          required = [
              Path("website/assets/ghostftp-symbol.svg"),
              Path("website/assets/icons/download.svg"),
              Path("website/assets/icons/features.svg"),
              Path("website/assets/icons/security.svg"),
              Path("website/assets/icons/help.svg"),
              Path("website/assets/icons/speed.svg"),
              Path("website/assets/icons/privacy.svg"),
              Path("website/assets/icons/globe.svg"),
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  errors.append(f"missing website asset: {path}")

          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Update-tool syntax
        shell: bash
        run: |
          node --check updates/scripts/build-manifest.mjs
          node --check updates/scripts/verify-manifest.mjs

      - name: Native frontend typecheck and production build
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check:i18n
          npm run check
          npm run build

  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri

      - name: Linux desktop prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare desktop frontendDist for Rust checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ghostftp-desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > ghostftp-desktop/dist/index.html

      - name: Rust formatting
        working-directory: ghostftp-desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        working-directory: ghostftp-desktop/src-tauri
        run: cargo check --workspace --all-targets

      - name: Rust workspace tests
        working-directory: ghostftp-desktop/src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: ghostftp-desktop/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
