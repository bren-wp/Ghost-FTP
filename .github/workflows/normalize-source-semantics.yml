name: GhostFTP source semantic normalization

on:
  push:
    branches: ['release/ghost-ftp-1.0.1-portable']

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[source-semantics-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/ghost-ftp-1.0.1-portable
      - name: Normalize source semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = (
              ('com/GhostFTP', 'com/ghostftp'),
              ('legacyUninstallKey', 'uninstallKey'),
              ('Legacy GhostFTP history', 'Pre-1.0.0 history'),
              ('legacy GhostFTP build', 'pre-1.0.0 build'),
              ('legacy GhostFTP', 'pre-1.0.0 Ghost FTP'),
          )
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or ('.github' in path.parts and 'workflows' in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
          PY
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No semantic normalization changes produced.' >&2; exit 1; }
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git commit -m 'Normalize GhostFTP source semantics [source-semantics-normalized]'
          git push origin HEAD:release/ghost-ftp-1.0.1-portable
