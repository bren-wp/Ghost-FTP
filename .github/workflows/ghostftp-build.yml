name: Ghost FTP native build

# RC9 production release gate: only Ghost FTP desktop bundles are eligible for end-user releases.
# RC9 release build stamp: 2026-09-20.10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact: 'GhostFTP-Windows-x64'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            artifact: 'GhostFTP-Linux-x86_64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: ghostftp-desktop
        run: npm run build
      - name: Build Ghost FTP desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ghostftp-desktop/src-tauri/target/release/bundle/**
            ghostftp-desktop/src-tauri/target/release/ghostftp.exe
            ghostftp-desktop/src-tauri/target/release/ghostftp
          if-no-files-found: error
