name: Ghost FTP native build

# RC13 production release gate: only Ghost FTP desktop bundles are eligible for end-user releases.
# RC13 release build stamp: 2026-09-21.13

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
  pull_request:
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
      - '.github/workflows/ghostftp-release.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact: 'GhostFTP-Windows-x64-RC13'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            artifact: 'GhostFTP-Linux-x86_64-RC13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: ghostftp-desktop
        run: npm run build
      - name: Build Ghost FTP desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}
      - name: Capture Windows native-window QA evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaDir = Join-Path $env:GITHUB_WORKSPACE 'qa'
          New-Item -ItemType Directory -Force $qaDir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'ghostftp-desktop\src-tauri\target\release\ghostftp.exe'
          if (-not (Test-Path $exe)) { throw "Ghost FTP executable not found: $exe" }

          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $handle = [IntPtr]::Zero
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Ghost FTP exited before the QA capture" }
              if ($proc.MainWindowHandle -ne 0) {
                $handle = $proc.MainWindowHandle
                break
              }
            }
            if ($handle -eq [IntPtr]::Zero) { throw "Ghost FTP did not expose a native main-window handle" }
            if ($proc.MainWindowTitle -ne 'Ghost FTP') { throw "Unexpected Ghost FTP window title: $($proc.MainWindowTitle)" }

            Add-Type -AssemblyName System.Drawing
            Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class GhostFtpWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool SetWindowPos(
              IntPtr hWnd,
              IntPtr hWndInsertAfter,
              int X,
              int Y,
              int cx,
              int cy,
              uint uFlags
            );

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdcBlt, uint nFlags);
          }
          "@

            # GitHub's Windows runner exposes a small desktop, so a normal
            # CopyFromScreen capture forces our responsive compact breakpoint.
            # Force the canonical 1290x852 reference geometry and use PrintWindow
            # so the full native WebView can be captured even when part of the
            # window extends beyond the runner's visible desktop.
            $targetWidth = 1290
            $targetHeight = 852
            $SWP_NOZORDER = 0x0004
            if (-not [GhostFtpWindowCapture]::SetWindowPos(
              $handle,
              [IntPtr]::Zero,
              0,
              0,
              $targetWidth,
              $targetHeight,
              $SWP_NOZORDER
            )) {
              throw "SetWindowPos failed while applying canonical QA geometry"
            }
            Start-Sleep -Milliseconds 750

            $rect = New-Object GhostFtpWindowCapture+RECT
            if (-not [GhostFtpWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
              throw "GetWindowRect failed"
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ([Math]::Abs($width - $targetWidth) -gt 2 -or [Math]::Abs($height - $targetHeight) -gt 2) {
              throw "Canonical Ghost FTP QA size was not applied: ${width}x${height}"
            }

            $bitmap = New-Object System.Drawing.Bitmap $width, $height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $hdc = $graphics.GetHdc()
              try {
                $PW_RENDERFULLCONTENT = 0x00000002
                if (-not [GhostFtpWindowCapture]::PrintWindow($handle, $hdc, $PW_RENDERFULLCONTENT)) {
                  throw "PrintWindow failed while capturing canonical native-window QA evidence"
                }
              } finally {
                $graphics.ReleaseHdc($hdc)
              }
              $bitmap.Save((Join-Path $qaDir 'GhostFTP-Windows-RC13-Native-Window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            @(
              "ProcessId=$($proc.Id)"
              "WindowTitle=$($proc.MainWindowTitle)"
              "WindowBounds=${width}x${height}"
              "TargetReferenceBounds=${targetWidth}x${targetHeight}"
              "CaptureMethod=PrintWindow(PW_RENDERFULLCONTENT)"
              "Executable=$exe"
            ) | Set-Content -Encoding UTF8 (Join-Path $qaDir 'GhostFTP-Windows-RC13-Native-Window.txt')
          } finally {
            if (-not $proc.HasExited) {
              $null = $proc.CloseMainWindow()
              Start-Sleep -Seconds 1
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            }
          }

      - name: Upload Windows native-window QA evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-Windows-x64-RC13-QA
          path: qa/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ghostftp-desktop/src-tauri/target/release/bundle/**
            ghostftp-desktop/src-tauri/Cargo.lock
            ghostftp-desktop/src-tauri/target/release/ghostftp.exe
            ghostftp-desktop/src-tauri/target/release/ghostftp
          if-no-files-found: error

  source-packages:
    name: RC13 source packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package RC13 source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC13-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC13-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-v2.1.1-RC13-Website.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC13-Updates.zip updates
          zip -qr dist/GhostFTP-v2.1.1-RC13-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt
      - name: Upload RC13 source packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-RC13-Source-Packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
