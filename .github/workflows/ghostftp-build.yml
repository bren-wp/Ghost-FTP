name: Ghost FTP native build

# RC13 production release gate: only Ghost FTP desktop bundles are eligible for end-user releases.
# RC13 release build stamp: 2026-09-21.13

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
  pull_request:
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
      - '.github/workflows/ghostftp-release.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact: 'GhostFTP-Windows-x64-RC13'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            artifact: 'GhostFTP-Linux-x86_64-RC13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: ghostftp-desktop
        run: npm run build
      - name: Build Ghost FTP desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}
      - name: Capture Windows native-window QA evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaDir = Join-Path $env:GITHUB_WORKSPACE 'qa'
          New-Item -ItemType Directory -Force $qaDir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'ghostftp-desktop\src-tauri\target\release\ghostftp.exe'
          if (-not (Test-Path $exe)) { throw "Ghost FTP executable not found: $exe" }

          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class GhostFtpWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool SetWindowPos(
              IntPtr hWnd,
              IntPtr hWndInsertAfter,
              int X,
              int Y,
              int cx,
              int cy,
              uint uFlags
            );
          }
          "@

          function Receive-CdpMessage {
            param(
              [System.Net.WebSockets.ClientWebSocket]$Socket,
              [int]$ExpectedId,
              [System.Threading.CancellationToken]$Token
            )
            while ($true) {
              $buffer = New-Object byte[] 1048576
              $builder = New-Object System.Text.StringBuilder
              do {
                $segment = [System.ArraySegment[byte]]::new($buffer)
                $result = $Socket.ReceiveAsync($segment, $Token).GetAwaiter().GetResult()
                if ($result.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) {
                  throw "WebView2 DevTools websocket closed before command $ExpectedId completed"
                }
                [void]$builder.Append([System.Text.Encoding]::UTF8.GetString($buffer, 0, $result.Count))
              } while (-not $result.EndOfMessage)

              $message = $builder.ToString() | ConvertFrom-Json
              if ($null -ne $message.id -and [int]$message.id -eq $ExpectedId) {
                if ($message.error) {
                  throw "WebView2 DevTools command $ExpectedId failed: $($message.error | ConvertTo-Json -Compress)"
                }
                return $message.result
              }
            }
          }

          function Send-CdpCommand {
            param(
              [System.Net.WebSockets.ClientWebSocket]$Socket,
              [int]$Id,
              [string]$Method,
              [hashtable]$Params,
              [System.Threading.CancellationToken]$Token
            )
            $payload = @{
              id = $Id
              method = $Method
              params = $Params
            } | ConvertTo-Json -Compress -Depth 12
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $segment = [System.ArraySegment[byte]]::new($bytes)
            $Socket.SendAsync(
              $segment,
              [System.Net.WebSockets.WebSocketMessageType]::Text,
              $true,
              $Token
            ).GetAwaiter().GetResult()
            return Receive-CdpMessage -Socket $Socket -ExpectedId $Id -Token $Token
          }

          $targetWidth = 1290
          $targetHeight = 852
          $SWP_NOZORDER = 0x0004
          $views = @(
            @{ key = 'main'; label = 'Native-Window' },
            @{ key = 'siteManager'; label = 'Site-Manager' },
            @{ key = 'newConnection'; label = 'New-Connection' },
            @{ key = 'settings'; label = 'Preferences' },
            @{ key = 'transferCenter'; label = 'Transfer-Center' },
            @{ key = 'properties'; label = 'File-Properties' },
            @{ key = 'about'; label = 'About' }
          )

          $viewIndex = 0
          foreach ($view in $views) {
            $debugPort = 9222 + $viewIndex
            $viewIndex++
            $env:GHOSTFTP_QA_VIEW = $view.key
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$debugPort --remote-allow-origins=*"

            $proc = Start-Process -FilePath $exe -PassThru
            try {
              $handle = [IntPtr]::Zero
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Milliseconds 400
                $proc.Refresh()
                if ($proc.HasExited) {
                  throw "Ghost FTP exited before the $($view.key) QA capture"
                }
                if ($proc.MainWindowHandle -ne 0) {
                  $handle = $proc.MainWindowHandle
                  break
                }
              }
              if ($handle -eq [IntPtr]::Zero) {
                throw "Ghost FTP did not expose a native main-window handle for $($view.key)"
              }
              if ($proc.MainWindowTitle -ne 'Ghost FTP') {
                throw "Unexpected Ghost FTP window title for $($view.key): $($proc.MainWindowTitle)"
              }

              if (-not [GhostFtpWindowCapture]::SetWindowPos(
                $handle,
                [IntPtr]::Zero,
                0,
                0,
                $targetWidth,
                $targetHeight,
                $SWP_NOZORDER
              )) {
                throw "SetWindowPos failed for $($view.key)"
              }

              $settleMs = if ($view.key -eq 'properties') { 2500 } else { 1400 }
              Start-Sleep -Milliseconds $settleMs

              $rect = New-Object GhostFtpWindowCapture+RECT
              if (-not [GhostFtpWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
                throw "GetWindowRect failed for $($view.key)"
              }
              $width = $rect.Right - $rect.Left
              $height = $rect.Bottom - $rect.Top
              if ([Math]::Abs($width - $targetWidth) -gt 2 -or [Math]::Abs($height - $targetHeight) -gt 2) {
                throw "Canonical Ghost FTP QA size was not applied for $($view.key): ${width}x${height}"
              }

              $target = $null
              for ($i = 0; $i -lt 30; $i++) {
                try {
                  $targets = Invoke-RestMethod -Uri "http://127.0.0.1:$debugPort/json/list" -TimeoutSec 2
                  $target = $targets |
                    Where-Object { $_.type -eq 'page' -and $_.webSocketDebuggerUrl } |
                    Select-Object -First 1
                  if ($target) { break }
                } catch {
                  # WebView2 DevTools endpoint is still starting.
                }
                Start-Sleep -Milliseconds 250
              }
              if (-not $target) {
                throw "WebView2 DevTools target was not available for $($view.key)"
              }

              $cts = [System.Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(20))
              $socket = [System.Net.WebSockets.ClientWebSocket]::new()
              try {
                $socket.ConnectAsync([Uri]$target.webSocketDebuggerUrl, $cts.Token).GetAwaiter().GetResult()

                # DevTools capture renders the actual WebView2 compositor rather
                # than PrintWindow's blank child surface. Metrics are fixed to
                # the approved 1290x852 reference viewport before each shot.
                $null = Send-CdpCommand -Socket $socket -Id 1 -Method 'Emulation.setDeviceMetricsOverride' -Params @{
                  width = $targetWidth
                  height = $targetHeight
                  deviceScaleFactor = 1
                  mobile = $false
                } -Token $cts.Token

                $shot = Send-CdpCommand -Socket $socket -Id 2 -Method 'Page.captureScreenshot' -Params @{
                  format = 'png'
                  fromSurface = $true
                  captureBeyondViewport = $false
                } -Token $cts.Token
              } finally {
                if ($socket.State -eq [System.Net.WebSockets.WebSocketState]::Open) {
                  $socket.CloseAsync(
                    [System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure,
                    'done',
                    [System.Threading.CancellationToken]::None
                  ).GetAwaiter().GetResult()
                }
                $socket.Dispose()
                $cts.Dispose()
              }

              if (-not $shot.data) {
                throw "WebView2 DevTools returned no screenshot data for $($view.key)"
              }

              $png = Join-Path $qaDir ("GhostFTP-Windows-RC13-" + $view.label + ".png")
              [System.IO.File]::WriteAllBytes($png, [Convert]::FromBase64String($shot.data))

              $image = [System.Drawing.Bitmap]::FromFile($png)
              try {
                if ($image.Width -ne $targetWidth -or $image.Height -ne $targetHeight) {
                  throw "QA screenshot dimensions for $($view.key) are $($image.Width)x$($image.Height), expected ${targetWidth}x${targetHeight}"
                }

                # Reject blank/white/solid captures without relying on PNG file
                # size. Sample a grid and require real UI color variation.
                $colors = New-Object 'System.Collections.Generic.HashSet[int]'
                $darkSamples = 0
                for ($y = 0; $y -lt $image.Height; $y += 53) {
                  for ($x = 0; $x -lt $image.Width; $x += 61) {
                    $pixel = $image.GetPixel($x, $y)
                    $null = $colors.Add($pixel.ToArgb())
                    if ($pixel.GetBrightness() -lt 0.65) { $darkSamples++ }
                  }
                }
                if ($colors.Count -lt 12 -or $darkSamples -lt 20) {
                  throw "QA screenshot for $($view.key) appears blank or invalid (colors=$($colors.Count), darkSamples=$darkSamples)"
                }
              } finally {
                $image.Dispose()
              }

              $pngInfo = Get-Item $png
              @(
                "View=$($view.key)"
                "ProcessId=$($proc.Id)"
                "WindowTitle=$($proc.MainWindowTitle)"
                "WindowBounds=${width}x${height}"
                "TargetReferenceBounds=${targetWidth}x${targetHeight}"
                "CaptureMethod=WebView2CDP(Page.captureScreenshot)"
                "DevToolsPort=$debugPort"
                "ImageBytes=$($pngInfo.Length)"
                "Executable=$exe"
              ) | Set-Content -Encoding UTF8 (Join-Path $qaDir ("GhostFTP-Windows-RC13-" + $view.label + ".txt"))
            } finally {
              if (-not $proc.HasExited) {
                $null = $proc.CloseMainWindow()
                Start-Sleep -Milliseconds 700
                if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              }
            }
            Start-Sleep -Milliseconds 500
          }

          Remove-Item Env:GHOSTFTP_QA_VIEW -ErrorAction SilentlyContinue

      - name: Upload Windows native-window QA evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-Windows-x64-RC13-QA
          path: qa/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ghostftp-desktop/src-tauri/target/release/bundle/**
            ghostftp-desktop/src-tauri/Cargo.lock
            ghostftp-desktop/src-tauri/target/release/ghostftp.exe
            ghostftp-desktop/src-tauri/target/release/ghostftp
          if-no-files-found: error

  source-packages:
    name: RC13 source packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package RC13 source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC13-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC13-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-v2.1.1-RC13-Website.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC13-Updates.zip updates
          zip -qr dist/GhostFTP-v2.1.1-RC13-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt
      - name: Upload RC13 source packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-RC13-Source-Packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
