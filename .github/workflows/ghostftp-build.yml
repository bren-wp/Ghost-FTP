name: Ghost FTP native build

# RC13 production release gate: only Ghost FTP desktop bundles are eligible for end-user releases.
# RC13 release build stamp: 2026-09-21.13

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
  pull_request:
    paths:
      - 'ghostftp-desktop/**'
      - '.github/workflows/ghostftp-build.yml'
      - '.github/workflows/ghostftp-release.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact: 'GhostFTP-Windows-x64-RC13'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            artifact: 'GhostFTP-Linux-x86_64-RC13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: ghostftp-desktop
        run: npm run build
      - name: Build Ghost FTP desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}
      - name: Capture Windows native-window QA evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaDir = Join-Path $env:GITHUB_WORKSPACE 'qa'
          New-Item -ItemType Directory -Force $qaDir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'ghostftp-desktop\src-tauri\target\release\ghostftp.exe'
          if (-not (Test-Path $exe)) { throw "Ghost FTP executable not found: $exe" }

          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class GhostFtpWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool SetWindowPos(
              IntPtr hWnd,
              IntPtr hWndInsertAfter,
              int X,
              int Y,
              int cx,
              int cy,
              uint uFlags
            );

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(IntPtr hWnd);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
          }
          "@

          $targetWidth = 1290
          $targetHeight = 852
          $SWP_NOZORDER = 0x0004
          $SWP_SHOWWINDOW = 0x0040
          $PW_RENDERFULLCONTENT = 0x00000002
          $views = @(
            @{ key = 'main'; label = 'Native-Window' },
            @{ key = 'siteManager'; label = 'Site-Manager' },
            @{ key = 'newConnection'; label = 'New-Connection' },
            @{ key = 'settings'; label = 'Preferences' },
            @{ key = 'transferCenter'; label = 'Transfer-Center' },
            @{ key = 'properties'; label = 'File-Properties' },
            @{ key = 'about'; label = 'About' }
          )

          $work = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          if ($work.Width -lt 400 -or $work.Height -lt 400) {
            throw "Unexpected Windows QA working area: $($work.Width)x$($work.Height)"
          }

          foreach ($view in $views) {
            $env:GHOSTFTP_QA_VIEW = $view.key
            $proc = Start-Process -FilePath $exe -PassThru
            try {
              $handle = [IntPtr]::Zero
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Milliseconds 400
                $proc.Refresh()
                if ($proc.HasExited) {
                  throw "Ghost FTP exited before the $($view.key) QA capture"
                }
                if ($proc.MainWindowHandle -ne 0) {
                  $handle = $proc.MainWindowHandle
                  break
                }
              }
              if ($handle -eq [IntPtr]::Zero) {
                throw "Ghost FTP did not expose a native main-window handle for $($view.key)"
              }
              if ($proc.MainWindowTitle -ne 'Ghost FTP') {
                throw "Unexpected Ghost FTP window title for $($view.key): $($proc.MainWindowTitle)"
              }

              # Keep the real native window at the canonical reference geometry.
              # PrintWindow(PW_RENDERFULLCONTENT) captures the HWND itself instead
              # of the hosted runner desktop, so unrelated console windows cannot
              # contaminate the visual evidence even when 1290x852 exceeds the
              # visible GitHub Actions working area.
              if (-not [GhostFtpWindowCapture]::SetWindowPos(
                $handle,
                [IntPtr]::Zero,
                $work.Left,
                $work.Top,
                $targetWidth,
                $targetHeight,
                ($SWP_NOZORDER -bor $SWP_SHOWWINDOW)
              )) {
                throw "SetWindowPos failed for $($view.key)"
              }
              $null = [GhostFtpWindowCapture]::SetForegroundWindow($handle)

              $settleMs = if ($view.key -eq 'properties') { 1800 } else { 1100 }
              Start-Sleep -Milliseconds $settleMs

              $rect = New-Object GhostFtpWindowCapture+RECT
              if (-not [GhostFtpWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
                throw "GetWindowRect failed for $($view.key)"
              }
              $width = $rect.Right - $rect.Left
              $height = $rect.Bottom - $rect.Top
              if ([Math]::Abs($width - $targetWidth) -gt 4 -or [Math]::Abs($height - $targetHeight) -gt 4) {
                throw "Native window bounds for $($view.key) are ${width}x${height}, expected approximately ${targetWidth}x${targetHeight}"
              }

              $bitmap = New-Object System.Drawing.Bitmap $targetWidth, $targetHeight, ([System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $hdc = [IntPtr]::Zero
              try {
                $hdc = $graphics.GetHdc()
                if (-not [GhostFtpWindowCapture]::PrintWindow($handle, $hdc, $PW_RENDERFULLCONTENT)) {
                  throw "PrintWindow(PW_RENDERFULLCONTENT) failed for $($view.key)"
                }
              } finally {
                if ($hdc -ne [IntPtr]::Zero) { $graphics.ReleaseHdc($hdc) }
                $graphics.Dispose()
              }

              $png = Join-Path $qaDir ("GhostFTP-Windows-RC13-" + $view.label + ".png")
              try {
                $bitmap.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $bitmap.Dispose()
              }

              if (-not (Test-Path $png)) {
                throw "QA screenshot was not written for $($view.key)"
              }
              $pngInfo = Get-Item $png
              if ($pngInfo.Length -le 0) {
                throw "QA screenshot is empty for $($view.key)"
              }

              $image = [System.Drawing.Bitmap]::FromFile($png)
              try {
                if ($image.Width -ne $targetWidth -or $image.Height -ne $targetHeight) {
                  throw "QA screenshot dimensions for $($view.key) are $($image.Width)x$($image.Height), expected ${targetWidth}x${targetHeight}"
                }

                # Robust blank-image validation: prove the decoded bitmap has
                # opaque content, multiple colors and measurable luminance
                # variation. Do not use compressed PNG byte size as a proxy.
                $colors = New-Object 'System.Collections.Generic.HashSet[int]'
                $sampleCount = 0
                $opaqueSamples = 0
                $transparentSamples = 0
                $minBrightness = 1.0
                $maxBrightness = 0.0
                $sumBrightness = 0.0
                $sumBrightnessSq = 0.0

                for ($y = 7; $y -lt $image.Height; $y += 29) {
                  for ($x = 7; $x -lt $image.Width; $x += 31) {
                    $pixel = $image.GetPixel($x, $y)
                    $sampleCount++
                    if ($pixel.A -eq 0) { $transparentSamples++ } else { $opaqueSamples++ }
                    $null = $colors.Add($pixel.ToArgb())
                    $brightness = [double]$pixel.GetBrightness()
                    $minBrightness = [Math]::Min($minBrightness, $brightness)
                    $maxBrightness = [Math]::Max($maxBrightness, $brightness)
                    $sumBrightness += $brightness
                    $sumBrightnessSq += ($brightness * $brightness)
                  }
                }

                if ($sampleCount -le 0 -or $opaqueSamples -le 0 -or $transparentSamples -eq $sampleCount) {
                  throw "QA screenshot for $($view.key) is fully transparent or has no sampled pixels"
                }

                $meanBrightness = $sumBrightness / $sampleCount
                $brightnessVariance = ($sumBrightnessSq / $sampleCount) - ($meanBrightness * $meanBrightness)
                $brightnessRange = $maxBrightness - $minBrightness
                if ($colors.Count -lt 12 -or $brightnessRange -lt 0.05 -or $brightnessVariance -lt 0.0003) {
                  throw "QA screenshot for $($view.key) appears blank/solid (colors=$($colors.Count), range=$([Math]::Round($brightnessRange,4)), variance=$([Math]::Round($brightnessVariance,6)), opaque=$opaqueSamples/$sampleCount)"
                }
              } finally {
                $image.Dispose()
              }

              @(
                "View=$($view.key)"
                "ProcessId=$($proc.Id)"
                "WindowTitle=$($proc.MainWindowTitle)"
                "WindowBounds=${width}x${height}"
                "TargetReferenceBounds=${targetWidth}x${targetHeight}"
                "WorkingArea=$($work.Width)x$($work.Height)"
                "CaptureMethod=PrintWindow(PW_RENDERFULLCONTENT)"
                "ImageBytes=$($pngInfo.Length)"
                "Executable=$exe"
              ) | Set-Content -Encoding UTF8 (Join-Path $qaDir ("GhostFTP-Windows-RC13-" + $view.label + ".txt"))
            } finally {
              if (-not $proc.HasExited) {
                $null = $proc.CloseMainWindow()
                Start-Sleep -Milliseconds 700
                if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              }
            }
            Start-Sleep -Milliseconds 500
          }

          Remove-Item Env:GHOSTFTP_QA_VIEW -ErrorAction SilentlyContinue

      - name: Upload Windows native-window QA evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-Windows-x64-RC13-QA
          path: qa/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ghostftp-desktop/src-tauri/target/release/bundle/**
            ghostftp-desktop/src-tauri/Cargo.lock
            ghostftp-desktop/src-tauri/target/release/ghostftp.exe
            ghostftp-desktop/src-tauri/target/release/ghostftp
          if-no-files-found: error

  source-packages:
    name: RC13 source packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package RC13 source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC13-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC13-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-v2.1.1-RC13-Website.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC13-Updates.zip updates
          zip -qr dist/GhostFTP-v2.1.1-RC13-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt
      - name: Upload RC13 source packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-RC13-Source-Packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
