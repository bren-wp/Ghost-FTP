name: Ghost FTP native build

# Canonical Windows/Linux production build + native-window QA gate.
# This is the single native build consumed by the release workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ghostftp-desktop/**'
      - 'updates/**'
      - 'version.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/releases/**'
      - 'docs/assets/screenshots/**'
      - '.github/scripts/sync-version.mjs'
      - '.github/scripts/refresh-cargo-lock.sh'
      - '.github/workflows/ghostftp-build.yml'
      - '.github/workflows/ghostftp-release.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis,msi'
            artifact: 'GhostFTP-Windows-x64-Preview'
          - os: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            artifact: 'GhostFTP-Linux-x86_64-Preview'
    runs-on: ${{ matrix.os }}
    env:
      HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb xauth
      - name: Validate central version metadata
        shell: bash
        run: node .github/scripts/sync-version.mjs --check

      - name: Install frontend dependencies
        working-directory: ghostftp-desktop
        run: npm ci
      - name: TypeScript/frontend build
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run check:i18n
          npm run check:ui
          npm run check
          npm run build
      - name: Verify committed Rust dependency graph
        working-directory: ghostftp-desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Report desktop update signing mode
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ "$HAS_TAURI_SIGNING_KEY" = "true" ]; then
            echo "Signed desktop updater artifacts are enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured; building normal Windows/Linux packages without signed in-app updater artifacts."
          fi

      - name: Build Ghost FTP desktop bundle
        if: github.event_name != 'push' || env.HAS_TAURI_SIGNING_KEY != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ghostftp-desktop
          args: ${{ matrix.args }}

      - name: Build signed Ghost FTP desktop and updater bundle
        if: github.event_name == 'push' && env.HAS_TAURI_SIGNING_KEY == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ghostftp-desktop
          args: --config src-tauri/updater-release.conf.json ${{ matrix.args }}
      - name: Windows NSIS and MSI install/uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $setup) { throw 'NSIS Setup executable was not produced.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'GhostFTP-Setup-Smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Ghost FTP Setup failed with exit code $($install.ExitCode)" }

          $installedExe = Get-ChildItem $installDir -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installedExe -or $installedExe.Length -le 0) {
            throw 'Ghost FTP executable was not installed by Setup.'
          }

          # Prove the NSIS-installed binary itself launches as a GUI application,
          # not only the unpackaged target/release executable used by later QA.
          $installedProc = Start-Process -FilePath $installedExe.FullName -PassThru
          try {
            $opened = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 250
              $installedProc.Refresh()
              if ($installedProc.HasExited) {
                throw "NSIS-installed Ghost FTP exited during launch smoke with code $($installedProc.ExitCode)"
              }
              if ($installedProc.MainWindowHandle -ne 0 -and $installedProc.MainWindowTitle -eq 'Ghost FTP') {
                $opened = $true
                break
              }
            }
            if (-not $opened) {
              throw 'NSIS-installed Ghost FTP did not expose its main GUI window.'
            }
          } finally {
            if (-not $installedProc.HasExited) {
              Stop-Process -Id $installedProc.Id -Force -ErrorAction SilentlyContinue
              $installedProc.WaitForExit()
            }
          }

          $uninstaller = Get-ChildItem $installDir -Filter '*uninstall*.exe' -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw 'Ghost FTP uninstaller was not installed.' }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Ghost FTP uninstaller failed with exit code $($uninstall.ExitCode)" }

          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installedExe.FullName); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $installedExe.FullName) {
            throw 'Ghost FTP executable remained after silent uninstall.'
          }

          $msi = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/msi' -Filter '*.msi' -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $msi -or $msi.Length -le 0) { throw 'MSI installer was not produced.' }

          $msiInstallLog = Join-Path $env:RUNNER_TEMP 'GhostFTP-MSI-install.log'
          $msiInstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList @(
            '/i',
            ('"' + $msi.FullName + '"'),
            '/qn',
            '/norestart',
            '/L*v',
            ('"' + $msiInstallLog + '"')
          ) -PassThru -Wait
          if ($msiInstall.ExitCode -notin @(0, 3010)) {
            Get-Content $msiInstallLog -Tail 120 -ErrorAction SilentlyContinue
            throw "Ghost FTP MSI install failed with exit code $($msiInstall.ExitCode)"
          }

          $msiUninstallLog = Join-Path $env:RUNNER_TEMP 'GhostFTP-MSI-uninstall.log'
          $msiUninstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList @(
            '/x',
            ('"' + $msi.FullName + '"'),
            '/qn',
            '/norestart',
            '/L*v',
            ('"' + $msiUninstallLog + '"')
          ) -PassThru -Wait
          if ($msiUninstall.ExitCode -notin @(0, 3010)) {
            Get-Content $msiUninstallLog -Tail 120 -ErrorAction SilentlyContinue
            throw "Ghost FTP MSI uninstall failed with exit code $($msiUninstall.ExitCode)"
          }

      - name: Linux package lifecycle smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(realpath "$(find ghostftp-desktop/src-tauri/target/release/bundle/appimage -type f -iname '*.AppImage' | head -n1)")"
          DEB="$(realpath "$(find ghostftp-desktop/src-tauri/target/release/bundle/deb -type f -iname '*.deb' | head -n1)")"
          RPM="$(realpath "$(find ghostftp-desktop/src-tauri/target/release/bundle/rpm -type f -iname '*.rpm' | head -n1)")"

          test -s "$APPIMAGE"
          test -s "$DEB"
          test -s "$RPM"

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-version
          dpkg-deb --info "$DEB" >/dev/null
          rpm -qip "$RPM" >/dev/null
          rpm -qpl "$RPM" | grep -E '/(usr/)?bin/[^/]*ghost' >/dev/null

          smoke_linux_gui() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/ghostftp-${label// /-}-launch.log"
            local home="$RUNNER_TEMP/ghostftp-${label// /-}-home"
            rm -rf "$home"
            mkdir -p "$home"

            set +e
            HOME="$home" timeout --signal=TERM --kill-after=3s 10s xvfb-run -a "$@" >"$log" 2>&1
            local exit_code=$?
            set -e

            # A healthy desktop app remains alive until timeout terminates it.
            # Any early exit (including loader/WebKit/package errors) is a failure.
            if [ "$exit_code" -ne 124 ]; then
              cat "$log" >&2 || true
              echo "$label GUI launch smoke exited early with code $exit_code." >&2
              exit 1
            fi
            echo "$label GUI launch stayed alive until the smoke timeout."
          }

          # GitHub runners may not expose FUSE. Extract-and-run still executes the
          # exact AppImage payload and its bundled desktop application.
          smoke_linux_gui "AppImage" env APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE"

          PACKAGE_NAME="$(dpkg-deb -f "$DEB" Package)"
          test -n "$PACKAGE_NAME"

          sudo apt-get install -y "$DEB"
          dpkg-query -W -f='${Status}' "$PACKAGE_NAME" | grep -Fq 'install ok installed'

          INSTALLED_BIN=""
          while IFS= read -r installed_path; do
            if [ -f "$installed_path" ] && [ -x "$installed_path" ]; then
              INSTALLED_BIN="$installed_path"
              break
            fi
          done < <(dpkg-query -L "$PACKAGE_NAME")
          if [ -z "$INSTALLED_BIN" ]; then
            echo "No executable file was installed by DEB package $PACKAGE_NAME." >&2
            dpkg-query -L "$PACKAGE_NAME" >&2
            exit 1
          fi
          echo "Installed Ghost FTP executable: $INSTALLED_BIN"
          smoke_linux_gui "DEB-installed" "$INSTALLED_BIN"

          sudo apt-get remove -y "$PACKAGE_NAME"
          if dpkg-query -W -f='${Status}' "$PACKAGE_NAME" 2>/dev/null | grep -Fq 'install ok installed'; then
            echo "Ghost FTP package still reports installed after remove." >&2
            exit 1
          fi
          if [ -e "$INSTALLED_BIN" ]; then
            echo "Ghost FTP executable remains after package removal: $INSTALLED_BIN" >&2
            exit 1
          fi

      - name: Capture Windows native-window QA evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaDir = Join-Path $env:GITHUB_WORKSPACE 'qa'
          New-Item -ItemType Directory -Force $qaDir | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'ghostftp-desktop\src-tauri\target\release\ghostftp.exe'
          if (-not (Test-Path $exe)) { throw "Ghost FTP executable not found: $exe" }

          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class GhostFtpWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool SetWindowPos(
              IntPtr hWnd,
              IntPtr hWndInsertAfter,
              int X,
              int Y,
              int cx,
              int cy,
              uint uFlags
            );

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(IntPtr hWnd);

            [DllImport("user32.dll")]
            public static extern bool IsZoomed(IntPtr hWnd);

            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
          }
          "@

          function Test-GhostFtpPng {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][int]$ExpectedWidth,
              [Parameter(Mandatory=$true)][int]$ExpectedHeight
            )

            if (-not (Test-Path $Path)) {
              return [pscustomobject]@{ Valid=$false; Reason='missing'; Colors=0; QuantizedColors=0; Range=0; Variance=0; EdgeRatio=0; Opaque=0; Samples=0 }
            }
            if ((Get-Item $Path).Length -le 0) {
              return [pscustomobject]@{ Valid=$false; Reason='empty'; Colors=0; QuantizedColors=0; Range=0; Variance=0; EdgeRatio=0; Opaque=0; Samples=0 }
            }

            try {
              $image = [System.Drawing.Bitmap]::FromFile($Path)
            } catch {
              return [pscustomobject]@{ Valid=$false; Reason='decode-failed'; Colors=0; QuantizedColors=0; Range=0; Variance=0; EdgeRatio=0; Opaque=0; Samples=0 }
            }

            try {
              if ($image.Width -ne $ExpectedWidth -or $image.Height -ne $ExpectedHeight) {
                return [pscustomobject]@{
                  Valid=$false
                  Reason=("dimensions-" + $image.Width + "x" + $image.Height)
                  Colors=0; QuantizedColors=0; Range=0; Variance=0; EdgeRatio=0; Opaque=0; Samples=0
                }
              }

              $colors = New-Object 'System.Collections.Generic.HashSet[int]'
              $quantized = New-Object 'System.Collections.Generic.HashSet[int]'
              $sampleCount = 0
              $opaqueSamples = 0
              $transparentSamples = 0
              $minBrightness = 1.0
              $maxBrightness = 0.0
              $sumBrightness = 0.0
              $sumBrightnessSq = 0.0
              $edgeComparisons = 0
              $edgeHits = 0

              # Sample densely enough to detect UI structure. RC19 exposed why
              # sparse color/variance checks are insufficient: a blank WebView2
              # compositor frame with only the native border still had >100 raw
              # colors from anti-aliasing and incorrectly passed.
              for ($y = 8; $y -lt ($image.Height - 9); $y += 12) {
                for ($x = 8; $x -lt ($image.Width - 9); $x += 12) {
                  $pixel = $image.GetPixel($x, $y)
                  $sampleCount++
                  if ($pixel.A -eq 0) { $transparentSamples++ } else { $opaqueSamples++ }
                  $null = $colors.Add($pixel.ToArgb())

                  $qr = [Math]::Floor($pixel.R / 16)
                  $qg = [Math]::Floor($pixel.G / 16)
                  $qb = [Math]::Floor($pixel.B / 16)
                  $null = $quantized.Add(($qr -shl 8) -bor ($qg -shl 4) -bor $qb)

                  $brightness = [double]$pixel.GetBrightness()
                  $minBrightness = [Math]::Min($minBrightness, $brightness)
                  $maxBrightness = [Math]::Max($maxBrightness, $brightness)
                  $sumBrightness += $brightness
                  $sumBrightnessSq += ($brightness * $brightness)

                  $right = $image.GetPixel($x + 8, $y)
                  $down = $image.GetPixel($x, $y + 8)
                  $edgeComparisons += 2
                  if ([Math]::Abs($brightness - [double]$right.GetBrightness()) -ge 0.035) { $edgeHits++ }
                  if ([Math]::Abs($brightness - [double]$down.GetBrightness()) -ge 0.035) { $edgeHits++ }
                }
              }

              if ($sampleCount -le 0 -or $opaqueSamples -le 0 -or $transparentSamples -eq $sampleCount) {
                return [pscustomobject]@{
                  Valid=$false; Reason='transparent'; Colors=$colors.Count; QuantizedColors=$quantized.Count
                  Range=0; Variance=0; EdgeRatio=0; Opaque=$opaqueSamples; Samples=$sampleCount
                }
              }

              $meanBrightness = $sumBrightness / $sampleCount
              $brightnessVariance = ($sumBrightnessSq / $sampleCount) - ($meanBrightness * $meanBrightness)
              $brightnessRange = $maxBrightness - $minBrightness
              $edgeRatio = if ($edgeComparisons -gt 0) { $edgeHits / $edgeComparisons } else { 0.0 }

              # A real Ghost FTP 1290x852 view has dense text, icons, separators
              # and controls. Require actual structure, not only native-window
              # border anti-aliasing. Keep thresholds conservative enough for
              # legitimate empty states.
              $valid =
                $colors.Count -ge 24 -and
                $quantized.Count -ge 18 -and
                $brightnessRange -ge 0.08 -and
                $brightnessVariance -ge 0.0005 -and
                $edgeRatio -ge 0.008

              return [pscustomobject]@{
                Valid=$valid
                Reason=if ($valid) { 'ok' } else { 'blank-or-structureless' }
                Colors=$colors.Count
                QuantizedColors=$quantized.Count
                Range=$brightnessRange
                Variance=$brightnessVariance
                EdgeRatio=$edgeRatio
                Opaque=$opaqueSamples
                Samples=$sampleCount
              }
            } finally {
              $image.Dispose()
            }
          }

          function Invoke-GhostFtpCdp {
            param(
              [Parameter(Mandatory=$true)][System.Net.WebSockets.ClientWebSocket]$Socket,
              [Parameter(Mandatory=$true)][int]$Id,
              [Parameter(Mandatory=$true)][string]$Method,
              [hashtable]$Params=@{}
            )

            $payload = @{ id=$Id; method=$Method; params=$Params } | ConvertTo-Json -Compress -Depth 12
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $send = [System.ArraySegment[byte]]::new($bytes)
            $Socket.SendAsync(
              $send,
              [System.Net.WebSockets.WebSocketMessageType]::Text,
              $true,
              [System.Threading.CancellationToken]::None
            ).GetAwaiter().GetResult()

            while ($true) {
              $buffer = New-Object byte[] 65536
              $stream = New-Object System.IO.MemoryStream
              try {
                do {
                  $segment = [System.ArraySegment[byte]]::new($buffer)
                  $received = $Socket.ReceiveAsync(
                    $segment,
                    [System.Threading.CancellationToken]::None
                  ).GetAwaiter().GetResult()
                  if ($received.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) {
                    throw "WebView2 DevTools socket closed while waiting for $Method"
                  }
                  if ($received.Count -gt 0) {
                    $stream.Write($buffer, 0, $received.Count)
                  }
                } until ($received.EndOfMessage)

                $jsonText = [System.Text.Encoding]::UTF8.GetString($stream.ToArray())
                $message = $jsonText | ConvertFrom-Json
                if ($message.id -eq $Id) {
                  if ($message.error) {
                    throw "WebView2 DevTools $Method failed: $($message.error.message)"
                  }
                  return $message
                }
              } finally {
                $stream.Dispose()
              }
            }
          }

          function Capture-GhostFtpWebView2 {
            param(
              [Parameter(Mandatory=$true)][int]$Port,
              [Parameter(Mandatory=$true)][string]$OutputPath,
              [Parameter(Mandatory=$true)][int]$Width,
              [Parameter(Mandatory=$true)][int]$Height
            )

            $target = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $targets = Invoke-RestMethod -Uri "http://127.0.0.1:$Port/json/list" -TimeoutSec 2
                $target = @($targets) | Where-Object {
                  $_.type -eq 'page' -and $_.webSocketDebuggerUrl
                } | Select-Object -First 1
                if ($target) { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $target) {
              throw "WebView2 DevTools endpoint did not expose a page target on port $Port"
            }

            $socket = [System.Net.WebSockets.ClientWebSocket]::new()
            try {
              $socket.ConnectAsync(
                [Uri]$target.webSocketDebuggerUrl,
                [System.Threading.CancellationToken]::None
              ).GetAwaiter().GetResult()

              # The production window remains the real Tauri/WebView2 window.
              # This QA-only override makes the captured compositor surface use
              # the canonical 1290x852 CSS viewport regardless of hosted-runner DPI.
              $null = Invoke-GhostFtpCdp -Socket $socket -Id 1 -Method 'Emulation.setDeviceMetricsOverride' -Params @{
                width=$Width
                height=$Height
                deviceScaleFactor=1
                mobile=$false
              }
              $null = Invoke-GhostFtpCdp -Socket $socket -Id 2 -Method 'Page.bringToFront'
              Start-Sleep -Milliseconds 250
              $capture = Invoke-GhostFtpCdp -Socket $socket -Id 3 -Method 'Page.captureScreenshot' -Params @{
                format='png'
                fromSurface=$true
                captureBeyondViewport=$false
              }
              if (-not $capture.result.data) {
                throw "WebView2 DevTools returned no screenshot data"
              }
              [System.IO.File]::WriteAllBytes(
                $OutputPath,
                [Convert]::FromBase64String([string]$capture.result.data)
              )
            } finally {
              if ($socket.State -eq [System.Net.WebSockets.WebSocketState]::Open) {
                $socket.CloseAsync(
                  [System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure,
                  'done',
                  [System.Threading.CancellationToken]::None
                ).GetAwaiter().GetResult()
              }
              $socket.Dispose()
            }
          }

          $targetWidth = 1290
          $targetHeight = 852
          $SWP_NOZORDER = 0x0004
          $SWP_SHOWWINDOW = 0x0040
          $PW_RENDERFULLCONTENT = 0x00000002
          $views = @(
            @{ key = 'main'; label = 'Native-Window' },
            @{ key = 'siteManager'; label = 'Site-Manager' },
            @{ key = 'newConnection'; label = 'New-Connection' },
            @{ key = 'settings'; label = 'Preferences' },
            @{ key = 'transferCenter'; label = 'Transfer-Center' },
            @{ key = 'properties'; label = 'File-Properties' },
            @{ key = 'about'; label = 'About' }
          )

          $work = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          if ($work.Width -lt 400 -or $work.Height -lt 400) {
            throw "Unexpected Windows QA working area: $($work.Width)x$($work.Height)"
          }

          $capturedHashes = @{}
          $viewIndex = 0
          foreach ($view in $views) {
            $debugPort = 9222 + $viewIndex
            $viewIndex++
            $env:GHOSTFTP_QA_VIEW = $view.key

            # The Rust/Tauri window builder consumes these QA-only variables and
            # applies WebView2 additional_browser_args/data_directory directly.
            # This is reliable for the elevated GitHub Windows runner, unlike
            # relying on WebView2's process environment or registry policy.
            $browserArgs = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --disable-gpu --disable-gpu-compositing --remote-debugging-address=127.0.0.1 --remote-debugging-port=$debugPort"
            $qaWebViewData = Join-Path $env:RUNNER_TEMP ("ghostftp-webview2-" + $debugPort)
            Remove-Item $qaWebViewData -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $qaWebViewData -Force | Out-Null

            $env:GHOSTFTP_QA_BROWSER_ARGS = $browserArgs
            $env:GHOSTFTP_QA_WEBVIEW_DATA = $qaWebViewData

            $proc = Start-Process -FilePath $exe -PassThru
            try {
              $handle = [IntPtr]::Zero
              $observedTitle = ''
              for ($i = 0; $i -lt 50; $i++) {
                Start-Sleep -Milliseconds 300
                $proc.Refresh()
                if ($proc.HasExited) {
                  throw "Ghost FTP exited before the $($view.key) QA capture"
                }
                $observedTitle = $proc.MainWindowTitle
                if ($proc.MainWindowHandle -ne 0 -and $observedTitle -eq 'Ghost FTP') {
                  $handle = $proc.MainWindowHandle
                  break
                }
              }
              if ($handle -eq [IntPtr]::Zero) {
                throw "Ghost FTP did not expose the expected native main window for $($view.key); last title: $observedTitle"
              }

              # Validate the real launch geometry before the canonical QA resize.
              # Preview must start as a normal window and stay inside the OS working
              # area even when the preferred 1290x852 size is larger than the
              # available desktop.
              $launchRect = New-Object GhostFtpWindowCapture+RECT
              if (-not [GhostFtpWindowCapture]::GetWindowRect($handle, [ref]$launchRect)) {
                throw "GetWindowRect failed for initial $($view.key) launch"
              }
              $launchWidth = $launchRect.Right - $launchRect.Left
              $launchHeight = $launchRect.Bottom - $launchRect.Top
              if ([GhostFtpWindowCapture]::IsZoomed($handle)) {
                throw "Ghost FTP started maximized for $($view.key)"
              }
              if ($launchWidth -gt ($work.Width - 16) -or $launchHeight -gt ($work.Height - 16)) {
                throw "Ghost FTP initial window ${launchWidth}x${launchHeight} does not preserve a compact margin inside working area $($work.Width)x$($work.Height)"
              }

              if (-not [GhostFtpWindowCapture]::SetWindowPos(
                $handle,
                [IntPtr]::Zero,
                $work.Left,
                $work.Top,
                $targetWidth,
                $targetHeight,
                ($SWP_NOZORDER -bor $SWP_SHOWWINDOW)
              )) {
                throw "SetWindowPos failed for $($view.key)"
              }
              $null = [GhostFtpWindowCapture]::SetForegroundWindow($handle)

              $settleMs = if ($view.key -eq 'properties') { 2200 } else { 1400 }
              Start-Sleep -Milliseconds $settleMs

              $rect = New-Object GhostFtpWindowCapture+RECT
              if (-not [GhostFtpWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
                throw "GetWindowRect failed for $($view.key)"
              }
              $width = $rect.Right - $rect.Left
              $height = $rect.Bottom - $rect.Top
              if ([Math]::Abs($width - $targetWidth) -gt 4 -or [Math]::Abs($height - $targetHeight) -gt 4) {
                throw "Native window bounds for $($view.key) are ${width}x${height}, expected approximately ${targetWidth}x${targetHeight}"
              }

              $png = Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + ".png")
              $printCandidate = Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + ".printwindow.tmp.png")
              $captureMethod = 'PrintWindow(PW_RENDERFULLCONTENT)'

              $bitmap = New-Object System.Drawing.Bitmap $targetWidth, $targetHeight, ([System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $hdc = [IntPtr]::Zero
              try {
                $hdc = $graphics.GetHdc()
                if (-not [GhostFtpWindowCapture]::PrintWindow($handle, $hdc, $PW_RENDERFULLCONTENT)) {
                  throw "PrintWindow(PW_RENDERFULLCONTENT) failed for $($view.key)"
                }
              } finally {
                if ($hdc -ne [IntPtr]::Zero) { $graphics.ReleaseHdc($hdc) }
                $graphics.Dispose()
              }
              try {
                $bitmap.Save($printCandidate, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $bitmap.Dispose()
              }

              $printValidation = Test-GhostFtpPng -Path $printCandidate -ExpectedWidth $targetWidth -ExpectedHeight $targetHeight
              if ($printValidation.Valid) {
                Move-Item -Force $printCandidate $png
              } else {
                Write-Host ("PrintWindow compositor capture invalid for " + $view.key +
                  " (reason=" + $printValidation.Reason +
                  ", colors=" + $printValidation.Colors +
                  ", range=" + [Math]::Round($printValidation.Range,4) +
                  ", variance=" + [Math]::Round($printValidation.Variance,6) +
                  ", quantized=" + $printValidation.QuantizedColors +
                  ", edgeRatio=" + [Math]::Round($printValidation.EdgeRatio,5) +
                  "); falling back to the real WebView2 compositor surface.")
                Remove-Item $printCandidate -Force -ErrorAction SilentlyContinue
                Capture-GhostFtpWebView2 -Port $debugPort -OutputPath $png -Width $targetWidth -Height $targetHeight
                $captureMethod = 'WebView2 CDP compositor fallback after blank PrintWindow'
              }

              $validation = Test-GhostFtpPng -Path $png -ExpectedWidth $targetWidth -ExpectedHeight $targetHeight
              if (-not $validation.Valid) {
                throw "QA screenshot for $($view.key) is invalid (reason=$($validation.Reason), colors=$($validation.Colors), quantized=$($validation.QuantizedColors), range=$([Math]::Round($validation.Range,4)), variance=$([Math]::Round($validation.Variance,6)), edgeRatio=$([Math]::Round($validation.EdgeRatio,5)), opaque=$($validation.Opaque)/$($validation.Samples))"
              }

              $hash = (Get-FileHash -Algorithm SHA256 $png).Hash
              if ($capturedHashes.ContainsKey($hash)) {
                throw "QA screenshot for $($view.key) is byte-identical to $($capturedHashes[$hash]); distinct allow-listed views must render distinct UI."
              }
              $capturedHashes[$hash] = $view.key

              $pngInfo = Get-Item $png
              @(
                "View=$($view.key)"
                "ProcessId=$($proc.Id)"
                "WindowTitle=$($proc.MainWindowTitle)"
                "InitialWindowBounds=${launchWidth}x${launchHeight}"
                "WindowBounds=${width}x${height}"
                "TargetReferenceBounds=${targetWidth}x${targetHeight}"
                "WorkingArea=$($work.Width)x$($work.Height)"
                "CaptureMethod=$captureMethod"
                "DecodedColors=$($validation.Colors)"
                "QuantizedColors=$($validation.QuantizedColors)"
                "BrightnessRange=$([Math]::Round($validation.Range,6))"
                "BrightnessVariance=$([Math]::Round($validation.Variance,8))"
                "EdgeRatio=$([Math]::Round($validation.EdgeRatio,8))"
                "OpaqueSamples=$($validation.Opaque)/$($validation.Samples)"
                "ImageBytes=$($pngInfo.Length)"
                "Executable=$exe"
              ) | Set-Content -Encoding UTF8 (Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + ".txt"))

              # Exercise a genuinely compact viewport for the workspaces that
              # carry the most responsive pressure. This is separate from the
              # canonical 1290x852 visual reference and catches clipped buttons,
              # wrapped navigation and off-viewport overlays.
              if (@('main', 'siteManager', 'newConnection', 'settings', 'transferCenter', 'properties', 'about') -contains $view.key) {
                $compactWidth = [Math]::Min(720, $work.Width - 40)
                $compactHeight = [Math]::Min(640, $work.Height - 40)
                if ($compactWidth -ge 520 -and $compactHeight -ge 610) {
                  if (-not [GhostFtpWindowCapture]::SetWindowPos(
                    $handle,
                    [IntPtr]::Zero,
                    $work.Left + 20,
                    $work.Top + 20,
                    $compactWidth,
                    $compactHeight,
                    ($SWP_NOZORDER -bor $SWP_SHOWWINDOW)
                  )) {
                    throw "Compact SetWindowPos failed for $($view.key)"
                  }
                  Start-Sleep -Milliseconds 350

                  $compactPng = Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + "-Compact.png")
                  Capture-GhostFtpWebView2 -Port $debugPort -OutputPath $compactPng -Width $compactWidth -Height $compactHeight
                  $compactValidation = Test-GhostFtpPng -Path $compactPng -ExpectedWidth $compactWidth -ExpectedHeight $compactHeight
                  if (-not $compactValidation.Valid) {
                    throw "Compact QA screenshot for $($view.key) is invalid (reason=$($compactValidation.Reason), colors=$($compactValidation.Colors), quantized=$($compactValidation.QuantizedColors), edgeRatio=$([Math]::Round($compactValidation.EdgeRatio,5)))"
                  }

                  $compactHash = (Get-FileHash -Algorithm SHA256 $compactPng).Hash
                  if ($capturedHashes.ContainsKey($compactHash)) {
                    throw "Compact QA screenshot for $($view.key) is byte-identical to $($capturedHashes[$compactHash])"
                  }
                  $capturedHashes[$compactHash] = "$($view.key)-compact"

                  @(
                    "View=$($view.key)-compact"
                    "ProcessId=$($proc.Id)"
                    "WindowTitle=$($proc.MainWindowTitle)"
                    "WindowBounds=${compactWidth}x${compactHeight}"
                    "WorkingArea=$($work.Width)x$($work.Height)"
                    "CaptureMethod=WebView2 CDP compact responsive viewport"
                    "DecodedColors=$($compactValidation.Colors)"
                    "QuantizedColors=$($compactValidation.QuantizedColors)"
                    "BrightnessRange=$([Math]::Round($compactValidation.Range,6))"
                    "BrightnessVariance=$([Math]::Round($compactValidation.Variance,8))"
                    "EdgeRatio=$([Math]::Round($compactValidation.EdgeRatio,8))"
                    "OpaqueSamples=$($compactValidation.Opaque)/$($compactValidation.Samples)"
                    "Executable=$exe"
                  ) | Set-Content -Encoding UTF8 (Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + "-Compact.txt"))
                }

                # Exercise a near-minimum responsive viewport as a separate
                # regression surface. The production window minimum is about
                # 480x600; 500x620 keeps OS chrome tolerance while still
                # exposing layouts that only look correct at the 720px compact
                # reference.
                $minimumWidth = [Math]::Min(500, $work.Width - 24)
                $minimumHeight = [Math]::Min(620, $work.Height - 24)
                if ($minimumWidth -ge 480 -and $minimumHeight -ge 600) {
                  if (-not [GhostFtpWindowCapture]::SetWindowPos(
                    $handle,
                    [IntPtr]::Zero,
                    $work.Left + 12,
                    $work.Top + 12,
                    $minimumWidth,
                    $minimumHeight,
                    ($SWP_NOZORDER -bor $SWP_SHOWWINDOW)
                  )) {
                    throw "Minimum SetWindowPos failed for $($view.key)"
                  }
                  Start-Sleep -Milliseconds 350

                  $minimumPng = Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + "-Minimum.png")
                  Capture-GhostFtpWebView2 -Port $debugPort -OutputPath $minimumPng -Width $minimumWidth -Height $minimumHeight
                  $minimumValidation = Test-GhostFtpPng -Path $minimumPng -ExpectedWidth $minimumWidth -ExpectedHeight $minimumHeight
                  if (-not $minimumValidation.Valid) {
                    throw "Minimum QA screenshot for $($view.key) is invalid (reason=$($minimumValidation.Reason), colors=$($minimumValidation.Colors), quantized=$($minimumValidation.QuantizedColors), edgeRatio=$([Math]::Round($minimumValidation.EdgeRatio,5)))"
                  }

                  $minimumHash = (Get-FileHash -Algorithm SHA256 $minimumPng).Hash
                  if ($capturedHashes.ContainsKey($minimumHash)) {
                    throw "Minimum QA screenshot for $($view.key) is byte-identical to $($capturedHashes[$minimumHash])"
                  }
                  $capturedHashes[$minimumHash] = "$($view.key)-minimum"

                  @(
                    "View=$($view.key)-minimum"
                    "ProcessId=$($proc.Id)"
                    "WindowTitle=$($proc.MainWindowTitle)"
                    "WindowBounds=${minimumWidth}x${minimumHeight}"
                    "WorkingArea=$($work.Width)x$($work.Height)"
                    "CaptureMethod=WebView2 CDP minimum responsive viewport"
                    "DecodedColors=$($minimumValidation.Colors)"
                    "QuantizedColors=$($minimumValidation.QuantizedColors)"
                    "BrightnessRange=$([Math]::Round($minimumValidation.Range,6))"
                    "BrightnessVariance=$([Math]::Round($minimumValidation.Variance,8))"
                    "EdgeRatio=$([Math]::Round($minimumValidation.EdgeRatio,8))"
                    "OpaqueSamples=$($minimumValidation.Opaque)/$($minimumValidation.Samples)"
                    "Executable=$exe"
                  ) | Set-Content -Encoding UTF8 (Join-Path $qaDir ("GhostFTP-Windows-Preview-" + $view.label + "-Minimum.txt"))
                }
              }
            } finally {
              if (-not $proc.HasExited) {
                $null = $proc.CloseMainWindow()
                Start-Sleep -Milliseconds 700
                if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
              }
              Remove-Item $qaWebViewData -Recurse -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 500
          }

          Remove-Item Env:GHOSTFTP_QA_VIEW -ErrorAction SilentlyContinue
          Remove-Item Env:GHOSTFTP_QA_BROWSER_ARGS -ErrorAction SilentlyContinue
          Remove-Item Env:GHOSTFTP_QA_WEBVIEW_DATA -ErrorAction SilentlyContinue

      - name: Upload Windows native-window QA evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-Windows-x64-Preview-QA
          path: qa/*
          if-no-files-found: warn
          retention-days: 14

      # Documentation screenshots intentionally remain pinned to the newest
      # published release. Fresh screenshots from this unreleased build are
      # validated and uploaded above as QA evidence, but are not compared
      # against release-proven README images here.

      - name: Collect Windows release-native artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/native | Out-Null
          $portable = 'ghostftp-desktop/src-tauri/target/release/ghostftp.exe'
          if (-not (Test-Path $portable)) { throw "Missing portable executable: $portable" }
          Copy-Item $portable 'dist/native/ghostftp.exe'

          $setup = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $setup) { throw 'Missing NSIS Setup executable.' }
          Copy-Item $setup.FullName 'dist/native/GhostFTP-Windows-x64-Setup.exe'

          $msi = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/msi' -Filter '*.msi' -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $msi) { throw 'Missing MSI installer.' }
          Copy-Item $msi.FullName 'dist/native/GhostFTP-Windows-x64-Setup.msi'

          if ('${{ github.event_name }}' -eq 'push' -and '${{ env.HAS_TAURI_SIGNING_KEY }}' -eq 'true') {
            $setupSig = Get-ChildItem 'ghostftp-desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig' -Recurse |
              Select-Object -First 1
            if (-not $setupSig) { throw 'Signed Windows updater signature was not produced.' }
            Copy-Item $setupSig.FullName 'dist/native/GhostFTP-Windows-x64-Setup.exe.sig'
          }

          $portableBytes = (Get-Item 'dist/native/ghostftp.exe').Length
          $setupBytes = (Get-Item 'dist/native/GhostFTP-Windows-x64-Setup.exe').Length
          $msiBytes = (Get-Item 'dist/native/GhostFTP-Windows-x64-Setup.msi').Length
          if ($portableBytes -gt 29360128) { throw "Portable executable exceeds 28 MiB budget: $portableBytes bytes" }
          if ($setupBytes -gt 12582912) { throw "Setup executable exceeds 12 MiB budget: $setupBytes bytes" }
          if ($msiBytes -gt 25165824) { throw "MSI installer exceeds 24 MiB budget: $msiBytes bytes" }

          "### Windows native artifact sizes" >> $env:GITHUB_STEP_SUMMARY
          "- portable.exe: $([Math]::Round($portableBytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
          "- setup.exe: $([Math]::Round($setupBytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
          "- setup.msi: $([Math]::Round($msiBytes / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY

      - name: Collect Linux release-native artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native

          BIN='ghostftp-desktop/src-tauri/target/release/ghostftp'
          APPIMAGE="$(find ghostftp-desktop/src-tauri/target/release/bundle/appimage -type f -iname '*.AppImage' | head -n1)"
          DEB="$(find ghostftp-desktop/src-tauri/target/release/bundle/deb -type f -iname '*.deb' | head -n1)"
          RPM="$(find ghostftp-desktop/src-tauri/target/release/bundle/rpm -type f -iname '*.rpm' | head -n1)"

          test -s "$BIN"; test -s "$APPIMAGE"; test -s "$DEB"; test -s "$RPM"
          cp "$BIN" dist/native/ghostftp
          cp "$APPIMAGE" dist/native/GhostFTP-Linux-x86_64.AppImage
          cp "$DEB" dist/native/GhostFTP-Linux-amd64.deb
          cp "$RPM" dist/native/GhostFTP-Linux-x86_64.rpm
          chmod +x dist/native/ghostftp dist/native/GhostFTP-Linux-x86_64.AppImage

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ env.HAS_TAURI_SIGNING_KEY }}" = "true" ]; then
            APPIMAGE_SIG="$(find ghostftp-desktop/src-tauri/target/release/bundle/appimage -type f -iname '*.AppImage.sig' | head -n1)"
            test -s "$APPIMAGE_SIG"
            cp "$APPIMAGE_SIG" dist/native/GhostFTP-Linux-x86_64.AppImage.sig
          fi

          bin_bytes="$(stat -c %s dist/native/ghostftp)"
          appimage_bytes="$(stat -c %s dist/native/GhostFTP-Linux-x86_64.AppImage)"
          deb_bytes="$(stat -c %s dist/native/GhostFTP-Linux-amd64.deb)"
          rpm_bytes="$(stat -c %s dist/native/GhostFTP-Linux-x86_64.rpm)"

          test "$bin_bytes" -le 31457280
          test "$appimage_bytes" -le 99614720
          test "$deb_bytes" -le 15728640
          test "$rpm_bytes" -le 15728640

          {
            echo '### Linux native artifact sizes'
            awk "BEGIN { printf \"- native binary: %.2f MiB\\n\", $bin_bytes/1048576 }"
            awk "BEGIN { printf \"- AppImage: %.2f MiB\\n\", $appimage_bytes/1048576 }"
            awk "BEGIN { printf \"- DEB: %.2f MiB\\n\", $deb_bytes/1048576 }"
            awk "BEGIN { printf \"- RPM: %.2f MiB\\n\", $rpm_bytes/1048576 }"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/native/*
          if-no-files-found: error
