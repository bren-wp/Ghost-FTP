name: GhostFTP Quality Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghostftp-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-go:
    name: Frontend + GhostFTP tools
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ghostftp-desktop/package-lock.json

      - name: Reject legacy/demo branding
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'Faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
            ghostftp-desktop/src ghostftp-desktop/src-tauri ghostftp-runtime ghostftp-installer ghostftp-web \
            --exclude-dir=node_modules --exclude-dir=target

      - name: GhostFTP runtime tooling checks
        shell: bash
        run: |
          set -euo pipefail
          cd ghostftp-runtime
          go test ./...
          go vet ./...
          node --check site/app.js

      - name: GhostFTP setup tooling checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ghostftp-installer/payload
          : > ghostftp-installer/payload/GhostFTP.exe
          cd ghostftp-installer
          go test ./...
          go vet ./...
          node --check site/setup.js

      - name: GhostFTP web syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ghostftp-web/assets/site.js

      - name: GhostFTP frontend typecheck and production build
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build

  rust:
    name: GhostFTP Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri

      - name: Linux desktop prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare GhostFTP frontend output for Rust checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ghostftp-desktop/dist
          printf '<!doctype html><html><body></body></html>\n' > ghostftp-desktop/dist/index.html

      - name: Rust formatting
        working-directory: ghostftp-desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        working-directory: ghostftp-desktop/src-tauri
        run: cargo check --workspace --all-targets

      - name: Rust workspace tests
        working-directory: ghostftp-desktop/src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: ghostftp-desktop/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
