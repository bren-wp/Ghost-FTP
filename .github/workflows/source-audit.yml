name: Ghost FTP source audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghostftp-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-go:
    name: Web + compatibility tooling
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Reject legacy/demo branding
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'Faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
            desktop-tauri/src desktop-tauri/src-tauri runtime installer website \
            --exclude-dir=node_modules --exclude-dir=target

      - name: Runtime checks
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          go test ./...
          go vet ./...
          node --check site/app.js

      - name: Installer checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer/payload
          : > installer/payload/GhostFTP.exe
          cd installer
          go test ./...
          go vet ./...
          node --check site/setup.js

      - name: Website syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check website/assets/site.js

      - name: Native frontend typecheck and production build
        working-directory: desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build

  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Linux Tauri prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare Tauri frontendDist for Rust checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-tauri/dist
          printf '<!doctype html><html><body></body></html>\n' > desktop-tauri/dist/index.html

      - name: Rust formatting
        working-directory: desktop-tauri/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        working-directory: desktop-tauri/src-tauri
        run: cargo check --workspace --all-targets

      - name: Rust workspace tests
        working-directory: desktop-tauri/src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: desktop-tauri/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
