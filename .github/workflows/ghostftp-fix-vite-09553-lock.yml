name: Lock patched Vite for unpublished 0.95.53 recovery

on:
  push:
    branches: [fix/vite-audit-hotfix-unpublished-v09553]

permissions:
  contents: write

concurrency:
  group: ghostftp-vite-09553-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-lock:
    if: github.repository == 'bren-wp/Ghost-FTP'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve patched Vite and prove npm dependency integrity
        shell: bash
        run: |
          set -euo pipefail
          cd ghostftp-desktop
          test "$(node -p 'require("./package.json").devDependencies.vite')" = "8.3.4"
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          test "$(node -p 'require("./package-lock.json").packages["node_modules/vite"].version')" = "8.3.4"
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high
          node ../.github/scripts/check-npm-dev-audit.mjs
          npm run check
          npm run build
      - name: Commit trusted npm-resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add ghostftp-desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already contains audited Vite 8.3.4."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): regenerate npm lock for patched Vite 8.3.4"
          git push origin "HEAD:$GITHUB_REF_NAME"
