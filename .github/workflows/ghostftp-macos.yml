name: Ghost FTP macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Swift toolchain
        run: swift --version

      - name: macOS production contract
        shell: bash
        run: bash macos/scripts/check-macos-contract.sh

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start real FTP fixture for macOS protocol acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir pyftpdlib
          ROOT="$RUNNER_TEMP/ghostftp-macos-ftp-root"
          mkdir -p "$ROOT"
          printf 'macOS FTP socket fixture\n' > "$ROOT/fixture.txt"
          cat > "$RUNNER_TEMP/ghostftp-macos-ftp-server.py" <<'PY'
          import os
          from pyftpdlib.authorizers import DummyAuthorizer
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer

          authorizer = DummyAuthorizer()
          authorizer.add_user(
              "ghostftp-e2e", "ghostftp-e2e-secret",
              os.path.join(os.environ["RUNNER_TEMP"], "ghostftp-macos-ftp-root"),
              perm="elradfmwMT",
          )
          class LegacyFTPHandler(FTPHandler):
              def ftp_MLSD(self, path):
                  self.respond("502 MLSD is not implemented on this FTP server")

          port = int(os.environ.get("GHOSTFTP_MACOS_TEST_PORT", "2127"))
          handler = LegacyFTPHandler if os.environ.get("GHOSTFTP_MACOS_LEGACY") == "1" else FTPHandler
          handler.authorizer = authorizer
          handler.passive_ports = range(32000 + (port - 2127) * 10, 32010 + (port - 2127) * 10)
          FTPServer(("127.0.0.1", port), handler).serve_forever()
          PY
          for port in 2127 2128; do
            legacy=0
            if [ "$port" = 2128 ]; then legacy=1; fi
            GHOSTFTP_MACOS_TEST_PORT="$port" GHOSTFTP_MACOS_LEGACY="$legacy" \
              nohup python3 "$RUNNER_TEMP/ghostftp-macos-ftp-server.py" \
                > "$RUNNER_TEMP/ghostftp-macos-ftp-server-$port.log" 2>&1 < /dev/null &
            echo "$!" > "$RUNNER_TEMP/ghostftp-macos-ftp-server-$port.pid"
          done
          for port in 2127 2128; do
            ready=0
            for attempt in $(seq 1 30); do
              if nc -z 127.0.0.1 "$port"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then
              cat "$RUNNER_TEMP/ghostftp-macos-ftp-server-$port.log"
              echo "::error::macOS real FTP test server $port did not start."
              exit 1
            fi
          done
          echo "Real MLSD and legacy LIST macOS FTP fixtures are accepting connections."

      - name: macOS unit and real FTP integration tests
        shell: bash
        env:
          GHOSTFTP_MACOS_E2E_PORT: '2127'
          GHOSTFTP_MACOS_LIST_E2E_PORT: '2128'
        run: swift test --package-path macos

      - name: Stop macOS FTP fixture
        if: always()
        shell: bash
        run: |
          for port in 2127 2128; do
            if [ -f "$RUNNER_TEMP/ghostftp-macos-ftp-server-$port.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/ghostftp-macos-ftp-server-$port.pid")" || true
            fi
          done

      - name: macOS release build
        shell: bash
        run: swift build --package-path macos -c release

      - name: Install SVG icon rasterizer
        shell: bash
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          command -v rsvg-convert

      - name: Package ad-hoc signed macOS preview
        shell: bash
        run: bash macos/scripts/package-app.sh

      - name: Verify macOS preview bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/macos/Ghost FTP.app"
          test -x "$APP/Contents/MacOS/GhostFTP"
          plutil -lint "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/GhostFTP.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = "GhostFTP.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.brendigo.ghostftp.macos"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -s dist/macos/GhostFTP-macOS-SHA256SUMS.txt

      - name: Fresh macOS archive extraction and installed-bundle integrity smoke
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./version.json").version')"
          PACKAGE="dist/macos/GhostFTP-macOS-v$VERSION-Preview.zip"
          test -s "$PACKAGE"
          (cd dist/macos && shasum -a 256 -c GhostFTP-macOS-SHA256SUMS.txt)
          INSTALL_ROOT="$RUNNER_TEMP/GhostFTP-Installation-Smoke"
          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT/Applications"
          # Extract the published ZIP into an isolated Applications tree, not
          # into the source/package staging directory used during build.
          ditto -x -k "$PACKAGE" "$INSTALL_ROOT/Applications"
          INSTALLED="$INSTALL_ROOT/Applications/Ghost FTP.app"
          test -x "$INSTALLED/Contents/MacOS/GhostFTP"
          test -s "$INSTALLED/Contents/Resources/GhostFTP.icns"
          plutil -lint "$INSTALLED/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INSTALLED/Contents/Info.plist")" = "com.brendigo.ghostftp.macos"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALLED/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$INSTALLED"
          cmp "dist/macos/Ghost FTP.app/Contents/MacOS/GhostFTP" "$INSTALLED/Contents/MacOS/GhostFTP"
          echo "macOS ZIP extraction, signature, version, binary identity and app bundle installation verified."
          # Mac GitHub runners may not provide an authenticated GUI session.
          # This step does not claim an installed GUI launch or notarization.

      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-macOS-Preview
          path: |
            dist/macos/GhostFTP-macOS-*-Preview.zip
            dist/macos/GhostFTP-macOS-SHA256SUMS.txt
          if-no-files-found: error
