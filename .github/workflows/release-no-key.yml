name: Publish Ghost FTP No-Key Distribution

on:
  push:
    branches:
      - 'release/ghostftp-v0.0.8-no-key'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostftp-release-no-key
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: No-key release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate exact no-key release source
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -print))"
          go test -race ./...
          go vet ./...
          python scripts/generate_brand_assets.py --check
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_docs.py
          python scripts/audit_release.py
          python scripts/test_release_no_key_contract.py
          python -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Windows unsigned universal Setup and Portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Build no-key Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go telemetry off
          if ((go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
          .\BUILD-WINDOWS.ps1
          $v = (Get-Content VERSION -Raw).Trim()
          foreach ($kind in @('Setup','Portable')) {
            $path = "dist\Ghost-FTP-$v-$kind.exe"
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing Windows artifact: $path" }
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.SignerCertificate) { throw "No-key Windows artifact unexpectedly has an Authenticode signer: $path" }
          }
          Write-Host 'WINDOWS_AUTHENTICODE=unsigned-no-key-distribution'
      - name: Store Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-no-key-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Setup.exe
            dist/Ghost-FTP-*-Portable.exe

  portable:
    name: Linux Android and browser no-key bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      android_signer_sha256: ${{ steps.android-build.outputs.signer_sha256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Build Linux and browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          bash linux/BUILD-DISTROS.sh
          python scripts/build_browser_extensions.py
          version="$(tr -d '\r\n' < VERSION)"
          test "$(find dist -maxdepth 1 -type f -name 'Ghost-FTP-*-Linux-*' | wc -l | tr -d ' ')" = '6'
          for browser in Chrome Edge Firefox Opera; do test -s "dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip"; done
      - name: Build installable Android debug-signed APK
        id: android-build
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          (cd android && gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace)
          version="$(tr -d '\r\n' < VERSION)"
          source='android/app/build/outputs/apk/debug/app-debug.apk'
          target="dist/Ghost-FTP-${version}-Android.apk"
          test -s "$source"
          cp "$source" "$target"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$target" | tee "$RUNNER_TEMP/android-no-key-signature.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-no-key-signature.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]]
          echo "signer_sha256=$signer" >> "$GITHUB_OUTPUT"
          echo 'ANDROID_APK=debug-signed-no-secret'
      - name: Store Linux Android and browser artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-no-key-portable
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Linux-Debian-Installer.run
            dist/Ghost-FTP-*-Linux-Debian-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Ubuntu-Installer.run
            dist/Ghost-FTP-*-Linux-Ubuntu-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Fedora-Installer.run
            dist/Ghost-FTP-*-Linux-Fedora-Portable.tar.gz
            dist/Ghost-FTP-*-Android.apk
            dist/browser/Ghost-FTP-*-Chrome-Extension.zip
            dist/browser/Ghost-FTP-*-Edge-Extension.zip
            dist/browser/Ghost-FTP-*-Firefox-Extension.zip
            dist/browser/Ghost-FTP-*-Opera-Extension.zip

  macos:
    name: macOS universal ad-hoc validation app
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build ad-hoc signed universal app
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          bash macos/BUILD.sh
          version="$(tr -d '\r\n' < VERSION)"
          archive="macos/dist/Ghost-FTP-${version}-macOS.app.zip"
          test -s "$archive"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ditto -x -k "$archive" "$work"
          codesign --verify --deep --strict "$work/Ghost FTP.app"
          echo 'MACOS_SIGNING=adhoc-validation-no-notarization'
      - name: Store macOS validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-no-key-macos
          if-no-files-found: error
          retention-days: 7
          path: macos/dist/Ghost-FTP-*-macOS.app.zip

  publish:
    name: Publish verified no-key 0.0.8 release
    needs: [quality, windows, portable, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ANDROID_SIGNER_SHA256: ${{ needs.portable.outputs.android_signer_sha256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Windows
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-no-key-windows
          path: staging/windows
      - name: Download Linux Android and browser
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-no-key-portable
          path: staging/portable
      - name: Download macOS
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-no-key-macos
          path: staging/macos
      - name: Assemble exact 17-file release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$version" = '0.0.8'
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$main_sha" || { echo "No-key release source $GITHUB_SHA is not exact main $main_sha" >&2; exit 1; }
          tag="ghostftp-v${version}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then echo 'release already exists; refusing to rewrite published assets' >&2; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then echo 'tag already exists; refusing to move release identity' >&2; exit 1; fi
          mkdir -p release
          find staging -type f -print0 | while IFS= read -r -d '' file; do cp "$file" release/; done
          cat > release/BUILD-METADATA.txt <<EOF
          BRAND=Ghost FTP
          VERSION=${version}
          RELEASE_TAG=${tag}
          RELEASE_CHANNEL=current
          COMMIT=${GITHUB_SHA}
          DISTRIBUTION_MODE=no-secret-public-release
          WINDOWS_SETUP=universal-x86-x64-arm64
          WINDOWS_PORTABLE=universal-x86-x64-arm64
          WINDOWS_AUTHENTICODE=unsigned
          ANDROID_APK=debug-signed-no-secret
          ANDROID_SIGNER_SHA256=${ANDROID_SIGNER_SHA256}
          ANDROID_SFTP=hidden-until-strict-host-key-verification
          MACOS_APP=universal-arm64-x86_64
          MACOS_SIGNING=adhoc-validation
          MACOS_NOTARIZATION=not-performed
          LINUX_PAYLOADS=amd64,arm64,i386
          BROWSER_EXTENSION_PACKAGES=Chrome,Edge,Firefox,Opera
          PUBLIC_PLATFORM_ARTIFACTS=14
          PUBLIC_RELEASE_FILES=17
          EOF
          cat > release/RELEASE-NOTES.txt <<EOF
          Ghost FTP 0.0.8

          This is the requested no-secret distribution build from exact source ${GITHUB_SHA}.

          Trust/signing boundary:
          - Windows Setup and Portable are intentionally unsigned and may trigger Windows SmartScreen/Unknown Publisher warnings.
          - Android is an installable debug-signed APK built in CI without a protected publisher secret.
          - macOS is an ad-hoc signed universal validation app. It is not Developer ID signed or Apple notarized.
          - Linux and browser helper artifacts are verified by exact-source build and SHA-256 checksums.

          Security/privacy behavior is unchanged: no telemetry, no ads, strict FTPS verification, desktop SFTP host-key trust, and Android SFTP remains hidden until strict host-key verification is maintained.
          EOF
          (cd release && find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | xargs -r sha256sum > SHA256.txt)
          expected=$(cat <<EOF
          BUILD-METADATA.txt
          Ghost-FTP-${version}-Android.apk
          Ghost-FTP-${version}-Chrome-Extension.zip
          Ghost-FTP-${version}-Edge-Extension.zip
          Ghost-FTP-${version}-Firefox-Extension.zip
          Ghost-FTP-${version}-Linux-Debian-Installer.run
          Ghost-FTP-${version}-Linux-Debian-Portable.tar.gz
          Ghost-FTP-${version}-Linux-Fedora-Installer.run
          Ghost-FTP-${version}-Linux-Fedora-Portable.tar.gz
          Ghost-FTP-${version}-Linux-Ubuntu-Installer.run
          Ghost-FTP-${version}-Linux-Ubuntu-Portable.tar.gz
          Ghost-FTP-${version}-Opera-Extension.zip
          Ghost-FTP-${version}-Portable.exe
          Ghost-FTP-${version}-Setup.exe
          Ghost-FTP-${version}-macOS.app.zip
          RELEASE-NOTES.txt
          SHA256.txt
          EOF
          )
          actual="$(find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual" = "$expected" || { diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true; exit 1; }
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" = '17'
          (cd release && sha256sum -c SHA256.txt)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="ghostftp-v${version}"
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ghost FTP $version" --notes-file release/RELEASE-NOTES.txt
      - name: Verify remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="ghostftp-v${version}"
          json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<< "$json")" = 'false'
          test "$(jq -r .prerelease <<< "$json")" = 'false'
          test "$(jq '.assets | length' <<< "$json")" = '17'
          remote_names="$(jq -r '.assets[].name' <<< "$json" | LC_ALL=C sort)"
          local_names="$(find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$remote_names" = "$local_names"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          test "$tag_sha" = "$GITHUB_SHA"
          echo "NO_KEY_RELEASE_READBACK=PASS tag=$tag assets=17 sha=$GITHUB_SHA"
      - name: Store exact release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-no-key-release-0.0.8
          if-no-files-found: error
          retention-days: 30
          path: release/*
