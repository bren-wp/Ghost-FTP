name: Ghost FTP RC23 release

on:
  workflow_run:
    workflows: ["Ghost FTP native build RC23"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghostftp-rc23-release.yml'
      - '.github/scripts/publish-rc23.sh'

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-rc23-release
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate RC23 source and wait for gates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "2.1.1-rc.23"' ghostftp-desktop/package.json
          grep -q '"version": "2.1.1-rc.23"' ghostftp-desktop/package-lock.json
          grep -q '^version = "2.1.1-rc.23"$' ghostftp-desktop/src-tauri/Cargo.toml
          grep -q '^version = "2.1.1-rc.23"$' ghostftp-desktop/src-tauri/ghostftp-cli/Cargo.toml
          grep -q '^version = "2.1.1-rc.23"$' ghostftp-desktop/src-tauri/ghostftp-agent-proto/Cargo.toml
          grep -q '^version = "2.1.1-rc.23"$' ghostftp-desktop/src-tauri/ghostftp-agentd/Cargo.toml
          grep -q '"version": "2.1.1-rc.23"' ghostftp-desktop/src-tauri/tauri.conf.json
          grep -q 'PRODUCT_VERSION = "2.1.1-rc.23"' ghostftp-desktop/src/lib/release.ts
          grep -q 'VERSION = "2.1.1-rc.23"' android/app/src/main/java/com/ghostftp/android/ReleaseInfo.kt
          grep -q 'versionName = "2.1.1-rc.23"' android/app/build.gradle.kts
          grep -q '"version": "2.1.1-rc.23"' updates/channels/preview.template.json
          grep -q '"version": "2.1.1-rc.23"' updates/latest.template.json
          grep -q '"build": "2026.09.25.23"' updates/latest.template.json
          test -f docs/releases/2.1.1-rc.23.md
          test -f website/download/index.html
          test -f website/security/index.html
          test -f website/support/index.html

          wait_for_gate() {
            local workflow="$1"
            local label="$2"
            for attempt in $(seq 1 60); do
              state="$(gh run list --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json status,conclusion --jq '.[0] | ((.status // "") + ":" + (.conclusion // ""))' || true)"
              echo "$label for $SOURCE_SHA: ${state:-not-found}"
              if [ "$state" = "completed:success" ]; then
                return 0
              fi
              if [[ "$state" == completed:* ]] && [ "$state" != "completed:success" ]; then
                echo "$label did not pass."
                return 1
              fi
              sleep 20
            done
            echo "Timed out waiting for $label."
            return 1
          }

          wait_for_gate "Ghost FTP quality" "source audit"
          wait_for_gate "Ghost FTP protocol E2E" "FTP/FTPS/SFTP E2E"
          wait_for_gate "Ghost FTP Android" "Android APK build"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Package source, website and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC23-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC23-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-v2.1.1-RC23-Android-Source.zip android
          zip -qr dist/GhostFTP-v2.1.1-RC23-Website.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC23-Updates.zip updates
          zip -qr dist/GhostFTP-v2.1.1-RC23-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download native build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -print

      - name: Download Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_RUN_ID="$(gh run list --workflow "Ghost FTP Android" --commit "$SOURCE_SHA" --limit 10 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // ""')"
          test -n "$ANDROID_RUN_ID"
          mkdir -p dist/android
          gh run download "$ANDROID_RUN_ID" --name GhostFTP-Android-APK-RC23 -D dist/android
          find dist/android -type f -print

      - name: Normalize Windows, Linux and Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup*.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"
          ANDROID_APK="$(find dist/android -type f \( -name 'GhostFTP-Android-v2.1.1-RC23-ci.apk' -o -name '*RC23*.apk' -o -name '*.apk' \) | head -n1 || true)"

          test -n "$WIN_EXE"
          test -n "$WIN_SETUP"
          test -n "$LINUX_BIN"
          test -n "$APPIMAGE"
          test -n "$DEB"
          test -n "$RPM"
          test -n "$ANDROID_APK"

          cp "$WIN_EXE" dist/GhostFTP-Windows-x64-Portable-v2.1.1-RC23.exe
          cp "$WIN_SETUP" dist/GhostFTP-Windows-x64-Setup-v2.1.1-RC23.exe
          cp "$LINUX_BIN" dist/GhostFTP-Linux-x86_64-v2.1.1-RC23
          chmod +x dist/GhostFTP-Linux-x86_64-v2.1.1-RC23
          cp "$APPIMAGE" dist/GhostFTP-Linux-x86_64-v2.1.1-RC23.AppImage
          cp "$DEB" dist/GhostFTP-Linux-amd64-v2.1.1-RC23.deb
          cp "$RPM" dist/GhostFTP-Linux-x86_64-v2.1.1-RC23.rpm
          cp "$ANDROID_APK" dist/GhostFTP-Android-v2.1.1-RC23.apk

          QA_FILES="$(find dist/native -type f \( -iname '*.png' -o -iname '*.txt' \) | wc -l | tr -d ' ')"
          if [ "$QA_FILES" -gt 0 ]; then
            mkdir -p dist/qa-evidence
            find dist/native -type f \( -iname '*.png' -o -iname '*.txt' \) -exec cp {} dist/qa-evidence/ \;
            (cd dist/qa-evidence && zip -q ../GhostFTP-Windows-x64-v2.1.1-RC23-Native-QA.zip ./*)
            rm -rf dist/qa-evidence
          fi

          (cd dist && zip -q GhostFTP-Windows-x64-v2.1.1-RC23.zip GhostFTP-Windows-x64-Portable-v2.1.1-RC23.exe GhostFTP-Windows-x64-Setup-v2.1.1-RC23.exe)
          (cd dist && tar -czf GhostFTP-Linux-x86_64-v2.1.1-RC23.tar.gz GhostFTP-Linux-x86_64-v2.1.1-RC23 GhostFTP-Linux-x86_64-v2.1.1-RC23.AppImage GhostFTP-Linux-amd64-v2.1.1-RC23.deb GhostFTP-Linux-x86_64-v2.1.1-RC23.rpm)
          rm -rf dist/native dist/android

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name 'GhostFTP-v2.1.1-RC23-SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum) > dist/GhostFTP-v2.1.1-RC23-SHA256SUMS.txt

      - name: Publish RC23 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-rc23.sh "${SOURCE_SHA:-$(git rev-parse HEAD)}"

  repair-metadata:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Repair and verify RC23 prerelease metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-rc23.sh --repair-metadata
