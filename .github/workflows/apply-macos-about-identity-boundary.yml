name: Apply macOS About identity boundary

on:
  push:
    branches:
      - feature/macos-application-parity
    paths:
      - .github/workflows/apply-macos-about-identity-boundary.yml

permissions:
  contents: write

concurrency:
  group: apply-macos-about-identity-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-application-parity
          fetch-depth: 0

      - name: Apply guarded About-only identity boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: guarded anchor count={text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          about = Path("macos/Bridge/about_identity.go")
          if about.exists():
              raise SystemExit("macOS About identity source already exists")
          about.write_text("package main\n\n// Author identity is intentionally isolated to the About surface. Public\n// product branding elsewhere remains Ghost FTP.\nconst (\n\tmacAboutPublisher     = \"BRENDIGO LTD\"\n\tmacAboutWebsite       = \"ghostftp.com\"\n\tmacAboutAuthorWebsite = \"brendigo.com\"\n\tmacAboutSupport       = \"brendigo.com/kontakt\"\n)\n", encoding="utf-8")

          old = "//export GhostFTPAboutPublisher\nfunc GhostFTPAboutPublisher() *C.char { return C.CString(\"BRENDIGO LTD\") }\n\n//export GhostFTPAboutWebsite\nfunc GhostFTPAboutWebsite() *C.char { return C.CString(\"ghostftp.com\") }\n\n//export GhostFTPAboutAuthorWebsite\nfunc GhostFTPAboutAuthorWebsite() *C.char { return C.CString(\"brendigo.com\") }\n\n//export GhostFTPAboutSupport\nfunc GhostFTPAboutSupport() *C.char { return C.CString(\"brendigo.com/kontakt\") }\n"
          new = "//export GhostFTPAboutPublisher\nfunc GhostFTPAboutPublisher() *C.char { return C.CString(macAboutPublisher) }\n\n//export GhostFTPAboutWebsite\nfunc GhostFTPAboutWebsite() *C.char { return C.CString(macAboutWebsite) }\n\n//export GhostFTPAboutAuthorWebsite\nfunc GhostFTPAboutAuthorWebsite() *C.char { return C.CString(macAboutAuthorWebsite) }\n\n//export GhostFTPAboutSupport\nfunc GhostFTPAboutSupport() *C.char { return C.CString(macAboutSupport) }\n"
          replace_once("macos/Bridge/application.go", old, new)

          old = "About is the only Mac application surface that exposes the publisher/author identity (`BRENDIGO LTD`, `brendigo.com`). Product version remains bound to root `VERSION` by the native build, while product/support identity remains explicit."
          new = "About is the only Mac application surface that exposes publisher/author identity, sourced from the dedicated macOS About-only metadata file. Product version remains bound to root `VERSION` by the native build, while product/support identity remains explicit."
          replace_once("macos/PARITY.md", old, new)

          old = "            \"GhostFTPAboutPublisher\",\n            '\"BRENDIGO LTD\"',\n"
          new = "            \"GhostFTPAboutPublisher\",\n            \"macAboutPublisher\",\n"
          replace_once("scripts/test_macos_application_parity_contract.py", old, new)

          old = "        for forbidden in (\"json.Marshal\", \"json.Unmarshal\", \"PasswordBlob\", \"PassphraseBlob\"):\n            self.assertNotIn(forbidden, bridge)\n"
          new = old + "\n        about_identity = read(\"macos/Bridge/about_identity.go\")\n        for marker in (\"macAboutPublisher\", \"macAboutWebsite\", \"macAboutAuthorWebsite\", \"macAboutSupport\"):\n            self.assertIn(marker, about_identity)\n"
          replace_once("scripts/test_macos_application_parity_contract.py", old, new)

          old = "    \"internal/desktop/about_identity_windows.go\",\n"
          new = old + "    \"macos/Bridge/about_identity.go\",\n"
          replace_once("scripts/audit_brand_hardcut.py", old, new)

          old = "    if violations:\n        fail(\"branding contract violation: \" + \", \".join(violations))\n"
          new = "    mac_about = ROOT / \"macos\" / \"Bridge\" / \"about_identity.go\"\n    if not mac_about.is_file():\n        violations.append(\"missing-macos-about-identity-source\")\n    else:\n        mac_about_text = mac_about.read_text(encoding=\"utf-8\")\n        for marker in (\n            'macAboutPublisher     = \"BRENDIGO LTD\"',\n            'macAboutAuthorWebsite = \"brendigo.com\"',\n            'macAboutSupport       = \"brendigo.com/kontakt\"',\n        ):\n            if marker not in mac_about_text:\n                violations.append(\"macos-about-identity-contract:\" + marker)\n\n" + old
          replace_once("scripts/audit_brand_hardcut.py", old, new)
          PY

      - name: Validate future production tree
        run: |
          gofmt -w macos/Bridge/about_identity.go macos/Bridge/application.go
          rm .github/workflows/apply-macos-about-identity-boundary.yml
          python3 scripts/audit_brand_hardcut.py
          python3 scripts/test_macos_application_parity_contract.py
          python3 scripts/test_macos_windows_parity_contract.py
          go test ./macos/Bridge
          git diff --check

      - name: Commit production changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: isolate macOS author identity to About'
          git push origin HEAD:feature/macos-application-parity
