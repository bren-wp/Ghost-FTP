name: Privremeno primijeni runtime credential rewrite

on:
  push:
    branches:
      - agent/byftp-2.16.0-connect-reliability
    paths:
      - '.github/workflows/apply-runtime-secrets.yml'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/byftp-2.16.0-connect-reliability
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Primijeni strogo ograničene zamjene
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: očekivano {count} pojavljivanja, pronađeno {found}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('internal/remote/curl_ftp.go', 'passwordBlob, err = security.ProtectString(password)', 'passwordBlob, err = security.ProtectRuntimeString(password)')
          replace_exact('internal/remote/curl_ftp.go', 'password, err := security.UnprotectBytes(c.passwordBlob)', 'password, err := security.UnprotectRuntimeBytes(c.passwordBlob)')
          replace_exact('internal/remote/curl_ftp.go', 'func (c *CurlFTP) Close() error {\n\tc.passwordBlob = ""', 'func (c *CurlFTP) Close() error {\n\tsecurity.ForgetRuntimeSecret(c.passwordBlob)\n\tc.passwordBlob = ""')

          replace_exact('internal/remote/sftp.go', 'passwordBlob, err = security.ProtectString(password)', 'passwordBlob, err = security.ProtectRuntimeString(password)')
          replace_exact('internal/remote/sftp.go', 'passphraseBlob, err = security.ProtectString(passphrase)', 'passphraseBlob, err = security.ProtectRuntimeString(passphrase)')
          replace_exact('internal/remote/sftp.go', '// Drop active references to connection metadata/protected credentials once\n\t// the session is closed.', 'security.ForgetRuntimeSecret(s.passwordBlob)\n\tsecurity.ForgetRuntimeSecret(s.passphraseBlob)\n\t// Drop active references to connection metadata/protected credentials once\n\t// the session is closed.')
      - name: Formatiraj i provjeri
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/remote/curl_ftp.go internal/remote/sftp.go internal/security/runtime_secret_*.go
          go test ./...
          go vet ./...
      - name: Spremi rezultat
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ByFTP CI'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/remote/curl_ftp.go internal/remote/sftp.go internal/security/runtime_secret_*.go
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nema promjena.'
            exit 0
          fi
          git commit -m 'Uskladi aktivne vjerodajnice s cross-platform runtime spremištem'
          git push origin HEAD:agent/byftp-2.16.0-connect-reliability
