name: Remove superseded RC7 release

on:
  push:
    branches: [main]
    paths:
      - '.release/REMOVE-RC7'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded RC7 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.1.1-rc.7 >/dev/null 2>&1; then
            gh release delete v2.1.1-rc.7 --cleanup-tag -y
          fi
