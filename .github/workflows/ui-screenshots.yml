# Authentic cross-platform runtime screenshot evidence for Ghost FTP.
name: Ghost FTP Authentic Cross-Platform UI Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'BUILD-WINDOWS.ps1'
      - 'BUILD-WINDOWS-ARCH-STAGE.ps1'
      - 'cmd/ghostftp/**'
      - 'internal/desktop/**'
      - 'internal/i18n/**'
      - 'internal/platform/**'
      - 'linux/**'
      - 'android/**'
      - 'scripts/capture_windows_screenshots.ps1'
      - 'scripts/capture_linux_screenshots.sh'
      - 'scripts/capture_android_screenshots.sh'
      - 'scripts/assemble_ui_evidence.py'
      - 'docs/UI-SCREENSHOT-REQUEST'
      - '.github/workflows/ui-screenshots.yml'
  push:
    branches:
      - main
      - 'hardening/**'
      - 'release-prep/**'
      - 'work/**'
      - 'release/**'
      - 'packaging/**'
    paths:
      - 'VERSION'
      - 'BUILD-WINDOWS.ps1'
      - 'BUILD-WINDOWS-ARCH-STAGE.ps1'
      - 'cmd/ghostftp/**'
      - 'internal/desktop/**'
      - 'internal/i18n/**'
      - 'internal/platform/**'
      - 'linux/**'
      - 'android/**'
      - 'scripts/capture_windows_screenshots.ps1'
      - 'scripts/capture_linux_screenshots.sh'
      - 'scripts/capture_android_screenshots.sh'
      - 'scripts/assemble_ui_evidence.py'
      - 'docs/UI-SCREENSHOT-REQUEST'
      - '.github/workflows/ui-screenshots.yml'

# Runtime evidence must never mutate a PR branch. Keeping this workflow read-only
# makes the tested SHA stable and lets required checks apply to the exact head.
permissions:
  contents: read

concurrency:
  group: ghostftp-authentic-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  UI_WINDOWS_MAIN: docs/images/ghost-ftp-main-workspace.png
  UI_WINDOWS_SITE_MANAGER: docs/images/ghost-ftp-site-manager.png
  UI_WINDOWS_SETTINGS: docs/images/ghost-ftp-settings.png
  UI_WINDOWS_ABOUT: docs/images/ghost-ftp-about.png

jobs:
  windows:
    name: Authentic Windows runtime surfaces
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Disable Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') {
            throw 'Go telemetry is not disabled.'
          }

      - name: Build production Windows packages
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1

      - name: Capture authentic main, Site Manager, Bookmarks, Settings and About windows
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = "dist\internal\Ghost-FTP-$version-Portable-x64.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Missing verified native production executable: $exe"
          }
          .\scripts\capture_windows_screenshots.ps1 -Executable $exe -OutputDirectory "ui-screenshots\windows"

      - name: Verify screenshot outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $expected = @(
            'Ghost-FTP-main-workspace.png',
            'Ghost-FTP-site-manager.png',
            'Ghost-FTP-bookmarks.png',
            'Ghost-FTP-settings.png',
            'Ghost-FTP-about.png'
          )
          foreach ($name in $expected) {
            $path = Join-Path 'ui-screenshots\windows' $name
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing Windows screenshot: $path" }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt 2048) { throw "Windows screenshot is implausibly small: $path" }
            $bitmap = New-Object System.Drawing.Bitmap $file.FullName
            try {
              if ($bitmap.Width -lt 320 -or $bitmap.Height -lt 200) { throw "Invalid Windows screenshot dimensions: $path" }
              $colors = New-Object 'System.Collections.Generic.HashSet[int]'
              for ($sx = 0; $sx -lt 32; $sx++) {
                $x = [Math]::Min($bitmap.Width - 1, [int](($sx + 0.5) * $bitmap.Width / 32))
                for ($sy = 0; $sy -lt 24; $sy++) {
                  $y = [Math]::Min($bitmap.Height - 1, [int](($sy + 0.5) * $bitmap.Height / 24))
                  [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
                }
              }
              if ($colors.Count -lt 8) { throw "Windows screenshot appears blank: $path" }
              Write-Host "WINDOWS_UI=$name SHA256=$((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
            finally { $bitmap.Dispose() }
          }

      - name: Publish authentic Windows UI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-authentic-ui-windows
          if-no-files-found: error
          retention-days: 30
          path: ui-screenshots/windows/*.png

  linux:
    name: Authentic Linux runtime surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install native capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick

      - name: Build production Linux portable packages
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          bash linux/BUILD.sh

      - name: Capture and verify real Linux X11 UI
        shell: bash
        run: bash scripts/capture_linux_screenshots.sh ui-screenshots/linux

      - name: Publish authentic Linux UI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-authentic-ui-linux
          if-no-files-found: error
          retention-days: 30
          path: ui-screenshots/linux/*.png

  android:
    name: Authentic Android emulator surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Install Android capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Build exact-source Android APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintDebug :app:packageGhostFtpApk --no-daemon --stacktrace
          test -s dist/Ghost-FTP-Android.apk

      - name: Capture and verify real Android emulator UI
        shell: bash
        run: bash scripts/capture_android_screenshots.sh android/dist/Ghost-FTP-Android.apk ui-screenshots/android

      - name: Publish authentic Android UI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-authentic-ui-android
          if-no-files-found: error
          retention-days: 30
          path: ui-screenshots/android/*.png

  evidence:
    name: Verify exact-head cross-platform evidence bundle
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Confirm exact tested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA" || {
            echo "Evidence checkout mismatch: expected $SOURCE_SHA, got $actual_sha" >&2
            exit 1
          }
          echo "AUTHENTIC_UI_SOURCE_SHA=$actual_sha"

      - name: Download Windows evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-authentic-ui-windows
          path: staging/windows

      - name: Download Linux evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-authentic-ui-linux
          path: staging/linux

      - name: Download Android evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-authentic-ui-android
          path: staging/android

      - name: Assemble and verify immutable evidence bundle
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/assemble_ui_evidence.py \
            --staging staging \
            --output verified-evidence/images \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path('verified-evidence/UI-SCREENSHOT-PROVENANCE.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_sha = os.environ['SOURCE_SHA'].lower()
          if manifest.get('capture_source_sha') != expected_sha:
              raise SystemExit('evidence manifest source SHA mismatch')
          images = manifest.get('images')
          if not isinstance(images, list) or len(images) != 15:
              raise SystemExit('evidence manifest does not contain exactly 15 verified images')
          for item in images:
              path = Path(item['path'])
              if not path.is_file() or path.stat().st_size != item['bytes']:
                  raise SystemExit(f'evidence file mismatch: {path}')
          print(f'AUTHENTIC_UI_EVIDENCE=VERIFIED SOURCE_SHA={expected_sha} IMAGES={len(images)}')
          PY

      - name: Publish immutable verified evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-authentic-ui-verified-bundle
          if-no-files-found: error
          retention-days: 30
          path: verified-evidence/
