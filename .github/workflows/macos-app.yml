name: Ghost FTP macOS Development App

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'build/icon.png'
      - 'macos/**'
      - 'internal/api/**'
      - 'internal/model/**'
      - 'internal/platform/**'
      - 'internal/remote/**'
      - 'internal/security/**'
      - 'scripts/audit_platform_contract.py'
      - 'scripts/audit_desktop_surface.py'
      - 'scripts/audit_version.py'
      - 'scripts/test_macos_windows_parity_contract.py'
      - 'scripts/test_macos_engine_bridge_contract.py'
      - 'scripts/test_macos_application_parity_contract.py'
      - 'scripts/test_macos_distribution_contract.py'
      - '.github/workflows/macos-app.yml'
      - '.github/workflows/macos-production.yml'
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    paths:
      - 'VERSION'
      - 'build/icon.png'
      - 'macos/**'
      - 'internal/api/**'
      - 'internal/model/**'
      - 'internal/platform/**'
      - 'internal/remote/**'
      - 'internal/security/**'
      - 'scripts/audit_platform_contract.py'
      - 'scripts/audit_desktop_surface.py'
      - 'scripts/audit_version.py'
      - 'scripts/test_macos_windows_parity_contract.py'
      - 'scripts/test_macos_engine_bridge_contract.py'
      - 'scripts/test_macos_application_parity_contract.py'
      - 'scripts/test_macos_distribution_contract.py'
      - '.github/workflows/macos-app.yml'
      - '.github/workflows/macos-production.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-macos-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal native macOS development app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm exact tested SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "MACOS_SOURCE_SHA=$SOURCE_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Verify toolchains and disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          go version
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path

      - name: Validate macOS engine parity and distribution contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_macos_windows_parity_contract.py
          python3 scripts/test_macos_engine_bridge_contract.py
          python3 scripts/test_macos_application_parity_contract.py
          python3 scripts/test_macos_distribution_contract.py
          python3 scripts/audit_platform_contract.py
          python3 scripts/audit_desktop_surface.py
          python3 scripts/audit_version.py
          bash -n macos/BUILD.sh
          bash -n macos/SIGN_AND_NOTARIZE.sh

      - name: Build universal native macOS app and shared engine
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: bash macos/BUILD.sh

      - name: Verify app, shared engine and AskPass helper
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="macos/dist/Ghost-FTP-${version}-macOS.app.zip"
          test -s "$archive"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ditto -x -k "$archive" "$work"
          app="$work/Ghost FTP.app"
          executable="$app/Contents/MacOS/GhostFTP"
          askpass="$app/Contents/MacOS/GhostFTPAskPass"
          engine="$app/Contents/Frameworks/libGhostFTPEngine.dylib"
          plist="$app/Contents/Info.plist"
          icon="$app/Contents/Resources/GhostFTP.icns"
          for file in "$executable" "$askpass" "$engine" "$plist" "$icon"; do test -s "$file"; done
          test -x "$executable"
          test -x "$askpass"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = 'app.ghostftp.client'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          for binary in "$executable" "$askpass" "$engine"; do
            archs="$(xcrun lipo -archs "$binary")"
            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          done
          otool -D "$engine" | grep -F '@rpath/libGhostFTPEngine.dylib'
          otool -L "$executable" | grep -F '@rpath/libGhostFTPEngine.dylib'
          codesign --verify --deep --strict "$app"
          echo "MACOS_APP_ENGINE_BRIDGE=PASS"
          echo "MACOS_APP_SIGNING=adhoc-development"

      - name: Store macOS development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-macos-development
          if-no-files-found: error
          retention-days: 14
          path: macos/dist/Ghost-FTP-*-macOS.app.zip
