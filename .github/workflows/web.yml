name: Ghost FTP Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/check_web_contract.py'
      - 'scripts/test_web_contract.py'
      - 'scripts/audit_*'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main, 'web/**']
    paths:
      - 'web/**'
      - 'scripts/check_web_contract.py'
      - 'scripts/test_web_contract.py'
      - 'scripts/audit_*'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: ghostftp-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web site and Web FTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Verify runtimes
        shell: bash
        run: |
          set -euo pipefail
          php --version
          node --version
      - name: Web contract and PHP lint
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_web_contract.py
          python -m unittest scripts.test_web_contract -v
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check web/assets/js/site.js
          node --check web/ftp/assets/app.js
      - name: Reject inline page scripts and styles
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '<style|<script([^>]*$|[^>]*[^s]rc=)' web --include='*.html'; then
            echo 'Inline CSS/JS is not allowed in maintained HTML pages.' >&2
            exit 1
          fi
