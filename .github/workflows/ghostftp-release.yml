name: Ghost FTP RC9 release

on:
  workflow_run:
    workflows: ["Ghost FTP native build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-rc9-release
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate build/source relationship and wait for current audit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"

          # Native binaries must match the production source. Documentation and
          # release-workflow-only commits may advance main without forcing an
          # expensive rebuild.
          changed="$(git diff --name-only "$BUILD_SHA" "$MAIN_SHA" || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|website/|README\.md$|CHANGELOG\.md$|SECURITY\.md$|LICENSE\.txt$|EULA\.txt$|\.github/workflows/.*\.yml$)' || true)"
            if [ -n "$forbidden" ]; then
              echo "Production source changed after the native build:"
              echo "$forbidden"
              exit 1
            fi
          fi

          git checkout --detach "$MAIN_SHA"
          grep -q '"version": "2.1.1-rc.9"' ghostftp-desktop/package.json
          grep -q '"version": "2.1.1-rc.9"' ghostftp-desktop/src-tauri/tauri.conf.json

          for attempt in $(seq 1 45); do
            audit="$(gh run list --workflow 'Ghost FTP source audit' --commit "$MAIN_SHA" --limit 1 --json status,conclusion --jq '.[0] | ((.status // "") + ":" + (.conclusion // ""))' || true)"
            echo "source audit for $MAIN_SHA: ${audit:-not-found}"
            if [ "$audit" = "completed:success" ]; then
              echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
              break
            fi
            if [[ "$audit" == completed:* ]] && [ "$audit" != "completed:success" ]; then
              echo "Source audit did not pass."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "Timed out waiting for source audit."
              exit 1
            fi
            sleep 20
          done

      - name: Package source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native

          git archive --format=zip --output=dist/GhostFTP-v2.1.1-RC9-Source.zip HEAD
          zip -qr dist/GhostFTP-v2.1.1-RC9-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-v2.1.1-RC9-Web.zip website
          zip -qr dist/GhostFTP-v2.1.1-RC9-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download successful native build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -print

      - name: Normalize platform artifact names
        shell: bash
        run: |
          set -euo pipefail

          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"

          test -n "$WIN_EXE"
          test -n "$WIN_SETUP"
          test -n "$LINUX_BIN"
          test -n "$APPIMAGE"
          test -n "$DEB"
          test -n "$RPM"

          cp "$WIN_EXE" dist/GhostFTP-Windows-x64-Portable-v2.1.1-RC9.exe
          cp "$WIN_SETUP" dist/GhostFTP-Windows-x64-Setup-v2.1.1-RC9.exe
          cp "$LINUX_BIN" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9
          chmod +x dist/GhostFTP-Linux-x86_64-v2.1.1-RC9
          cp "$APPIMAGE" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9.AppImage
          cp "$DEB" dist/GhostFTP-Linux-amd64-v2.1.1-RC9.deb
          cp "$RPM" dist/GhostFTP-Linux-x86_64-v2.1.1-RC9.rpm

          (
            cd dist
            zip -q GhostFTP-Windows-x64-v2.1.1-RC9.zip               GhostFTP-Windows-x64-Portable-v2.1.1-RC9.exe               GhostFTP-Windows-x64-Setup-v2.1.1-RC9.exe
            tar -czf GhostFTP-Linux-x86_64-v2.1.1-RC9.tar.gz               GhostFTP-Linux-x86_64-v2.1.1-RC9               GhostFTP-Linux-x86_64-v2.1.1-RC9.AppImage               GhostFTP-Linux-amd64-v2.1.1-RC9.deb               GhostFTP-Linux-x86_64-v2.1.1-RC9.rpm
          )

          rm -rf dist/native

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'GhostFTP-v2.1.1-RC9-SHA256SUMS.txt' -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum
          ) > dist/GhostFTP-v2.1.1-RC9-SHA256SUMS.txt

      - name: Publish RC9 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-rc.9"
          MAIN_SHA="${MAIN_SHA:-$(git rev-parse HEAD)}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" -y || true
            done
            gh release edit "$TAG"               --target "$MAIN_SHA"               --title "Ghost FTP 2.1.1 RC9"               --notes-file docs/releases/2.1.1-rc.9.md               --prerelease
          else
            gh release create "$TAG"               --target "$MAIN_SHA"               --title "Ghost FTP 2.1.1 RC9 — Native"               --notes-file docs/releases/2.1.1-rc.9.md               --prerelease
          fi

          gh release upload "$TAG" dist/* --clobber
