name: Ghost FTP release

on:
  workflow_run:
    workflows: ["Ghost FTP native build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-release
  cancel-in-progress: true

jobs:
  select-trigger:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    outputs:
      should_publish: ${{ steps.latest.outputs.should_publish }}
    steps:
      - id: latest
        name: Accept only the newest native-build run for this source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_ID="$(gh run list --workflow ghostftp-build.yml --commit "$SOURCE_SHA" --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // ""')"
          test -n "$LATEST_ID"
          if [ "$LATEST_ID" = "$TRIGGER_RUN_ID" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale trigger $TRIGGER_RUN_ID; latest run is $LATEST_ID"
          fi

  publish:
    needs: select-trigger
    if: ${{ needs.select-trigger.outputs.should_publish == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate source and wait for release gates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CURRENT_MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo "Refusing stale release source $SOURCE_SHA; current main is $CURRENT_MAIN_SHA." >&2
            exit 1
          fi
          node .github/scripts/sync-version.mjs --check
          VERSION="$(node -p 'require("./version.json").version')"
          RELEASE_CHANNEL="$(node -p 'require("./version.json").channel || ""')"
          test -f "docs/releases/$VERSION.md"
          case "$RELEASE_CHANNEL" in
            preview|stable) ;;
            *)
              echo "::error::version.json must declare an explicit supported release channel (preview or stable); found '${RELEASE_CHANNEL:-missing}'."
              exit 1
              ;;
          esac

          wait_for_gate() {
            local workflow="$1"
            local label="$2"
            local state run_url
            for attempt in $(seq 1 270); do
              state="$(gh run list --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json status,conclusion --jq '.[0] | ((.status // "") + ":" + (.conclusion // ""))' || true)"
              run_url="$(gh run list --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json url --jq '.[0].url // ""' || true)"
              echo "$label for $SOURCE_SHA: ${state:-not-found} ${run_url:+($run_url)}"
              if [ "$state" = "completed:success" ]; then return 0; fi
              if [[ "$state" == completed:* ]] && [ "$state" != "completed:success" ]; then
                echo "::error::$label failed for release source $SOURCE_SHA: $state ${run_url:+$run_url}"
                return 1
              fi
              sleep 20
            done
            echo "::error::Timed out after 90 minutes waiting for $label on release source $SOURCE_SHA."
            return 1
          }

          wait_for_gate "ghostftp-quality.yml" "source audit"
          wait_for_gate "ghostftp-protocol-e2e.yml" "FTP/FTPS/SFTP E2E"
          wait_for_gate "ghostftp-android.yml" "Android"
          wait_for_gate "validate-win-hardening.yml" "Windows hardening"
          wait_for_gate "ghostftp-macos.yml" "macOS preview"

          # A merged source version is not necessarily a published release.
          # Verify the actual latest canonical public release instead of waiting
          # for a tag which does not exist (0.30.11/0.30.12 were not published).
          PREVIOUS_PUBLISHED_VERSION="$(node -p 'const v = require("./version.json"); v.previousPublishedVersion || v.previousVersion || ""')"
          if [ -n "$PREVIOUS_PUBLISHED_VERSION" ]; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              EXISTING_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.sha')"
              if [ "$EXISTING_TAG_SHA" != "$SOURCE_SHA" ]; then
                echo "::error::Existing release tag v$VERSION points at a different source SHA." >&2
                exit 1
              fi
              echo "The exact-source v$VERSION release already exists; validating its artifacts again."
            else
              LATEST_PUBLISHED_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
              if [ "$LATEST_PUBLISHED_TAG" != "v$PREVIOUS_PUBLISHED_VERSION" ]; then
                echo "::error::Release lineage mismatch: expected latest public v$PREVIOUS_PUBLISHED_VERSION, found $LATEST_PUBLISHED_TAG." >&2
                exit 1
              fi
              echo "Verified published predecessor: $LATEST_PUBLISHED_TAG"
            fi
          fi

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$RELEASE_CHANNEL" >> "$GITHUB_ENV"

      - name: Package source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          git archive --format=zip --output="dist/GhostFTP-v$VERSION-Source.zip" HEAD
          zip -qr "dist/GhostFTP-v$VERSION-Desktop-Source.zip" ghostftp-desktop
          zip -qr "dist/GhostFTP-v$VERSION-Android-Source.zip" android
          zip -qr "dist/GhostFTP-v$VERSION-macOS-Source.zip" macos
          zip -qr "dist/GhostFTP-v$VERSION-Updates.zip" updates
          zip -qr "dist/GhostFTP-v$VERSION-Documentation.zip" docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download native build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -print

      - name: Download verified Android APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "ghostftp-android.yml" --commit "$SOURCE_SHA" --limit 10 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // ""')"
          test -n "$RUN_ID"
          mkdir -p dist/android
          gh run download "$RUN_ID" --name GhostFTP-Android-APK -D dist/android
          find dist/android -type f -print
          UNSIGNED_ANDROID_APK="$(find dist/android -type f -iname '*Release-Unsigned.apk.unsigned' | head -n1 || true)"
          PREVIEW_ANDROID_APK="$(find dist/android -type f -iname '*Installable-Preview.apk' | head -n1 || true)"
          test -n "$UNSIGNED_ANDROID_APK"; test -s "$UNSIGNED_ANDROID_APK"
          test -n "$PREVIEW_ANDROID_APK"; test -s "$PREVIEW_ANDROID_APK"
          echo "::notice::Android production package is intentionally unsigned; installable preview evidence is retained separately."

      - name: Download verified macOS preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "ghostftp-macos.yml" --commit "$SOURCE_SHA" --limit 10 --json databaseId,status,conclusion --jq 'map(select(.status == "completed" and .conclusion == "success")) | .[0].databaseId // ""')"
          test -n "$RUN_ID"
          mkdir -p dist/macos
          gh run download "$RUN_ID" --name GhostFTP-macOS-Preview -D dist/macos
          MACOS_PREVIEW="$(find dist/macos -type f -name "GhostFTP-macOS-v$VERSION-Preview.zip" | head -n1 || true)"
          test -n "$MACOS_PREVIEW"; test -s "$MACOS_PREVIEW"
          echo "::notice::macOS artifact is an ad-hoc-signed development Preview, not a Developer ID/notarized production package."

      - name: Normalize release artifacts
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup*.exe' ! -iname '*.sig' | head -n1 || true)"
          WIN_MSI="$(find dist/native -type f -iname '*.msi' | head -n1 || true)"
          WIN_SETUP_SIG="$(find dist/native -type f -iname '*setup*.exe.sig' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' ! -iname '*.sig' | head -n1 || true)"
          APPIMAGE_SIG="$(find dist/native -type f -iname '*.AppImage.sig' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"
          ANDROID_UNSIGNED_APK="$(find dist/android -type f -iname '*Release-Unsigned.apk.unsigned' | head -n1 || true)"
          ANDROID_PREVIEW_APK="$(find dist/android -type f -iname '*Installable-Preview.apk' | head -n1 || true)"
          MACOS_PREVIEW="$(find dist/macos -type f -name "GhostFTP-macOS-v$VERSION-Preview.zip" | head -n1 || true)"

          test -n "$WIN_EXE"; test -n "$WIN_SETUP"; test -n "$WIN_MSI"; test -n "$LINUX_BIN"
          test -n "$APPIMAGE"; test -n "$DEB"; test -n "$RPM"
          test -n "$ANDROID_UNSIGNED_APK"; test -n "$ANDROID_PREVIEW_APK"
          test -n "$MACOS_PREVIEW"; test -s "$MACOS_PREVIEW"
          if [ -n "$WIN_SETUP_SIG" ] || [ -n "$APPIMAGE_SIG" ]; then
            test -n "$WIN_SETUP_SIG"
            test -n "$APPIMAGE_SIG"
            echo "Signed desktop updater artifacts detected; update-service assets will be generated."
          else
            echo "::notice::No desktop updater signatures detected; publishing verified release packages without an in-app update bundle."
          fi

          cp "$WIN_EXE" "dist/GhostFTP-Windows-x64-Portable-v$VERSION.exe"
          cp "$WIN_SETUP" "dist/GhostFTP-Windows-x64-Setup-v$VERSION.exe"
          cp "$WIN_MSI" "dist/GhostFTP-Windows-x64-Setup-v$VERSION.msi"
          if [ -n "$WIN_SETUP_SIG" ]; then
            cp "$WIN_SETUP_SIG" "dist/GhostFTP-Windows-x64-Setup-v$VERSION.exe.sig"
          fi
          cp "$LINUX_BIN" "dist/GhostFTP-Linux-x86_64-v$VERSION"
          chmod +x "dist/GhostFTP-Linux-x86_64-v$VERSION"
          cp "$APPIMAGE" "dist/GhostFTP-Linux-x86_64-v$VERSION.AppImage"
          if [ -n "$APPIMAGE_SIG" ]; then
            cp "$APPIMAGE_SIG" "dist/GhostFTP-Linux-x86_64-v$VERSION.AppImage.sig"
          fi
          cp "$DEB" "dist/GhostFTP-Linux-amd64-v$VERSION.deb"
          cp "$RPM" "dist/GhostFTP-Linux-x86_64-v$VERSION.rpm"
          cp "$ANDROID_UNSIGNED_APK" "dist/GhostFTP-Android-v$VERSION.apk.unsigned"
          cp "$ANDROID_PREVIEW_APK" "dist/GhostFTP-Android-v$VERSION-Installable-Preview.apk"
          cp "$MACOS_PREVIEW" "dist/GhostFTP-macOS-v$VERSION-Preview.zip"

          QA_DIR="$(find dist/native -type d -name 'GhostFTP-Windows-x64-Preview-QA' | head -n1 || true)"
          test -n "$QA_DIR"
          QA_PNG_COUNT="$(find "$QA_DIR" -type f -iname '*.png' | wc -l | tr -d ' ')"
          QA_TXT_COUNT="$(find "$QA_DIR" -type f -iname '*.txt' | wc -l | tr -d ' ')"
          test "$QA_PNG_COUNT" -ge 7
          test "$QA_TXT_COUNT" -ge 7
          (
            cd "$QA_DIR"
            zip -q "$GITHUB_WORKSPACE/dist/GhostFTP-Windows-x64-v$VERSION-Native-QA.zip" ./*
          )

          (cd dist && zip -q "GhostFTP-Windows-x64-v$VERSION.zip" "GhostFTP-Windows-x64-Portable-v$VERSION.exe" "GhostFTP-Windows-x64-Setup-v$VERSION.exe" "GhostFTP-Windows-x64-Setup-v$VERSION.msi")
          (cd dist && tar -czf "GhostFTP-Linux-x86_64-v$VERSION.tar.gz" "GhostFTP-Linux-x86_64-v$VERSION" "GhostFTP-Linux-x86_64-v$VERSION.AppImage" "GhostFTP-Linux-amd64-v$VERSION.deb" "GhostFTP-Linux-x86_64-v$VERSION.rpm")
          rm -rf dist/native dist/android dist/macos

      - name: Build update-service deployment package
        if: ${{ hashFiles('dist/GhostFTP-Windows-x64-Setup-v*.exe.sig') != '' && hashFiles('dist/GhostFTP-Linux-x86_64-v*.AppImage.sig') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/update-service/updates
          PUB_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node updates/scripts/build-manifest.mjs \
            --version="$VERSION" \
            --notes="Ghost FTP $VERSION" \
            --pub-date="$PUB_DATE" \
            --windows-url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/GhostFTP-Windows-x64-Setup-v$VERSION.exe" \
            --windows-signature-file="dist/GhostFTP-Windows-x64-Setup-v$VERSION.exe.sig" \
            --linux-url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/GhostFTP-Linux-x86_64-v$VERSION.AppImage" \
            --linux-signature-file="dist/GhostFTP-Linux-x86_64-v$VERSION.AppImage.sig" \
            --out="dist/update-service/updates/latest.json"
          node updates/scripts/verify-manifest.mjs "dist/update-service/updates/latest.json" --expected-version="$VERSION"
          cp "dist/update-service/updates/latest.json" "dist/GhostFTP-v$VERSION-latest.json"
          (cd dist/update-service && zip -qr "../GhostFTP-v$VERSION-Update-Service.zip" updates)
          rm -rf dist/update-service

      - name: Verify optional signed updater publication
        shell: bash
        run: |
          set -euo pipefail
          updater_files=(
            "GhostFTP-Windows-x64-Setup-v$VERSION.exe.sig"
            "GhostFTP-Linux-x86_64-v$VERSION.AppImage.sig"
            "GhostFTP-v$VERSION-latest.json"
            "GhostFTP-v$VERSION-Update-Service.zip"
          )

          present=0
          for file in "${updater_files[@]}"; do
            if [ -s "dist/$file" ]; then
              present=$((present + 1))
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo "No signed updater bundle present; manual package release remains valid."
            exit 0
          fi

          if [ "$present" -ne "${#updater_files[@]}" ]; then
            echo "::error::Signed updater publication is incomplete; signatures, manifest and Update-Service package must be all present or all absent."
            exit 1
          fi

          node updates/scripts/verify-manifest.mjs             "dist/GhostFTP-v$VERSION-latest.json"             --expected-version="$VERSION"
          unzip -p "dist/GhostFTP-v$VERSION-Update-Service.zip" updates/latest.json             > "$RUNNER_TEMP/ghostftp-latest-from-package.json"
          cmp "$RUNNER_TEMP/ghostftp-latest-from-package.json"             "dist/GhostFTP-v$VERSION-latest.json"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name "GhostFTP-v$VERSION-SHA256SUMS.txt" -printf '%f\0' | sort -z | xargs -0 sha256sum) > "dist/GhostFTP-v$VERSION-SHA256SUMS.txt"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-release.sh "$SOURCE_SHA"
