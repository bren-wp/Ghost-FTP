name: Import verified Ghost FTP 0.0.6 UI evidence

on:
  push:
    branches:
      - docs/0.0.6-authentic-media
    paths:
      - .github/workflows/import-0.0.6-ui-media.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable verified screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10355808973'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghostftp-ui-artifact"
          curl --fail --location --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/ghostftp-ui-artifact.zip"
          unzip -q "$RUNNER_TEMP/ghostftp-ui-artifact.zip" -d "$RUNNER_TEMP/ghostftp-ui-artifact"

      - name: Verify provenance and import exact bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import os

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ghostftp-ui-artifact'
          provenance_path = root / 'UI-SCREENSHOT-PROVENANCE.json'
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))

          expected_sha = '9adace20030a300c39eb320a97482eb50dfdb9d8'
          expected_run = 34863585111
          expected_names = {
              'ghost-ftp-main-workspace.png',
              'ghost-ftp-site-manager.png',
              'ghost-ftp-bookmarks.png',
              'ghost-ftp-settings.png',
              'ghost-ftp-about.png',
              'ghost-ftp-linux-main-workspace.png',
              'ghost-ftp-linux-bookmarks.png',
              'ghost-ftp-linux-settings.png',
              'ghost-ftp-android-files.png',
              'ghost-ftp-android-navigation.png',
              'ghost-ftp-android-sites.png',
              'ghost-ftp-android-bookmarks.png',
              'ghost-ftp-android-transfers.png',
              'ghost-ftp-android-settings.png',
              'ghost-ftp-android-about.png',
          }

          if provenance.get('capture_source_sha') != expected_sha:
              raise SystemExit('capture source SHA mismatch')
          if provenance.get('workflow_run_id') != expected_run:
              raise SystemExit('workflow run id mismatch')
          if provenance.get('evidence') != 'authentic-runtime-capture':
              raise SystemExit('artifact is not marked authentic runtime capture')

          images = provenance.get('images') or []
          names = {pathlib.Path(item['path']).name for item in images}
          if len(images) != 15 or names != expected_names:
              raise SystemExit('unexpected screenshot allow-list')

          target = pathlib.Path('docs/images/0.0.6')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          for item in images:
              name = pathlib.Path(item['path']).name
              source = root / 'images' / name
              payload = source.read_bytes()
              if len(payload) != item['bytes']:
                  raise SystemExit(f'byte length mismatch: {name}')
              digest = hashlib.sha256(payload).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f'SHA-256 mismatch: {name}')
              (target / name).write_bytes(payload)

          shutil.copyfile(provenance_path, target / 'UI-SCREENSHOT-PROVENANCE.json')
          lines = [f"{item['sha256']}  {pathlib.Path(item['path']).name}" for item in images]
          (target / 'SHA256.txt').write_text('\n'.join(sorted(lines)) + '\n', encoding='utf-8')
          PY

      - name: Commit verified media to source branch
        run: |
          set -euo pipefail
          git add docs/images/0.0.6
          if git diff --cached --quiet; then
            echo 'Verified 0.0.6 media already matches the artifact.'
            exit 0
          fi
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git commit -m 'Add verified Ghost FTP 0.0.6 UI evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
