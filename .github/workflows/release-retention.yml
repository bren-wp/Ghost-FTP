name: Retain Latest Ghost FTP Release

on:
  workflow_run:
    workflows:
      - Publish Ghost FTP
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ghostftp-release-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify current release before retention cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          test "$version" != '0.0.0'
          current_tag="ghostftp-v${version}"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$current_tag")"
          release_tag="$(jq -r .tag_name <<< "$release_json")"
          release_draft="$(jq -r .draft <<< "$release_json")"
          release_prerelease="$(jq -r .prerelease <<< "$release_json")"
          asset_count="$(jq '.assets | length' <<< "$release_json")"
          test "$release_tag" = "$current_tag"
          test "$release_draft" = 'false'
          test "$release_prerelease" = 'false'
          test "$asset_count" -eq 17
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$current_tag" --jq .object.sha)"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test -n "$tag_sha"
          test "$tag_sha" = "$main_sha"
          echo "CURRENT_GHOSTFTP_RELEASE=$current_tag"
          echo "CURRENT_GHOSTFTP_RELEASE_SHA=$tag_sha"
          echo "CURRENT_GHOSTFTP_RELEASE_ASSETS=$asset_count"

      - name: Remove superseded Ghost FTP releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          current_tag="ghostftp-v${version}"
          protected_tag="ghostftp-v0.0.7"

          keep_release_tag() {
            [[ "$1" = "$current_tag" || "$1" = "$protected_tag" ]]
          }

          mapfile -t release_tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          for tag in "${release_tags[@]}"; do
            case "$tag" in ghostftp-v*) ;; *) continue ;; esac
            if keep_release_tag "$tag"; then
              echo "Keeping protected Ghost FTP release/tag: $tag"
              continue
            fi
            echo "Deleting superseded Ghost FTP release/tag: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

          mapfile -t refs < <(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/ghostftp-v" --jq '.[].ref')
          for ref in "${refs[@]}"; do
            tag="${ref#refs/tags/}"
            if keep_release_tag "$tag"; then
              echo "Keeping protected Ghost FTP tag ref: $tag"
              continue
            fi
            echo "Deleting orphan/superseded Ghost FTP tag: $tag"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done

          expected_tags="$(printf '%s\n' "$protected_tag" "$current_tag" | LC_ALL=C sort -u)"
          remaining_releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("ghostftp-v")) | .tagName' | LC_ALL=C sort)"
          test "$remaining_releases" = "$expected_tags" || {
            echo 'Ghost FTP release retention set mismatch.' >&2
            diff -u <(printf '%s\n' "$expected_tags") <(printf '%s\n' "$remaining_releases") || true
            exit 1
          }
          remaining_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/ghostftp-v" --jq '.[].ref | sub("^refs/tags/"; "")' | LC_ALL=C sort)"
          test "$remaining_refs" = "$expected_tags" || {
            echo 'Ghost FTP tag retention set mismatch.' >&2
            diff -u <(printf '%s\n' "$expected_tags") <(printf '%s\n' "$remaining_refs") || true
            exit 1
          }
          echo "GHOSTFTP_RELEASE_RETENTION=PASS (current=$current_tag; protected=$protected_tag)"

      - name: Remove obsolete release branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          current="refs/heads/release/ghostftp-v${version}"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/ghostftp-v" > release-branches.json 2>release-branches.err; then
            if grep -q 'HTTP 404' release-branches.err; then echo 'No release branches to remove.'; exit 0; fi
            cat release-branches.err >&2
            exit 1
          fi
          mapfile -t refs < <(jq -r '.[].ref' release-branches.json)
          for ref in "${refs[@]}"; do
            if [[ "$ref" = "$current" ]]; then
              echo "Keeping current release branch: ${ref#refs/heads/}"
              continue
            fi
            short="${ref#refs/}"
            echo "Deleting superseded release branch: $short"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$short"
          done
          echo 'GHOSTFTP_RELEASE_BRANCH_RETENTION=PASS'

      - name: Remove obsolete Ghost FTP package versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          endpoint="users/$owner/packages/container/ghost-ftp/versions?per_page=100"
          if ! gh api "$endpoint" > package-versions.json 2>package-versions.err; then
            if grep -q 'HTTP 404' package-versions.err; then
              echo 'Current release requires its verified Ghost FTP package, but none exists.' >&2
              exit 1
            fi
            cat package-versions.err >&2
            exit 1
          fi

          while IFS=$'\t' read -r id tags; do
            [[ -n "$id" ]] || continue
            keep='false'
            protected_version='0.0.7'
            IFS=',' read -ra tag_list <<< "$tags"
            for tag in "${tag_list[@]}"; do
              if [[ "$tag" = "$version" || "$tag" = "$protected_version" ]]; then keep='true'; break; fi
            done
            if [[ "$keep" = 'true' ]]; then
              echo "Keeping current package version id=$id tags=$tags"
              continue
            fi
            echo "Deleting obsolete package version id=$id tags=$tags"
            gh api --method DELETE "users/$owner/packages/container/ghost-ftp/versions/$id"
          done < <(jq -r '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv' package-versions.json)

          current_count="$(gh api "$endpoint" | jq --arg version "$version" '[.[] | select((.metadata.container.tags // []) | index($version))] | length')"
          test "$current_count" -ge 1
          echo "GHOSTFTP_PACKAGE_RETENTION=PASS (current=$version; preserves-0.0.7-if-present)"

      - name: Record protected retention policy
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "CURRENT_PUBLIC_VERSION=$version"
          echo "PROTECTED_RELEASE_TAG=ghostftp-v0.0.7"
          echo "PROTECTED_RELEASE_POLICY=PRESERVE_TAG_RELEASE_AND_EXISTING_PACKAGE"
