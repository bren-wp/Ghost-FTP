name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  integrate-installer:
    name: One-time installer integration
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Apply installer integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_installer_integration.py
          rm -f scripts/apply_installer_integration.py
          gofmt -w cmd/installer internal/api/engine.go cmd/uninstaller/main.go internal/platform/language_*.go
          git diff --check
          go test ./cmd/installer ./internal/platform ./internal/api ./cmd/uninstaller
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No installer integration changes were required.'
            exit 0
          fi
          git commit -m 'feat: integrate setup language selection and canonical data path'
          git push origin HEAD:${{ github.head_ref }}
