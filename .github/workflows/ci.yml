name: Ghost FTP CI

on:
  push:
    branches: [main, 'work/**', 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Core quality, security and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Go format, tests and vet
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(find cmd internal -name '*.go' -print))"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files are not gofmt-clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go test -race ./...
          go vet ./...
      - name: Repository and platform contract audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_brand_hardcut.py
          python scripts/audit_repository.py
          python scripts/audit_platform_contract.py
          python scripts/audit_dependencies.py
          python scripts/audit_version.py
          python scripts/audit_localization.py
      - name: Security, privacy, docs and companion-web audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_docs.py
          python scripts/audit_web.py
          python scripts/audit_release.py
      - name: Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Windows x64 and x86 production build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Build setup and portable packages
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Verify Windows release artifacts
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          foreach ($arch in @('x64','x86')) {
            foreach ($kind in @('Setup','Portable')) {
              $path = "dist\Ghost-FTP-$v-$kind-$arch.exe"
              if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
                throw "Missing Windows artifact: $path"
              }
            }
          }
      - name: Authenticode private-key pipeline smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content VERSION -Raw).Trim()
          $work = Join-Path $env:RUNNER_TEMP 'ghostftp-signing-smoke'
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          try {
            $passwordText = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
            $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
            .\scripts\New-DevCodeSigningCertificate.ps1 -OutputDirectory $work -Password $password -ValidDays 2

            $pfx = Join-Path $work 'Ghost-FTP-Development-Code-Signing.pfx'
            $targets = @(
              (Join-Path $work 'Ghost-FTP-Portable-signing-smoke.exe'),
              (Join-Path $work 'Ghost-FTP-Setup-signing-smoke.exe')
            )
            Copy-Item -LiteralPath "dist\Ghost-FTP-$v-Portable-x64.exe" -Destination $targets[0]
            Copy-Item -LiteralPath "dist\Ghost-FTP-$v-Setup-x64.exe" -Destination $targets[1]

            .\scripts\Sign-WindowsArtifacts.ps1 -PfxPath $pfx -Password $password -Paths $targets -AllowUntrustedSigner
            foreach ($target in $targets) {
              $signature = Get-AuthenticodeSignature -FilePath $target
              if (-not $signature.SignerCertificate) {
                throw "Signing smoke target has no signer: $target"
              }
              if ($signature.Status -eq 'HashMismatch' -or $signature.Status -eq 'NotSigned') {
                throw "Signing smoke verification failed: $target ($($signature.Status))"
              }
            }

            Write-Host 'AUTHENTICODE_SIGNING_SMOKE=PASS'
          }
          finally {
            $password = $null
            $passwordText = $null
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host 'AUTHENTICODE_SIGNING_SMOKE_TEMPORARY_FILES=CLEANED'
          }
      - name: Store Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-windows-stage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Setup-*.exe
            dist/Ghost-FTP-*-Portable-*.exe

  linux:
    name: Linux amd64 arm64 i386 production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Linux tests and package build
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          bash linux/BUILD.sh
      - name: Verify DEB packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/Ghost-FTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'ghost-ftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done
      - name: Store Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Linux-*.deb
