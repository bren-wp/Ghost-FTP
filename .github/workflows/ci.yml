name: Provjere

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  test:
    name: Testovi, race, vet, sigurnost, privatnost, dokumentacija i release integritet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Provjeri slikovne resurse
        run: python scripts/generate_brand_assets.py --check

      - name: Provjeri hrvatski korisnički sadržaj
        run: python scripts/audit_croatian.py

      - name: Provjeri verzijsku konzistentnost
        run: python scripts/audit_version.py

      - name: Provjeri dokumentaciju
        run: python scripts/audit_docs.py

      - name: Provjeri sigurnosne invarijante
        run: python scripts/audit_security.py

      - name: Provjeri privatnost i mrežnu politiku
        run: python scripts/audit_privacy.py

      - name: Provjeri release pipeline
        run: python scripts/audit_release.py

      - name: Python regresije release alata
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Jedinični testovi
        run: go test ./...

      - name: Race provjera
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Provjera release metapodataka
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.txt"
          test -s "$RUNNER_TEMP/RELEASE-NOTES.txt"
          grep -F "ByFTP $version" "$RUNNER_TEMP/RELEASE-NOTES.txt"

  windows-build:
    name: Windows produkcijski build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Izgradi i provjeri
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1

      - name: Spremi nepotpisane verifikacijske artefakte
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-windows-nepotpisano
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.txt