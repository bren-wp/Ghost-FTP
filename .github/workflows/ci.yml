name: Provjere

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  test:
    name: Testovi, race, vet, sigurnost, privatnost, dokumentacija i release integritet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Isključi i potvrdi Go telemetriju
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Provjeri slikovne resurse
        run: python scripts/generate_brand_assets.py --check
      - name: Provjeri hrvatski korisnički sadržaj
        run: python scripts/audit_croatian.py
      - name: Provjeri verzijsku konzistentnost
        run: python scripts/audit_version.py
      - name: Provjeri dokumentaciju
        run: python scripts/audit_docs.py
      - name: Provjeri sigurnosne invarijante
        run: python scripts/audit_security.py
      - name: Provjeri privatnost i mrežnu politiku
        run: python scripts/audit_privacy.py
      - name: Provjeri release pipeline
        run: python scripts/audit_release.py
      - name: Python regresije release alata
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Jedinični testovi
        run: go test ./...
      - name: Race provjera
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Provjera release metapodataka
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.txt"
          test -s "$RUNNER_TEMP/RELEASE-NOTES.txt"
          grep -F "ByFTP $version" "$RUNNER_TEMP/RELEASE-NOTES.txt"

  windows-build:
    name: Windows x64 i x86 produkcijski build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Isključi i potvrdi Go telemetriju
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0) { throw 'Nije moguće isključiti Go telemetriju.' }
          if ((go telemetry).Trim() -ne 'off') { throw 'Go telemetrija nije isključena.' }
      - name: Provjeri sintaksu release publishera
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\publish_release.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'publish_release.ps1 ima PowerShell sintaksnu grešku.'
          }
      - name: Izgradi i provjeri x64 i x86
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Spremi interne build dokaze
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-windows-ci
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ByFTP-*-Portable-x64.exe
            dist/ByFTP-*-Setup-x64.exe
            dist/ByFTP-*-Portable-x86.exe
            dist/ByFTP-*-Setup-x86.exe
            dist/internal/verification-x64.txt
            dist/internal/verification-x86.txt

  linux-build:
    name: Linux DEB amd64 arm64 i i386
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Isključi i potvrdi Go telemetriju
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Linux connect smoke, unit i vet
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Izgradi Linux instalacijske pakete
        run: bash scripts/BUILD-LINUX.sh
      - name: Provjeri DEB metapodatke
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/ByFTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'byftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done

  macos-build:
    name: macOS Universal PKG
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Isključi i potvrdi Go telemetriju
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: macOS connect smoke, unit i vet
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Izgradi macOS Universal installer
        run: bash scripts/BUILD-MACOS.sh
      - name: Provjeri PKG strukturu
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          pkg="dist/ByFTP-${version}-macOS-Universal.pkg"
          test -s "$pkg"
          pkgutil --expand "$pkg" "$RUNNER_TEMP/byftp-pkg"
          test -f "$RUNNER_TEMP/byftp-pkg/PackageInfo"
