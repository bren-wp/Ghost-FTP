name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, race, vet & privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Privacy audit
        run: python scripts/audit_privacy.py

  windows-build:
    name: Windows production build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and verify
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1

      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byftp-windows-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.txt
