name: Refresh README from exact latest verified native release

on:
  push:
    branches: [fix/security-audit-protocols-retention-v09553]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-readme-09552-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact release SHA and native capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39493900331" --jq '.head_sha')" = b2b90a029a7217aa269c42f293e0d322531c8387
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39493900331" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.95.52" --jq '.prerelease')" = true
          mkdir -p "$RUNNER_TEMP/ghostftp-qa"
          gh run download 39493900331 --name GhostFTP-Windows-x64-Preview-QA -D "$RUNNER_TEMP/ghostftp-qa"
          node .github/scripts/import-verified-windows-09552.mjs "$RUNNER_TEMP/ghostftp-qa"
      - name: Commit only genuine source-pinned Windows capture files
        run: |
          set -euo pipefail
          git add README.md docs/assets/screenshots
          if git diff --cached --quiet; then
            echo "README already shows the latest 0.95.52 release captures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh seven real README images to latest 0.95.52 release"
          git push origin "HEAD:$GITHUB_REF_NAME"
