name: Temporary ByFTP repository cleanup runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'RUN_BYFTP_REPOSITORY_CLEANUP_49'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/installer-i18n-cleanup-20260823
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply deterministic cleanup
        run: python scripts/apply_repository_cleanup.py
      - name: Remove one-time migration file
        run: rm -f scripts/apply_repository_cleanup.py
      - name: Commit generated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: remove legacy branding and normalize assets'
          git push origin HEAD:chatgpt/installer-i18n-cleanup-20260823
