name: Bootstrap ByFTP source

on:
  push:
    branches: [main]
    paths:
      - '.github/bootstrap/source.tar.xz.b64'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -f .github/bootstrap/source.tar.xz.b64 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Expand source payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          base64 -d .github/bootstrap/source.tar.xz.b64 > "$RUNNER_TEMP/byftp-source.tar.xz"
          tar -xJf "$RUNNER_TEMP/byftp-source.tar.xz" -C "$GITHUB_WORKSPACE"
          rm -f "$RUNNER_TEMP/byftp-source.tar.xz"

      - name: Commit source implementation
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add cmd internal scripts build/icon.ico
          git rm -f .github/bootstrap/source.tar.xz.b64
          git commit -m 'Add complete ByFTP 2.12.0 source implementation'
          git push origin HEAD:main
