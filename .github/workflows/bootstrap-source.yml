name: Bootstrap Ghost FTP RC8 source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

concurrency:
  group: ghostftp-source-bootstrap
  cancel-in-progress: false

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/rc8/source.part.*.b64 | base64 -d > /tmp/ghostftp-source.tar.xz
          echo "60bd016984e8646e6b1487b7af8f50366c7106da1ac1635b03b153ff725f8dbc  /tmp/ghostftp-source.tar.xz" | sha256sum -c -
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/ghostftp-source.tar.xz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Ghost FTP 2.1.1 RC8 full source"
          git push
