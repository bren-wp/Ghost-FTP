name: Bootstrap Ghost FTP RC7 source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

concurrency:
  group: ghostftp-source-bootstrap
  cancel-in-progress: false

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify RC7 source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ghostftp-source.b64
          for part in bootstrap/rc7/source.chunk.*.b64; do
            cat "$part" >> /tmp/ghostftp-source.b64
            printf '\n' >> /tmp/ghostftp-source.b64
          done
          base64 -d /tmp/ghostftp-source.b64 > /tmp/ghostftp-source.tar.xz
          echo "146c5d0a467c3789c9bb87273879950ed219b1f66616357cbf5e4aed127d8ac0  /tmp/ghostftp-source.tar.xz" | sha256sum -c -

      - name: Extract full Ghost FTP source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/ghostftp-source.tar.xz
          rm -rf bootstrap
          rm -f LICENSE
          rm -f .github/workflows/bootstrap-source.yml

      - name: Validate imported source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE.txt
          test -d desktop-tauri
          test -d runtime
          test -d installer
          test -d website
          test -f .github/workflows/native-build.yml
          test -f .github/workflows/source-audit.yml
          ! grep -RniE 'faro|example\.com|Production Server|Staging Server|Design Assets|Cloud Server|C:\\Users\\Alex' \
              desktop-tauri runtime installer website --exclude-dir=node_modules

      - name: Commit reconstructed RC7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Ghost FTP 2.1.1 RC7 full source"
          git push
