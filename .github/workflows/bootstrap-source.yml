name: Bootstrap Ghost FTP RC7 source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part.*.b64 | base64 -d > /tmp/ghostftp-source.tar.xz
          echo "146c5d0a467c3789c9bb87273879950ed219b1f66616357cbf5e4aed127d8ac0  /tmp/ghostftp-source.tar.xz" | sha256sum -c -
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/ghostftp-source.tar.xz
          rm -rf bootstrap
      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Ghost FTP 2.1.1 RC7 source"
          git push
