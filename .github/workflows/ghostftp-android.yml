name: Ghost FTP Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android production contract
        shell: bash
        run: bash android/scripts/check-android-contract.sh
      - name: Native Android lint and APK build
        shell: bash
        run: gradle -p android lintDebug lintRelease lintPreview assembleDebug assembleRelease assemblePreview
      - name: Android click-through emulator smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          pre-emulator-launch-script: |
            set -euo pipefail
            adb start-server
            adb version
            adb devices
          script: |
            set -euo pipefail
            gradle -p android connectedDebugAndroidTest
            mkdir -p dist/android
            adb shell am force-stop com.ghostftp.android || true
            adb shell monkey -p com.ghostftp.android 1 >/dev/null
            sleep 2
            adb exec-out screencap -p > dist/android/GhostFTP-Android-UI-Smoke.png
            test -s dist/android/GhostFTP-Android-UI-Smoke.png
      - name: Prepare Android APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          VERSION="$(node -p 'require("./version.json").version')"
          PREVIEW_APK="android/app/build/outputs/apk/preview/app-preview.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"

          test -s "$PREVIEW_APK"
          test -s "$RELEASE_APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$PREVIEW_APK"
          if "$APKSIGNER" verify "$RELEASE_APK" >/dev/null 2>&1; then
            echo "Unsigned release-check APK unexpectedly contains a signature." >&2
            exit 1
          fi

          PACKAGE_ID="$("$AAPT" dump badging "$PREVIEW_APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$PACKAGE_ID" = "com.ghostftp.android.preview"

          cp "$PREVIEW_APK" "dist/android/GhostFTP-Android-v${VERSION}-Installable-Preview.apk"
          cp "$RELEASE_APK" "dist/android/GhostFTP-Android-v${VERSION}-Release-Unsigned.apk.unsigned"
          sha256sum dist/android/* > dist/android/GhostFTP-Android-Preview-SHA256SUMS.txt
      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-Android-APK-Preview
          path: |
            dist/android/*
          if-no-files-found: error
