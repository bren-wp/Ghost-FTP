name: Ghost FTP Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghostftp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Android 16 x86_64 AOSP ATD remained ADB-offline until the emulator boot
    # timeout on macOS Intel; Linux KVM supplies hardware acceleration.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Android production and visual instrumentation result contracts
        shell: bash
        run: |
          bash android/scripts/check-android-contract.sh
          bash android/scripts/test-visual-instrumentation-output.sh
      - name: Native Android lint and APK build
        shell: bash
        run: gradle -p android testDebugUnitTest lintDebug lintRelease lintPreview assembleDebug assembleRelease assemblePreview bundleRelease
      # SDK mirror/CDN corruption can surface as "Archive is not a ZIP
      # archive" before an AVD ever boots. Install the exact Android 16 ATD
      # image with bounded retries and verify files, *before* invoking the
      # emulator runner. Never skip click-through/instrumentation tests.
      - name: Install verified Android 16 emulator system image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="system-images;android-36;aosp_atd;x86_64"
          INSTALLED="$ANDROID_HOME/system-images/android-36/aosp_atd/x86_64"
          for attempt in 1 2 3; do
            echo "Installing Android 16 ATD system image (attempt $attempt/3)."
            if sdkmanager --install "$IMAGE" &&
               test -s "$INSTALLED/system.img" &&
               test -s "$INSTALLED/source.properties" &&
               test -s "$INSTALLED/package.xml"; then
              echo "Android 16 emulator system image installed and checked."
              exit 0
            fi
            echo "::warning::Android 16 SDK image download/extraction is incomplete."
            # Only clear this exact AVD system-image installation and the SDK's
            # incomplete extraction cache on this disposable GitHub runner.
            rm -rf -- "$INSTALLED" "$ANDROID_HOME/.temp"
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          echo "::error::Android 16 emulator image installation failed after 3 attempts."
          exit 1

      # reactivecircus detects /dev/kvm access when the action STARTS,
      # before pre-emulator-launch-script. Configure Linux KVM beforehand,
      # otherwise the action silently launches the emulator with -accel off.
      - name: Enable and verify KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::Android 16 emulator requires Linux /dev/kvm."
            exit 1
          fi
          # Existing GitHub-hosted /dev/kvm nodes are not reliably rewritten
          # by udevadm trigger. Grant the ephemeral CI user direct KVM access
          # before reactivecircus evaluates the acceleration capability.
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Android emulator runner has no read/write access to /dev/kvm."
            ls -l /dev/kvm
            exit 1
          fi
          echo "Android emulator hardware acceleration available via /dev/kvm."
      - name: Android click-through emulator smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-linux-hw-accel: 'false'
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash android/scripts/run-instrumentation-smoke.sh
      - name: Upload Android premium visual QA evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Android-Premium-Visual-QA-480x960
          path: |
            dist/visual-qa/android/*
          if-no-files-found: error

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Android-Instrumentation-Diagnostics
          path: |
            dist/android/diagnostics/*
          if-no-files-found: ignore

      - name: Prepare Android APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          VERSION="$(node -p 'require("./version.json").version')"
          ANDROID_VERSION_CODE="$(node -p 'require("./version.json").androidVersionCode')"
          PREVIEW_APK="android/app/build/outputs/apk/preview/app-preview.apk"
          UNSIGNED_RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"

          test -s "$PREVIEW_APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$PREVIEW_APK"

          PREVIEW_BADGING="$("$AAPT" dump badging "$PREVIEW_APK")"
          PREVIEW_PACKAGE_ID="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"
          PREVIEW_VERSION_CODE="$(sed -n "s/package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"
          PREVIEW_VERSION_NAME="$(sed -n "s/package: .*versionName='\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"
          PREVIEW_MIN_SDK="$(sed -n "s/sdkVersion:'\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"
          PREVIEW_TARGET_SDK="$(sed -n "s/targetSdkVersion:'\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"
          PREVIEW_LAUNCH_ACTIVITY="$(sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" <<< "$PREVIEW_BADGING" | head -n1)"

          test "$PREVIEW_PACKAGE_ID" = "com.ghostftp.android.preview"
          test "$PREVIEW_VERSION_CODE" = "$ANDROID_VERSION_CODE"
          test "$PREVIEW_VERSION_NAME" = "${VERSION}-preview"
          test "$PREVIEW_MIN_SDK" = "26"
          test "$PREVIEW_TARGET_SDK" = "36"
          test "$PREVIEW_LAUNCH_ACTIVITY" = "com.ghostftp.android.MainActivity"
          if grep -Fq "application-debuggable" <<< "$PREVIEW_BADGING"; then
            echo "Installable preview APK unexpectedly remains debuggable." >&2
            exit 1
          fi
          cp "$PREVIEW_APK" "dist/android/GhostFTP-Android-v${VERSION}-Installable-Preview.apk"

          test -s "$UNSIGNED_RELEASE_APK"
          if "$APKSIGNER" verify "$UNSIGNED_RELEASE_APK" >/dev/null 2>&1; then
            echo "Unsigned release APK unexpectedly contains a signature." >&2
            exit 1
          fi

          RELEASE_BADGING="$("$AAPT" dump badging "$UNSIGNED_RELEASE_APK")"
          RELEASE_PACKAGE_ID="$(sed -n "s/package: name='\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"
          RELEASE_VERSION_CODE="$(sed -n "s/package: .*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"
          RELEASE_VERSION_NAME="$(sed -n "s/package: .*versionName='\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"
          RELEASE_MIN_SDK="$(sed -n "s/sdkVersion:'\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"
          RELEASE_TARGET_SDK="$(sed -n "s/targetSdkVersion:'\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"
          RELEASE_LAUNCH_ACTIVITY="$(sed -n "s/launchable-activity: name='\\([^']*\\)'.*/\\1/p" <<< "$RELEASE_BADGING" | head -n1)"

          test "$RELEASE_PACKAGE_ID" = "com.ghostftp.android"
          test "$RELEASE_VERSION_CODE" = "$ANDROID_VERSION_CODE"
          test "$RELEASE_VERSION_NAME" = "$VERSION"
          test "$RELEASE_MIN_SDK" = "26"
          test "$RELEASE_TARGET_SDK" = "36"
          test "$RELEASE_LAUNCH_ACTIVITY" = "com.ghostftp.android.MainActivity"
          if grep -Fq "application-debuggable" <<< "$RELEASE_BADGING"; then
            echo "Unsigned release APK unexpectedly remains debuggable." >&2
            exit 1
          fi
          cp "$UNSIGNED_RELEASE_APK" "dist/android/GhostFTP-Android-v${VERSION}-Release-Unsigned.apk.unsigned"

          # AAB is not installable directly. The release build is intentionally
          # unsigned until a trusted production Play signing identity is supplied.
          test -s "$RELEASE_AAB"
          unzip -tqq "$RELEASE_AAB"
          unzip -Z -1 "$RELEASE_AAB" | grep -Fx 'base/manifest/AndroidManifest.xml' > /dev/null
          cp "$RELEASE_AAB" "dist/android/GhostFTP-Android-v${VERSION}-Release-Unsigned.aab.unsigned"

          (
            cd dist/android
            find . -maxdepth 1 -type f ! -name 'GhostFTP-Android-SHA256SUMS.txt' -print0               | sort -z               | xargs -0 sha256sum
          ) > dist/android/GhostFTP-Android-SHA256SUMS.txt
          test -s dist/android/GhostFTP-Android-SHA256SUMS.txt

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GhostFTP-Android-APK
          path: |
            dist/android/*
          if-no-files-found: error
