name: Apply Ghost FTP 1.0.5 hardening

on:
  push:
    branches:
      - release/ghost-ftp-1.0.5-quality
    paths:
      - scripts/one_shot_105_hardening.py
      - .github/workflows/one-shot-105-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ghost-ftp-1.0.5-quality
          fetch-depth: 0

      - name: Disambiguate deterministic index markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/one_shot_105_hardening.py')
          text = path.read_text(encoding='utf-8')
          generic = "        ('alt=\"GhostFTP\"', 'alt=\"Ghost FTP\"'),\n"
          specific = "        (\"<img src=\\\"<?= GhostFTP_e(GhostFTP_asset('images/mark.svg')) ?>\\\" alt=\\\"GhostFTP\\\">\", \"<img src=\\\"<?= GhostFTP_e(GhostFTP_asset('images/mark.svg')) ?>\\\" alt=\\\"Ghost FTP\\\">\"),\n"
          if text.count(generic) != 2:
              raise SystemExit(f'expected two generic alt markers in helper, got {text.count(generic)}')
          if text.count(specific) != 1:
              raise SystemExit(f'expected one specific modal alt marker in helper, got {text.count(specific)}')
          text = text.replace(generic, '', 1)
          text = text.replace(specific, '', 1)
          anchor = "# Canonical public Ghost FTP branding. Internal PHP namespace/functions,\n# package IDs and compatibility identifiers intentionally remain GhostFTP.\n"
          addition = anchor + "replace_all_checked(\"GhostFTP WEB/index.php\", 'alt=\"GhostFTP\"', 'alt=\"Ghost FTP\"', 2)\n"
          if text.count(anchor) != 1:
              raise SystemExit('canonical brand anchor mismatch')
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Apply deterministic patch
        run: python3 scripts/one_shot_105_hardening.py

      - name: Validate Web hardening, dead-code cleanup and release metadata
        shell: bash
        run: |
          set -euo pipefail
          find 'GhostFTP WEB' -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          cat /tmp/php-lint.log
          php 'GhostFTP WEB/tests/public-error-boundary.php'
          php 'GhostFTP WEB/tests/html-error-and-interface-boundary.php'
          php 'GhostFTP WEB/tests/unit.php'
          php 'GhostFTP WEB/tests/zip-extraction-preflight.php'
          python3 scripts/audit_docs.py
          python3 scripts/audit_web.py
          python3 scripts/audit_version.py
          python3 scripts/audit_release.py

      - name: Commit clean validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one_shot_105_hardening.py .github/workflows/one-shot-105-hardening.yml
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Extend Web error safety and remove dead transport write path for 1.0.5'
          git push origin HEAD:release/ghost-ftp-1.0.5-quality
