name: Generate Ghost FTP app icons

on:
  push:
    branches: [main]
    paths:
      - '.github/generate-brand-assets'

permissions:
  contents: write

concurrency:
  group: ghostftp-brand-assets
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ hashFiles('.github/generate-brand-assets') != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG/icon tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Generate branded Ghost FTP application icons
        shell: bash
        run: |
          set -euo pipefail
          SRC="desktop-tauri/branding/ghostftp-symbol.svg"
          OUT="desktop-tauri/src-tauri/icons"
          mkdir -p "$OUT"

          rsvg-convert -w 32  -h 32  "$SRC" -o "$OUT/32x32.png"
          rsvg-convert -w 128 -h 128 "$SRC" -o "$OUT/128x128.png"
          rsvg-convert -w 256 -h 256 "$SRC" -o "$OUT/128x128@2x.png"
          rsvg-convert -w 512 -h 512 "$SRC" -o "$OUT/source.png"

          convert "$OUT/source.png" -define icon:auto-resize=256,128,64,48,32,16 "$OUT/icon.ico"

          file "$OUT"/*
          test -s "$OUT/32x32.png"
          test -s "$OUT/128x128.png"
          test -s "$OUT/128x128@2x.png"
          test -s "$OUT/source.png"
          test -s "$OUT/icon.ico"

      - name: Commit generated icons
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/generate-brand-assets
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add desktop-tauri/src-tauri/icons .github/generate-brand-assets
          git commit -m "Add branded Ghost FTP native application icons"
          git pull --rebase origin main
          git push origin HEAD:main
