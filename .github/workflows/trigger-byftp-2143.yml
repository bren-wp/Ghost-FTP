name: Jednokratno pokreni ByFTP 2.14.3 izdanje

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-byftp-2143.yml'

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    name: Veži tag uz provjereni commit i pokreni release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dohvati repozitorij
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stvori točan v2.14.3 tag
        shell: bash
        run: |
          set -euo pipefail
          expected='86904c73201bb53bbe6f2dbb072f1915a22c5119'
          before='${{ github.event.before }}'
          if [[ "$before" != "$expected" ]]; then
            echo "Odbijam release: očekivani prethodni main je $expected, a push prije ove pomoćne datoteke bio je $before." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin 'refs/tags/v2.14.3' >/dev/null 2>&1; then
            echo 'Odbijam release: v2.14.3 tag već postoji.' >&2
            exit 1
          fi
          git tag v2.14.3 "$expected"
          git push origin 'refs/tags/v2.14.3'

      - name: Pokreni kanonski release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v2.14.3 -f version=2.14.3
          echo 'RELEASE_DISPATCH=CREATED'
