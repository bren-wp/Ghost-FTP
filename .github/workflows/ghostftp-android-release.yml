name: Ghost FTP Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag that should receive the Android APK asset
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ghostftp-android-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  android-release-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          SAFE_TAG="${TAG#v}"
          SAFE_TAG="${SAFE_TAG//./-}"
          SAFE_TAG="${SAFE_TAG//_/-}"
          echo "SAFE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android release contract
        shell: bash
        run: bash android/scripts/check-android-contract.sh

      - name: Configure production signing
        env:
          KEYSTORE_B64: ${{ secrets.GHOSTFTP_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHOSTFTP_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Android production signing secret $value is required." >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/signing.properties
          chmod 600 android/signing.properties

      - name: Build signed Android release APK
        shell: bash
        run: gradle -p android lintRelease assembleRelease

      - name: Verify mandatory signed release APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$SIGNED" ]]; then
            echo "Android release is incomplete: release APK was not produced." >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          echo "ANDROID_RELEASE_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Prepare APK asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          APK="dist/android/GhostFTP-Android-${SAFE_TAG}.apk"
          cp "$ANDROID_RELEASE_APK" "$APK"
          test -s "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/android/*.apk dist/android/*.sha256 --clobber

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f android/release.keystore android/signing.properties

      - name: Verify mandatory Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="GhostFTP-Android-${SAFE_TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK_NAME" <<<"$ASSETS"
          grep -Fxq "$SHA_NAME" <<<"$ASSETS"
