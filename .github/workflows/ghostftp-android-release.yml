name: Ghost FTP Android release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag that should receive the Android APK asset
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ghostftp-android-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  android-release-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          SAFE_TAG="${TAG#v}"
          SAFE_TAG="${SAFE_TAG//./-}"
          SAFE_TAG="${SAFE_TAG//_/-}"
          echo "SAFE_TAG=$SAFE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android release contract
        shell: bash
        run: bash android/scripts/check-android-contract.sh

      - name: Build Android release APK
        shell: bash
        run: gradle -p android lintRelease assembleRelease

      - name: Select mandatory release APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -s "$SIGNED" ]]; then
            echo "ANDROID_RELEASE_APK=$SIGNED" >> "$GITHUB_ENV"
          elif [[ -s "$UNSIGNED" ]]; then
            echo "ANDROID_RELEASE_APK=$UNSIGNED" >> "$GITHUB_ENV"
          else
            echo "Android release is incomplete: release APK was not produced." >&2
            exit 1
          fi

      - name: Prepare APK asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          APK="dist/android/GhostFTP-Android-${SAFE_TAG}.apk"
          cp "$ANDROID_RELEASE_APK" "$APK"
          test -s "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/android/*.apk dist/android/*.sha256 --clobber
