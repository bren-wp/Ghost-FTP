name: Refresh README from real Ghost FTP v0.95.53 Windows captures
on:
  push:
    branches: [release/0.99.0-preserve-history-security-macos]
permissions:
  contents: write
  actions: read
concurrency:
  group: ghostftp-readme-original-09553-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check source identity and import original running Windows pixels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39506868388" --jq '.head_sha')" = "27a3f8413f168e4cb8cc31cf6d7b7c85c353f5af"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39506868388" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.95.53" --jq '.assets | length')" -ge 21
          mkdir -p "$RUNNER_TEMP/ghostftp-windows-qa"
          gh run download 39506868388 --name GhostFTP-Windows-x64-Preview-QA -D "$RUNNER_TEMP/ghostftp-windows-qa"
          node .github/scripts/import-latest-windows-09553.mjs "$RUNNER_TEMP/ghostftp-windows-qa"
          git fetch --force origin refs/tags/v0.95.53:refs/tags/v0.95.53 --depth=1
          GHOSTFTP_LATEST_RELEASE_TAG=v0.95.53 node .github/scripts/check-release-images.mjs
      - name: Commit exact captured screenshots and digest verifier
        run: |
          set -euo pipefail
          git add docs/assets/screenshots README.md .github/scripts/check-release-images.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: use authentic current v0.95.53 Windows application screenshots"
          git push origin "HEAD:$GITHUB_REF_NAME"
