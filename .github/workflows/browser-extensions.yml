name: Ghost FTP Browser Extensions

on:
  pull_request:
    branches: [main]
    paths:
      - 'ekstenzije/**'
      - 'scripts/build_browser_extensions.py'
      - 'scripts/test_browser_extensions_contract.py'
      - '.github/workflows/browser-extensions.yml'
      - 'VERSION'
  push:
    branches:
      - main
      - release-prep/ghostftp-v0.0.6
    paths:
      - 'ekstenzije/**'
      - 'scripts/build_browser_extensions.py'
      - 'scripts/test_browser_extensions_contract.py'
      - '.github/workflows/browser-extensions.yml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostftp-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-extensions:
    name: Build official Chrome Edge Firefox packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate brand privacy and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py --check
          python scripts/test_browser_extensions_contract.py
      - name: Build deterministic browser packages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py
          version="$(tr -d '\r\n' < VERSION)"
          for browser in Chrome Edge Firefox; do
            test -s "dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip"
            unzip -t "dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip" >/dev/null
          done
          test "$(find dist/browser -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = '3'
          sha256sum dist/browser/*.zip
      - name: Upload official browser packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-browser-extensions
          if-no-files-found: error
          retention-days: 14
          path: dist/browser/*.zip

  release-prep-autofix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-prep/ghostftp-v0.0.6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release-prep branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-prep/ghostftp-v0.0.6
          fetch-depth: 0
      - name: Apply exact fail-closed fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout e9a58871da721a1cf7a950264464d0cbe091d954 -- .github/workflows/browser-extensions.yml
          rm -f .github/workflows/release-prep-autofix.yml
          python - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one marker, got {n}: {old[:90]!r}')
              p.write_text(text.replace(old,new,1), encoding='utf-8')
          one('android/app/src/main/java/app/ghostftp/client/MainActivity.java','TextView platform = label("Android development client", 11, GhostTheme.MUTED);','TextView platform = label("Android app", 11, GhostTheme.MUTED);')
          one('android/app/src/main/java/app/ghostftp/client/MainActivity.java','content.addView(surfaceHeading("About", "Build identity and privacy/security status for this Android development client."));','content.addView(surfaceHeading("About", "Build identity and privacy/security status for this Android app."));')
          one('android/app/src/main/java/app/ghostftp/client/MainActivity.java','card.addView(infoLine("Release status", "Repository build " + BuildConfig.VERSION_NAME + "; Android APK remains development-only and is not a public Android release"), matchWrapSpaced());','card.addView(infoLine("Release status", "Repository build " + BuildConfig.VERSION_NAME + (BuildConfig.DEBUG ? "; development package; not the production-signed public APK" : "; release package; official publication requires verified publisher-signature evidence")), matchWrapSpaced());')
          one('android/UI-UX.md','The Android version shown in About comes from `BuildConfig.VERSION_NAME`, which is derived from the repository root `VERSION` plus the Android development suffix. The CI APK remains a development/debug-signed artifact and must not be represented as a public Android release merely because the repository release identity advances.','The Android version shown in About comes from `BuildConfig.VERSION_NAME`. Production release builds use the repository root `VERSION` exactly; development builds append `-dev`. The ordinary CI development APK remains explicitly separate from the production-signed public Android release, and official publication is accepted only after the protected release workflow verifies the configured publisher certificate fingerprint.')
          one('docs/THIRD-PARTY-NOTICES.md','`ekstenzije/` contains the official Manifest V3 Chrome, Edge and Firefox companion packages. They use browser-provided extension APIs and one local shared JavaScript runtime; they do not bundle an FTP/SFTP networking stack, connect to transfer servers, or provide a supported browser-to-desktop URI/native-messaging handoff today.','`ekstenzije/` contains the official Manifest V3 Chrome, Edge and Firefox companion packages. They use browser-provided extension APIs and one local shared JavaScript runtime; they do not bundle an FTP/SFTP networking stack or connect to transfer servers. They do not provide a supported browser-to-desktop URI/native-messaging handoff today.')
          one('CHANGELOG.md','### Android parity, privacy and lifecycle hardening\n\n','### Android parity, privacy and lifecycle hardening\n\n- Preserved the non-destructive current-folder filter over already-loaded entries with no hidden filesystem/network scan.\n- Preserved bounded recursive local/server search as a separate cancellable, deadline-limited workflow rather than conflating it with current-folder filtering.\n')
          one('docs/RELEASE-VERIFICATION.md','# Ghost FTP release verification\n\n','# Ghost FTP release verification\n\nThe canonical 0.0.6 publication contains **18 platform artifacts / 21 public files**.\n\n')
          one('docs/RELEASE-HISTORY.md','# Ghost FTP release history\n\n','# Ghost FTP release history\n\n## 0.0.6 — 2026-09-14\n\nGhost FTP 0.0.6 expands the verified public release to Windows, Linux, Android and official Chrome/Edge/Firefox companion packages while preserving fail-closed transport and signing boundaries.\n\n- Completed Linux modal input/focus hardening and retained shared Windows/Linux Engine behavior.\n- Added Android file management, filtering/sorting, bounded recursive search, directory comparison, synchronized navigation and hardened Remote Edit workflows.\n- Added the protected production-signed Android release path while keeping Android SFTP hidden until strict maintained host-key verification exists.\n- Consolidated official browser helpers onto one shared runtime with enforced Ghost FTP branding, minimal permissions and no supported desktop launch/handoff.\n- Expanded publication to **18 platform artifacts / 21 public files** with exact SHA-256 readback and latest-only retention.\n- Preserved macOS as a separately validated development/source frontend until real Developer ID signing and Apple notarization succeed.\n\n')
          one('docs/NAVIGATION-BOOKMARKS.md','saving a bookmark never creates a hidden Site Manager profile.','Saving a bookmark does **not** create a hidden persistent Site Manager profile.')
          one('docs/QUEUE-PRIORITY.md','Directory-tree structural preparation occurs before file jobs become reorderable, so priority controls cannot move a file ahead of an unexecuted directory-creation queue dependency.','Directory-tree structural preparation occurs before `reservation.Commit()` makes file jobs reorderable, so priority controls cannot move a file ahead of an unexecuted directory-creation queue dependency.')
          one('.github/workflows/release.yml','          python scripts/build_browser_extensions.py --check\n','          test -f ekstenzije/BRAND.json\n          test -d ekstenzije/manifests\n          test -d ekstenzije/shared\n          python scripts/build_browser_extensions.py --check\n')
          PY
          git diff --check
          python -m unittest discover -s scripts -p 'test_*.py'
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix final 0.0.6 release contract drift'
          git push origin HEAD:release-prep/ghostftp-v0.0.6
