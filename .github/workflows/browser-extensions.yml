name: Ghost FTP Browser Extensions

on:
  pull_request:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'scripts/build_browser_extensions.py'
      - 'scripts/test_browser_extensions_contract.py'
      - '.github/workflows/browser-extensions.yml'
      - 'VERSION'
  push:
    branches:
      - main
      - 'packaging/**'
    paths:
      - 'extensions/**'
      - 'scripts/build_browser_extensions.py'
      - 'scripts/test_browser_extensions_contract.py'
      - '.github/workflows/browser-extensions.yml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostftp-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-extensions:
    name: Build official Chrome Edge Firefox Opera packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate brand privacy and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py --check
          python scripts/test_browser_extensions_contract.py
      - name: Build deterministic browser packages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py
          version="$(tr -d '\r\n' < VERSION)"
          for browser in Chrome Edge Firefox Opera; do
            test -s "dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip"
            unzip -t "dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip" >/dev/null
          done
          test "$(find dist/browser -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = '4'
          sha256sum dist/browser/*.zip
      - name: Upload official browser packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-browser-extensions
          if-no-files-found: error
          retention-days: 14
          path: dist/browser/*.zip
