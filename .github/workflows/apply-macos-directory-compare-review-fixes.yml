name: Apply macOS Directory Compare Review Fixes

on:
  push:
    branches:
      - feature/macos-directory-compare

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/macos-directory-compare
          fetch-depth: 1
      - name: Apply guarded Swift fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_macos_directory_compare_review_fixes.py
          git diff --check
      - name: Commit production-only result
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_macos_directory_compare_review_fixes.py
          rm .github/workflows/apply-macos-directory-compare-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close macOS directory compare review races"
          git push origin HEAD:feature/macos-directory-compare
