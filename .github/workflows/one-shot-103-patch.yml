name: Apply Ghost FTP 1.0.3 quality patch

on:
  push:
    branches:
      - release/ghost-ftp-1.0.3-quality
    paths:
      - scripts/one_shot_103_patch.py
      - scripts/one_shot_103_followup.py
      - .github/workflows/one-shot-103-patch.yml

permissions:
  contents: write

concurrency:
  group: ghostftp-1.0.3-one-shot-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ghost-ftp-1.0.3-quality
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          python3 scripts/one_shot_103_patch.py
          python3 scripts/one_shot_103_followup.py

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_docs.py scripts/audit_web.py
          php -l 'GhostFTP WEB/app/Storage/ProfileStore.php'
          php -l 'GhostFTP WEB/app/Operations/RemoteOperations.php'
          php -l 'GhostFTP WEB/app/Remote/SftpClient.php'
          php -l 'GhostFTP WEB/api.php'
          php 'GhostFTP WEB/tests/unit.php'
          python3 scripts/audit_docs.py
          python3 scripts/audit_web.py

      - name: Commit clean 1.0.3 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one_shot_103_patch.py scripts/one_shot_103_followup.py .github/workflows/one-shot-103-patch.yml
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch changes produced.' >&2; exit 1; }
          git commit -m 'Ghost FTP 1.0.3 web security and integrity hardening'
          git push origin HEAD:release/ghost-ftp-1.0.3-quality
