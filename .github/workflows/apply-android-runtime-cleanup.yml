name: Apply Android Runtime Cleanup

on:
  push:
    branches:
      - hardening/0.0.6-product-polish
    paths:
      - '.github/workflows/apply-android-runtime-cleanup.yml'
      - 'scripts/tmp_android_runtime_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghostftp-android-runtime-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/0.0.6-product-polish
          fetch-depth: 0

      - name: Apply runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_android_runtime_cleanup.py
          rm -f scripts/tmp_android_runtime_cleanup.py
          rm -f .github/workflows/apply-android-runtime-cleanup.yml
          git diff --check

      - name: Commit only product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/app/ghostftp/client/MainActivity.java scripts/_android_contract_regressions.py scripts/tmp_android_runtime_cleanup.py .github/workflows/apply-android-runtime-cleanup.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'polish: clean Android runtime copy and error surfaces'
          git push origin HEAD:hardening/0.0.6-product-polish
