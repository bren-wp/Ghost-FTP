name: Ghost FTP one-shot Linux GUI entry patch

on:
  push:
    branches:
      - work/premium-parity-release-hardening-0.1.1
    paths:
      - .github/workflows/patch-linux-gui-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/premium-parity-release-hardening-0.1.1
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Patch Linux UI entry and profile trust state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gui = Path('internal/desktop/gui_linux.go')
          s = gui.read_text(encoding='utf-8')
          old = '\tu.pendingFingerprint = p.Fingerprint\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one profile pending-fingerprint assignment, found {s.count(old)}')
          s = s.replace(old, '\tu.pendingFingerprint = ""\n')
          gui.write_text(s, encoding='utf-8')

          other = Path('internal/desktop/other.go')
          s = other.read_text(encoding='utf-8')
          old = 'func Run(engine *api.Engine, version string) error { return runTerminal(engine, version) }'
          new = '''func Run(engine *api.Engine, version string) error {
          mode := strings.ToLower(strings.TrimSpace(os.Getenv("GHOSTFTP_UI")))
          if mode == "terminal" || strings.TrimSpace(os.Getenv("DISPLAY")) == "" {
              return runTerminal(engine, version)
          }
          if mode != "" && mode != "desktop" && mode != "gui" {
              return errors.New("GHOSTFTP_UI must be desktop, gui or terminal")
          }
          return runLinuxGUI(engine, version)
          }'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one Linux Run entrypoint, found {s.count(old)}')
          other.write_text(s.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/desktop/gui_linux.go internal/desktop/other.go
          test -z "$(gofmt -l internal/desktop/gui_linux.go internal/desktop/other.go)"
          git diff --check

      - name: Compile and test desktop package before commit
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/desktop ./internal/security ./internal/config
          go vet ./internal/desktop

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add internal/desktop/gui_linux.go internal/desktop/other.go
          git commit -m 'Enable premium Linux desktop UI with headless fallback'
          git push origin HEAD:work/premium-parity-release-hardening-0.1.1
