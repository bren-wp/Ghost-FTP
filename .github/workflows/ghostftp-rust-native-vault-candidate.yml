name: Rust native vault integration (candidate)

on:
  push:
    branches: [perf/recovery-gc-marker-v0.99.86]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ghostftp-desktop/src-tauri
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf dbus gnome-keyring libsecret-tools libsecret-1-dev
      - name: Build and check feature-gated adapter
        working-directory: ghostftp-desktop/src-tauri
        run: |
          set -euo pipefail
          mkdir -p ../dist
          printf '<!doctype html><html><body></body></html>\n' > ../dist/index.html
          cargo fmt --all -- --check
          cargo clippy --locked -p ghostftp --lib --tests --features native-vault-candidate -- -D warnings
          cargo test --locked -p ghostftp --lib --features native-vault-candidate candidate_requires_explicit_test_selection
          cargo test --locked -p ghostftp --lib --features native-vault-candidate credential_mutation_journal::tests
          cargo test --locked -p ghostftp --lib --features native-vault-candidate native_vault_end_to_end_benchmark --no-run
      - name: Native journal anchor and reconciliation
        shell: bash
        working-directory: ghostftp-desktop/src-tauri
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME"
          trap 'rm -rf -- "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME"' EXIT
          export GHOSTFTP_DIRECT_VAULT_TEST=disposable-fixtures
          timeout --kill-after=5s 120s dbus-run-session -- bash -euo pipefail -c '
            printf %s isolated-fixture-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked -p ghostftp --lib --features native-vault-candidate journal_native_vault_anchor_reconciliation -- --ignored --nocapture
          '
      - name: Compare full recovery promotions on same runner (ABBA)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rust-native-vault
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export GHOSTFTP_ACTIVE_RECOVERY_BENCH_OPT_IN=disposable-fixtures
          {
            git rev-parse HEAD
            rustc --version
            uname -srmo
            pkg-config --modversion libsecret-1
          } > build/rust-native-vault/environment.txt
          export GHOSTFTP_RECOVERY_BENCH_SAMPLES=25
          index=0
          for variant in A B B A B A A B; do
            index=$((index + 1))
            (
              root="$(mktemp -d)"
              trap 'rm -rf -- "$root"' EXIT
              export HOME="$root/home" XDG_DATA_HOME="$root/data" XDG_CONFIG_HOME="$root/config" XDG_RUNTIME_DIR="$root/runtime"
              mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"
              unset GHOSTFTP_DIRECT_VAULT_TEST
              if [ "$variant" = B ]; then export GHOSTFTP_DIRECT_VAULT_TEST=disposable-fixtures; fi
              cd ghostftp-desktop/src-tauri
              timeout --kill-after=10s 30m dbus-run-session -- bash -euo pipefail -c '
                printf %s isolated-fixture-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null
                cargo test --locked -p ghostftp --lib --features native-vault-candidate native_vault_end_to_end_benchmark -- --ignored --nocapture
              '
            ) 2>&1 | tee "build/rust-native-vault/run-$index-$variant.log"
          done
      - name: Summarize full recovery observations
        run: |
          python3 - <<'PY'
          import pathlib, re, statistics, math
          root = pathlib.Path("build/rust-native-vault")
          samples = {}
          for index, variant in enumerate("ABBABAAB", 1):
              rows = re.findall(r"recovery_e2e_sample platform=linux bytes=(\d+) sample=(\d+) elapsed_us=(\d+)", (root / f"run-{index}-{variant}.log").read_text())
              assert len(rows) == 50
              assert {(int(b), int(i)) for b, i, _ in rows} == {(b,i) for b in (1048576,16777216) for i in range(25)}
              for size, _, value in rows:
                  samples.setdefault((variant, size), []).append(int(value))
          lines = ["Full recovery promotion ABBA/BAAB; 100 samples per variant and size. P99 is an empirical nearest-rank estimate, not a production SLA."]
          for (variant, size), values in sorted(samples.items()):
              xs = sorted(values)
              assert len(xs) == 100
              lines.append(f"{variant} bytes={size} n={len(xs)} median_us={statistics.median(xs)} p95_us={xs[math.ceil(.95*len(xs))-1]} p99_us={xs[math.ceil(.99*len(xs))-1]} max_us={xs[-1]}")
          (root / "summary.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: GhostFTP-Rust-Native-Vault-Recovery
          path: build/rust-native-vault/
          if-no-files-found: warn
