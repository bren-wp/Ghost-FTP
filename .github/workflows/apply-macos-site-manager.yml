name: Apply macOS Site Manager integration

on:
  push:
    branches:
      - feature/macos-site-manager
    paths:
      - scripts/apply_macos_site_manager_patch.py
      - .github/workflows/apply-macos-site-manager.yml

permissions:
  contents: write

concurrency:
  group: apply-macos-site-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-site-manager
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable Go telemetry
        run: go telemetry off

      - name: Normalize current parity documentation anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_macos_site_manager_patch.py')
          source = p.read_text(encoding='utf-8')
          start_marker = '''replace_once(
              "macos/PARITY.md",
              "The macOS client is currently a development source platform."'''
          next_marker = '''replace_once(
              "scripts/test_macos_windows_parity_contract.py"'''
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('obsolete PARITY replacement block was not found')
          end = source.find(next_marker, start)
          if end < 0:
              raise SystemExit('next parity-contract replacement block was not found')
          source = source[:start] + source[end:]
          p.write_text(source, encoding='utf-8')
          PY

      - name: Apply guarded production patch
        run: python3 scripts/apply_macos_site_manager_patch.py

      - name: Document Keychain and runtime-secret boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('macos/PARITY.md')
          source = p.read_text(encoding='utf-8')
          anchor = 'The Windows desktop is the canonical visual and behavior reference for the macOS client. macOS may use native AppKit windowing, accessibility, file panels and menu conventions, but capability/state/security parity is mandatory. The Mac frontend must use the same typed `internal/api.Engine`; no decorative or dead controls are allowed.\n'
          paragraph = '\nSaved profiles use a native `Security.framework` Keychain-protected 256-bit wrapping key with `WhenUnlockedThisDeviceOnly`; profile envelopes and stored credentials are authenticated with purpose-separated AES-GCM. Durable profile credentials are converted to short-lived runtime capabilities only inside the shared engine after exact account/private-key binding succeeds. Site Manager exposes `PublicProfile` metadata and `HasPassword` / `HasPassphrase` flags only, requires explicit credential save/retain consent, and never returns saved password or passphrase values to Swift.\n'
          if source.count(anchor) != 1:
              raise SystemExit('current parity introduction anchor is not unique')
          p.write_text(source.replace(anchor, anchor + paragraph, 1), encoding='utf-8')
          PY

      - name: Format changed Go source
        run: |
          gofmt -w \
            internal/security/profile_secret_darwin.go \
            internal/security/runtime_secret_darwin.go \
            internal/security/runtime_secret_other.go \
            internal/security/profile_secret_other.go \
            internal/config/profile_crypto_darwin.go \
            internal/config/profile_stored_secret_darwin.go \
            internal/config/profile_stored_secret_other.go \
            internal/config/profiles.go \
            internal/remote/manager.go \
            macos/Bridge/profiles.go

      - name: Validate diff and targeted contracts
        run: |
          git diff --check
          go test ./internal/config ./internal/remote ./internal/security ./internal/api
          python3 scripts/test_macos_site_manager_contract.py
          python3 scripts/test_macos_windows_parity_contract.py

      - name: Remove one-shot integration files
        run: |
          rm scripts/apply_macos_site_manager_patch.py
          rm .github/workflows/apply-macos-site-manager.yml
          git diff --check

      - name: Commit production-only integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete macOS Site Manager profile parity'
          git push origin HEAD:feature/macos-site-manager
