name: Apply macOS Site Manager integration

on:
  push:
    branches:
      - feature/macos-site-manager
    paths:
      - scripts/apply_macos_site_manager_patch.py
      - .github/workflows/apply-macos-site-manager.yml

permissions:
  contents: write

concurrency:
  group: apply-macos-site-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-site-manager
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable Go telemetry
        run: go telemetry off

      - name: Apply guarded production patch
        run: python3 scripts/apply_macos_site_manager_patch.py

      - name: Format changed Go source
        run: |
          gofmt -w \
            internal/security/profile_secret_darwin.go \
            internal/security/runtime_secret_darwin.go \
            internal/security/runtime_secret_other.go \
            internal/security/profile_secret_other.go \
            internal/config/profile_crypto_darwin.go \
            internal/config/profile_stored_secret_darwin.go \
            internal/config/profile_stored_secret_other.go \
            internal/config/profiles.go \
            internal/remote/manager.go \
            macos/Bridge/profiles.go

      - name: Validate diff and targeted contracts
        run: |
          git diff --check
          go test ./internal/config ./internal/remote ./internal/security ./internal/api
          python3 scripts/test_macos_site_manager_contract.py
          python3 scripts/test_macos_windows_parity_contract.py

      - name: Remove one-shot integration files
        run: |
          rm scripts/apply_macos_site_manager_patch.py
          rm .github/workflows/apply-macos-site-manager.yml
          git diff --check

      - name: Commit production-only integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete macOS Site Manager profile parity'
          git push origin HEAD:feature/macos-site-manager
