name: Publish Ghost FTP 0.0.7 Android Compatibility Artifact

on:
  push:
    branches:
      - release-compat/ghostftp-v0.0.7
    paths:
      - .github/workflows/publish-0.0.7-android-compat.yml

permissions:
  contents: write

concurrency:
  group: ghostftp-0.0.7-android-compat
  cancel-in-progress: false

jobs:
  android:
    name: Build, compatibility-sign and attach Android 0.0.7
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: f7dc8a6947279dc773fe58e9ff264c1aa25bf477
      VERSION: 0.0.7
      RELEASE_TAG: ghostftp-v0.0.7
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f7dc8a6947279dc773fe58e9ff264c1aa25bf477
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release/source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$main_sha" = "$SOURCE_SHA"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .target_commitish)"
          test "$release_sha" = "$SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate Android contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
          python scripts/test_android_release_signing_contract.py

      - name: Build optimized release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Create temporary compatibility signing identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ghostftp-0.0.7-compat.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storepass ghostftp007compat \
            -keypass ghostftp007compat \
            -alias ghostftp-compat \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=Ghost FTP 0.0.7 Compatibility,O=Brendigo LTD,C=HR'
          chmod 600 "$keystore"
          echo "COMPAT_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Sign and verify installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          signed="dist/Ghost-FTP-${VERSION}-Android.apk"
          test -s "$unsigned"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$COMPAT_KEYSTORE" \
            --ks-key-alias ghostftp-compat \
            --ks-pass pass:ghostftp007compat \
            --key-pass pass:ghostftp007compat \
            --out "$signed" "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/android-signature.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signature.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]]
          echo "ANDROID_COMPAT_SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
          unzip -t "$signed" >/dev/null

      - name: Reassemble release metadata with Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf current
          mkdir current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir current
          rm -f current/BUILD-METADATA.txt current/RELEASE-NOTES.txt current/SHA256.txt
          cp "dist/Ghost-FTP-${VERSION}-Android.apk" current/

          cat > current/RELEASE-NOTES.txt <<EOF
          Ghost FTP ${VERSION}

          Public compatibility release
          ============================

          Ghost FTP ${VERSION} is published from verified source commit ${SOURCE_SHA}.

          Windows
          -------
          - Universal Setup and Portable packages for x64, x86 and ARM64 payloads.
          - Windows executables are explicitly UNSIGNED in this compatibility release.

          Linux
          -----
          - Debian, Ubuntu and Fedora Installer + Portable universal bundles.
          - Each bundle carries amd64, arm64 and i386 payloads.

          Android
          -------
          - Ghost-FTP-${VERSION}-Android.apk is included and is installable.
          - The APK is built from the exact published ${SOURCE_SHA} source and passes Android unit tests and release lint.
          - Because no protected production Android signing identity is configured, this compatibility artifact uses a temporary compatibility certificate generated only for this publication run.
          - It is NOT the long-term production signing identity and may not support in-place upgrades to a future production-signed APK. Reinstallation may be required when the permanent production key is introduced.
          - Compatibility signer SHA-256: ${ANDROID_COMPAT_SIGNER_SHA256}

          Browser helpers
          ---------------
          - Chrome, Edge, Firefox and Opera helper packages are included.

          macOS
          -----
          - macOS remains development/source-only until Developer ID Application signing and Apple notarization are available.

          Integrity
          ---------
          - Source commit: ${SOURCE_SHA}
          - Tag: ${RELEASE_TAG}
          - Platform artifacts: 13
          - Metadata files: 3
          - Total public files: 16
          - SHA256.txt covers every public file except itself.
          EOF

          cat > current/BUILD-METADATA.txt <<EOF
          PRODUCT=Ghost FTP
          VERSION=${VERSION}
          RELEASE_TAG=${RELEASE_TAG}
          SOURCE_COMMIT=${SOURCE_SHA}
          RELEASE_MODE=0.0.7-compatibility
          WINDOWS_SETUP=universal-x64-x86-arm64
          WINDOWS_PORTABLE=universal-x64-x86-arm64
          WINDOWS_AUTHENTICODE=unsigned
          LINUX_DISTROS=Debian,Ubuntu,Fedora
          LINUX_PAYLOAD_ARCHITECTURES=amd64,arm64,i386
          ANDROID_PUBLIC_APK=included-compatibility-signed
          ANDROID_APPLICATION_ID=app.ghostftp.client
          ANDROID_SIGNING=temporary-compatibility-certificate
          ANDROID_SIGNER_SHA256=${ANDROID_COMPAT_SIGNER_SHA256}
          BROWSER_EXTENSION_PACKAGES=Chrome,Edge,Firefox,Opera
          BROWSER_PERMISSIONS=zero
          BROWSER_HOST_PERMISSIONS=zero
          MACOS_PUBLIC_ARTIFACT=excluded-development-only
          TELEMETRY=disabled
          PUBLIC_PLATFORM_ARTIFACTS=13
          PUBLIC_METADATA_FILES=3
          PUBLIC_FILES_TOTAL=16
          EOF

          (
            cd current
            find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256.txt
            sha256sum -c SHA256.txt
          )

      - name: Upload Android and refreshed metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "current/Ghost-FTP-${VERSION}-Android.apk" \
            current/BUILD-METADATA.txt current/RELEASE-NOTES.txt current/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file current/RELEASE-NOTES.txt

      - name: Verify 16-file remote release and digest readback
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-assets.txt" <<EOF
          BUILD-METADATA.txt
          Ghost-FTP-${VERSION}-Android.apk
          Ghost-FTP-${VERSION}-Chrome-Extension.zip
          Ghost-FTP-${VERSION}-Edge-Extension.zip
          Ghost-FTP-${VERSION}-Firefox-Extension.zip
          Ghost-FTP-${VERSION}-Linux-Debian-Installer.run
          Ghost-FTP-${VERSION}-Linux-Debian-Portable.tar.gz
          Ghost-FTP-${VERSION}-Linux-Fedora-Installer.run
          Ghost-FTP-${VERSION}-Linux-Fedora-Portable.tar.gz
          Ghost-FTP-${VERSION}-Linux-Ubuntu-Installer.run
          Ghost-FTP-${VERSION}-Linux-Ubuntu-Portable.tar.gz
          Ghost-FTP-${VERSION}-Opera-Extension.zip
          Ghost-FTP-${VERSION}-Portable.exe
          Ghost-FTP-${VERSION}-Setup.exe
          RELEASE-NOTES.txt
          SHA256.txt
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
          test "$(wc -l < "$RUNNER_TEMP/remote-assets.txt" | tr -d ' ')" = '16'
          rm -rf readback
          mkdir readback
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          (cd readback && sha256sum -c SHA256.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "readback/Ghost-FTP-${VERSION}-Android.apk" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          echo 'GHOSTFTP_ANDROID_0_0_7_COMPAT=PASS'

      - name: Remove temporary compatibility signing identity
        if: always()
        shell: bash
        run: |
          rm -f -- "${COMPAT_KEYSTORE:-}"
