name: Apply Ghost FTP 1.0.3 preflight fix

on:
  push:
    branches:
      - release/ghost-ftp-1.0.3-quality
    paths:
      - scripts/one_shot_103_preflight_fix.py
      - .github/workflows/one-shot-103-preflight-fix.yml

permissions:
  contents: write

concurrency:
  group: ghostftp-1.0.3-preflight-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ghost-ftp-1.0.3-quality
          fetch-depth: 0

      - name: Apply preflight fix
        run: python3 scripts/one_shot_103_preflight_fix.py

      - name: Validate preflight fix
        shell: bash
        run: |
          set -euo pipefail
          php -l 'GhostFTP WEB/api.php'
          php -l 'GhostFTP WEB/app/Remote/SftpClient.php'
          php 'GhostFTP WEB/tests/api-batch-preflight.php'
          php 'GhostFTP WEB/tests/unit.php'
          python3 scripts/audit_docs.py
          python3 scripts/audit_web.py

      - name: Commit clean fix tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one_shot_103_preflight_fix.py .github/workflows/one-shot-103-preflight-fix.yml
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No fix changes produced.' >&2; exit 1; }
          git commit -m 'Make Web batch deletion fully fail closed'
          git push origin HEAD:release/ghost-ftp-1.0.3-quality
