name: Polish Ghost FTP 0.2.1 Windows

on:
  push:
    branches:
      - work/windows-ui-stability-logo-20260906
    paths:
      - .github/workflows/polish-0.2.1-windows.yml
      - scripts/polish_0_2_1_windows_visual.py

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  polish:
    name: Patch, test and commit final Windows visual polish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/windows-ui-stability-logo-20260906
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Apply and prove final visual polish
        shell: bash
        run: |
          set -euo pipefail
          # The owner-drawn menu migration removes the last real unsafe use from
          # menu_windows.go. Patch the one-shot migration script at runtime so
          # its generated file also drops that now-unused import before the
          # Windows cross-build gate runs.
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/polish_0_2_1_windows_visual.py')
          s = p.read_text(encoding='utf-8')
          needle = "\nfiles=['internal/desktop/chrome_windows.go'"
          insert = "\nrepl('internal/desktop/menu_windows.go', '\\t\"unsafe\"\\n', '')\n"
          if s.count(needle) != 1:
              raise SystemExit('visual polish runtime-patch guard failed')
          p.write_text(s.replace(needle, insert + needle, 1), encoding='utf-8')
          PY
          python scripts/polish_0_2_1_windows_visual.py
