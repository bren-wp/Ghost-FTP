name: Sanitize Ghost FTP RC7 release

on:
  push:
    branches: [main]
    paths:
      - '.release/CLEAN-RC7'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove compatibility executables from public RC7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-rc.7"
          gh release view "$TAG" >/dev/null
          for asset in             "GhostFTP-Portable-2.1.1-RC7.exe"             "GhostFTP-Setup-2.1.1-RC7.exe"             "GhostFTP-linux-x86_64-2.1.1-RC7"             "GhostFTP-linux-x86_64-2.1.1-RC7.tar.gz"             "ghostftp_2.1.1.rc7_amd64.deb"             "SHA256SUMS.txt"; do
            gh release delete-asset "$TAG" "$asset" -y 2>/dev/null || true
          done
          gh release edit "$TAG"             --title "Ghost FTP 2.1.1 RC7 — Native build pending"             --notes-file RELEASE_NOTES_RC7.md             --prerelease
