name: Ghost FTP one-time npm security lock refresh
on:
  push:
    branches:
      - fix/upload-source-sampled-fingerprint-v0-99-69

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'bren-wp/Ghost-FTP' && github.ref == 'refs/heads/fix/upload-source-sampled-fingerprint-v0-99-69'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-source-sampled-fingerprint-v0-99-69
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Refresh only the audited npm lockfile without executing package scripts
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # An already-reviewed dev-only braces finding can keep npm audit fix
          # nonzero. The strict repository audit below must still pass.
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo 'Audit fix incomplete; enforcing the independent strict audit policy.'
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node ../.github/scripts/check-npm-dev-audit.mjs
      - name: Commit verified package-lock only back to this trusted branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ghostftp-desktop/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh audited npm lockfile for patched Vite toolchain'
            git push origin HEAD:refs/heads/fix/upload-source-sampled-fingerprint-v0-99-69
          else
            echo 'Audited lockfile already up to date.'
          fi
