name: Ghost FTP one-time npm security lock refresh
on:
  push:
    branches:
      - fix/upload-source-sampled-fingerprint-v0-99-69

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'bren-wp/Ghost-FTP' && github.ref == 'refs/heads/fix/upload-source-sampled-fingerprint-v0-99-69'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-source-sampled-fingerprint-v0-99-69
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Resolve exact npm lockfile without running dependency scripts
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json"); const l=require("./package-lock.json"); for (const [name,version] of [["vite",p.devDependencies.vite],["@vitejs/plugin-react","6.3.0"]]) { const actual=l.packages["node_modules/"+name]?.version; if (actual!==version) throw Error(name+": lock "+actual+" does not match "+version); }'
      - name: Commit only the resolved lockfile to the trusted PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ghostftp-desktop/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize npm lockfile with audited source manifest'
            git push origin HEAD:refs/heads/fix/upload-source-sampled-fingerprint-v0-99-69
          else
            echo 'Npm lockfile already matches manifest.'
          fi
      - name: Enforce independent npm security audit (must not silently bypass findings)
        working-directory: ghostftp-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          node ../.github/scripts/check-npm-dev-audit.mjs
