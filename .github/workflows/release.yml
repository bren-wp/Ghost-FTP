name: Publish Ghost FTP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version guard; must equal VERSION'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ghostftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -print))"
          go test -race ./...
          go vet ./...
          python scripts/audit_brand_hardcut.py
          python scripts/audit_repository.py
          python scripts/audit_platform_contract.py
          python scripts/audit_dependencies.py
          python scripts/audit_version.py
          python scripts/audit_localization.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_docs.py
          python scripts/audit_web.py
          python scripts/audit_release.py
          python -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Windows setup and portable x64/x86
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Build Windows artifacts
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          foreach ($arch in @('x64','x86')) {
            foreach ($kind in @('Setup','Portable')) {
              $path = "dist\Ghost-FTP-$v-$kind-$arch.exe"
              if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) {
                throw "Missing Windows artifact: $path"
              }
            }
          }
      - name: Store Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-windows-stage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Setup-*.exe
            dist/Ghost-FTP-*-Portable-*.exe

  linux:
    name: Linux amd64 arm64 i386
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Build DEB packages
        run: bash linux/BUILD.sh
      - name: Verify DEB metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/Ghost-FTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'ghost-ftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done
      - name: Store Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Linux-*.deb

  publish:
    name: Assemble and publish Windows and Linux release
    needs: [quality, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Resolve version and release channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '\r\n' < VERSION)"
          manual='${{ inputs.version }}'
          if [[ -n "$manual" ]]; then version="$manual"; else version="$source_version"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          test "$version" = "$source_version"

          major="${version%%.*}"
          if [[ "$major" = '0' ]]; then
            release_channel='beta'
            release_title="Ghost FTP $version Beta"
          else
            release_channel='stable'
            release_title="Ghost FTP $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ghostftp-v$version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$release_channel" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
      - name: Download Windows
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-windows-stage, path: staging/windows }
      - name: Download Linux
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-linux-stage, path: staging/linux }
      - name: Assemble public release and NuGet package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release packages-out

          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x64.exe" "release/Ghost-FTP-${VERSION}-Setup-x64.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x86.exe" "release/Ghost-FTP-${VERSION}-Setup-x86.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x86.exe" "release/Ghost-FTP-${VERSION}-Setup-x32.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Portable-x64.exe" "release/Ghost-FTP-${VERSION}-Portable-x64.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Portable-x86.exe" "release/Ghost-FTP-${VERSION}-Portable-x86.exe"

          for arch in amd64 arm64 i386; do
            cp "staging/linux/Ghost-FTP-${VERSION}-Linux-${arch}.deb" "release/Ghost-FTP-${VERSION}-Linux-${arch}.deb"
          done
          (
            cd staging/linux
            zip -9 "$GITHUB_WORKSPACE/release/Ghost-FTP-${VERSION}-Linux-multiarch.zip" \
              "Ghost-FTP-${VERSION}-Linux-amd64.deb" \
              "Ghost-FTP-${VERSION}-Linux-arm64.deb" \
              "Ghost-FTP-${VERSION}-Linux-i386.deb"
          )

          python scripts/package_nuget.py \
            --x64 "staging/windows/Ghost-FTP-${VERSION}-Portable-x64.exe" \
            --x86 "staging/windows/Ghost-FTP-${VERSION}-Portable-x86.exe" \
            --output-dir packages-out
          test -s "packages-out/GhostFTP.${VERSION}.nupkg"

          python scripts/release_notes.py --version "$VERSION" --output release/RELEASE-NOTES.txt
          cat > release/BUILD-METADATA.txt <<EOF
          BRAND=Ghost FTP
          TECHNICAL_IDENTITY=GhostFTP
          VERSION=${VERSION}
          RELEASE_TAG=${RELEASE_TAG}
          RELEASE_CHANNEL=${RELEASE_CHANNEL}
          COMMIT=${GITHUB_SHA}
          ACTIVE_APPLICATION_PLATFORMS=WINDOWS,LINUX
          WINDOWS_SETUP=x64,x86,x32-alias-of-x86
          WINDOWS_PORTABLE=x64,x86
          LINUX_DEB=amd64,arm64,i386
          LINUX_BUNDLE=multiarch-amd64-arm64-i386
          LANGUAGES=24
          DEFAULT_LANGUAGE=en
          TELEMETRY=disabled
          PUBLIC_PLATFORM_ARTIFACTS=9
          PUBLIC_RELEASE_FILES=12
          EOF
          sed -i 's/^          //' release/BUILD-METADATA.txt

          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256.txt
          )
          count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = '12'
          test "$(sha256sum "release/Ghost-FTP-${VERSION}-Setup-x86.exe" | awk '{print $1}')" = "$(sha256sum "release/Ghost-FTP-${VERSION}-Setup-x32.exe" | awk '{print $1}')"
      - name: Publish GitHub Release and GhostFTP package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved from release commit" >&2; exit 1; }
          command -v dotnet >/dev/null || { echo 'dotnet CLI is required for NuGet publication' >&2; exit 1; }

          prerelease_args=()
          if [[ "$RELEASE_CHANNEL" = 'beta' ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ -z "$tag_sha" ]]; then
              git fetch --tags --force
              tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            fi
            test "$tag_sha" = "$GITHUB_SHA" || { echo "Existing $RELEASE_TAG points to $tag_sha, not $GITHUB_SHA; refusing to rewrite it." >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release/* --repo "$repo" --clobber
            gh release edit "$RELEASE_TAG" --repo "$repo" --title "$RELEASE_TITLE" --notes-file release/RELEASE-NOTES.txt
          else
            gh release create "$RELEASE_TAG" release/* --repo "$repo" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release/RELEASE-NOTES.txt "${prerelease_args[@]}"
          fi

          release_id="$(gh api "repos/$repo/releases/tags/$RELEASE_TAG" --jq .id)"
          if [[ "$RELEASE_CHANNEL" = 'beta' ]]; then
            gh api --method PATCH "repos/$repo/releases/$release_id" -F prerelease=true -f name="$RELEASE_TITLE" >/dev/null
          else
            gh api --method PATCH "repos/$repo/releases/$release_id" -F prerelease=false -f name="$RELEASE_TITLE" >/dev/null
          fi

          dotnet nuget push "packages-out/GhostFTP.${VERSION}.nupkg" \
            --api-key "$GH_TOKEN" \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --skip-duplicate

          package_versions="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/nuget/GhostFTP/versions" --jq '.[].name')"
          grep -Fx "$VERSION" <<< "$package_versions"
          echo "GITHUB_PACKAGE_READBACK=PASS (GhostFTP $VERSION; channel=$RELEASE_CHANNEL)"

          assert_release_asset_set() {
            phase="$1"
            local_manifest="$(mktemp)"
            remote_manifest="$(mktemp)"
            readback_dir="$(mktemp -d)"
            trap 'rm -f "$local_manifest" "$remote_manifest"; rm -rf "$readback_dir"' RETURN
            find release -maxdepth 1 -type f -printf '%f\t%s\n' | LC_ALL=C sort > "$local_manifest"
            gh release view "$RELEASE_TAG" --repo "$repo" --json assets \
              --jq '.assets[] | [.name, (.size | tostring)] | @tsv' | LC_ALL=C sort > "$remote_manifest"
            diff -u "$local_manifest" "$remote_manifest"
            gh release download "$RELEASE_TAG" --repo "$repo" --pattern 'SHA256.txt' --dir "$readback_dir"
            cmp release/SHA256.txt "$readback_dir/SHA256.txt"

            remote_prerelease="$(gh api "repos/$repo/releases/tags/$RELEASE_TAG" --jq .prerelease)"
            if [[ "$RELEASE_CHANNEL" = 'beta' ]]; then
              test "$remote_prerelease" = 'true'
            else
              test "$remote_prerelease" = 'false'
            fi
            echo "RELEASE_ASSET_READBACK=PASS ($phase; channel=$RELEASE_CHANNEL)"
          }

          assert_release_asset_set immediate
          sleep 5
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved before delayed release verification" >&2; exit 1; }
          assert_release_asset_set delayed
      - name: Store complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-${{ steps.version.outputs.version }}-complete-release
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*
            packages-out/GhostFTP.*.nupkg
