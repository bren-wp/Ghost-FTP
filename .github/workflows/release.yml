name: Publish Ghost FTP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version guard; must equal VERSION'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ghostftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -print))"
          go test -race ./...
          go vet ./...
          python scripts/generate_brand_assets.py --check
          python scripts/audit_brand_hardcut.py
          python scripts/audit_repository.py
          python scripts/audit_platform_contract.py
          python scripts/audit_desktop_surface.py
          python scripts/audit_dependencies.py
          python scripts/audit_version.py
          python scripts/audit_localization.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_docs.py
          python scripts/audit_release.py
          python -m unittest discover -s scripts -p 'test_*.py'

  windows:
    name: Windows universal x86 x64 ARM64 setup and portable
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signing_state: ${{ steps.signing.outputs.state }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Require protected Authenticode identity
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.GHOSTFTP_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.GHOSTFTP_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw 'Official Ghost FTP publication requires GHOSTFTP_SIGNING_PFX_BASE64.' }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw 'Official Ghost FTP publication requires GHOSTFTP_SIGNING_PASSWORD.' }
          try { $bytes = [Convert]::FromBase64String($env:PFX_BASE64) }
          catch { throw 'GHOSTFTP_SIGNING_PFX_BASE64 is not valid Base64.' }
          if ($bytes.Length -lt 256) { throw 'Decoded Authenticode PFX is unexpectedly small.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'ghostftp-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          "GHOSTFTP_SIGNING_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "state=signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'WINDOWS_RELEASE_SIGNING=CONFIGURED'
      - name: Build Windows artifacts
        shell: pwsh
        env:
          GHOSTFTP_SIGNING_PASSWORD: ${{ secrets.GHOSTFTP_SIGNING_PASSWORD }}
          GHOSTFTP_SIGNING_TIMESTAMP_URL: ${{ secrets.GHOSTFTP_SIGNING_TIMESTAMP_URL }}
        run: .\BUILD-WINDOWS.ps1
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          foreach ($kind in @('Setup','Portable')) {
            $path = "dist\Ghost-FTP-$v-$kind.exe"
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing Windows artifact: $path" }
            $signature = Get-AuthenticodeSignature -FilePath $path
            if (-not $signature.SignerCertificate -or $signature.Status -ne 'Valid') {
              throw "Production Authenticode verification failed for ${path}: $($signature.Status) $($signature.StatusMessage)"
            }
          }
          if (Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '(?i)-(?:x64|x86|x32|arm64)\.exe$' }) {
            throw 'Architecture-specific Windows executables leaked into the public release stage.'
          }
      - name: Remove protected Authenticode identity
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GHOSTFTP_SIGNING_PFX_PATH) -and (Test-Path -LiteralPath $env:GHOSTFTP_SIGNING_PFX_PATH)) {
            Remove-Item -LiteralPath $env:GHOSTFTP_SIGNING_PFX_PATH -Force
          }
      - name: Store Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-windows-stage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Setup.exe
            dist/Ghost-FTP-*-Portable.exe

  linux:
    name: Debian Ubuntu Fedora universal installer and portable bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Build universal distro bundles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_linux_distro_packaging_contract.py
          bash linux/BUILD-DISTROS.sh
      - name: Verify universal distro bundle parity
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for distro in Debian Ubuntu Fedora; do
            installer="dist/Ghost-FTP-${version}-Linux-${distro}-Installer.run"
            portable="dist/Ghost-FTP-${version}-Linux-${distro}-Portable.tar.gz"
            test -x "$installer"
            test -s "$portable"
            mkdir -p "$work/$distro"
            tar -xzf "$portable" -C "$work/$distro"
            portable_root="$work/$distro/Ghost-FTP-${version}-Linux-${distro}-Portable"
            test -x "$portable_root/bin/amd64/ghostftp"
            test -x "$portable_root/bin/arm64/ghostftp"
            test -x "$portable_root/bin/i386/ghostftp"
            prefix="$work/${distro}-installed"
            GHOSTFTP_PREFIX="$prefix" "$installer"
            cmp "$prefix/bin/ghostftp" "$portable_root/bin/amd64/ghostftp"
          done
          test "$(find dist -maxdepth 1 -type f -name 'Ghost-FTP-*-Linux-*' | wc -l | tr -d ' ')" = '6'
      - name: Store Linux universal distro bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-universal-distro-stage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Ghost-FTP-*-Linux-Debian-Installer.run
            dist/Ghost-FTP-*-Linux-Debian-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Ubuntu-Installer.run
            dist/Ghost-FTP-*-Linux-Ubuntu-Portable.tar.gz
            dist/Ghost-FTP-*-Linux-Fedora-Installer.run
            dist/Ghost-FTP-*-Linux-Fedora-Portable.tar.gz

  android:
    name: Production signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      signing_state: ${{ steps.signing.outputs.state }}
      signer_sha256: ${{ steps.verify.outputs.signer_sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Android release source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_android_contract.py
          python scripts/test_android_passive_data_contract.py
          python scripts/test_android_mobile_navigation_contract.py
          python scripts/test_android_release_signing_contract.py
      - name: Build unsigned Android release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Require protected Android production signing identity
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GHOSTFTP_ANDROID_KEYSTORE_BASE64 }}
          GHOSTFTP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_KEYSTORE_PASSWORD }}
          GHOSTFTP_ANDROID_KEY_ALIAS: ${{ secrets.GHOSTFTP_ANDROID_KEY_ALIAS }}
          GHOSTFTP_ANDROID_KEY_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_KEY_PASSWORD }}
          GHOSTFTP_ANDROID_CERT_SHA256: ${{ secrets.GHOSTFTP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for pair in \
            KEYSTORE_BASE64:GHOSTFTP_ANDROID_KEYSTORE_BASE64 \
            GHOSTFTP_ANDROID_KEYSTORE_PASSWORD:GHOSTFTP_ANDROID_KEYSTORE_PASSWORD \
            GHOSTFTP_ANDROID_KEY_ALIAS:GHOSTFTP_ANDROID_KEY_ALIAS \
            GHOSTFTP_ANDROID_KEY_PASSWORD:GHOSTFTP_ANDROID_KEY_PASSWORD \
            GHOSTFTP_ANDROID_CERT_SHA256:GHOSTFTP_ANDROID_CERT_SHA256; do
            variable="${pair%%:*}"
            label="${pair##*:}"
            test -n "${!variable:-}" || { echo "Official Ghost FTP Android publication requires $label." >&2; exit 1; }
          done
          expected="$(printf '%s' "$GHOSTFTP_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo 'GHOSTFTP_ANDROID_CERT_SHA256 must be a SHA-256 certificate fingerprint.' >&2; exit 1; }
          keystore="$RUNNER_TEMP/ghostftp-android-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test "$(wc -c < "$keystore")" -ge 256 || { echo 'Decoded Android production keystore is unexpectedly small.' >&2; exit 1; }
          chmod 600 "$keystore"
          echo "GHOSTFTP_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "state=signed" >> "$GITHUB_OUTPUT"
          echo 'ANDROID_RELEASE_SIGNING=CONFIGURED'
      - name: Sign Android release APK
        shell: bash
        env:
          GHOSTFTP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_KEYSTORE_PASSWORD }}
          GHOSTFTP_ANDROID_KEY_ALIAS: ${{ secrets.GHOSTFTP_ANDROID_KEY_ALIAS }}
          GHOSTFTP_ANDROID_KEY_PASSWORD: ${{ secrets.GHOSTFTP_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          signed="dist/Ghost-FTP-${version}-Android.apk"
          test -s "$unsigned"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$GHOSTFTP_ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$GHOSTFTP_ANDROID_KEY_ALIAS" \
            --ks-pass env:GHOSTFTP_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:GHOSTFTP_ANDROID_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          test -s "$signed"
      - name: Verify Android production signature
        id: verify
        shell: bash
        env:
          EXPECTED_SIGNER: ${{ secrets.GHOSTFTP_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          apk="dist/Ghost-FTP-${version}-Android.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/android-signature.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signature.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_SIGNER" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]] || { echo 'Unable to read Android signer SHA-256 fingerprint.' >&2; exit 1; }
          test "$actual" = "$expected" || { echo 'Android production signer fingerprint mismatch.' >&2; exit 1; }
          unzip -t "$apk" >/dev/null
          echo "signer_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo 'ANDROID_PRODUCTION_SIGNATURE=PASS'
      - name: Remove protected Android signing identity
        if: always()
        shell: bash
        run: |
          if [[ -n "${GHOSTFTP_ANDROID_KEYSTORE_PATH:-}" ]]; then rm -f -- "$GHOSTFTP_ANDROID_KEYSTORE_PATH"; fi
      - name: Store Android release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-android-release-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Android.apk

  browser:
    name: Chrome Edge Firefox Opera release packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Validate browser helper contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py --check
          python scripts/test_browser_extensions_contract.py
      - name: Build deterministic browser packages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_browser_extensions.py
          version="$(tr -d '\r\n' < VERSION)"
          for browser in Chrome Edge Firefox Opera; do
            archive="dist/browser/Ghost-FTP-${version}-${browser}-Extension.zip"
            test -s "$archive"
            unzip -t "$archive" >/dev/null
          done
          test "$(find dist/browser -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = '4'
      - name: Store browser release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-browser-release-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/browser/*.zip

  publish:
    name: Assemble and publish verified cross-platform release
    needs: [quality, windows, linux, android, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      WINDOWS_SIGNING_STATE: ${{ needs.windows.outputs.signing_state }}
      ANDROID_SIGNING_STATE: ${{ needs.android.outputs.signing_state }}
      ANDROID_SIGNER_SHA256: ${{ needs.android.outputs.signer_sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Resolve version and release channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '\r\n' < VERSION)"
          manual='${{ inputs.version }}'
          if [[ -n "$manual" ]]; then version="$manual"; else version="$source_version"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          test "$version" != '0.0.0' || { echo '0.0.0 is reserved' >&2; exit 1; }
          test "$version" = "$source_version"
          release_channel='current'
          release_title="Ghost FTP $version"
          test "$WINDOWS_SIGNING_STATE" = 'signed' || { echo 'Official Ghost FTP publication requires trusted Authenticode.' >&2; exit 1; }
          test "$ANDROID_SIGNING_STATE" = 'signed' || { echo 'Official Ghost FTP publication requires a production-signed Android APK.' >&2; exit 1; }
          [[ "$ANDROID_SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Android signer fingerprint output is invalid.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ghostftp-v$version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$release_channel" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
      - name: Download Windows
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-windows-stage
          path: staging/windows
      - name: Download Linux
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-linux-universal-distro-stage
          path: staging/linux
      - name: Download Android
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-android-release-stage
          path: staging/android
      - name: Download browser packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.0
        with:
          name: ghostftp-browser-release-stage
          path: staging/browser
      - name: Assemble public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup.exe" "release/Ghost-FTP-${VERSION}-Setup.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Portable.exe" "release/Ghost-FTP-${VERSION}-Portable.exe"
          for distro in Debian Ubuntu Fedora; do
            cp "staging/linux/Ghost-FTP-${VERSION}-Linux-${distro}-Installer.run" "release/Ghost-FTP-${VERSION}-Linux-${distro}-Installer.run"
            cp "staging/linux/Ghost-FTP-${VERSION}-Linux-${distro}-Portable.tar.gz" "release/Ghost-FTP-${VERSION}-Linux-${distro}-Portable.tar.gz"
          done
          cp "staging/android/Ghost-FTP-${VERSION}-Android.apk" "release/Ghost-FTP-${VERSION}-Android.apk"
          for browser in Chrome Edge Firefox Opera; do
            cp "staging/browser/Ghost-FTP-${VERSION}-${browser}-Extension.zip" "release/Ghost-FTP-${VERSION}-${browser}-Extension.zip"
          done

          python scripts/release_notes.py --version "$VERSION" --output release/RELEASE-NOTES.txt
          cat > release/BUILD-METADATA.txt <<EOF
          BRAND=Ghost FTP
          TECHNICAL_IDENTITY=GhostFTP
          VERSION=${VERSION}
          RELEASE_TAG=${RELEASE_TAG}
          RELEASE_CHANNEL=${RELEASE_CHANNEL}
          COMMIT=${GITHUB_SHA}
          PUBLIC_RELEASE_PLATFORMS=WINDOWS,LINUX,ANDROID,BROWSER_HELPER
          ACTIVE_SOURCE_PLATFORMS=WINDOWS,LINUX,ANDROID,MACOS
          WINDOWS_SETUP=universal-x86-x64-arm64
          WINDOWS_PORTABLE=universal-x86-x64-arm64
          WINDOWS_BOOTSTRAP_PE=x86
          WINDOWS_NATIVE_PAYLOADS=x64,x86,arm64
          WINDOWS_ARM64_RUNTIME_EVIDENCE=not-native-ci
          WINDOWS_AUTHENTICODE=${WINDOWS_SIGNING_STATE}
          LINUX_DEBIAN_INSTALLER=universal-amd64-arm64-i386
          LINUX_DEBIAN_PORTABLE=universal-amd64-arm64-i386
          LINUX_UBUNTU_INSTALLER=universal-amd64-arm64-i386
          LINUX_UBUNTU_PORTABLE=universal-amd64-arm64-i386
          LINUX_FEDORA_INSTALLER=universal-amd64-arm64-i386
          LINUX_FEDORA_PORTABLE=universal-amd64-arm64-i386
          LINUX_ARM64_RUNTIME_EVIDENCE=build-and-package-ci
          LINUX_I386_RUNTIME_EVIDENCE=build-and-package-ci
          ANDROID_APK=production-signed
          ANDROID_SIGNER_SHA256=${ANDROID_SIGNER_SHA256}
          ANDROID_SFTP=hidden-until-strict-host-key-verification
          BROWSER_EXTENSION_PACKAGES=Chrome,Edge,Firefox,Opera
          BROWSER_DESKTOP_HANDOFF=sanitized-ghostftp-connect-no-autoconnect
          LANGUAGES=24
          DEFAULT_LANGUAGE=en
          TELEMETRY=disabled
          PUBLIC_PLATFORM_ARTIFACTS=13
          PUBLIC_RELEASE_FILES=16
          GITHUB_PACKAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghost-ftp:${VERSION}
          EOF
          sed -i 's/^          //' release/BUILD-METADATA.txt
          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256.txt
          )
          count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = '16'
          test "$(find release -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" = '2'
          test "$(find release -maxdepth 1 -type f -name '*-Installer.run' | wc -l | tr -d ' ')" = '3'
          test "$(find release -maxdepth 1 -type f -name '*-Portable.tar.gz' | wc -l | tr -d ' ')" = '3'
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = '1'
          test "$(find release -maxdepth 1 -type f -name '*-Extension.zip' | wc -l | tr -d ' ')" = '4'
          ! find release -maxdepth 1 -type f -name '*.exe' -print | grep -Eq -- '-(x64|x86|x32|arm64)\.exe$'
          ! find release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print | grep .
      - name: Publish verified bundle to GitHub Packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_ref="ghcr.io/${owner}/ghost-ftp"
          major="${VERSION%%.*}"
          remainder="${VERSION#*.}"
          minor="${remainder%%.*}"
          cat > Dockerfile.release-bundle <<'EOF'
          FROM scratch
          ARG VERSION
          ARG SOURCE
          ARG REVISION
          LABEL org.opencontainers.image.title="Ghost FTP verified release bundle"
          LABEL org.opencontainers.image.description="Verified Ghost FTP release files for Windows, Linux, Android and browser helpers. Distribution bundle only; not a supported runtime container."
          LABEL org.opencontainers.image.source="$SOURCE"
          LABEL org.opencontainers.image.version="$VERSION"
          LABEL org.opencontainers.image.revision="$REVISION"
          LABEL org.opencontainers.image.licenses="LicenseRef-Proprietary"
          COPY release/ /ghostftp-release/
          EOF
          sed -i 's/^          //' Dockerfile.release-bundle
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull=false --network=none \
            --build-arg VERSION="$VERSION" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg REVISION="$GITHUB_SHA" \
            -f Dockerfile.release-bundle -t "$package_ref:$VERSION" .
          docker tag "$package_ref:$VERSION" "$package_ref:$major.$minor"
          docker tag "$package_ref:$VERSION" "$package_ref:$major"
          docker tag "$package_ref:$VERSION" "$package_ref:latest"
          docker push "$package_ref:$VERSION"
          docker push "$package_ref:$major.$minor"
          docker push "$package_ref:$major"
          docker push "$package_ref:latest"
          docker buildx imagetools inspect "$package_ref:$VERSION" >/dev/null
          echo "GITHUB_PACKAGE_PUBLISH=PASS ($package_ref:$VERSION)"
      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved from release commit" >&2; exit 1; }
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            echo "$RELEASE_TAG already exists at $tag_sha; refusing to rewrite an existing release tag." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            echo "$RELEASE_TAG release already exists; refusing to rewrite published assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$repo" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release/RELEASE-NOTES.txt

          expected_assets="$(cat <<EOF
          BUILD-METADATA.txt
          Ghost-FTP-${VERSION}-Android.apk
          Ghost-FTP-${VERSION}-Chrome-Extension.zip
          Ghost-FTP-${VERSION}-Edge-Extension.zip
          Ghost-FTP-${VERSION}-Firefox-Extension.zip
          Ghost-FTP-${VERSION}-Opera-Extension.zip
          Ghost-FTP-${VERSION}-Linux-Debian-Installer.run
          Ghost-FTP-${VERSION}-Linux-Debian-Portable.tar.gz
          Ghost-FTP-${VERSION}-Linux-Fedora-Installer.run
          Ghost-FTP-${VERSION}-Linux-Fedora-Portable.tar.gz
          Ghost-FTP-${VERSION}-Linux-Ubuntu-Installer.run
          Ghost-FTP-${VERSION}-Linux-Ubuntu-Portable.tar.gz
          Ghost-FTP-${VERSION}-Portable.exe
          Ghost-FTP-${VERSION}-Setup.exe
          RELEASE-NOTES.txt
          SHA256.txt
          EOF
          )"
          expected_assets="$(sed 's/^          //' <<< "$expected_assets" | LC_ALL=C sort)"
          assert_release_asset_set() {
            phase="$1"
            remote_assets="$(gh release view "$RELEASE_TAG" --repo "$repo" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
            test "$remote_assets" = "$expected_assets" || {
              echo "GitHub Release asset set mismatch during $phase verification." >&2
              diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$remote_assets") || true
              exit 1
            }
            remote_prerelease="$(gh api "repos/$repo/releases/tags/$RELEASE_TAG" --jq .prerelease)"
            test "$remote_prerelease" = 'false'
            echo "RELEASE_ASSET_READBACK=PASS ($phase; channel=$RELEASE_CHANNEL; windows_signing=$WINDOWS_SIGNING_STATE; android_signing=$ANDROID_SIGNING_STATE)"
          }
          assert_release_asset_set immediate
          sleep 5
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved before delayed release verification" >&2; exit 1; }
          assert_release_asset_set delayed
      - name: Store verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-release-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: release/*
