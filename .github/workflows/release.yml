name: GhostFTP RC10 Release

on:
  workflow_run:
    workflows: ["GhostFTP Desktop Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghostftp-rc10-release
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate build/source relationship and current quality audit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$BUILD_SHA" = "$MAIN_SHA"

          git checkout --detach "$MAIN_SHA"
          grep -q '"version": "2.1.1-rc.10"' ghostftp-desktop/package.json
          grep -q '"version": "2.1.1-rc.10"' ghostftp-desktop/src-tauri/tauri.conf.json

          for attempt in $(seq 1 45); do
            audit="$(gh run list --workflow 'GhostFTP Quality Audit' --commit "$MAIN_SHA" --limit 1 --json status,conclusion --jq '.[0] | ((.status // "") + ":" + (.conclusion // ""))' || true)"
            echo "quality audit for $MAIN_SHA: ${audit:-not-found}"
            if [ "$audit" = "completed:success" ]; then
              break
            fi
            if [[ "$audit" == completed:* ]] && [ "$audit" != "completed:success" ]; then
              echo "Quality audit did not pass."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "Timed out waiting for quality audit."
              exit 1
            fi
            sleep 20
          done

      - name: Package GhostFTP source and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native

          git archive --format=zip --output=dist/GhostFTP-2.1.1-RC10-Full-Source.zip HEAD
          zip -qr dist/GhostFTP-2.1.1-RC10-Desktop-Source.zip ghostftp-desktop
          zip -qr dist/GhostFTP-2.1.1-RC10-Web.zip ghostftp-web
          zip -qr dist/GhostFTP-2.1.1-RC10-Documentation.zip docs README.md CHANGELOG.md SECURITY.md LICENSE.txt EULA.txt

      - name: Download successful GhostFTP desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -D dist/native
          find dist/native -type f -print

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail

          WIN_EXE="$(find dist/native -type f -iname 'ghostftp.exe' | head -n1 || true)"
          WIN_SETUP="$(find dist/native -type f -iname '*setup.exe' | head -n1 || true)"
          LINUX_BIN="$(find dist/native -type f -name 'ghostftp' | head -n1 || true)"
          APPIMAGE="$(find dist/native -type f -iname '*.AppImage' | head -n1 || true)"
          DEB="$(find dist/native -type f -iname '*.deb' | head -n1 || true)"
          RPM="$(find dist/native -type f -iname '*.rpm' | head -n1 || true)"

          test -n "$WIN_EXE"
          test -n "$WIN_SETUP"
          test -n "$LINUX_BIN"
          test -n "$APPIMAGE"
          test -n "$DEB"
          test -n "$RPM"

          cp "$WIN_EXE" dist/GhostFTP-2.1.1-RC10-Windows-x64-Portable.exe
          cp "$WIN_SETUP" dist/GhostFTP-2.1.1-RC10-Windows-x64-Setup.exe
          cp "$LINUX_BIN" dist/GhostFTP-2.1.1-RC10-Linux-x86_64
          chmod +x dist/GhostFTP-2.1.1-RC10-Linux-x86_64
          cp "$APPIMAGE" dist/GhostFTP-2.1.1-RC10-Linux-x86_64.AppImage
          cp "$DEB" dist/GhostFTP-2.1.1-RC10-Linux-amd64.deb
          cp "$RPM" dist/GhostFTP-2.1.1-RC10-Linux-x86_64.rpm

          (
            cd dist
            zip -q GhostFTP-2.1.1-RC10-Windows-x64.zip \
              GhostFTP-2.1.1-RC10-Windows-x64-Portable.exe \
              GhostFTP-2.1.1-RC10-Windows-x64-Setup.exe

            tar -czf GhostFTP-2.1.1-RC10-Linux-x86_64.tar.gz \
              GhostFTP-2.1.1-RC10-Linux-x86_64 \
              GhostFTP-2.1.1-RC10-Linux-x86_64.AppImage \
              GhostFTP-2.1.1-RC10-Linux-amd64.deb \
              GhostFTP-2.1.1-RC10-Linux-x86_64.rpm
          )

          rm -rf dist/native

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'GhostFTP-2.1.1-RC10-SHA256SUMS.txt' -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum
          ) > dist/GhostFTP-2.1.1-RC10-SHA256SUMS.txt

      - name: Publish GhostFTP RC10 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.1.1-rc.10"

          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" -y || true
            done
            gh release edit "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Ghost FTP 2.1.1 RC10 — Native Desktop" \
              --notes-file docs/releases/2.1.1-rc.10.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Ghost FTP 2.1.1 RC10 — Native Desktop" \
              --notes-file docs/releases/2.1.1-rc.10.md \
              --prerelease
          fi

          gh release upload "$TAG" dist/* --clobber
