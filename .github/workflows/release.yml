name: Publish ByFTP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (for example 2.13.0)'
        required: true
        default: '2.12.0'

permissions:
  contents: write
  packages: write

concurrency:
  group: byftp-release-${{ github.ref }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOTELEMETRY: off

jobs:
  publish:
    name: Build, Release & Package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Verify source version
        shell: pwsh
        run: |
          $scriptVersion = Select-String -Path 'BUILD-WINDOWS.ps1' -Pattern "^\$version = '([^']+)'$" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($scriptVersion -ne $env:VERSION) {
            throw "Release version $env:VERSION does not match BUILD-WINDOWS.ps1 version $scriptVersion."
          }

      - name: Build and verify ByFTP
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item 'dist\ByFTP-Uninstall.exe' "dist\ByFTP-$env:VERSION-Uninstall-x64.exe" -Force
          @"
          ByFTP $env:VERSION

          Native Windows FTP / FTPS / SFTP client by Brendigo.

          Highlights:
          - Native dark Windows desktop interface
          - FTP, FTPS Explicit/Implicit and SFTP
          - Multi-file and whole-folder transfers
          - Transfer queue with parallelism, transient retry and Skip Existing
          - Windows DPAPI-protected saved profiles
          - SFTP host-key pinning
          - No telemetry, analytics, cloud account or automatic external API calls

          Downloads:
          - Setup: recommended installation
          - Portable: run without installation
          - Uninstaller: standalone removal binary

          Verify SHA-256 values before distribution. Public production binaries should be Authenticode-signed with the real Brendigo signing identity.
          "@ | Set-Content 'dist\RELEASE-NOTES.txt' -Encoding UTF8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping creation."
          } else {
            gh release create $tag `
              "dist\ByFTP-$env:VERSION-Portable-x64.exe" `
              "dist\ByFTP-$env:VERSION-Setup-x64.exe" `
              "dist\ByFTP-$env:VERSION-Uninstall-x64.exe" `
              "dist\SHA256.txt" `
              "dist\verification.txt" `
              "dist\RELEASE-NOTES.txt" `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "ByFTP $env:VERSION" `
              --notes-file 'dist\RELEASE-NOTES.txt' `
              --target "$env:GITHUB_SHA"
          }

      - name: Build GitHub Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package\assets','package-out' | Out-Null
          Copy-Item "dist\ByFTP-$env:VERSION-Portable-x64.exe" 'package\assets\' -Force
          Copy-Item "dist\ByFTP-$env:VERSION-Setup-x64.exe" 'package\assets\' -Force
          Copy-Item "dist\ByFTP-$env:VERSION-Uninstall-x64.exe" 'package\assets\' -Force
          Copy-Item 'dist\SHA256.txt' 'package\assets\' -Force
          Copy-Item 'dist\verification.txt' 'package\assets\' -Force
          @"
          # ByFTP.Windows $env:VERSION

          Official packaged Windows distribution of ByFTP by Brendigo.

          For normal Windows installation, GitHub Releases is the recommended download channel. This package contains the same verified Setup, Portable and Uninstaller artifacts plus checksums and verification output.

          ByFTP is proprietary/source-available software. See LICENSE, PRIVACY.md and SECURITY.md in the package and repository.
          "@ | Set-Content 'package\PACKAGE-README.md' -Encoding UTF8
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <PackageId>ByFTP.Windows</PackageId>
              <Version>$env:VERSION</Version>
              <Authors>Brendigo</Authors>
              <Company>Brendigo</Company>
              <Description>Official ByFTP Windows FTP/FTPS/SFTP distribution package.</Description>
              <PackageTags>byftp;ftp;ftps;sftp;windows;brendigo;privacy</PackageTags>
              <PackageProjectUrl>https://github.com/bren-wp/by-ftp</PackageProjectUrl>
              <RepositoryUrl>https://github.com/bren-wp/by-ftp</RepositoryUrl>
              <RepositoryType>git</RepositoryType>
              <PackageLicenseFile>LICENSE</PackageLicenseFile>
              <PackageReadmeFile>PACKAGE-README.md</PackageReadmeFile>
              <PackageRequireLicenseAcceptance>true</PackageRequireLicenseAcceptance>
              <SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking>
              <IncludeBuildOutput>false</IncludeBuildOutput>
            </PropertyGroup>
            <ItemGroup>
              <None Include="assets\**\*" Pack="true" PackagePath="tools\" />
              <None Include="PACKAGE-README.md" Pack="true" PackagePath="\" />
              <None Include="..\LICENSE" Pack="true" PackagePath="\" />
              <None Include="..\PRIVACY.md" Pack="true" PackagePath="docs\" />
              <None Include="..\SECURITY.md" Pack="true" PackagePath="docs\" />
            </ItemGroup>
          </Project>
          "@ | Set-Content 'package\ByFTP.Windows.csproj' -Encoding UTF8
          dotnet pack 'package\ByFTP.Windows.csproj' -c Release -o 'package-out'

      - name: Publish GitHub Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-ChildItem 'package-out\ByFTP.Windows.*.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'ByFTP.Windows package was not created.' }
          dotnet nuget push $pkg.FullName `
            --api-key "$env:GITHUB_TOKEN" `
            --source 'https://nuget.pkg.github.com/bren-wp/index.json' `
            --skip-duplicate
