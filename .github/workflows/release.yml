name: Publish ByFTP

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version without the v prefix; leave empty to use canonical VERSION'
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: byftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Production quality, race, security and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Verify assets, localization, version and Android invariants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_brand_assets.py --check
          python scripts/audit_localization.py
          python scripts/audit_version.py
          python scripts/audit_android.py
      - name: Verify docs, security, privacy and release contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_docs.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_release.py
      - name: Python release-tool regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Go unit, race and vet
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Verify release-note generation
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.txt"
          test -s "$RUNNER_TEMP/RELEASE-NOTES.txt"
          grep -F "ByFTP $version" "$RUNNER_TEMP/RELEASE-NOTES.txt"

  android:
    name: Android source quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.5.0'
          cache-disabled: true
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Audit Android source
        run: python scripts/audit_android.py
      - name: Test, lint and compile Android APK
        shell: bash
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Store Android validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-android-release-gate
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows x64 and x86
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable and verify Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0) { throw 'Unable to disable Go telemetry.' }
          if ((go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Build Windows x64 and x86
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Build verified Windows ZIP bundles
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          python scripts/release_notes.py --version $version --output 'dist\RELEASE-NOTES.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Release-note generation failed.' }
          @"
          VERSION=$version
          COMMIT=$env:GITHUB_SHA
          SOURCE_REF=$env:GITHUB_REF
          GO_VERSION=$((go env GOVERSION).Trim())
          GO_TELEMETRY=$((go telemetry).Trim())
          BUILD_OS=windows
          BUILD_ARCH=x64,x86
          GITHUB_RUN_ID=$env:GITHUB_RUN_ID
          GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT
          "@ | Set-Content 'dist\BUILD-METADATA-WINDOWS.txt' -Encoding ascii
          foreach ($arch in @('x64','x86')) {
            $root = "dist\ByFTP-$version-Windows-$arch"
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $root, (Join-Path $root 'Documentation') | Out-Null
            Copy-Item "dist\ByFTP-$version-Portable-$arch.exe" $root -Force
            Copy-Item "dist\ByFTP-$version-Setup-$arch.exe" $root -Force
            Copy-Item 'dist\RELEASE-NOTES.txt' $root -Force
            Copy-Item 'dist\BUILD-METADATA-WINDOWS.txt' (Join-Path $root 'BUILD-METADATA.txt') -Force
            Copy-Item 'README.md','CHANGELOG.md','LICENSE' $root -Force
            Copy-Item 'docs\*.md' (Join-Path $root 'Documentation') -Force
            $lines = foreach ($file in Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\','/')
              "$hash  $relative"
            }
            $lines | Set-Content (Join-Path $root 'BUNDLE-SHA256.txt') -Encoding ascii
            $zip = "dist\ByFTP-$version-Windows-$arch.zip"
            Remove-Item -Force $zip -ErrorAction SilentlyContinue
            Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal
            python scripts/verify_bundle.py $zip --version $version --arch $arch
            if ($LASTEXITCODE -ne 0) { throw "Windows $arch ZIP verification failed." }
          }
      - name: Store Windows release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-windows-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ByFTP-*-Portable-x64.exe
            dist/ByFTP-*-Setup-x64.exe
            dist/ByFTP-*-Windows-x64.zip
            dist/ByFTP-*-Portable-x86.exe
            dist/ByFTP-*-Setup-x86.exe
            dist/ByFTP-*-Windows-x86.zip

  linux:
    name: Linux amd64 arm64 and i386
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Verify Linux core
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Build DEB packages
        shell: bash
        run: bash scripts/BUILD-LINUX.sh
      - name: Verify DEB metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/ByFTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'byftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done
      - name: Store Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-linux-release
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-Linux-*.deb

  macos:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Cross-platform tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Build Universal PKG
        shell: bash
        run: bash scripts/BUILD-MACOS.sh
      - name: Verify PKG structure
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          pkg="dist/ByFTP-${version}-macOS-Universal.pkg"
          test -s "$pkg"
          pkgutil --expand "$pkg" "$RUNNER_TEMP/byftp-pkg"
          test -f "$RUNNER_TEMP/byftp-pkg/PackageInfo"
      - name: Store macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-macos-release
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-macOS-Universal.pkg

  publish:
    name: Verify and publish release
    needs: [quality, windows, linux, macos, android]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $manual = '${{ inputs.version }}'.Trim()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and $manual) {
            $version = $manual
          } else {
            $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          $source = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($source -ne $version) { throw "Release version $version does not match VERSION=$source" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download Windows packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: byftp-windows-release
          path: release
      - name: Download Linux packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: byftp-linux-release
          path: release
      - name: Download macOS package
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: byftp-macos-release
          path: release
      - name: Verify public release staging
        shell: pwsh
        run: |
          $expected = @(
            "ByFTP-$env:VERSION-Portable-x64.exe",
            "ByFTP-$env:VERSION-Setup-x64.exe",
            "ByFTP-$env:VERSION-Windows-x64.zip",
            "ByFTP-$env:VERSION-Portable-x86.exe",
            "ByFTP-$env:VERSION-Setup-x86.exe",
            "ByFTP-$env:VERSION-Windows-x86.zip",
            "ByFTP-$env:VERSION-Linux-amd64.deb",
            "ByFTP-$env:VERSION-Linux-arm64.deb",
            "ByFTP-$env:VERSION-Linux-i386.deb",
            "ByFTP-$env:VERSION-macOS-Universal.pkg"
          )
          $actual = @(Get-ChildItem -LiteralPath 'release' -File | ForEach-Object Name | Sort-Object)
          $wanted = @($expected | Sort-Object)
          if ($actual.Count -ne $wanted.Count) { throw "Release staging has $($actual.Count) files instead of $($wanted.Count)." }
          if (Compare-Object -ReferenceObject $wanted -DifferenceObject $actual) { throw 'Release staging does not match the public package contract.' }
      - name: Generate shared metadata and SHA-256
        shell: pwsh
        run: |
          python scripts/release_notes.py --version $env:VERSION --output 'release\RELEASE-NOTES.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Release-note generation failed.' }
          @"
          VERSION=$env:VERSION
          COMMIT=$env:GITHUB_SHA
          SOURCE_REF=$env:GITHUB_REF
          WINDOWS=x64,x86
          LINUX=amd64,arm64,i386
          MACOS=universal-amd64-arm64
          ANDROID=source-gate-only
          RELEASE_QUALITY_GATE=passed
          GITHUB_RUN_ID=$env:GITHUB_RUN_ID
          GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT
          "@ | Set-Content 'release\BUILD-METADATA.txt' -Encoding ascii
          $hashTargets = Get-ChildItem -LiteralPath 'release' -File | Where-Object { $_.Name -ne 'SHA256.txt' } | Sort-Object Name
          $lines = foreach ($item in $hashTargets) {
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content 'release\SHA256.txt' -Encoding ascii
      - name: Publish or safely complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release\ByFTP-$env:VERSION-Portable-x64.exe",
            "release\ByFTP-$env:VERSION-Setup-x64.exe",
            "release\ByFTP-$env:VERSION-Windows-x64.zip",
            "release\ByFTP-$env:VERSION-Portable-x86.exe",
            "release\ByFTP-$env:VERSION-Setup-x86.exe",
            "release\ByFTP-$env:VERSION-Windows-x86.zip",
            "release\ByFTP-$env:VERSION-Linux-amd64.deb",
            "release\ByFTP-$env:VERSION-Linux-arm64.deb",
            "release\ByFTP-$env:VERSION-Linux-i386.deb",
            "release\ByFTP-$env:VERSION-macOS-Universal.pkg",
            'release\SHA256.txt',
            'release\RELEASE-NOTES.txt',
            'release\BUILD-METADATA.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          & .\scripts\publish_release.ps1 -Repository $env:GITHUB_REPOSITORY -Version $env:VERSION -Commit $env:GITHUB_SHA -NotesFile 'release\RELEASE-NOTES.txt' -Assets $assets
      - name: Store complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-${{ steps.version.outputs.version }}-complete-release
          if-no-files-found: error
          retention-days: 30
          path: release/*
      - name: Build GitHub Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package\assets','package-out' | Out-Null
          foreach ($name in @(
            "ByFTP-$env:VERSION-Portable-x64.exe","ByFTP-$env:VERSION-Setup-x64.exe","ByFTP-$env:VERSION-Windows-x64.zip",
            "ByFTP-$env:VERSION-Portable-x86.exe","ByFTP-$env:VERSION-Setup-x86.exe","ByFTP-$env:VERSION-Windows-x86.zip",
            'SHA256.txt','RELEASE-NOTES.txt','BUILD-METADATA.txt')) {
            Copy-Item (Join-Path 'release' $name) 'package\assets\' -Force
          }
          @"
          # ByFTP.Windows $env:VERSION

          Official ByFTP Windows distribution package for x64 and x86. It contains only public Windows builds and verified release metadata.
          "@ | Set-Content 'package\PACKAGE-README.md' -Encoding UTF8
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework><PackageId>ByFTP.Windows</PackageId><Version>$env:VERSION</Version><Authors>ByFTP</Authors><Company>ByFTP</Company><Description>ByFTP Windows x64 and x86 FTP/FTPS/SFTP distribution package.</Description><PackageTags>byftp;ftp;ftps;sftp;windows;privacy</PackageTags><PackageProjectUrl>https://github.com/bren-wp/by-ftp</PackageProjectUrl><RepositoryUrl>https://github.com/bren-wp/by-ftp</RepositoryUrl><RepositoryType>git</RepositoryType><PackageLicenseFile>LICENSE</PackageLicenseFile><PackageReadmeFile>PACKAGE-README.md</PackageReadmeFile><PackageRequireLicenseAcceptance>true</PackageRequireLicenseAcceptance><SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking><IncludeBuildOutput>false</IncludeBuildOutput></PropertyGroup><ItemGroup><None Include="assets\**\*" Pack="true" PackagePath="tools\" /><None Include="PACKAGE-README.md" Pack="true" PackagePath="\" /><None Include="..\LICENSE" Pack="true" PackagePath="\" /><None Include="..\docs\*.md" Pack="true" PackagePath="docs\" /></ItemGroup></Project>
          "@ | Set-Content 'package\ByFTP.Windows.csproj' -Encoding UTF8
          dotnet pack 'package\ByFTP.Windows.csproj' -c Release -o 'package-out'
      - name: Publish GitHub Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-ChildItem 'package-out\ByFTP.Windows.*.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'ByFTP.Windows package was not built.' }
          dotnet nuget push $pkg.FullName --api-key "$env:GITHUB_TOKEN" --source 'https://nuget.pkg.github.com/bren-wp/index.json' --skip-duplicate
