name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GhostFTP.sln
      - name: Dependency and telemetry audit
        shell: pwsh
        run: ./audit-source.ps1
      - name: Self-test
        run: dotnet run --project tests/GhostFTP.SelfTest/GhostFTP.SelfTest.csproj -c Release
      - name: Build release packages
        shell: pwsh
        run: ./build-release.ps1
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostFTP-release
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --title "GhostFTP ${{ github.ref_name }}" --generate-notes --verify-tag
