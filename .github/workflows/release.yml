name: Publish Ghost FTP

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional semantic version; empty uses VERSION'
        required: false

permissions:
  contents: write

concurrency:
  group: ghostftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Core quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Verify formatting, unit tests, race detector and vet
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Security and privacy audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_security.py
          python scripts/audit_privacy.py
      - name: Verify release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.txt"
          grep -F "Ghost FTP $version" "$RUNNER_TEMP/RELEASE-NOTES.txt"
      - name: Build WEB package
        run: python scripts/package_web.py --output-dir dist
      - name: Store WEB package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-web-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Web.zip

  android:
    name: Android installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.7.1'
          cache-disabled: true
      - name: Test, lint and build debug-signed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Store Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-android-stage
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS arm64 unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native iPhoneOS artifact
        run: bash ios/BUILD.sh
      - name: Store iOS IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-ios-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-iOS-arm64-unsigned.ipa

  windows:
    name: Windows x64 and x86 installers
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Build x64 and x86 installers
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Verify installers
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          foreach ($arch in @('x64','x86')) {
            $path = "dist\Ghost-FTP-$v-Setup-$arch.exe"
            if (-not (Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 0) { throw "Missing installer: $path" }
          }
      - name: Store Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-windows-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Setup-*.exe

  linux:
    name: Linux amd64 arm64 i386
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Build DEB packages
        run: bash linux/BUILD.sh
      - name: Verify DEB metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/Ghost-FTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'ghost-ftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done
      - name: Store Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-linux-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/Ghost-FTP-*-Linux-*.deb

  macos:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Build Universal PKG
        run: bash macos/BUILD.sh
      - name: Verify PKG
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test -s "dist/ByFTP-${version}-macOS-Universal.pkg"
      - name: Store macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-macos-stage
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-macOS-Universal.pkg

  publish:
    name: Assemble and publish Ghost FTP release
    needs: [quality, windows, linux, macos, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '\r\n' < VERSION)"
          manual='${{ inputs.version }}'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' && -n "$manual" ]]; then version="$manual"; else version="$source_version"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          test "$version" = "$source_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ghostftp-v$version" >> "$GITHUB_ENV"
      - name: Download Windows
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-windows-stage, path: staging/windows }
      - name: Download Linux
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-linux-stage, path: staging/linux }
      - name: Download macOS
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-macos-stage, path: staging/macos }
      - name: Download Android
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-android-stage, path: staging/android }
      - name: Download iOS
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-ios-stage, path: staging/ios }
      - name: Download WEB
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: ghostftp-web-stage, path: staging/web }
      - name: Assemble public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x64.exe" "release/Ghost-FTP-${VERSION}-Setup-x64.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x86.exe" "release/Ghost-FTP-${VERSION}-Setup-x86.exe"
          cp "staging/windows/Ghost-FTP-${VERSION}-Setup-x86.exe" "release/Ghost-FTP-${VERSION}-Setup-x32.exe"
          (
            cd staging/linux
            zip -9 "$GITHUB_WORKSPACE/release/Ghost-FTP-${VERSION}-Linux-multiarch.zip" \
              "Ghost-FTP-${VERSION}-Linux-amd64.deb" \
              "Ghost-FTP-${VERSION}-Linux-arm64.deb" \
              "Ghost-FTP-${VERSION}-Linux-i386.deb"
          )
          cp "staging/macos/ByFTP-${VERSION}-macOS-Universal.pkg" "release/Ghost-FTP-${VERSION}-macOS-Universal.pkg"
          cp "staging/android/app-debug.apk" "release/Ghost-FTP-${VERSION}-Android.apk"
          cp "staging/ios/ByFTP-${VERSION}-iOS-arm64-unsigned.ipa" "release/Ghost-FTP-${VERSION}-iOS-arm64-unsigned.ipa"
          cp "staging/web/Ghost-FTP-${VERSION}-Web.zip" "release/Ghost-FTP-${VERSION}-Web.zip"

          python scripts/release_notes.py --version "$VERSION" --output release/RELEASE-NOTES.txt
          cat > release/BUILD-METADATA.txt <<EOF
          BRAND=Ghost FTP
          VERSION=${VERSION}
          RELEASE_TAG=${RELEASE_TAG}
          COMMIT=${GITHUB_SHA}
          WINDOWS=x64,x86,x32-alias-of-x86
          LINUX=multiarch-amd64-arm64-i386
          MACOS=universal-x86_64-arm64
          ANDROID=debug-signed-installable-non-store
          IOS=arm64-unsigned
          WEB=shared-hosting
          PUBLIC_PLATFORM_ARTIFACTS=8
          PUBLIC_RELEASE_FILES=11
          EOF
          sed -i 's/^          //' release/BUILD-METADATA.txt

          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256.txt
          )

          count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = '11'
          test "$(sha256sum "release/Ghost-FTP-${VERSION}-Setup-x86.exe" | awk '{print $1}')" = "$(sha256sum "release/Ghost-FTP-${VERSION}-Setup-x32.exe" | awk '{print $1}')"
          cat release/BUILD-METADATA.txt
          cat release/SHA256.txt
      - name: Publish GitHub Release without rewriting existing tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved from release commit" >&2; exit 1; }

          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [[ -z "$tag_sha" ]]; then
              git fetch --tags --force
              tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            fi
            test "$tag_sha" = "$GITHUB_SHA" || { echo "Existing $RELEASE_TAG points to $tag_sha, not $GITHUB_SHA; refusing to rewrite it." >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release/* --repo "$repo" --clobber
            gh release edit "$RELEASE_TAG" --repo "$repo" --title "Ghost FTP $VERSION" --notes-file release/RELEASE-NOTES.txt
          else
            gh release create "$RELEASE_TAG" release/* --repo "$repo" --target "$GITHUB_SHA" --title "Ghost FTP $VERSION" --notes-file release/RELEASE-NOTES.txt
          fi

          assert_release_asset_set() {
            phase="$1"
            local_manifest="$(mktemp)"
            remote_manifest="$(mktemp)"
            readback_dir="$(mktemp -d)"
            trap 'rm -f "$local_manifest" "$remote_manifest"; rm -rf "$readback_dir"' RETURN

            find release -maxdepth 1 -type f -printf '%f\t%s\n' | LC_ALL=C sort > "$local_manifest"
            gh release view "$RELEASE_TAG" --repo "$repo" --json assets \
              --jq '.assets[] | [.name, (.size | tostring)] | @tsv' | LC_ALL=C sort > "$remote_manifest"
            diff -u "$local_manifest" "$remote_manifest"

            gh release download "$RELEASE_TAG" --repo "$repo" --pattern 'SHA256.txt' --dir "$readback_dir"
            cmp release/SHA256.txt "$readback_dir/SHA256.txt"
            echo "RELEASE_ASSET_READBACK=PASS ($phase)"
          }

          assert_release_asset_set immediate
          sleep 5
          main_sha="$(gh api "repos/$repo/commits/main" --jq .sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "main moved before delayed release verification" >&2; exit 1; }
          assert_release_asset_set delayed
      - name: Store complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostftp-${{ steps.version.outputs.version }}-complete-release
          if-no-files-found: error
          retention-days: 30
          path: release/*
