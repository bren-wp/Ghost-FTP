name: Publish ByFTP

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version without v prefix; empty uses VERSION'
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: byftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  quality:
    name: Production quality, race, security, privacy and WEB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Verify source and release invariants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_brand_assets.py --check
          python scripts/audit_localization.py
          python scripts/audit_version.py
          python scripts/audit_repository.py
          python scripts/audit_web.py
          python scripts/audit_android.py
          python scripts/audit_ios.py
          python scripts/audit_docs.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_release.py
      - name: Python regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Go unit, race and vet
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Verify release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/release_notes.py --version "$version" --output "$RUNNER_TEMP/RELEASE-NOTES.txt"
          test -s "$RUNNER_TEMP/RELEASE-NOTES.txt"
          grep -F "ByFTP $version" "$RUNNER_TEMP/RELEASE-NOTES.txt"
      - name: Build verified WEB package
        run: python scripts/package_web.py --output-dir dist
      - name: Store WEB release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-web-release
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-WEB-shared-hosting.zip

  android:
    name: Android APK quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.7.1'
          cache-disabled: true
      - name: Verify Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          find "$sdk_root/platforms" -maxdepth 1 -type d -name 'android-37*' -print -quit | grep -q .
          test -d "$sdk_root/build-tools/36.0.0"
      - name: Audit Android source
        run: python scripts/audit_android.py
      - name: Test, lint and build Android APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          python scripts/package_android.py --debug android/app/build/outputs/apk/debug/app-debug.apk --release android/app/build/outputs/apk/release/app-release-unsigned.apk --output-dir dist
      - name: Store Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-android-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ByFTP-*-Android-debug.apk
            dist/ByFTP-*-Android-release-unsigned.apk

  ios:
    name: iOS arm64 unsigned IPA and app bundle
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Audit iOS source and packaging contract
        run: python3 scripts/audit_ios.py
      - name: Build native iPhoneOS artifacts
        run: bash ios/BUILD.sh
      - name: Store iOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-ios-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ByFTP-*-iOS-arm64-unsigned.ipa
            dist/ByFTP-*-iOS-arm64-unsigned-app.zip

  windows:
    name: Windows x64 and x86
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Disable and verify Go telemetry
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetry is not disabled.' }
      - name: Build Windows x64 and x86
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Build verified Windows ZIP bundles
        shell: pwsh
        run: .\scripts\package_windows_bundles.ps1
      - name: Store Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-windows-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/ByFTP-*-Portable-x64.exe
            dist/ByFTP-*-Setup-x64.exe
            dist/ByFTP-*-Windows-x64.zip
            dist/ByFTP-*-Portable-x86.exe
            dist/ByFTP-*-Setup-x86.exe
            dist/ByFTP-*-Windows-x86.zip

  linux:
    name: Linux amd64 arm64 and i386
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Verify Linux core
        run: go test ./... && go vet ./...
      - name: Build DEB packages
        run: bash linux/BUILD.sh
      - name: Verify DEB metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          for arch in amd64 arm64 i386; do
            pkg="dist/ByFTP-${version}-Linux-${arch}.deb"
            test -s "$pkg"
            test "$(dpkg-deb -f "$pkg" Package)" = 'byftp'
            test "$(dpkg-deb -f "$pkg" Version)" = "$version"
            test "$(dpkg-deb -f "$pkg" Architecture)" = "$arch"
          done
      - name: Store Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-linux-release
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-Linux-*.deb

  macos:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Disable and verify Go telemetry
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Cross-platform tests on macOS
        run: go test ./... && go vet ./...
      - name: Build Universal PKG
        run: bash macos/BUILD.sh
      - name: Verify PKG structure
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          pkg="dist/ByFTP-${version}-macOS-Universal.pkg"
          test -s "$pkg"
          pkgutil --expand "$pkg" "$RUNNER_TEMP/byftp-pkg"
          test -f "$RUNNER_TEMP/byftp-pkg/PackageInfo"
      - name: Store macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-macos-release
          if-no-files-found: error
          retention-days: 7
          path: dist/ByFTP-*-macOS-Universal.pkg

  publish:
    name: Verify and publish release
    needs: [quality, windows, linux, macos, android, ios]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $manual = '${{ inputs.version }}'.Trim()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and $manual) { $version = $manual } else { $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim() }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          $source = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($source -ne $version) { throw "Release version $version does not match VERSION=$source" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download Windows packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-windows-release, path: release }
      - name: Download Linux packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-linux-release, path: release }
      - name: Download macOS package
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-macos-release, path: release }
      - name: Download Android packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-android-release, path: release }
      - name: Download iOS packages
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-ios-release, path: release }
      - name: Download WEB package
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with: { name: byftp-web-release, path: release }
      - name: Verify public release staging and generate metadata
        shell: pwsh
        run: .\scripts\prepare_release.ps1
      - name: Publish or safely complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'release' -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -ne 18) { throw "Expected 18 public release files; found $($assets.Count)." }
          & .\scripts\publish_release.ps1 -Repository $env:GITHUB_REPOSITORY -Version $env:VERSION -Commit $env:GITHUB_SHA -NotesFile 'release\RELEASE-NOTES.txt' -Assets $assets
      - name: Store complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byftp-${{ steps.version.outputs.version }}-complete-release
          if-no-files-found: error
          retention-days: 30
          path: release/*
      - name: Build GitHub Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package\assets','package-out' | Out-Null
          foreach ($name in @("ByFTP-$env:VERSION-Portable-x64.exe","ByFTP-$env:VERSION-Setup-x64.exe","ByFTP-$env:VERSION-Windows-x64.zip","ByFTP-$env:VERSION-Portable-x86.exe","ByFTP-$env:VERSION-Setup-x86.exe","ByFTP-$env:VERSION-Windows-x86.zip",'SHA256.txt','RELEASE-NOTES.txt','BUILD-METADATA.txt')) { Copy-Item (Join-Path 'release' $name) 'package\assets\' -Force }
          '# ByFTP.Windows ' + $env:VERSION + "`n`nOfficial verified ByFTP Windows x64/x86 distribution. No standalone uninstaller is included." | Set-Content 'package\PACKAGE-README.md' -Encoding UTF8
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework><PackageId>ByFTP.Windows</PackageId><Version>$env:VERSION</Version><Authors>ByFTP</Authors><Description>ByFTP Windows x64 and x86 FTP/FTPS/SFTP distribution package.</Description><PackageTags>byftp;ftp;ftps;sftp;windows;privacy</PackageTags><PackageProjectUrl>https://github.com/bren-wp/by-ftp</PackageProjectUrl><RepositoryUrl>https://github.com/bren-wp/by-ftp</RepositoryUrl><RepositoryType>git</RepositoryType><PackageLicenseFile>LICENSE</PackageLicenseFile><PackageReadmeFile>PACKAGE-README.md</PackageReadmeFile><PackageRequireLicenseAcceptance>true</PackageRequireLicenseAcceptance><SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking><IncludeBuildOutput>false</IncludeBuildOutput></PropertyGroup><ItemGroup><None Include="assets\**\*" Pack="true" PackagePath="tools\" /><None Include="PACKAGE-README.md" Pack="true" PackagePath="\" /><None Include="..\LICENSE" Pack="true" PackagePath="\" /><None Include="..\docs\*.md" Pack="true" PackagePath="docs\" /></ItemGroup></Project>
          "@ | Set-Content 'package\ByFTP.Windows.csproj' -Encoding UTF8
          dotnet pack 'package\ByFTP.Windows.csproj' -c Release -o 'package-out'
      - name: Publish GitHub Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-ChildItem 'package-out\ByFTP.Windows.*.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'ByFTP.Windows package was not built.' }
          dotnet nuget push $pkg.FullName --api-key "$env:GITHUB_TOKEN" --source 'https://nuget.pkg.github.com/bren-wp/index.json' --skip-duplicate
