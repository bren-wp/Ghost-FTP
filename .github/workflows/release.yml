name: Objavi ByFTP

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzija za ponovno pokretanje izdanja; prazno čita VERSION'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: byftp-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  quality:
    name: Produkcijski quality, race i sigurnosni gate
    runs-on: ubuntu-24.04
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: false
      - name: Isključi i potvrdi Go telemetriju
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
      - name: Produkcijski auditi
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_brand_assets.py --check
          python scripts/audit_croatian.py
          python scripts/audit_version.py
          python scripts/audit_docs.py
          python scripts/audit_security.py
          python scripts/audit_privacy.py
          python scripts/audit_release.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Go unit, race i vet
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...

  windows:
    name: Windows x64+x86 — 12 produkcijskih EXE datoteka
    runs-on: windows-2025
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: false
      - name: Isključi i potvrdi Go telemetriju
        shell: pwsh
        run: |
          go telemetry off
          if ($LASTEXITCODE -ne 0 -or (go telemetry).Trim() -ne 'off') { throw 'Go telemetrija nije isključena.' }
      - name: Provjeri PowerShell release alate
        shell: pwsh
        run: |
          foreach ($file in @('.\scripts\publish_release.ps1', '.\scripts\reset_release_line.ps1', '.\scripts\make_github_packages.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$file ima PowerShell sintaksnu grešku."
            }
          }
      - name: Izgradi i verificiraj 12 EXE datoteka
        shell: pwsh
        run: .\BUILD-WINDOWS.ps1
      - name: Provjeri točan Windows javni izlaz
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = @(
            "ByFTP-$version-Setup-x64.exe", "ByFTP-$version-Setup-x86.exe",
            "ByFTP-$version-Portable-x64.exe", "ByFTP-$version-Portable-x86.exe",
            "ByFTP-FTP-Client-$version-Portable-x64.exe", "ByFTP-FTP-Client-$version-Portable-x86.exe",
            "ByFTP-SFTP-Client-$version-Portable-x64.exe", "ByFTP-SFTP-Client-$version-Portable-x86.exe",
            "ByFTP-SSH-Client-$version-Portable-x64.exe", "ByFTP-SSH-Client-$version-Portable-x86.exe",
            "ByFTP-S3-Client-$version-Portable-x64.exe", "ByFTP-S3-Client-$version-Portable-x86.exe"
          )
          $actual = @(Get-ChildItem dist -File -Filter '*.exe' | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne $expected.Count) { throw "Očekuje se 12 javnih EXE datoteka, pronađeno $($actual.Count)." }
          if (Compare-Object ($expected | Sort-Object) $actual) { throw 'Windows javni EXE izlaz ne odgovara 1.x release ugovoru.' }
      - name: Spremi Windows release kandidat
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: byftp-windows-release
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  linux-smoke:
    name: Linux runtime smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Testiraj Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          go test ./...
          go vet ./...

  macos-smoke:
    name: macOS runtime smoke
    runs-on: macos-15
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Postavi Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Testiraj macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          go telemetry off
          test "$(go telemetry)" = 'off'
          go test ./...
          go vet ./...

  publish:
    name: GitHub Release i Packages
    needs: [quality, windows, linux-smoke, macos-smoke]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dohvati izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Postavi Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: false
      - name: Preuzmi Windows release kandidat
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: byftp-windows-release
          path: release
      - name: Odredi i provjeri verziju
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release je dopušten samo s main grane." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "${REQUESTED_VERSION:-}" && "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Tražena verzija $REQUESTED_VERSION ne odgovara VERSION=$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Provjeri točno 12 release EXE datoteka
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $expected = @(
            "ByFTP-$v-Setup-x64.exe", "ByFTP-$v-Setup-x86.exe",
            "ByFTP-$v-Portable-x64.exe", "ByFTP-$v-Portable-x86.exe",
            "ByFTP-FTP-Client-$v-Portable-x64.exe", "ByFTP-FTP-Client-$v-Portable-x86.exe",
            "ByFTP-SFTP-Client-$v-Portable-x64.exe", "ByFTP-SFTP-Client-$v-Portable-x86.exe",
            "ByFTP-SSH-Client-$v-Portable-x64.exe", "ByFTP-SSH-Client-$v-Portable-x86.exe",
            "ByFTP-S3-Client-$v-Portable-x64.exe", "ByFTP-S3-Client-$v-Portable-x86.exe"
          )
          $actual = @(Get-ChildItem release -File -Filter '*.exe' | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne 12 -or (Compare-Object ($expected | Sort-Object) $actual)) {
            throw 'Release kandidat ne sadrži točno ugovorenih 12 EXE datoteka.'
          }
      - name: Generiraj release bilješke
        shell: bash
        run: python scripts/release_notes.py --version '${{ steps.version.outputs.version }}' --output release-notes.txt
      - name: Resetiraj staru release liniju za 1.0.0
        if: steps.version.outputs.version == '1.0.0'
        shell: pwsh
        run: ./scripts/reset_release_line.ps1 -Repository '${{ github.repository }}' -Version '${{ steps.version.outputs.version }}'
      - name: Objavi i verificiraj GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File -Filter '*.exe' | Sort-Object Name | Select-Object -ExpandProperty FullName)
          ./scripts/publish_release.ps1 `
            -Repository '${{ github.repository }}' `
            -Version '${{ steps.version.outputs.version }}' `
            -Commit '${{ steps.version.outputs.commit }}' `
            -NotesFile (Resolve-Path 'release-notes.txt') `
            -Assets $assets
      - name: Izgradi pet GitHub Packages paketa
        shell: pwsh
        run: ./scripts/make_github_packages.ps1 -Version '${{ steps.version.outputs.version }}' -Dist 'release' -Output 'packages'
      - name: Objavi GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.nupkg)
          if [[ ${#packages[@]} -ne 5 ]]; then
            echo "Očekuje se 5 GitHub Packages paketa, pronađeno ${#packages[@]}." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json' \
              --api-key "$GH_TOKEN" \
              --skip-duplicate
          done
      - name: Završna release i package provjera
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag="v$version"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag")"
          count="$(jq '.assets | length' <<<"$release_json")"
          [[ "$count" == '12' ]]
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq '.object.sha')"
          [[ "$tag_sha" == '${{ steps.version.outputs.commit }}' ]]
          for package in ByFTP.Suite ByFTP.FTP.Client ByFTP.SFTP.Client ByFTP.SSH.Client ByFTP.S3.Client; do
            versions="$(gh api -H 'Accept: application/vnd.github+json' "users/${{ github.repository_owner }}/packages/nuget/$package/versions?per_page=100")"
            jq -e --arg v "$version" 'map(select(.name == $v)) | length >= 1' <<<"$versions" >/dev/null
          done
          echo "BYFTP_RELEASE_AND_PACKAGES=PASS ($tag, 12 asseta, 5 paketa)"
