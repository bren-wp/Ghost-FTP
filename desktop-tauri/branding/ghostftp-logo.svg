<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Ghost FTP</title>
  <desc id="desc">Ghost FTP blue ghost symbol and wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061B2E"/><stop offset="1" stop-color="#04111E"/></linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5FDFF"/><stop offset=".45" stop-color="#BEEBFF"/><stop offset="1" stop-color="#42AEFF"/></linearGradient>
    <linearGradient id="ftp" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8DD7FF"/><stop offset="1" stop-color="#36A9FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="820" height="220" rx="34" fill="url(#bg)"/>
  <g transform="translate(44 25)" filter="url(#glow)">
    <path d="M12 143c14-4 24-15 26-29l6-50C48 28 65 4 88 4s40 24 44 60l6 50c2 14 12 25 26 29-8 8-19 13-30 10-9-2-17-9-21-18-5 11-14 18-25 18s-20-7-25-18c-4 9-12 16-21 18-11 3-22-2-30-10Z" fill="url(#ghost)"/>
    <ellipse cx="71" cy="72" rx="9" ry="15" fill="#0A2B51"/><ellipse cx="106" cy="72" rx="9" ry="15" fill="#0A2B51"/>
  </g>
  <text x="238" y="111" fill="#F3FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-2.5">Ghost</text>
  <text x="450" y="111" fill="url(#ftp)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2.5">FTP</text>
  <text x="244" y="153" fill="#9AC9E9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" letter-spacing=".6">More Than Transfer. Total Control.</text>
  <text x="245" y="184" fill="#5D9CC7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5">FILES MOVE FORWARD</text>
</svg>
