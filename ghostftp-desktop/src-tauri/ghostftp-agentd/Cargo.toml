[package]
name = "ghostftp-agentd"
version = "2.1.1-rc.14"
edition = "2021"
license = "MIT"
description = "Ghost FTP remote-agent daemon — run on a machine to control it from Ghost FTP over an encrypted, paired connection."

[[bin]]
name = "ghostftp-agentd"
path = "src/main.rs"

[dependencies]
ghostftp-agent-proto = { path = "../ghostftp-agent-proto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gethostname = "0.4"
mdns-sd = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
